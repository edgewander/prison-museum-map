// EVENTS CALENDAR RENDER
// ============================================================
function renderEventsView() {
  var container = document.getElementById('events-view');
  if (!container) return;

  var months = {};
  EVENTS.forEach(function(ev) {
    if (!months[ev.month]) months[ev.month] = [];
    months[ev.month].push(ev);
  });

  var monthNames = ['', '一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
  var monthEmoji = ['', '🎆', '❄️', '🌸', '🌿', '🌺', '☀️', '🔥', '🌻', '🍂', '🎃', '🍁', '🎄'];
  var html = '';

  for (var m = 1; m <= 12; m++) {
    var events = months[m] || [];
    if (events.length === 0) continue;

    html += '<div class="ev-month">';
    html += '<div class="ev-month-header">';
    html += '<span class="ev-month-badge">' + m + '月</span>';
    html += monthEmoji[m] + ' ' + monthNames[m] + ' <span style="font-weight:400;font-size:10px;color:#888;margin-left:4px">' + events.length + ' 个活动</span>';
    html += '</div>';

    events.forEach(function(ev) {
      html += '<div class="ev-item" onclick="flyToEvent(' + ev.lat + ',' + ev.lng + ')">';
      html += '<div class="ev-icon">' + ev.icon + '</div>';
      html += '<div class="ev-info">';
      html += '<div class="ev-name">' + ev.name + '</div>';
      html += '<div class="ev-location">' + ev.country + ' · ' + ev.city + '</div>';
      html += '<div class="ev-date">📅 每年' + m + '月</div>';
      html += '<div class="ev-desc">' + ev.desc + '</div>';
      html += '</div></div>';
    });
    html += '</div>';
  }

  if (!html) html = '<div class="ev-nodata">没有找到匹配的活动</div>';
  container.innerHTML = html;
}

function flyToEvent(lat, lng) {
  if (typeof map === 'undefined') return;
  map.flyTo([lat, lng], 12, { duration: 1.2 });
  // Find nearest museum and show its popup after fly
  setTimeout(function() {
    var nearest = null, nearestDist = Infinity;
    for (var k in markers) {
      var d = map.distance([lat, lng], markers[k].getLatLng());
      if (d < nearestDist) { nearestDist = d; nearest = k; }
    }
    if (nearest && nearestDist < 50000) {
      var m = MUSEUMS.find(function(x) { return x.id == nearest; });
      if (m) showPopup(m);
    }
  }, 1400);
}

// ROUTES RENDER
// ============================================================
var routeLayer = null;
var currentRouteId = null;

function renderRoutesView() {
  var container = document.getElementById('routes-view');
  if (!container) return;

  var html = '';
  ROUTES.forEach(function(route) {
    var isActive = (currentRouteId === route.id);
    html += '<div class="route-card' + (isActive ? ' active-route' : '') + '" id="route-card-' + route.id + '">';
    html += '<div class="route-header" onclick="toggleRoute(\'' + route.id + '\')">';
    html += '<div class="route-icon">' + route.icon + '</div>';
    html += '<div class="route-title-group">';
    html += '<div class="route-name">' + route.name + '</div>';
    html += '<div class="route-subtitle">' + route.subtitle + '</div>';
    html += '<div class="route-meta"><span>🗓️ ' + route.days + '</span><span>📍 ' + route.countries + '</span><span>🛑 ' + route.stops.length + '站</span></div>';
    html += '</div></div>';
    html += '<div class="route-stops" id="route-stops-' + route.id + '" style="display:' + (isActive ? 'block' : 'none') + '">';
    route.stops.forEach(function(stop, si) {
      html += '<div class="route-stop" onclick="flyToRouteStop(' + stop.lat + ',' + stop.lng + ')">';
      html += '<div class="route-stop-num">' + (si + 1) + '</div>';
      html += '<div><div class="route-stop-name">' + stop.name + ' <span style="font-size:10px;color:#888">第' + stop.day + '天</span></div>';
      html += '<div class="route-stop-desc">' + stop.desc + '</div></div>';
      html += '</div>';
    });
    html += '<div class="route-theme"><b>💭 思考题</b><br>' + route.theme + '</div>';
    html += '<div class="route-actions">';
    html += '<button class="route-btn' + (isActive ? ' route-btn-active' : '') + '" onclick="selectRoute(\'' + route.id + '\')">🗺️ ' + (isActive ? '已显示' : '在地图显示') + '</button>';
    if (isActive) html += '<button class="route-btn" onclick="clearRoute()">✕ 清除</button>';
    html += '</div></div></div>';
  });

  if (!html) html = '<div class="ev-nodata">没有找到匹配的线路</div>';
  container.innerHTML = html;
}

function toggleRoute(routeId) {
  var stops = document.getElementById('route-stops-' + routeId);
  if (!stops) return;
  stops.style.display = (stops.style.display === 'none') ? 'block' : 'none';
}

function selectRoute(routeId) {
  clearRoute();
  currentRouteId = routeId;
  var route = ROUTES.find(function(r) { return r.id === routeId; });
  if (!route) return;

  routeLayer = L.layerGroup().addTo(map);

  // Add markers for each stop
  route.stops.forEach(function(stop, i) {
    var marker = L.circleMarker([stop.lat, stop.lng], {
      radius: 8, color: '#ffd700', fillColor: '#ffd700', fillOpacity: 0.8, weight: 2
    }).addTo(routeLayer);
    marker.bindPopup('<b>' + stop.name + '</b><br><small>第' + stop.day + '天 · ' + stop.desc + '</small>');
  });

  // Draw polyline connecting stops
  var latlngs = route.stops.map(function(s) { return [s.lat, s.lng]; });
  L.polyline(latlngs, { color: '#ffd700', weight: 3, dashArray: '8 6', opacity: 0.7 }).addTo(routeLayer);

  // Fit bounds
  var bounds = L.latLngBounds(latlngs);
  map.fitBounds(bounds, { padding: [60, 60] });

  renderRoutesView();
}

function clearRoute() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  currentRouteId = null;
  renderRoutesView();
}

function flyToRouteStop(lat, lng) {
  if (typeof map === 'undefined') return;
  map.flyTo([lat, lng], 14, { duration: 1.2 });
}

// ============================================================
function updateStats() {
  const total = MUSEUMS.length;
  const checked = MUSEUMS.filter(m => checkedSet.has(m.id)).length;
  document.getElementById('total-count').textContent = total;
  document.getElementById('checked-count').textContent = checked;
  const pct = Math.round(checked / total * 100);
  let msg = '开始你的旅程吧！';
  if (pct >= 100) msg = '🏆 全部打卡完成！传奇旅行家！';
  else if (pct >= 80) msg = `🌟 已完成 ${pct}%，即将完成！`;
  else if (pct >= 50) msg = `🎯 已完成 ${pct}%，继续加油！`;
  else if (pct >= 20) msg = `✈️ 已完成 ${pct}%，旅程过半！`;
  else if (pct > 0) msg = `🗺 已打卡 ${checked}/${total} 个`;
  document.getElementById('progress-text').textContent = msg;
}

function getFilteredMuseums() {
  return MUSEUMS.filter(m => {
    if (currentRegion !== '全部' && m.region !== currentRegion) return false;
    if (currentView === 'checked' && !checkedSet.has(m.id)) return false;
    if (currentView === 'unchecked' && checkedSet.has(m.id)) return false;
    if (searchText) {
      const q = searchText.toLowerCase();
      if (!(m.name.toLowerCase().includes(q) ||

}

function getMuseumPeriod(m) {
  // 1. Check manual override
  if (MUSEUM_PERIODS[m.id]) return MUSEUM_PERIODS[m.id];
  // 2. Hotels are always modern
  if (m.category === 'hotel') return 'modern';
  // 3. Heuristic by keywords in name/desc
  const text = (m.name + ' ' + (m.desc||'')).toLowerCase();
  if (/二战|纳粹|集中营|战俘|holocaust|auschwitz|dachau|buchenwald|bergen|sachsenhausen|neuengamme|mauthausen|ravensbr|treblinka|sobibor|majdanek|chelmno|gestapo|ss camp/.test(text)) return 'ww2';
  if (/冷战|cold war|铁幕|iron curtain|政治犯|political prison|克格勃|kgb|斯塔西|stasi/.test(text)) return 'coldwar';
  if (/殖民|penal colon|流放|convict|transportation/.test(text)) return 'colonial';
  if (/维多利亚|victorian|19世纪|1800|19th/.test(text)) return 'c19';
  // 4. Region-based defaults
  if (m.region === '大洋洲' || m.country === '澳大利亚' || m.country === 'Australia') return 'c19';
  return 'unknown';
}

function renderTimeline() {
  const list = document.getElementById('museum-list');
  const filtered = getFilteredMuseums();
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:#aaa;padding:30px 16px;font-size:13px;">没有匹配的博物馆</div>';
    return;
  }

  // Group by period
  const groups = {};
  filtered.forEach(m => {
    const period = getMuseumPeriod(m);
    if (!groups[period]) groups[period] = [];
    groups[period].push(m);
  });

  // Build HTML
  let html = '<div id="timeline-view">';
  TIMELINE_PERIODS.forEach(tp => {
    const items = groups[tp.key] || [];
    if (items.length === 0) return;
    html += `<div class="tl-era">
      <div class="tl-era-header">
        <span>${tp.label} <span style="font-size:11px;color:#aaa;">${tp.range}</span></span>
        <span class="tl-era-count">${items.length} 个</span>
      </div>
      <div class="tl-era-body">`;
    items.forEach(m => {
      const checked = checkedSet.has(m.id);
      const isHotel = m.category === 'hotel';
      const dotColor = isHotel ? '#e8590c' : getColor(m.region);
      html += `<div class="tl-item ${checked?'checked':''} ${isHotel?'hotel':''}" onclick="flyToMuseum(${m.id})">
        <div class="tl-dot" style="background:${dotColor}"></div>
        <div class="tl-name">${isHotel?'🏨 ':''}${m.name}</div>
        <div class="tl-country">${m.country}</div>
        <div class="tl-check ${checked?'checked':''}" onclick="toggleCheck(${m.id},event)" title="打卡">✓</div>
      </div>`;
    });
    html += '</div></div>';
  });
  html += '</div>';
  list.innerHTML = html;
}

  document.getElementById('sidebar').classList.remove('drawer-open');
  const overlay = document.getElementById('sidebar-overlay');
  overlay.classList.remove('active');
  setTimeout(() => { overlay.style.display = 'none'; }, 260);
  document.body.style.overflow = '';
}

function autoCloseDrawer() {
  if (window.innerWidth <= 768) closeDrawer();
}

function flyToMuseum(id) {
  const museum = MUSEUMS.find(m => m.id === id);
  if (!museum) return;
  autoCloseDrawer();
  map.flyTo([museum.lat, museum.lng], 16, { duration: 1.2 });
  setTimeout(() => showPopup(museum), 800);
}

function showStats() {
  var total = MUSEUMS.length;
  var checked = MUSEUMS.filter(function(m){ return checkedSet.has(m.id); }).length;
  var checkedIds = Array.from(checkedSet);
  var wishlist = JSON.parse(localStorage.getItem('prison_wishlist') || '[]');
  var want = wishlist.length;

  // Countries explored
  var countries = new Set();
  checkedIds.forEach(function(id){
    var m = MUSEUMS.find(function(x){ return x.id === id; });
    if (m) countries.add(m.country);
  });
  var countryCount = countries.size;
  var pct = total > 0 ? Math.round(checked / total * 100) : 0;

  // Update top numbers
  document.getElementById('st-checked').textContent = checked;
  document.getElementById('st-total').textContent = total;
  document.getElementById('st-want').textContent = want;
  document.getElementById('st-countries').textContent = countryCount;
  document.getElementById('st-progress-fill').style.width = pct + '%';
  document.getElementById('st-pct').textContent = '完成率 ' + pct + '%';

  // Region breakdown
  var regionColors = {
    '东亚':'#ff6b6b','东南亚':'#f97316','南亚':'#a855f7','中亚':'#0ea5e9',
    '西亚':'#ec4899','欧洲':'#8b5cf6','非洲':'#eab308','北美':'#ef4444',
    '南美洲':'#f43f5e','大洋洲':'#06b6d4'
  };
  var regions = ['东亚','东南亚','南亚','中亚','西亚','欧洲','非洲','北美','南美洲','大洋洲'];
  var regionCounts = {};
  regions.forEach(function(r){ regionCounts[r] = {total:0, checked:0}; });
  MUSEUMS.forEach(function(m){
    if (regionCounts[m.region]) {
      regionCounts[m.region].total++;
      if (checkedSet.has(m.id)) regionCounts[m.region].checked++;
    }
  });
  var rowsHtml = regions.map(function(r){
    var c = regionCounts[r];
    if (c.total === 0) return '';
    var barPct = c.total > 0 ? Math.round(c.checked / c.total * 100) : 0;
    var color = regionColors[r] || '#888';
    return '<div class="st-region-row">'+
      '<div class="st-region-label">'+r+'</div>'+
      '<div class="st-region-bar-wrap">'+
        '<div class="st-region-bar-fill" style="width:'+barPct+'%; background:'+color+'"></div>'+
      '</div>'+
      '<div class="st-region-count">'+c.checked+'/'+c.total+'</div>'+
    '</div>';
  }).join('');
  document.getElementById('st-regions').innerHTML = rowsHtml;

  document.getElementById('stats-overlay').classList.add('show');
}
