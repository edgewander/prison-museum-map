<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界监狱博物馆地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #222; }

  /* ===== HEADER ===== */
  #header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    z-index: 1000;
    position: relative;
  }
  #header .title-wrap { display: flex; align-items: center; gap: 12px; }
  #header .title-icon { font-size: 28px; }
  #header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  #header .subtitle { font-size: 12px; color: #adb5bd; margin-top: 2px; }
  #stats-bar {
    display: flex; gap: 20px; align-items: center;
  }
  .stat-item {
    text-align: center;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .stat-num { font-size: 20px; font-weight: 800; color: #ffd700; }
  .stat-label { font-size: 11px; color: #adb5bd; }
  #progress-text { font-size: 13px; color: #74c0fc; font-weight: 600; }

  /* ===== LAYOUT ===== */
  #app { display: flex; height: calc(100vh - 62px); }

  /* ===== SIDEBAR ===== */
  #sidebar {
    width: 300px;
    min-width: 260px;
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #2a2a4e;
    z-index: 100;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 14px 16px 10px;
    border-bottom: 1px solid #2a2a4e;
    background: #1a1a3e;
  }
  #sidebar-header h2 { font-size: 13px; color: #ffd700; margin-bottom: 6px; }
  #search-box {
    width: 100%;
    padding: 7px 12px;
    border: 1px solid #3a3a5e;
    border-radius: 20px;
    font-size: 12px;
    outline: none;
    background: #1a1a3e; color: #e0e0e0;
    transition: border-color 0.2s; box-sizing: border-box;
  }
  #search-box:focus { border-color: #4a9eff; }

  /* Region Filter */
  #region-filter {
    padding: 10px 16px;
    border-bottom: 1px solid #2a2a4e;
    display: flex;
    flex-wrap: wrap;
    gap: 3px; padding: 6px 12px;
  }
  .region-btn {
    padding: 3px 9px;
    border-radius: 12px;
    border: 1px solid #3a3a5e;
    font-size: 10px;
    cursor: pointer;
    background: #2a2a4e;
    color: #aaa;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .region-btn:hover { border-color: #4a9eff; color: #4a9eff; }
  .region-btn.active { background: #0f3460; color: #fff; border-color: #0f3460; }

  /* View Toggle */
  #view-toggle {
    padding: 8px 16px;
    border-bottom: 1px solid #2a2a4e;
    display: flex; gap: 4px; padding: 6px 12px;
  }
  .view-btn {
    flex: 1; padding: 4px 2px; border-radius: 6px; border: 1px solid #3a3a5e;
    font-size: 11px; cursor: pointer; background: #2a2a4e; color: #aaa;
    transition: all 0.15s; text-align: center;
  }
  .view-btn.active { background: #0f3460; color: #fff; border-color: #0f3460; }

  /* List */
  #museum-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #museum-list::-webkit-scrollbar { width: 4px; }
  #museum-list::-webkit-scrollbar-thumb { background: #555; border-radius: 2px; }
  .museum-item {
    padding: 10px 16px;
    cursor: pointer;
    border-bottom: 1px solid #2a2a4e;
    transition: background 0.12s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .museum-item:hover { background: #2a2a4e; }
  .museum-item.active-item { background: #1a3a5e; border-left: 3px solid #4a9eff; }
  .museum-item.checked { background: #1a3a2e; }
  .item-check {
    width: 20px; height: 20px; min-width: 20px;
    border-radius: 50%; border: 2px solid #666;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.15s; margin-top: 2px;
    font-size: 11px; color: transparent;
  }
  .item-check.checked { background: #28a745; border-color: #28a745; color: #fff; }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 13px; font-weight: 600; color: #ddd; line-height: 1.3; }
  .item-meta { font-size: 11px; color: #999; margin-top: 2px; }
  .item-num { font-size: 11px; color: #777; margin-right: 4px; }

  /* ===== MAIN CONTENT (right side) ===== */
  #main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; position: relative; }
  /* ===== MAP ===== */
  #map { height: 55%; min-height: 200px; flex-shrink: 0; z-index: 0; }

  /* ===== BOTTOM PANEL ===== */
  #bottom-panel { height: 45%; display: flex; overflow: hidden; background: #0d0d1a; min-height: 0; }
  .panel-col { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #1a1a3e; min-width: 0; overflow: hidden; }
  .panel-col:last-child { border-right: none; }
  .panel-header {
    padding: 8px 14px; font-size: 13px; font-weight: 700; color: #ffd700;
    background: linear-gradient(180deg, #1a1a3e, #111827);
    border-bottom: 1px solid #2a2a4e; flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
  }
  .panel-header-icon { font-size: 15px; }
  .panel-body { flex: 1; overflow-y: auto; min-height: 0; }
  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

  /* Shared column: two sub-panels stacked vertically */
  .panel-sub { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel-sub:first-child { border-bottom: 1px solid #2a2a4e; }
  .panel-sub .panel-body { flex: 1; overflow-y: auto; min-height: 0; }
  .panel-sub .panel-header { flex-shrink: 0; }

  /* ===== GISCUS COMMENTS ===== */
  .giscus-body { background: #0d0d1a; }
  .giscus-body .giscus { height: 100%; }
  .giscus-body .giscus-frame { width: 100%; height: 100%; border: none; }

  /* ===== POPUP ===== */
  .museum-popup {
    min-width: 260px;
    max-width: 340px;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  .popup-image-wrap { margin: 0 -19px; overflow: hidden; }
  .popup-image-wrap img { width: 100%; height: 160px; object-fit: cover; display: block; }
  .popup-header {
    background: linear-gradient(135deg, #1a1a2e, #0f3460);
    color: #fff;
    padding: 10px 14px;
    margin: -13px -19px 10px;
    border-radius: 4px 4px 0 0;
  }
  .popup-num { font-size: 11px; color: #adb5bd; margin-bottom: 3px; }
  .popup-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .popup-region { font-size: 11px; color: #74c0fc; margin-top: 3px; }
  .popup-body {
    font-size: 12px; line-height: 1.6;
    max-height: 240px; overflow-y: auto;
    padding-right: 4px;
    margin-bottom: 2px;
  }
  .popup-desc { color: #444; margin-bottom: 8px; }
  .popup-info-row { display: flex; gap: 6px; margin-bottom: 4px; align-items: flex-start; }
  .popup-info-icon { color: #0f3460; font-size: 13px; min-width: 16px; }
  .popup-info-text { color: #555; flex: 1; }
  .popup-check-btn {
    width: 100%; margin-top: 10px; padding: 7px;
    border-radius: 6px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all 0.2s;
    background: #0f3460; color: #fff;
  }
  .popup-check-btn.checked { background: #28a745; }
  .popup-check-btn:hover { opacity: 0.9; }
  .popup-website { color: #0f3460; font-size: 11px; text-decoration: none; }
  .popup-website:hover { text-decoration: underline; }
  .popup-share-btn {
    width: 100%; margin-top: 6px; padding: 7px;
    border-radius: 6px; border: 1px solid #ffd700; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all 0.2s;
    background: transparent; color: #ffd700;
  }
  .popup-share-btn:hover { background: rgba(255,215,0,0.15); }

  /* popup scrollbar (dark thin) */
  .popup-body::-webkit-scrollbar { width: 5px; }
  .popup-body::-webkit-scrollbar-track { background: transparent; }
  .popup-body::-webkit-scrollbar-thumb {
    background: rgba(15,52,96,0.3); border-radius: 3px;
  }
  .popup-body::-webkit-scrollbar-thumb:hover { background: rgba(15,52,96,0.5); }
  .popup-body { scrollbar-width: thin; scrollbar-color: rgba(15,52,96,0.3) transparent; }

  /* ===== FLOATING POPUP (独立浮层，不受地图 overflow 限制) ===== */
  .floating-popup {
    display: none; position: fixed; z-index: 99999;
    pointer-events: auto;
    max-width: 360px; min-width: 280px;
  }
  .floating-popup.show { display: block; }
  .floating-popup-inner {
    background: #fff; border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
    overflow: hidden;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  .floating-popup-arrow {
    width: 14px; height: 14px; background: #fff;
    position: absolute; left: 30px; bottom: -7px;
    transform: rotate(45deg);
    box-shadow: 3px 3px 8px rgba(0,0,0,0.15);
  }
  .floating-popup-arrow.arrow-top {
    top: -7px; bottom: auto;
    box-shadow: -2px -2px 6px rgba(0,0,0,0.12);
  }
  .floating-popup .popup-header {
    margin: 0; border-radius: 0; padding: 12px 16px;
  }
  .floating-popup .popup-image-wrap { margin: 0; }
  .floating-popup .popup-body { padding: 12px 16px; max-height: 200px; }
  .floating-popup .popup-check-btn { margin: 0 16px 12px; width: calc(100% - 32px); }
  .floating-popup .popup-share-btn { margin: 0 16px 12px; width: calc(100% - 32px); }
  .floating-popup-close {
    position: absolute; top: 8px; right: 12px; z-index: 10;
    width: 28px; height: 28px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.5); color: #fff;
    font-size: 16px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .floating-popup-close:hover { background: rgba(0,0,0,0.75); }

  /* ===== SHARE MODAL ===== */
  #share-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 99999;
    align-items: center; justify-content: center; flex-direction: column;
  }
  #share-overlay.show { display: flex; }
  #share-card {
    width: 360px; background: linear-gradient(160deg, #1a1a2e 0%, #16213e 30%, #0f3460 100%);
    border-radius: 16px; padding: 28px 24px 20px;
    border: 2px solid #2a2a5e;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(15,52,96,0.4);
    color: #fff; font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    text-align: center; position: relative; overflow: hidden;
  }
  #share-card::before {
    content: ''; position: absolute; top: -60px; right: -60px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(255,215,0,0.08) 0%, transparent 70%);
    border-radius: 50%;
  }
  #share-card::after {
    content: ''; position: absolute; bottom: -40px; left: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(255,215,0,0.06) 0%, transparent 70%);
    border-radius: 50%;
  }
  .sc-header {
    font-size: 12px; color: #adb5bd; letter-spacing: 1px;
    margin-bottom: 6px; position: relative; z-index: 1;
  }
  .sc-header span { color: #ffd700; }
  .sc-divider {
    height: 1px; background: linear-gradient(90deg, transparent, #ffd70055, transparent);
    margin: 12px 0; position: relative; z-index: 1;
  }
  .sc-icon { font-size: 40px; margin: 8px 0; position: relative; z-index: 1; }
  .sc-name {
    font-size: 18px; font-weight: 700; line-height: 1.3;
    margin: 6px 0; position: relative; z-index: 1;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .sc-meta {
    display: flex; justify-content: center; gap: 16px;
    font-size: 12px; color: #adb5bd; margin: 8px 0;
    position: relative; z-index: 1;
  }
  .sc-meta-item { display: flex; align-items: center; gap: 4px; }
  .sc-meta-item .dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  .sc-date {
    font-size: 13px; color: #74c0fc; margin: 6px 0;
    position: relative; z-index: 1;
  }
  .sc-id {
    font-size: 11px; color: #666; margin: 4px 0;
    position: relative; z-index: 1;
  }
  .sc-footer {
    font-size: 11px; color: #6c7a89; margin-top: 14px;
    position: relative; z-index: 1;
  }
  .sc-footer .url { color: #ffd700; font-weight: 600; }
  .sc-stamp {
    position: absolute; bottom: 18px; right: 22px;
    border: 2px solid rgba(255,215,0,0.5); color: rgba(255,215,0,0.7);
    font-size: 22px; font-weight: 900; padding: 4px 10px;
    border-radius: 6px; transform: rotate(-12deg);
    letter-spacing: 2px; pointer-events: none; z-index: 2;
  }
  #share-actions {
    display: flex; gap: 12px; margin-top: 18px;
  }
  #share-actions button {
    padding: 10px 24px; border-radius: 8px; border: none;
    cursor: pointer; font-size: 14px; font-weight: 600;
    transition: all 0.2s;
  }
  .btn-save {
    background: linear-gradient(135deg, #ffd700, #f0c000);
    color: #1a1a2e;
  }
  .btn-save:hover { filter: brightness(1.1); }
  .btn-close-share {
    background: rgba(255,255,255,0.1); color: #ddd;
    border: 1px solid #3a3a5e !important;
  }
  .btn-close-share:hover { background: rgba(255,255,255,0.2); }

  /* ===== STATS SHARE MODAL (stats overview card) ===== */
  #stats-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); z-index: 99999;
    align-items: center; justify-content: center; flex-direction: column;
    padding: 20px;
  }
  #stats-overlay.show { display: flex; }
  #stats-card {
    width: 380px; max-width: 95vw;
    background: linear-gradient(160deg, #0d0d19 0%, #1a1a2e 30%, #0a1628 100%);
    border-radius: 20px; padding: 32px 28px 24px;
    border: 2px solid #2a2a4a;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 60px rgba(15,52,96,0.3);
    color: #fff; font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    text-align: center; position: relative; overflow: hidden;
  }
  #stats-card::before {
    content: ''; position: absolute; top: -80px; right: -80px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(255,215,0,0.06) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  }
  #stats-card::after {
    content: ''; position: absolute; bottom: -60px; left: -60px;
    width: 150px; height: 150px;
    background: radial-gradient(circle, rgba(255,215,0,0.05) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  }
  .st-header {
    font-size: 11px; color: #8a8fab; letter-spacing: 2px;
    text-transform: uppercase; margin-bottom: 4px; position: relative; z-index: 1;
  }
  .st-header span { color: #ffd700; }
  .st-divider {
    height: 1px; background: linear-gradient(90deg, transparent, #ffd70033, transparent);
    margin: 14px 0; position: relative; z-index: 1;
  }
  .st-divider.thin { margin: 10px 0; }
  .st-big-num {
    font-size: 52px; font-weight: 900;
    background: linear-gradient(180deg, #ffd700 0%, #e6a800 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1; position: relative; z-index: 1;
  }
  .st-big-label {
    font-size: 13px; color: #adb5bd; margin: 2px 0 8px;
    position: relative; z-index: 1;
  }
  .st-sub-row {
    display: flex; justify-content: center; gap: 20px;
    font-size: 13px; color: #ced4da; margin-bottom: 12px;
    position: relative; z-index: 1;
  }
  .st-sub-row .st-val { color: #ffd700; font-weight: 700; }
  .st-progress-wrap {
    width: 100%; height: 8px; background: rgba(255,255,255,0.08);
    border-radius: 4px; overflow: hidden; position: relative; z-index: 1;
    margin-bottom: 6px;
  }
  .st-progress-fill {
    height: 100%; background: linear-gradient(90deg, #b8860b, #ffd700, #ffed4e);
    border-radius: 4px; transition: width 0.5s;
  }
  .st-pct {
    font-size: 11px; color: #6c7a89; position: relative; z-index: 1;
    margin-bottom: 14px;
  }
  .st-section-title {
    font-size: 12px; color: #adb5bd; text-align: left;
    margin-bottom: 8px; position: relative; z-index: 1;
    letter-spacing: 1px;
  }
  .st-section-title span { color: #ffd700; }
  .st-region-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px; position: relative; z-index: 1;
  }
  .st-region-label {
    font-size: 11px; color: #adb5bd; width: 52px;
    text-align: right; flex-shrink: 0;
  }
  .st-region-bar-wrap {
    flex: 1; height: 10px; background: rgba(255,255,255,0.06);
    border-radius: 5px; overflow: hidden;
  }
  .st-region-bar-fill {
    height: 100%; border-radius: 5px; transition: width 0.5s;
    opacity: 0.7;
  }
  .st-region-count {
    font-size: 10px; color: #6c7a89; width: 42px;
    flex-shrink: 0;
  }
  .st-footer {
    font-size: 11px; color: #6c7a89; margin-top: 18px;
    position: relative; z-index: 1;
  }
  .st-footer .url { color: #ffd700; font-weight: 600; }
  .st-stamp {
    position: absolute; bottom: 20px; right: 24px;
    border: 2px solid rgba(255,215,0,0.4); color: rgba(255,215,0,0.6);
    font-size: 12px; font-weight: 700; padding: 3px 8px;
    border-radius: 4px; transform: rotate(-10deg);
    letter-spacing: 1px; pointer-events: none; z-index: 2;
  }
  #stats-actions {
    display: flex; gap: 12px; margin-top: 16px;
  }
  #stats-actions button {
    padding: 10px 24px; border-radius: 8px; border: none;
    cursor: pointer; font-size: 14px; font-weight: 600;
    transition: all 0.2s;
  }
  .btn-stats-save {
    background: linear-gradient(135deg, #ffd700, #f0c000);
    color: #1a1a2e;
  }
  .btn-stats-save:hover { filter: brightness(1.1); }
  .btn-stats-close {
    background: rgba(255,255,255,0.1); color: #ddd;
    border: 1px solid #3a3a5e !important;
  }
  .btn-stats-close:hover { background: rgba(255,255,255,0.2); }

  /* Make stats-bar clickable hint */
  #stats-bar { cursor: pointer; }
  #stats-bar:hover { opacity: 0.85; }

  /* ===== CUSTOM MARKERS ===== */
  .custom-marker {
    width: 28px; height: 28px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .marker-inner {
    transform: rotate(45deg);
    font-size: 12px; color: #fff; font-weight: 700;
  }

  /* ===== FOOTER STATUS ===== */
  #map-footer {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px;
    color: #555;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 500;
    pointer-events: none;
    display: none;
  }

  /* ===== HAMBURGER BUTTON (mobile only) ===== */
  #hamburger-btn {
    display: none;
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
    margin-left: 8px;
  }
  #hamburger-btn:hover { background: rgba(255,255,255,0.1); }

  /* ===== SIDEBAR OVERLAY / SCRIM ===== */
  #sidebar-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 998;
    opacity: 0;
    transition: opacity 0.25s;
  }
  #sidebar-overlay.active { display: block; opacity: 1; }

  /* ===== DRAWER CLOSE BUTTON (mobile only) ===== */

{id:2, name:"抚顺战犯管理所旧址陈列馆", region:"东亚", country:"中国", lat:41.8571, lng:123.9572, address:"辽宁省抚顺市顺城区宁远街43号", ticket:"门票50 元", hours:"8:30-16:30(4 月-10 月)；8:30-16:00(11 月-3月)；周一闭馆", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/003_抚顺战犯管理所旧址陈列馆.jpeg", desc:"抚顺战犯管理所旧址陈列馆位于辽宁省抚顺市顺城区宁远街43号。原为日本侵华时期修建的监狱，48 年后，成为改造日本战犯、伪满战犯及国民党战俘的特殊场所。"},
{id:3,name:"沈阳二战盟军战俘营旧址陈列馆",region:"东亚",country:"中国",lat:41.805,lng:123.49,address:"辽宁省沈阳市大东区地坛街 30-3 号",ticket:"免费",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%B2%88%E9%98%B3%E4%BA%8C%E6%88%98%E7%9B%9F%E5%86%9B%E6%88%98%E4%BF%98%E8%90%A5%E6%97%A7%E5%9D%80%E9%99%88%E5%88%97%E9%A6%86.jpg",desc:"奉天俘虏收容所，二战时日本在东北的中心战俘营，有 “东方奥斯维辛” 之称。\n时间：1942.11—1945.8，关押美、英、加、澳、荷、法等国战俘 2000 余名，含76 名将军级军官，约248 人死于虐待、疾病与过劳。\n地位：二战日军18 座中心战俘营中保存最完整的一处；全国重点文保单位、国家级抗战纪念遗址"},

{id:6,name:"潍县乐道院侨民集中营",region:"东亚",country:"中国",lat:36.707,lng:119.158,address:"山东省潍坊市奎文区虞河路西 2999 号（虞河南岸）",ticket:"免费",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E4%B9%90%E9%81%93%E9%99%A2.jpg",desc:"潍县集中营建筑群原来叫“乐道院”，位于潍县东南郊区，是美国传教士从19世纪末逐渐建立起来的传教基地。到1941年，已经有教堂、学校和医院三个部分。盟军向日本宣战之后，日本人就把这里占领，修了围墙、营房，拉上电网，改造成集中营。集中营的日本名字叫 “潍县敌国人集团生活所”。关押英、美、法、澳、加等近 20 国侨民 2000 余人（含 327 名儿童），是二战亚洲最大盟国侨民集中营。"},
{id:7, name:"苏三监狱", region:"东亚", country:"中国", lat:36.25, lng:111.65, address:"临汾市洪洞县古槐路66号", ticket:"成人40元，学生/老人半价", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E8%8B%8F%E4%B8%89%E7%9B%91%E7%8B%B1.jpg", desc:""},
{id:8, name:"青岛德国监狱旧址博物馆", region:"东亚", country:"中国", lat:36.0607, lng:120.3174, address:"青岛市市南区常州路23 号", ticket:"成人25元，学生/老人10元", hours:"旺季（4 月1 日至10 月31 日）：周二至周日8:30-17:30。淡季（11 月1 日至次年3 月31 日）：周二至周日9:00-17:00。每周一闭馆（法定节假日除外）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/001_青岛德国监狱旧址博物馆.jpeg", desc:"青岛德国监狱旧址博物馆位于青岛市市南区常州路23 号，毗邻游人如织的栈桥。是中国现存最早的殖民监狱遗址，也是难得的19 世纪德国古堡式建筑典范。"},
{id:9, name:"明潞简王陵", region:"东亚", country:"中国", lat:35.400, lng:113.928, address:"河南省新乡市凤泉区潞王坟乡坟上村", ticket:"40 元", hours:"夏季：8:30–18:00（17:30 止票）；冬季：8:00–17:30（17:00 止票）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%98%8E%E6%BD%9E%E7%AE%80%E7%8E%8B%E9%99%B5.jpg", desc:"朱翊镠（1568–1614），明万历皇帝唯一同母弟。始建于万历四十年（1612年），1615年完工，占地约400亩。几乎全用青石、白石砌筑，仿北京定陵规制，有\"中原定陵\"之称。1953–2005年，次妃赵氏墓（西陵）被河南省豫北监狱占用52年。"},
{id:10, name:"新密县衙", region:"东亚", country:"中国", lat:34.513, lng:113.360, address:"河南省郑州市新密市城关镇东街", ticket:"40 元", hours:"8:30–17:30（冬季 17:00 闭馆），周一闭馆（节假日除外）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%96%B0%E5%AF%86%E5%8E%BF%E8%A1%99.jpg", desc:"隋大业十二年（616 年）始建，距今约1400年；元代毁于战火，明洪武三年（1370 年）原址复建，现存格局为明清风格。坐北朝南，占地约4万平方米，五进院落、300余间房，中轴对称，左文右武、前堂后宅。内有千年监狱，自隋代沿用至2003年。"},
{id:11, name:"合柴1972 文创园", region:"东亚", country:"中国", lat:31.8086, lng:117.2533, address:"中国安徽省合肥市包河区金寨路与天堂寨路交口", ticket:"免费开放", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/004_合柴1972_文创园.jpeg", desc:"合柴1972文创园中国安徽省合肥市包河区金寨路与天堂寨路交口。该园区不仅是国内首座由监狱旧址改造而成的文化创意产业园，也是合肥最具代表性的工业遗产再生案例。"},
{id:12,name:"芜湖模范监狱",region:"东亚",country:"中国",lat:31.326,lng:118.385,address:"安徽省芜湖市镜湖区古城东内街 28、32 号（宣春门西侧）",hours:"尚未开放",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E8%8A%9C%E6%B9%96%E6%A8%A1%E8%8C%83%E7%9B%91%E7%8B%B1.jpg",desc:"芜湖模范监狱（俗称 “大清监狱”，正式名安徽省立第二监狱），是中国近代狱制改革的代表性建筑，2025 年入选 “中国 20 世纪建筑遗产”。\n1905 年：始建，初名皖南罪犯习艺所，羁押皖南各县罪犯，教授纺织、木作等技艺。\n1911 年：更名模范监狱，践行清末狱制改良。\n1918 年：扩建为安徽省立第二监狱，规模与设施为全省之冠。\n1949 年后：更名安徽省第一监狱，1965 年停用，改为工厂宿舍。\n2012 年：列为安徽省级文保单位；2025 年修缮完工，即将开放。\n建筑特色：占地约10127㎡，坐北朝南，核心为十字形监房（放射状布局），中央设八角瞭望塔。"},
{id:13,name:"饮马塘监狱旧址",region:"东亚",country:"中国",lat:30.517,lng:117.042,address:"安徽省安庆市大观区德宽路与壕埂街交叉口南 200 米（关岳庙街附近）",hours:"不开放",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E9%A5%AE%E9%A9%AC%E5%A1%98%E7%9B%91%E7%8B%B1%E6%97%A7%E5%9D%80.jpg",desc:"有着百年变迁史的老监狱。坐北朝南，占地约20 亩，由监房、工场、哨楼等组成。始建于清光绪三十二年（1906），初名 “安庆罪犯习艺所”，收容偷窃等轻罪犯处。现存清末 “习艺所” 汉白玉石额。1910 年改称 “安徽模范监狱”，1930 年设 “安徽省反省院”，1949 年定名 “饮马塘监狱”。1995年更名为\"安徽省安庆监狱\"，即后来的安徽省第一监狱。2009年9月, 安庆监狱老监区近千名在押犯转移至新监区, 饮马塘监狱空置，后曾对外出租，现荒废。"},
{id:14,name:"白公馆",region:"东亚",country:"中国",lat:29.575,lng:106.443,address:"重庆市沙坪坝区童家桥街道壮志路治法三村 63 号（歌乐山麓、烈士陵园内）",ticket:"免费",hours:"9:00–16:40（16:30 止入）",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E7%99%BD%E5%85%AC%E9%A6%86.jpg",desc:"白公馆（原名香山别墅），与渣滓洞并称 “两口活棺材”，是抗战时期国民党军统级别最高的秘密监狱，《红岩》原型地。前身：20 世纪 30 年代建，四川军阀白驹别墅，自诩白居易后裔，取名 “香山别墅”，俗称 “白公馆”。\n沿革：\n1939 年：戴笠以 30 两黄金强购，改为军统本部直属看守所（“中学”）。\n1943 年：中美合作所成立，改为美军第三招待所，犯人转渣滓洞重庆市人民政府。\n1945 年：恢复看守所，专押高级政治犯重庆市人民政府。\n1949.11.27：“一一・二七大屠杀”，19 人脱险重庆市人民政府。\n建筑：占地约1131㎡，土砖木结构，两层，20 间男牢；地下室为地牢 / 刑讯室，防空洞为刑讯洞。\n关押名人：杨虎城、小萝卜头（宋振中）、黄显声、罗世文、车耀先、陈然、罗广斌等。\n现状：全国重点文保单位（1988）、国家 4A 级景区、红岩革命博物馆核心区。"},
{id:15,name:"渣滓洞",region:"东亚",country:"中国",lat:29.574,lng:106.443,address:"重庆市沙坪坝区歌乐山麓凌云路（歌乐山烈士陵园社区内）",ticket:"免费",hours:"9:00–17:00（16:30 止入），周一闭馆",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%B8%A3%E6%BB%93%E6%B4%9E.jpg",desc:"渣滓洞看守所旧址，与白公馆并称 “两口活棺材”，是国民党军统关押革命志士的秘密监狱，《红岩》核心原型地。\n前身：20 世纪 20 年代小煤窑，因渣多煤少得名 “渣滓洞”。\n沿革：1943 年：军统霸占煤窑设看守所（“小学”），白公馆犯人迁此。\n1947 年：一度关闭，年底重开，专押 **《挺进报》案、六・一学潮、川东起义 ** 被捕者。\n1949.11.27：“一一・二七大屠杀”，187 人殉难，15 人脱险。\n布局：分内外两院\n外院：特务办公室、刑讯室（陈列老虎凳、竹签等 72 种刑具）。\n内院：16 间男牢（一楼一底）、2 间女牢，放风坝狭小。\n关押名人：江竹筠（江姐）、许建业、何雪松、小萝卜头（宋振中）等，最多时囚300 余人。\n现状：全国重点文保单位（1988）、国家 4A 级景区、红岩革命博物馆核心区，1963 年开放。"},
{id:16,name:"雷马屏监狱陈列馆",region:"东亚",country:"中国",lat:28.55,lng:103.58,address:"凉山彝族自治州西宁镇雷马屏监狱场部",ticket:"免费",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E9%9B%B7%E9%A9%AC%E5%B1%8F%E7%9B%91%E7%8B%B1%E9%99%88%E5%88%97%E9%A6%86.jpg",desc:"雷马屏监狱场部"},
{id:17,name:"上饶集中营",region:"东亚",country:"中国",lat:28.432,lng:117.974,address:"江西省上饶市信州区陵园路 66 号（南郊茅家岭）",ticket:"免费",hours:"9:00–17:00（纪念馆 16:30 止入）；周一闭馆",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E4%B8%8A%E9%A5%B6%E9%9B%86%E4%B8%AD%E8%90%A5.jpg",desc:"上饶集中营是 1941 年皖南事变后，国民党军统在江西上饶设立的集中营，由茅家岭、周田、李村、七峰岩等多处监狱组成，总面积约2 平方公里。1941 年 3 月设立，至 1942 年 6 月迁福建，历时 1 年 4 个月。\n规模：囚禁新四军军长叶挺、将领张正坤、冯达飞等排以上干部770 余人，及冯雪峰等爱国人士近150 人，总计900 余人。"},
{id:18,name:"息烽集中营",region:"东亚",country:"中国",lat:27.086,lng:106.741,address:"贵州省贵阳市息烽县永阳街道猫洞村（城南约 6 公里阳朗坝）",ticket:"免费（凭身份证）",hours:"08:30–16:30；每月最后一周周一13:00 后闭馆",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%81%AF%E7%83%BD%E9%9B%86%E4%B8%AD%E8%90%A5.jpg",desc:"抗战时期国民党军统规模最大、级别最高、管理最严的秘密监狱，对外称 “国民政府军事委员会息烽行辕”，内部代号 “大学”。1938 年 11 月–1946 年 7 月，存续近 8 年。由阳朗坝本部（核心区）与玄天洞囚禁处（距本部约 14 公里，专押重犯）组成，总占地约447.8 亩。\n监房：本部设 9 栋 52 间，以 “忠、孝、仁、爱、信、义、和、平” 命名，“义斋” 为女监；猫洞为秘密刑讯场。累计关押1200 余人，包括杨虎城、罗世文、车耀先、张露萍等；600 余人被杀害或折磨致死，400 余人失踪，幸存者不足百人。"},
{id:19,name:"福州梅园监狱",region:"东亚",country:"中国",lat:26.0,lng:119.456,address:"福建省福州市马尾区昭忠路昭忠祠景区内（马限山山顶）",ticket:"免费",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E7%A6%8F%E5%B7%9E%E6%A2%85%E5%9B%AD%E7%9B%91%E7%8B%B1.jpg",desc:"梅园监狱（又称马限监狱、罗星塔监狱），是英国殖民者在福州私设的监狱旧址，始建于清咸丰四年（1854）（一说同治九年 1870），英国人以 “捕海盗” 为名兴建，实际用于关押中国船民、渔民及反英民众，勒索 “护航费”。欧式砖木结构，坐西北朝东南，占地约310–450㎡，分地上、地下两层。地上：6 间牢房，墙高开小铁窗，通风极差。地下：地牢 + 水牢，阴暗潮湿；牢门仅0.9m×0.6m，需爬行进入。"},
{id:20, name:"白色恐怖景美纪念园区", region:"东亚", country:"中国台湾", lat:24.9764, lng:121.5378, address:"台湾新北市新店区复兴路131 号", ticket:"免费参观", hours:"每周二至周日9:00 至17:00。园区每日10:30 和14:30提供免费定时导览，无需预约，直接至服务中心集合。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/007_%E7%99%BD%E8%89%B2%E6%81%90%E6%80%96%E6%99%AF%E7%BE%8E%E7%BA%AA%E5%BF%B5%E5%9B%AD%E5%8C%BA.jpeg", desc:"白色恐怖景美纪念园区（以下简称景美园区）位于台湾新北市新店区复兴路131 号。这座园区曾是台湾“白色恐怖”时期羁押和审判政治犯的核心场所，如今转型为国家人权博物馆的一部分。"},
{id:21, name:"狱政博物馆（嘉义旧监狱）", region:"东亚", country:"中国台湾", lat:23.4837, lng:120.4529, address:"台湾嘉义市东区维新路140 号", ticket:"免费参观", hours:"每周二至周日9:30-16:30，每日提供四场免费导览（9:30、10:30、13:30、14:30），每场约一小时。周一休馆。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/008_狱政博物馆（嘉义旧监狱）.jpeg", desc:"嘉义旧监狱（现为狱政博物馆）位于台湾嘉义市东区维新路140 号。是台湾保存最完整的日式监狱建筑。"},
{id:22, name:"白色恐怖绿岛纪念园区", region:"东亚", country:"中国台湾", lat:22.6697, lng:121.4739, address:"台湾台东县绿岛乡公馆村将军岩20 号", ticket:"免费入场", hours:"每日9:00-17:00，每年10 月1 日至次年4 月30 日期间每周一休园（国定假日除外）。免费入场。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/006_白色恐怖绿岛纪念园区.jpeg", desc:"白色恐怖绿岛纪念园区（以下简称绿岛园区）位于台湾台东县绿岛乡公馆村将军岩20 号。是一个承载着人权抗争与威权统治记忆的文化景观，见证了台湾“白色恐怖”时期的政治迫害，许多知名人物曾被关押于此，如今转型为文化部国家人权博物馆的一部分。"},
{id:23, name:"香港大馆", region:"东亚", country:"中国香港", lat:22.2818, lng:114.1545, address:"香港中环荷李活道10 号", ticket:"免费入场", hours:"每日10:00 至23:00（展览区至19:00），免费入场。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/005_香港大馆.jpeg", desc:"大馆（Tai Kwun）位于香港中环荷李活道10 号。这座博物馆原为香港中央警署、裁判司署和域多利监狱的综合建筑群，经过精心修复与再利用，转型为香港最大的文化遗产与艺术中心。"},
{id:24, name:"网走监狱博物馆：北疆苦役见证", region:"东亚", country:"日本", lat:44.0091, lng:144.272, address:"日本北海道网走市呼人1-1", ticket:"成人门票为1500 日元", hours:"5 月至9 月：8:30-18:00；10 月至4 月：9:00-17:00，全年无休。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/010_网走监狱博物馆：北疆苦役见证.jpeg", desc:"作为日本保存最为完好的集治监时代监狱，1985 年，网走监狱博物馆（Abashiri Prison Museum）在天都山腰、网走湖畔重新面世。不仅成为当地热门景点，更是北海道历史的重要见证。"},
{id:25,name:"CAPIC狱中制品商店",region:"东亚",country:"日本",lat:35.711,lng:139.656,address:"东京〒165-0026 東京都中野区新井 3-37-2",ticket:"无",hours:"周二至周六 9:30–17:00",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/CAPIC%E7%8B%B1%E4%B8%AD%E5%88%B6%E5%93%81%E5%95%86%E5%BA%97%EF%BC%88CAPIC%20prison%20product%20shop%EF%BC%89.jpg",desc:"CAPIC 是矫正协会刑务所作业协力事业部的缩写，为日本公益财团法人，专门销售全国监狱受刑人制作的产品。商品范围约1000品类：木工、缝纫、日用、食品等，价格平价品质扎实。"},
{id:26,name:"江户传马町牢屋敷",region:"东亚",country:"日本",lat:35.689,lng:139.78,address:"东京都中央区日本桥小传马町 3～5 番地（十思公园、十思广场一带）",ticket:"无",hours:"全天",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%B1%9F%E6%88%B7%E4%BC%A0%E9%A9%AC%E7%94%BA%E7%89%A2%E5%B1%8B%E6%95%B7.jpg",desc:"传马町牢屋敷（てんまちょうろうやしき）是江户时代最大、存续最久的幕府监狱，从 1613 年沿用至 1875 年，约 260 年。\n历史沿革\n1613 年（庆长 18）：从常盘桥门外迁至传马町，正式启用。\n江户时代：负责收押、审讯、执行刑罚（含斩首），可容纳约2000 人，占地 2618 坪（约 8600㎡）。\n1875 年（明治 8）：监狱迁至市谷，后发展为中野刑务所。\n1923 年关东大地震后：原址改建为十思公园与十思小学（现十思广场）。\n2012 年：出土石垣等遗迹，被指定为东京都旧迹（文化财）著名囚犯\n吉田松阴：幕末思想家，1859 年在此处决。\n高野长英：兰学者，1844 年火灾时趁机越狱。\n长谷川平藏：江户名捕，曾任 “火付盗贼改”，管理此地。有遗址碑、吉田松阴终焉地碑。"},
{id:27, name:"明治博物馆村", region:"东亚", country:"日本", lat:35.3836, lng:136.9475, address:"爱知县犬山市入鹿湖边明治博物馆村", ticket:"成人门票2000 日元", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%98%8E%E6%B2%BB%E5%8D%9A%E7%89%A9%E9%A6%86%E6%9D%91.jpg", desc:""},
{id:28,name:"奈良少年刑务所",region:"东亚",country:"日本",lat:34.688,lng:135.832,address:"奈良县奈良市般若寺町 18",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%A5%88%E8%89%AF%E5%B0%91%E5%B9%B4%E5%88%91%E5%8A%A1%E6%89%80.jpg",desc:"旧奈良监狱（奈良少年刑务所）是日本明治五大监狱中唯一完整保存的实物，1908 年（明治 41）竣工，2017 年被指定为国家重要文化财。英国式红砖、放射状 “哈维兰系统”，中央主楼 + 5 条舍房呈扇形展开，可容约 1000 人2026.4.27：奈良监狱博物馆开馆（9:00–17:00，最终入馆 16:00）\n2026.6.25：虹夕诺雅 奈良监狱（豪华酒店）开业"},
{id:29,name:"广岛拘置役外墙壁画",region:"东亚",country:"日本",lat:34.395,lng:132.457,address:"广岛拘置役",ticket:"无",hours:"全天",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%B9%BF%E5%B2%9B%E6%8B%98%E7%BD%AE%E5%BD%B9%E5%A4%96%E5%A2%99%E5%A3%81%E7%94%BB.jpg",desc:"广岛看守所（拘置）的北墙和东墙上有总长200米，高2米的壁画，由画家入野忠义（1939-2013）创作。该项目由广岛市委托，为纪念广岛城建成400周年而绘制，于1989年11月竣工。壁画描绘的是江户时代末期仅举办过一次的“砂持化政”节，入野以描绘江户时代广岛城下町风貌的画卷《叡山一蘭圖》等为灵感进行创作。\n2009年，在入野本人的要求下，对壁画进行了修复。他修改了构图，将原本带框的画作变成了连续的卷轴， 2013 年 5 月（入野去世前五个月）完成了修复工作。\n近年，广岛看守所计划提升重建，原外墙将被拆除，该壁画可能以数字形式或缩小复刻到瓷板上保存。"},
{id:30,name:"福冈旧三池集治监外墙",region:"东亚",country:"日本",lat:33.026,lng:130.452,address:"日本福冈县大牟田市上官町 4 丁目 77（福冈县立三池工业高中）",ticket:"无",hours:"不开放",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E7%A6%8F%E5%86%88%E6%97%A7%E4%B8%89%E6%B1%A0%E9%9B%86%E6%B2%BB%E7%9B%91%E5%A4%96%E5%A2%99.jpg",desc:"旧三池集治监（しゅうじかん），是明治日本产业革命遗产核心遗址，为西日本唯一的国立重刑犯监狱，专门羁押囚犯用于三池煤矿强制劳动。\n历史沿革\n1875 年：明治政府开始将熊本县囚犯送往三池煤矿采煤。\n1883 年（明治 16）：正式设立国立三池集治监，收容西日本各县重刑犯，设计容量2000 人，高峰（1897 年）达2166 人。\n1889 年：三池煤矿转由三井组经营，囚犯劳动继续。\n1931 年（昭和 6）：因人道主义压力与机械化，囚犯劳动终止，监狱关闭。\n1950 年：原址改为福冈县立三池工业高中。\n建筑与遗存：原建筑已拆除，仅存600 米长、5–6 米高的红砖外墙与石垣，为福冈县指定有形文化财（1996）。附近有原宫原矿坑等。"},
{id:31,name:"浦上分局遗址",region:"东亚",country:"日本",lat:32.777,lng:129.864,address:"长崎和平公园",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E9%95%BF%E5%B4%8E%E7%9B%91%E7%8B%B1%E6%B5%A6%E4%B8%8A%E5%88%86%E5%B1%80.jpg",desc:"离长崎原爆中心最近的建筑。1945年8月9日，美军在投下原子弹，当场死了134人（18名职工，35名家属，81名服刑人员，其中32名中国人），监狱建筑直接核平，剩了一个烟囱。公园内可见扇形建筑根基及“浦上监狱分局中国人原爆牺牲者追悼碑”。"},
{id:32, name:"韩国·西大门刑务所历史馆", region:"东亚", country:"韩国", lat:37.5739, lng:126.9557, address:"首尔特别市西大门区统一路251", ticket:"成人门票为3000 韩元", hours:"3 月至10 月：9:30-18:00；11 月至2 月：9:30-17:00，每周一休馆（若周一为节假日则次日休馆）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/011_韩国·西大门刑务所历史馆.jpeg", desc:"西大门刑务所历史馆位于韩国首尔市西大门独立公园内（岘底洞101）。是一座保存完好的殖民时代监狱遗址。"},
{id:33,name:"益山监狱拍摄基地",region:"东亚",country:"韩国",lat:35.95,lng:126.95,address:"全北特别自治道益山市圣堂面咸南路 207 号",ticket:"基础参观免费；囚服租赁约2000韩元/套",hours:"夏季09:00-18:00，冬季09:00-17:00，周一闭馆",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/益山监狱拍摄基地.jpg",desc:"韩国唯一的专业监狱主题影视拍摄基地，2005年为拍摄电影《假日》搭建，占地约2.2万㎡。完整还原真实监狱场景，已累计拍摄300余部韩剧和电影，包括《7号房的礼物》《与神同行》等。提供囚服租赁、AR监狱逃脱游戏等特色服务。"},
{id:34, name:"韩国巨济岛战俘营", region:"东亚", country:"韩国", lat:0, lng:0, address:"庆尚南道巨济市古县洞", ticket:"", hours:"开放时间：09:00–18:00（冬季至 17:00）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%B7%A8%E6%B5%8E%E5%B2%9B%E6%88%98%E4%BF%98%E8%90%A5.jpg", desc:"1951 年 2 月，联合国军（美军为主）为收容朝鲜战争中朝战俘，在巨济岛建当时全球最大战俘营。高峰关押：朝鲜人民军约 15 万人、志愿军约 2 万人，总计 17 万人。布局：山谷两侧密布帐篷 / 半永久营房，10–15 层铁丝网 + 哨塔 + 重机枪 + 坦克，海陆空严防。管理方：美军第 9 步兵团、3 步兵师、187 空降团，韩军 32/33 警卫队。生存环境：50 人挤 1 帐篷，地面铺麻袋；食物匮乏（日均 1 磅主食）；疫病流行。酷刑、意识形态分裂。关键事件：巨济岛事件（1952.5）"},
{id:35, name:"5・18 自由公园", region:"东亚", country:"韩国", lat:0, lng:0, address:"光州广域市西区内防路 152（서구 내방로 152）", ticket:"免费", hours:"09:00–18:00", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/5.18%E8%87%AA%E7%94%B1%E5%85%AC%E5%9B%AD.jpg", desc:"5・18 自由公园（5・18자유공원），原尚武台宪兵队军中拘留所（상무대 헌병대 군내 구류소），是 1980 年光州事件（5・18 民主化运动）期间，全斗焕戒严军队用于抓捕、审讯、酷刑、临时关押市民与学生的核心场所，现为韩国国家级历史遗迹与人权教育地。保留扇形牢房区：6 间扇形禁闭室，每间约 10㎡，关押 20–30 人；铁丝网、铁门锁、水泥地原样保留。拷问室（原食堂）：长桌、刑具、电击设备复原，配酷刑场景雕塑与说明等。"},
{id:36, name:"雅加达历史博物馆", region:"东南亚", country:"印尼", lat:-6.18, lng:106.828, address:"雅加达老城区巴达维亚市政厅", ticket:"成人约5,000 印尼盾（约2.5元）", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%B3%95%E5%A1%94%E5%B8%8C%E6%8B%89%E5%8D%9A%E7%89%A9%E9%A6%86.jpg", desc:""},
{id:37,name:"布鲁岛",region:"东南亚",country:"印度尼西亚",lat:-3.4,lng:126.66666666666667,address:"在塞兰岛（Seram）以西 68 公里，隔马尼帕海峡（Selat Manipa）；安汶岛东北方向。",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%B8%83%E9%B2%81%E5%B2%9B.jpg",desc:"布鲁岛（Pulau Buru），号称热带古拉格。1969–1979/80：苏哈托 “新秩序” 时期，将布鲁岛设为政治犯流放地（Gulag），关押约1 万人，多为 1965 年 “九三〇事件” 相关左翼人士、共产党人、异见者。1969–1979年，印尼著名作家普拉姆迪亚曾在此被流放十年（他也曾被短暂关押于努萨康邦甘岛），当局禁止他使用纸笔，他最初靠向其他囚犯讲故事来创作，后来获准书写，将故事偷偷带出岛外。诞生了他最著名的作品——“布鲁岛四部曲”，不过布鲁岛四部曲并没有涉及布鲁岛的生活，关于布鲁岛的劳改生涯，他记录在回忆录《哑巴独白》（The Mute's Soliloquy）中。"},
{id:38,name:"万隆班丘伊监狱遗址",region:"东南亚",country:"印度尼西亚",lat:-6.914,lng:107.61,address:"Soekarno-Hatta 路",ticket:"免费",hours:"8：00-16：00",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E4%B8%87%E9%9A%86%E7%8F%AD%E4%B8%98%E4%BC%8A%E7%9B%91%E7%8B%B1%E9%81%97%E5%9D%80.jpg",desc:"班丘伊监狱遗址（Monumen Penjara Banceuy），该监狱1877年由荷兰人建造，原名 Bantjeuj-gevangenis，是西爪哇最古老的殖民监狱之一。专收低级政治犯与普通刑事犯；上层关政治犯、下层关平民囚犯。因反对殖民统治，“印尼国父”苏加诺于1930年在此被关押八个月。1983年，监狱拆除，保留了当年关押苏加诺的第5号牢房（Block F）和警卫塔。"},
{id:39,name:"泗水古城penjara监狱",region:"东南亚",country:"印度尼西亚",lat:-7.245,lng:112.738,address:"Jl. Penjara, Krembangan Selatan, Kec. Krembangan, Kota Surabaya, Jawa Timur",hours:"不对外开放",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%B3%97%E6%B0%B4penjara%E5%BA%9F%E5%BC%83%E7%9B%91%E7%8B%B1.jpg",desc:"泗水最古老的荷兰殖民监狱，关押过大量政治犯、独立运动领袖。国歌作者曾被关押，建筑老化，废弃。部分区域被第三方使用。"},
{id:40,name:"努萨康邦甘岛",region:"东南亚",country:"印度尼西亚",lat:-7.716666666666667,lng:108.85,address:"印尼中爪哇省芝拉扎县（Cilacap），爪哇岛南岸外海",image:"",desc:"努萨康邦甘岛（Nusa Kambangan），中爪哇省的南部。别称：印尼恶魔岛、死刑岛、监狱岛荷兰殖民时期开始关人，岛上九座监狱，目前还有四座在运营。但该岛不允许自由行，必须至少组成15人的团，需要单独申请许可以及安保人员陪同，且当日下午六点必须离岛。"},
{id:41,name:"日惹Wirogunan监狱",region:"东南亚",country:"印度尼西亚",lat:-7.801,lng:110.378,address:"Jl. Tamansiswa No.6, Wirogunan, Mergangsan, Kota Yogyakarta, Indonesia（日惹市 Tamansiswa 大街 6 号）",ticket:"无",hours:"全天",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%97%A5%E6%83%B9Wirogunan%E7%9B%91%E7%8B%B1.jpg",desc:"Wirogunan，始建：1917 年，荷兰殖民时期，原名 Gevangenis En Huis Van Bewaring（监狱兼拘留所）。\n地位：日惹唯一仍在运行的殖民时期监狱，文化遗产级建筑，现称 Lapas Kelas IIA Wirogunan。2022年底，狱方召集一些涂鸦创作者，涂了整整三面墙，大家可以自由发挥，官方只是贴了两个提示：请不要发布淫秽内容。所以呈现出不少挺耐看的作品。完全没有五讲四美、正能量等主旋律画面。狱方在正面外墙上做了一些展示。"},
{id:42, name:"新加坡 樟宜监狱礼拜堂", region:"东南亚", country:"新加坡", lat:1.3537, lng:103.9874, address:"新加坡东部樟宜区上樟宜北路1000 号（1000 Upper ChangiRoad North）", ticket:"成人门票9新元（约合7美元/人民币48元），新加坡公民及永久居民免费。优惠票（60岁以上/学生/残障人士）7新元，6岁以下儿童免费，家庭套票（最多5人含3名成人）27新元", hours:"每周二至周日9:30-17:30（17:00最后入场），周一及公共假期闭馆。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/019_%E6%96%B0%E5%8A%A0%E5%9D%A1%C2%B7%E6%A8%9F%E5%AE%9C%E5%86%9B%E4%BA%8B%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"樟宜军事博物馆（Changi Chapel and Museum）位于新加坡东部樟宜区上樟宜北路1000 号。1942 年2 月15 日，新加坡沦陷，日本占领军将樟宜地区的英军军营（包括罗伯茨军营，Roberts Barracks）改建为樟宜战俘营，用于关押被俘的盟军士兵和本地反抗者。"},
{id:43, name:"柬埔寨·吐斯廉屠杀博物馆", region:"东南亚", country:"柬埔寨", lat:11.5494, lng:104.9283, address:"柬埔寨金边市113 街与350 街交汇处", ticket:"成人门票为5 美元", hours:"每日8:00 至17:00，全年无休（特殊节假日除外）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/013_柬埔寨·吐斯廉屠杀博物馆.jpeg", desc:"吐斯廉屠杀博物馆（Tuol Sleng Genocide Museum）位于柬埔寨金边市113 街与350 街交汇处。这座博物馆原为红色高棉政权的安全监狱21（S-21），是了解柬埔寨“杀戮场”时期暴行的重要窗口。"},
{id:44, name:"琼邑克杀戮场", region:"东南亚", country:"柬埔寨", lat:11.4847, lng:104.9017, address:"柬埔寨金边市丹考区琼邑克路（Choeung Ek Road, Dangkao, Phnom Penh）", ticket:"成人门票为6 美元", hours:"每日7:30-17:30，全年无休。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/014_琼邑克杀戮场.jpeg", desc:"琼邑克杀戮场（Choeung Ek Genocidal Centre）位于柬埔寨金边市丹考区琼邑克路（Choeung Ek Road, Dangkao, Phnom Penh），距离金边市中心约15 公里。这座遗址是红色高棉政权最大的处决中心之一。"},
{id:45, name:"泰国女子监狱按摩", region:"东南亚", country:"泰国", lat:18.7883, lng:98.9853, address:"100 Rachawithi Road, Si Phum, Mueang Chiang Mai,Chiang Mai 50200, Thailand营业时间：周一至周五 08:00-16:30，周六至周日 09:00-16:30备注：不接受提前预订，需现场排队，建议早到", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%B3%B0%E5%9B%BD%E5%A5%B3%E5%AD%90%E7%9B%91%E7%8B%B1%E6%8C%89%E6%91%A9.jpg", desc:"到清迈旅行的朋友可以去体验清迈的女子监狱按摩，该项目由清迈女子惩教所发起，旨在为女性囚犯提供职业技能培训，帮助她们更好地重返社会。2008 年，清迈女子监狱在泰国皇室成员帕差拉吉帝雅帕公主的“激励计划”支持下，启动了按摩培训项目，项目得到泰国公共卫生部的认证。"},
{id:46, name:"泰国惩教博物馆", region:"东南亚", country:"泰国", lat:13.8617, lng:100.5078, address:"泰国暖武里府暖武里路1 号（Nonthaburi 1 Road Nonthaburi Province）", ticket:"免费入场", hours:"为每日8:30-16:30（周一闭馆），入场免费，建议提前联系（+66-2-967-2222）确认参观详情。", image:"", desc:"泰国惩教博物馆（Thailand Corrections Museum）位于泰国暖武里府暖武里路1 号（Nonthaburi 1 Road Nonthaburi Province），占地超过三英亩，毗邻邦光中央监狱。这座博物馆最初由查洛·斯里塔纳科恩上校（Colonel Charo Sri-tanakhon）于1939 年在邦光监狱内创立，作为了解泰国惩教系统的窗口。"},
{id:47, name:"缅甸“过去的记忆”博物馆", region:"东南亚", country:"缅甸", lat:16.8661, lng:96.1951, address:"仰光北达贡镇区奥克塔法亚街75 号（No.75, Oakthaphayar Street）", ticket:"", hours:"为周一至周五9:30-17:30，", image:"", desc:"缅甸“过去的记忆”博物馆（Memory of the Past Museum）是由政治犯互助协会（简称AAPP）建立的一座小型纪念馆。这座博物馆并非位于监狱遗址，而是一处独立的展览空间。"},
{id:48,name:"维甘旧监狱博物馆",region:"东南亚",country:"菲律宾",lat:17.576,lng:120.389,address:"Vigan City, Ilocos Sur（维甘世界遗产城内）",image:"",desc:"原伊洛科斯苏尔省监狱，Carcel de Vigan，1657 年始建（菲律宾最古老监狱之一），1818 年成为南伊罗戈省监狱。\n转型：2014 年移交国家博物馆，现为伊罗戈地区博物馆复合体核心馆。"},
{id:49,name:"圣迭戈古堡",region:"东南亚",country:"菲律宾",lat:14.594,lng:120.971,address:"Intramuros, Manila, 1002 Metro Manila",ticket:"75 比索",hours:"每日 08:00–23:00",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%9C%A3%E8%BF%AD%E6%88%88%E5%8F%A4%E5%A0%A1.jpg",desc:"1571 年：西班牙殖民者米格尔・洛佩斯・德・莱加斯皮始建，原址为菲律宾本土国王宫殿。荷兰人建的军事要塞。同时有囚室和地牢，菲律宾精神之父黎塞（作家、医生、艺术家，而非一呼百应的革命家）被处决之前就在这里被关押了两个多月。地牢里展示了二战日本人对菲律宾人的暴行。"},
{id:50,name:"索尔索贡省博物馆",region:"东南亚",country:"菲律宾",lat:12.974,lng:124.006,address:"Old Provincial Jail Building, Capitol Compound, Sorsogon省政府大院內",ticket:"20 比索",hours:"周一至周五 08:30–16:30，周末 / 节假日闭馆。",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E7%B4%A2%E5%B0%94%E7%B4%A2%E8%B4%A1%E7%9C%81%E5%8D%9A%E7%89%A9%E9%A6%86.jpg",desc:"原是省监狱 + 法院，非监狱主题博物馆。共10 个展厅，保留原有牢房作为展廊。1916 年建成，美国殖民时期建筑，两层石结构。"},
{id:51,name:"西维萨亚斯国家博物馆分馆",region:"东南亚",country:"菲律宾",lat:10.7,lng:122.565,address:"Bonifacio Drive, Iloilo Provincial Capitol Complex, Iloilo City",ticket:"免费",hours:"周二至周日 09:00–16:00，周一闭馆。",image:"",desc:"原伊洛伊洛省监狱，非监狱主题博物馆。1911 年建成，美国殖民时期伊洛伊洛省监狱（Iloilo Provincial Jail），由美国著名建筑师William Parsons设计，现代主义风格，四角设瞭望塔。\n2006 年停用，2015 年修复，2018 年 4 月 11 日移交国家博物馆，2019 年 12 月正式开放"},
{id:52, name:"菲律宾·宿务博物馆", region:"东南亚", country:"菲律宾", lat:10.2919, lng:123.9018, address:"宿务市M.J. 宽科大道（M.J. Cuenco Avenue Tejero）", ticket:"成人门票75 比索", hours:"周二至周六9:00-17:00（16:30 停止入场），周日、周一及公共假期闭馆。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/021_菲律宾·宿务监狱博物馆.jpeg", desc:"宿务监狱博物馆（Museo Sugbo，亦称宿务省博物馆）位于菲律宾宿务市M.J. 宽科大道，老西班牙时代的特赫罗区，是宿务省最古老的监狱遗址。宿务监狱始建于1869 年，占地约1 公顷，建筑面积约1.2 万平方米。"},
{id:53, name:"越南·火炉监狱博物馆", region:"东南亚", country:"越南", lat:21.0339, lng:105.8452, address:"越南河内市还剑区火炉街1 号", ticket:"成人门票50,000 越南盾", hours:"每日8:00-17:00，全年无休（特殊节假日除外）。另有夜游项目“神圣之夜”（每周五至周日19:00-20:30，需提前预约）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/012_越南·火炉监狱博物馆.jpeg", desc:"火炉监狱博物馆（Hoa Lò Prison Museum）位于越南河内市还剑区火炉街1 号。是法国殖民时期和越战期间的监狱遗址。"},
{id:54, name:"富国岛监狱", region:"东南亚", country:"越南", lat:10.2234, lng:104.0000, address:"建江省富国岛杨东镇", ticket:"成人30,000越南盾", hours:"07:30-17:00", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%AF%8C%E5%9B%BD%E5%B2%9B%E7%9B%91%E7%8B%B1.jpg", desc:"富国岛监狱（Phú Quốc Prison），俗称椰子监狱（Coconut Tree Prison），是法属与越战时期南越最大战俘营，以极端酷刑和高死亡率著称。1949–1950 年由法国殖民政府始建，占地约40 公顷，划分为 A、B、C、D 四区，主要关押越南抗法政治犯与战俘。1954 年高峰时关押14"},
{id:55,name:"吉隆坡半山芭监狱遗址",region:"东南亚",country:"马来西亚",lat:3.143,lng:101.71,address:"LaLaPort",ticket:"无",hours:"全天",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%90%89%E9%9A%86%E5%9D%A1%E5%8D%8A%E5%B1%B1%E8%8A%AD%E7%9B%91%E7%8B%B1%E9%81%97%E5%9D%80.jpg",desc:"原半山芭监狱，保留原监狱大门，在大门的基础上合围了一个小半圆，改为时尚的面包坊CHEF KECIK。旁边有个不大的喷泉广场，叫大门广场（Gate Plaza），半山芭监狱位于吉隆坡市中心，由英殖民政府兴建，1895年启用，运行了100多年，于1996年关闭，曾改为监狱博物馆，半年后关闭。2009-2012年拆除，在原址建了豪华商场LaLaPort。以前，半山芭监狱还有个特色，它的外墙有270公尺长的壁画。是三名犯人邝炎章、曾戴登和林金祥1983年耗时上千小时完成的，创下当时世界最长壁画记录，监狱当局为此购买了327桶漆料。可惜没能保存下来。"},
{id:56, name:"马来西亚监狱博物馆", region:"东南亚", country:"马来西亚", lat:2.1929, lng:102.2497, address:"马来西亚马六甲市班达希利尔村帕拉梅斯瓦拉路（Jalan Parameswara KampungBandar Hilir Melaka City）", ticket:"成人门票为RM6", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/017_%E9%A9%AC%E6%9D%A5%E8%A5%BF%E4%BA%9A%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"马来西亚监狱博物馆（Muzium Penjara Malaysia）位于马来西亚马六甲市班达希利尔村帕拉梅斯瓦拉路（Jalan Parameswara KampungBandar Hilir Melaka City）。该监狱由英国殖民政府修建于1860年，初名为“HM监狱”，占地约1.5公顷，建筑面积约6000 平方米。"},
{id:57, name:"哥打监狱博物馆", region:"东南亚", country:"马来西亚", lat:1.463, lng:103.7585, address:"Penjara (lama) Ayer Molek, Jalan Ayer Molek, 80888Johor Bahru", ticket:"门票信息：非马来西亚公民（外国人）：RM15（约合人民币22.5 元）", hours:"每日10:00-22:00（具体活动时间可能不同，如集市至午夜）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/kota%20Jail.jpg", desc:"哥打监狱（Kota Jail 也称Penjara Ayer Molek 博物馆）位于马来西亚柔佛州新山（Johor Bahru），前身为哥打监狱，现已转型为集博物馆、艺术空间和创意中心的综合性文化地标。哥打监狱，原名Johor Bahru Prison（柔佛巴鲁监狱），建于1883年，是马来西亚第三古老的监狱，仅次于霹雳州的Taiping Prison（1879年）和马六甲的Banda Hilir Prison（1860 年）。"},
{id:58, name:"达格沙伊中央监狱博物馆", region:"南亚", country:"印度", lat:30.8601, lng:77.0551, address:"印度喜马偕尔邦达格沙伊镇达格沙伊军营", ticket:"成人门票为50 卢比", hours:"每日10:00-17:00，周一闭馆。冬季（11 月-2 月）可能缩短至16:00。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/024_达格沙伊中央监狱博物馆.jpeg", desc:"达格沙伊中央监狱博物馆（Dagshai Central Jail Museum）位于印度喜马偕尔邦达格沙伊镇达格沙伊军营，是印度北部保存最完好的殖民时期监狱遗址之一。达格沙伊监狱始建于1849 年，由英国殖民政府在海拔约1820 米的军事要塞达格沙伊山城的军营内兴建，占地约2 公顷，建筑面积约1500平方米。"},
{id:59, name:"比尔萨·蒙达监狱公园", region:"南亚", country:"印度", lat:23.3441, lng:85.3096, address:"Jail More, Deputy Para, Ahirtoli, Ranchi,Jharkhand", ticket:"门票为成人50 卢比", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/026_比尔萨·蒙达监狱公园.jpeg", desc:"比尔萨· 蒙达监狱公园全称“Bhagwan Birsa Munda MemorialPark-cum-Freedom Fighter Museum”（巴格万·比尔萨·蒙达纪念公园暨自由战士博物馆），位于印度贾坎德邦首府兰契市市中心，原址为废弃的比尔萨·蒙达中央监狱。于2022 年3 月向公众开放，纪念印度独立运动中的部落英雄比尔萨·蒙达及其他贾坎德邦战士。"},
{id:60, name:"桑加雷迪遗产监狱博物馆", region:"南亚", country:"印度", lat:17.6268, lng:78.0848, address:"印度特兰加纳邦桑加雷迪镇桑加雷迪老监狱遗址", ticket:"成人门票为50 卢比", hours:"每日9:00-17:00，周一闭馆。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/025_桑加雷迪遗产监狱博物馆.jpeg", desc:"桑加雷迪遗产监狱博物馆（Heritage Jail Museum, SangareddyDistrict Jail）位于印度特兰加纳邦桑加雷迪镇桑加雷迪老监狱遗址，靠近NH-65 公路。是印度最古老的殖民时期监狱之一，2016 年开馆，2018 年，推出独特的24 小时“监狱生活体验”项目。"},
{id:61, name:"印度·蜂窝监狱纪念馆", region:"南亚", country:"印度", lat:11.6709, lng:92.7433, address:"印度安达曼- 尼科巴群岛布莱尔港亚特兰大角", ticket:"门票：成人30 卢比，光影秀50 卢比，摄影许可25 卢比", hours:"每日9:00-13:00 及14:00-17:00，周一闭馆。光影秀：每日18:00（英语）和19:15（印地语）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/023_印度·蜂窝监狱纪念馆.jpeg", desc:"蜂窝监狱国家纪念馆（Cellular Jail National Memorial）位于印度安达曼- 尼科巴群岛首府布莱尔港亚特兰大角。这座监狱位于与世隔绝的岛上，监禁条件严酷，被印度人称为“卡拉帕尼”（Kalapani，意为“黑水”），是英国殖民时期最臭名昭著的流放地。"},
{id:62, name:"康提博甘巴拉监狱旧址", region:"南亚", country:"斯里兰卡", lat:7.29, lng:80.63, address:"靠近康提火车站与康提湖", ticket:"", hours:"", image:"", desc:""},
{id:63, name:"Rajasinha Guard / King’s Prison Cell", region:"南亚", country:"斯里兰卡", lat:6.935, lng:79.845, address:"科伦坡 Fort 区", ticket:"", hours:"", image:"", desc:""},
{id:64, name:"科伦坡港航海博物馆", region:"南亚", country:"斯里兰卡", lat:6.93, lng:79.84, address:"", ticket:"", hours:"", image:"", desc:""},
{id:65, name:"乌兹别克斯坦·布哈拉监狱遗址", region:"中亚", country:"乌兹别克斯坦", lat:39.7742, lng:64.4286, address:"乌兹别克斯坦布哈拉市阿尔克堡（ArkFortress）东北约100 米处的乌鲁贾拉尔街（Ulucanlar Street）", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/035_乌兹别克斯坦·布哈拉监狱遗址.jpeg", desc:"布哈拉法律与司法历史博物馆（Museum of Legal and JudicialHistory of Bukhara），位于乌兹别克斯坦布哈拉市阿尔克堡（ArkFortress）东北约100 米处的乌鲁贾拉尔街（Ulucanlar Street）。这座博物馆原为布哈拉埃米尔的“津丹”（Zindan）监狱。"},
{id:66, name:"阿尔日尔博物馆", region:"中亚", country:"哈萨克斯坦", lat:51.09, lng:71.46, address:"哈萨克斯坦首都阿斯塔纳（Astana", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/037_阿尔日尔博物馆.jpeg", desc:"阿尔日尔博物馆（ALZHIR Museum-Memorial Complex）位于哈萨克斯坦首都阿斯塔纳（Astana，今努尔苏丹）以西约20 英里的阿克莫尔（Akmol），这座博物馆纪念的是“祖国叛徒妻子阿克莫林斯克劳改营”（Akmola Labor Camp for Wives of Traitors of the Motherland，简称ALZHIR）。"},
{id:67, name:"哈萨克斯坦·卡拉格博物馆", region:"中亚", country:"哈萨克斯坦", lat:49.7835, lng:73.0884, address:"哈萨克斯坦卡拉干达地区多林卡村学校街39 号", ticket:"成人门票为450 坚戈", hours:"周二至周日10:00-17:00（冬季至16:00）。建议查询", image:"", desc:"卡拉格纪念博物馆（KarLag Museum），正式名称为多林卡定居点政治压迫受害者纪念博物馆（Museum of Memory of Victims ofPolitical Repression in the Dolinka Settlement），位于哈萨克斯坦卡拉干达地区多林卡村，曾是苏联古拉格系统中规模最大的集中营之一——卡拉格劳动营的遗址。记录了1931-1959 年间超过百万囚犯的悲惨命运。"},
{id:68, name:"兰卡兰老监狱", region:"中亚", country:"阿塞拜疆", lat:38.75, lng:48.85, address:"", ticket:"", hours:"", image:"", desc:""},
{id:69, name:"以色列·耶路撒冷地下囚徒博物馆", region:"西亚", country:"以色列", lat:31.785, lng:35.2152, address:"以色列耶路撒冷勇敢巷1 号（Mish’ol HaGvura St 1,Jerusalem 9131401）", ticket:"成人门票为25 谢克尔（约7 美元）", hours:"为周日至周四9:00-17:00。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/030_以色列·耶路撒冷地下囚徒博物馆.jpeg", desc:"耶路撒冷地下囚徒博物馆（Underground Prisoners Museum）位于以色列耶路撒冷市中心俄罗斯大院，靠近卢基什凯斯广场。是英国托管时期耶路撒冷中央监狱的遗址，见证了犹太地下组织反抗英国统治、争取以色列独立的斗争。"},
{id:70, name:"伊拉克·阿姆纳·索拉卡博物馆", region:"西亚", country:"伊拉克", lat:35.5574, lng:45.432, address:"伊拉克苏莱曼尼亚省萨义德·卡班街（Saeed Kaban St,Sulaymaniyah, Sulaymaniyah Governorate, 46001）", ticket:"免费入场", hours:"周日至周四9:00-16:00，周五、周六开放至13:00，节假日可能调整。建议电话确认（+964 770 151 5151）。免费入场。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E4%BC%8A%E6%8B%89%E5%85%8B%C2%B7%E9%98%BF%E5%A7%86%E7%BA%B3%C2%B7%E7%B4%A2%E6%8B%89%E5%8D%A1%E5%8D%9A%E7%89%A9%E9%A6%86.jpg", desc:"阿姆纳·索拉卡博物馆（Amna Suraka Museum）位于伊拉克库尔德斯坦地区苏莱曼尼亚市。是萨达姆政权时期北部的秘密警察总部，记录库尔德人遭受的酷刑、屠杀与反抗斗争。"},
{id:71, name:"伊朗·卡萨尔监狱博物馆", region:"西亚", country:"伊朗", lat:35.7231, lng:51.3657, address:"伊朗德黑兰市纳贾·肖哈达街警察广场", ticket:"门票为100,000 里亚尔", hours:"每日9:00 至18:00（冬季至17:00），周五及官方节假日闭馆", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/027_伊朗·卡萨尔监狱博物馆.jpeg", desc:"卡萨尔监狱博物馆（Museum of the Qasr Prison）位于伊朗德黑兰市纳贾·肖哈达街警察广场。原为卡萨尔监狱，是伊朗最古老的监狱之一，如今转型为历史与文化的综合体，周围环绕着同名公园。"},
{id:72, name:"德黑兰埃博拉特博物馆", region:"西亚", country:"伊朗", lat:35.7089, lng:51.4207, address:"伊朗德黑兰市塔赫蒂街（Taherdi Street）11 号", ticket:"门票为200,000 里亚尔", hours:"周日至周五9:00 至16:00", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/028_德黑兰埃博拉特博物馆.jpeg", desc:"德黑兰埃博拉特博物馆（Ebrat Museum of Iran）位于伊朗德黑兰市塔赫蒂街（Taherdi Street）11 号，原址是一座巴列维王朝时期的政治监狱。埃博拉特监狱建于1930 年代，为巴列维政权的一处普通拘留所。"},
{id:73, name:"锡诺普堡垒监狱博物馆", region:"西亚", country:"土耳其", lat:42.0235, lng:35.1497, address:"土耳其锡诺普省锡诺普市卡莱亚兹街共和国大道（Kaleyazisi, Cumhuriyet Cd., Sinop Merkez, 57000）", ticket:"成人门票5 里拉", hours:"夏季（6-9 月）：每日8:00-19:00；冬季（10-5 月）：每日8:00-17:00。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/032_锡诺普堡垒监狱博物馆.jpeg", desc:"锡诺普堡垒监狱博物馆（Sinop Fortress Prison Museum）位于土耳其北部黑海沿岸的锡诺普市。这座博物馆藏身于锡诺普堡垒的内堡，是奥斯曼帝国时期的监狱，关押过多名土耳其知名作家。"},
{id:74, category:"hotel", name:"土耳其四季酒店", region:"西亚", country:"土耳其", lat:41.0064, lng:28.9779, address:"伊斯坦布尔Tevkifhane Sk. No:1", ticket:"300欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/20.%E5%9C%9F%E8%80%B3%E5%85%B6%E5%9B%9B%E5%AD%A3%E9%85%92%E5%BA%97.jpg", desc:"前身为苏丹艾哈迈德监狱（Sultanahmet Jail），1918-1919年建成，1986年最终废弃。保留了牢房、庭院和涂鸦等元素。"},
{id:75, name:"土耳其·乌鲁贾拉尔监狱博物馆", region:"西亚", country:"土耳其", lat:39.9371, lng:32.8469, address:"安卡拉阿尔滕达区乌鲁贾拉尔街63 号", ticket:"门票：2024 年成人票价为10 土耳其里拉，学生和教师4 里拉", hours:"每日10:00 至17:00（周四闭馆）。节假日可能调整，建议提前查阅", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%9C%9F%E8%80%B3%E5%85%B6%C2%B7%E4%B9%8C%E9%B2%81%E8%B4%BE%E6%8B%89%E5%B0%94%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpg", desc:"乌鲁贾拉尔监狱博物馆（Ulucanlar Cezaevi Müzesi）位于土耳其首都安卡拉乌鲁贾拉尔街63 号（Ulucanlar Cd. No:63），前身为臭名昭著的乌鲁贾拉尔监狱。乌鲁贾拉尔监狱于1925 年启用，原址为一座1923 年建成的军事仓库，占地约3.4 万平方米。"},
{id:76, name:"格鲁吉亚·苏联占领博物馆", region:"西亚", country:"格鲁吉亚", lat:41.6941, lng:44.8015, address:"戈里市斯大林大道32 号", ticket:"成人门票为10 拉里", hours:"为每日10:00-18:00（冬季至17:00）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/033_格鲁吉亚·苏联占领博物馆.jpeg", desc:"格鲁吉亚的苏联占领博物馆（Museum of Soviet Occupation）位于首都第比利斯市中心鲁斯塔韦利大道 3 号（Rustaveli Avenue 3），属于格鲁吉亚国家博物馆-- 西蒙·贾纳西亚博物馆四楼的一间展厅，成立于2006 年5 月26 日（格鲁吉亚独立日）。记录了1921-1991 年苏联占领格鲁吉亚的七十年中的反占领运动及政治压迫受害者的故事。"},
{id:77, name:"阿塞拜疆·政治压迫受害者博物馆", region:"西亚", country:"阿塞拜疆", lat:40.3736, lng:49.8392, address:"阿塞拜疆巴库尤西夫·萨法罗夫街31 号（Yusif SafarovSt 31, Baku, AZ1025）", ticket:"成人门票为5 马纳特，含语音导览（英语/ 阿塞拜疆语）", hours:"周一至周五9:00-17:00，周末与节假日闭馆。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/034_阿塞拜疆·政治压迫受害者博物馆.jpeg", desc:"政治压迫受害者博物馆（Museum of Political RepressionVictims）位于阿塞拜疆巴库市国家边防局行政大楼的地下室，前身为苏联时期秘密警察机构——契卡、内务人民委员会和国家安全委员会，见证了1920-1950 年间阿塞拜疆人民遭受的政治压迫。博物馆所在建筑最初为行政办公楼，始建于19 世纪末，1920 年4月苏联红军占领巴库后，被契卡接管。"},
{id:78, category:"hotel", name:"霍尔森斯监狱酒店", region:"欧洲", country:"丹麦", lat:55.8633, lng:9.851, address:"霍尔森斯市弗辛斯韦伊8号", ticket:"195丹麦克朗起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/13.%E9%9C%8D%E5%B0%94%E6%A3%AE%E6%96%AF%E7%9B%91%E7%8B%B1%E9%85%92%E5%BA%97.jpg", desc:"前身为1853年启用的霍尔森斯国家监狱（Horsens Prison），2006年关闭，2015年酒店开业。保留了牢房、铁栏和红砖外墙等元素，并设有监狱博物馆。"},
{id:79, name:"丹麦·霍尔森斯监狱博物馆", region:"欧洲", country:"丹麦", lat:47.992766, lng:7.852316, address:"霍尔森斯市中心，弗辛斯韦伊8 号（Fussingsvej 8, 8700Horsens）", ticket:"成人门票为110 丹麦克朗", hours:"周二至周日10:00-16:00（15:30 停止入场），学校假期期间每天开放。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/065_丹麦·霍尔森斯监狱博物馆.jpeg", desc:"霍尔森斯监狱博物馆（Horsens Prison Museum）位于丹麦中部霍尔森斯市, 其前身是一座历经170 余年的监狱。霍尔森斯监狱的建设始于1847 年，由当时的丹麦政府投资兴建，1853 年5 月正式启用，最初名为“霍尔森斯国家监狱”。"},
{id:80, name:"乌克兰·兰茨基街监狱国家纪念博物馆", region:"欧洲", country:"乌克兰", lat:31.858188, lng:35.458228, address:"乌克兰利沃夫班德拉街1 号（Bandery vul. 1, Lviv79013）", ticket:"门票：免费，接受捐款", hours:"周一至周六10:00-13:00 及14:00-19:00，周日10:00-17:00（因战争可能调整，建议确认：+380 32 235 51 66）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/116_乌克兰·兰茨基街监狱国家纪念博物馆.jpeg", desc:"兰茨基街监狱国家纪念博物馆（National Museum-Memorial ofVictims of the Occupation Regimes, Prison on lacki Street）位于乌克兰西部城市利沃夫，靠近市中心的圣玛丽·玛达肋纳教堂，曾是20 世纪波兰、苏联和纳粹占领时期的监狱。兰茨基街监狱始建于1889 年，原为奥匈帝国宪兵队的办公楼，采用新文艺复兴风格，砖石结构外观朴素而坚固。"},
{id:81, name:"诺里尔斯克古拉格纪念馆", region:"欧洲", country:"俄罗斯", lat:69.3465, lng:88.2, address:"诺里尔斯克市列宁大街1 号，占地约2000 平方米", ticket:"", hours:"", image:"", desc:"诺里尔斯克古拉格纪念馆（Norilsk Gulag Memorial）位于俄罗斯克拉斯诺亚尔斯克边疆区诺里尔斯克市（Norilsk KrasnoyarskKrai），它并非一座独立的博物馆，而是以诺里尔斯克工业区历史博物馆为核心，结合周边纪念建筑群（如“诺里尔斯克各各他”纪念地）共同构成的古拉格历史纪念体系。这座偏远的北极圈城市由数十万囚犯的血汗建成，是苏联古拉格系统的重要节点。"},
{id:82, name:"沃库塔古拉格遗址", region:"欧洲", country:"俄罗斯", lat:67.4989, lng:64.055, address:"俄罗斯科米共和国沃库塔市列宁街26 号", ticket:"门票：遗址免费，博物馆约300 卢布", hours:"周二至周日10:00-17:00（冬季可能调整）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/103_沃库塔古拉格遗址.jpeg", desc:"沃库塔古拉格遗址（Vorkuta Gulag Sites）位于俄罗斯科米共和国沃库塔市，坐落在欧洲最东北的乌拉尔山脉北段，距离莫斯科约2000公里。曾是古拉格系统中最为严酷的劳改营之一。"},
{id:83, name:"因塔古拉格遗址", region:"欧洲", country:"俄罗斯", lat:66.0374, lng:60.1472, address:"俄罗斯科米共和国因塔市", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/107_因塔古拉格遗址.jpeg", desc:"因塔古拉格遗址（Inta Gulag Sites，简称Intalag）位于俄罗斯科米共和国因塔市，地处北极圈内，是1941-1948 年间因塔劳改营（Intalag）的核心区域，囚犯主要从事煤矿开采和基础设施建设。因塔古拉格始于1941 年11 月17 日，当时苏联内务部（NKVD）将其从沃库塔劳改营分离出来，建立独立的因塔劳改营，隶属于铁路建设营总管理局（GULZHDS）。"},
{id:84, name:"白海- 波罗的海运河遗址", region:"欧洲", country:"俄罗斯", lat:64.5231, lng:34.7659, address:"俄罗斯卡累利阿共和国（Republic of Karelia）北部白海沿岸", ticket:"", hours:"", image:"", desc:"20 世纪30 年代初期，索洛韦茨基劳改营中许多犯人被派遣参与白海- 波罗的海运河工程。俄罗斯白海- 波罗的海运河遗址（（WhiteSea-Baltic Canal Sites，简称BBK 或Belomorkanal））位于俄罗斯卡累利阿共和国（Republic of Karelia）北部白海沿岸，其核心区域围绕运河的北端起点——白海边的小镇别洛莫尔斯克（Belomorsk）。"},
{id:85, name:"乌赫塔古拉格遗址", region:"欧洲", country:"俄罗斯", lat:63.5638, lng:53.6861, address:"Mira St）收藏少量古拉格文物，如囚犯劳动工具、营地地图和照片，未设专属古拉格展厅", ticket:"", hours:"", image:"", desc:"乌赫塔古拉格遗址（Ukhta Gulag Sites）位于俄罗斯科米共和国乌赫塔市（Ukhta Komi Republic），包括乌赫塔- 佩乔拉劳改营（Ukhtpechlag，1931-1938）和乌赫塔- 伊日马劳改营（Ukhtizhemlag，1938-1955），该劳改营曾在石油和煤炭勘探、开采中的起到重要作用。乌赫塔地区遗址位于北极圈以南约300 公里，周围为针叶林和冻土苔原，冬季漫长严寒，夏季短暂多虫，早在17 世纪就因乌赫塔河沿岸的天然油泉而闻名，19 世纪中期即开始油井开发。"},
{id:86, name:"尸骨之路", region:"欧洲", country:"俄罗斯", lat:62.0355, lng:129.6755, address:"俄罗斯科雷马地区R504联邦公路科雷马段", ticket:"", hours:"", image:"", desc:"尸骨之路（Kolyma Highway）正式名称是R504 联邦公路科雷马段，是科雷马地区唯一的公路，连接下别斯佳赫和马加丹，途经汉德加、乌斯季涅拉、阿尔特克、卡德克昌、苏苏曼、亚戈德诺耶等城镇，全长2032 公里，于下别斯佳赫接续勒拿公路。"},
{id:87, name:"布坦达营遗址", region:"欧洲", country:"俄罗斯", lat:61.9386, lng:149.628, address:"科雷马地区", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/101_布坦达营遗址.jpeg", desc:"布坦达营遗址（Butugychag Camp）位于科雷马地区，为苏联时期采矿营（特别是铀矿开采），属于古拉格系统中较大的别尔拉格（Berlag）分支，运营时间为1945 年至1955 年。1930 年代末，科雷马地区的布坦达因开采锡石和锡矿而设营。"},
{id:88, name:"杜涅普罗夫斯基营遗址", region:"欧洲", country:"俄罗斯", lat:61.524, lng:149.628, address:"马加丹市以北约320公里", ticket:"", hours:"", image:"", desc:"杜涅普罗夫斯基营遗址（Dneprovsky Camp）位于马加丹市以北约320公里，靠近“尸骨之路”265公里处的岔路口，再沿沼泽小路行20公里。为古拉格锡矿劳改营，隶属于科雷马地区东北劳改营系统（Sevvostlag），运营时间为1941 年至1955 年。"},
{id:89, name:"特鲁别茨科伊棱堡监狱博物馆", region:"欧洲", country:"俄罗斯", lat:59.971935, lng:30.246255, address:"圣彼得堡彼得保罗要塞3 号", ticket:"门票：成人300 卢布，要塞入场免费，综合票（含教堂等）750 卢布", hours:"每日10:00-18:00（周二至20:00），17:00 停止入场，1 月1 日闭馆。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/110_特鲁别茨科伊棱堡监狱博物馆.jpeg", desc:"特鲁别茨科伊棱堡监狱（Trubetskoy Bastion Prison Museum）位于俄罗斯圣彼得堡扎亚奇岛彼得保罗要塞（Peter and Paul FortressZayachy Island））内的特鲁别茨科伊棱堡。早期为防御工事，后为俄罗斯帝国的政治犯监狱。"},
{id:90,name:"十字监狱（Kresty）",region:"欧洲",country:"俄罗斯",lat:59.955,lng:30.35,address:"俄罗斯圣彼得堡，阿尔塞纳尔滨河街 7 号",hours:"不开放",image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%8D%81%E5%AD%97%E7%9B%91%E7%8B%B1%EF%BC%88kresty%EF%BC%89.jpg",desc:"十字监狱（Kresty），正式名称为圣彼得堡独居监禁监狱，因两栋主体建筑呈十字形而得名。两栋5层十字形红砖建筑，共960间单人牢房。沙俄时期关押政治犯，苏联时期为克格勃监狱。著名囚犯：托洛茨基、索尔仁尼琴等。2017年正式关闭。"},
{id:91, name:"基里洛- 别洛泽尔斯基修道院博物馆", region:"欧洲", country:"俄罗斯", lat:59.8617, lng:38.3756, address:"俄罗斯沃洛格达州基里洛夫镇锡韦尔湖畔（LakeSiverskoye, Kirillov, Vologda Oblast）", ticket:"门票：修道院门票成人300 卢布，监狱区单独票价100 卢布", hours:"夏季（6-9 月）：每日10:00-18:00；冬季（10-5 月）：周二至周日10:00-16:00，周一闭馆。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/111_基里洛-_别洛泽尔斯基修道院博物馆.jpeg", desc:"基里洛·别洛泽尔斯基修道院（Kirillo-Belozersky MonasteryMuseum）位于俄罗斯沃洛格达州基里洛夫镇（Kirillov），这座曾经有着600 年历史的修道院内藏着一座400 多年历史的监狱，如今作为博物馆向公众开放。基里洛·别洛泽尔斯基修道院位于锡韦尔湖（Lake Siverskoye）畔，1397 年建立，占地约12 公顷，核心建筑面积约3 万平方米。"},
{id:92, name:"科雷马地区遗址：远东的死亡冰原", region:"欧洲", country:"俄罗斯", lat:59.5645, lng:150.8029, address:"北纬59 度的科雷马河流域的马加丹市", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/098_科雷马地区遗址：远东的死亡冰原.jpeg", desc:"科雷马地区遗址（Kolyma Region Sites）是一片冰封于俄罗斯远东的悲剧之地。这片遗址位于北纬59 度的科雷马河流域的马加丹市，距离莫斯科约6000 公里，靠近北冰洋的鄂霍茨克海（Sea ofOkhotsk）。"},
{id:93, name:"马加丹地方博物馆", region:"欧洲", country:"俄罗斯", lat:59.5645, lng:150.8029, address:"马加丹市卡尔·马克思大道55 号（Karl Marx Ave 55）", ticket:"门票为成人100 卢布（约1.5 美元），学生50 卢布", hours:"马加丹地方博物馆每周二至周日9:00-18:00 开放（周一闭馆）", image:"", desc:"马加丹地方博物馆（全称Magadan Regional Museum of LocalLore）位于马加丹市卡尔·马克思大道55 号（Karl Marx Ave 55）。占地约3000 平方米，含多个展厅，其中古拉格展览是核心亮点，设于博物馆一层，占地约200 平方米：古拉格展厅占总展馆约五分之一，展示科雷马地区劳改营的文物，包括从杜涅普罗夫斯基矿等营地回收的瞭望塔、铁丝网、囚犯自制工具（如铲子和勺子）和稀有的五角星形信号灯（用于指示工作结束）。"},
{id:94, name:"彼尔姆-36 监狱博物馆", region:"欧洲", country:"俄罗斯", lat:58.012014, lng:56.210117, address:"俄罗斯彼尔姆边疆区丘索沃伊区库奇诺村社会文化中心附近", ticket:"成人门票为500 卢布", hours:"夏季（5-10 月）：周二至周日10:00-17:00；冬季（11-4 月）：周三至周日10:00-16:00。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/104_彼尔姆-36_监狱博物馆.jpeg", desc:"彼尔姆-36 监狱博物馆（Memorial Museum of the History ofPolitical Repression “Perm-36“）位于俄罗斯彼尔姆区的库奇诺村，前身为彼尔姆-36 劳改营，该劳改营曾关押过成千上万政治犯。彼尔姆-36 始建于1946 年，作为苏联古拉格系统的一部分，最初代号“VS-389/36”，占地约5 公顷，建筑面积约1 万平方米，设计容量约1000 人。"},
{id:95, name:"莫斯科古拉格历史博物馆", region:"欧洲", country:"俄罗斯", lat:55.7736, lng:37.6139, address:"1-y Samotechny Pereulok, 9,bldg. 1", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E8%8E%AB%E6%96%AF%E7%A7%91%E5%8F%A4%E6%8B%89%E6%A0%BC%E5%8D%9A%E7%89%A9%E9%A6%86.jpg", desc:"莫斯科古拉格历史博物馆（Gulag History Museum）是一座致力于揭示苏联时期大规模镇压和强制劳动营历史的标志性博物馆。这座博物馆由历史学家兼公共人物安东·安东诺夫- 奥弗申柯（Anton Antonov-Ovseyenko）于2001 年创立，他本人曾是斯大林时期劳改营的囚犯。"},
{id:96, name:"俄罗斯·索洛韦茨基修道院", region:"欧洲", country:"俄罗斯", lat:54.116403, lng:42.905156, address:"俄罗斯阿尔汉格尔斯克州索洛韦茨基村修道院建筑群（Spaso-Preobrazhensky Monastery, Solovetsky Settlement,164520）", ticket:"门票成人500 卢布，含语音导览（英语/ 俄语）", hours:"夏季（6-9 月）：每日9:00-18:00；冬季（10-5 月）：周二至周日10:00-16:00，周一闭馆。建议查阅询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/096_%E4%BF%84%E7%BD%97%E6%96%AF%C2%B7%E7%B4%A2%E6%B4%9B%E9%9F%A6%E8%8C%A8%E5%9F%BA%E4%BF%AE%E9%81%93%E9%99%A2.jpeg", desc:"索洛韦茨基修道院（Solovetsky Monastery Prison Museum）位于俄罗斯北部白海中的索洛韦茨基群岛（Solovetsky Islands）。它不仅是俄罗斯东正教的圣地，也是苏联早期古拉格劳改营的一部分，为苏联关押反布尔什维克社会革命党的地方。"},
{id:97, name:"保加利亚·大特尔诺沃监狱博物馆", region:"欧洲", country:"保加利亚", lat:43.0809, lng:25.6385, address:"保加利亚北部历史名城大特尔诺沃市中心统一广场（SaedinenieSqr）南侧一栋奥斯曼时期建造的石头建筑内", ticket:"成人门票为6 列弗（约3 欧元），联合票（含复兴博物馆等）20 列弗", hours:"4 月-10 月：周二至周六9:00-17:30；11 月- 次年3 月：周二至周六9:00-17:00，周日、周一闭馆。建议查询", image:"", desc:"大特尔诺沃监狱博物馆（Museum of Prison, Veliko Tarnovo）位于保加利亚北部历史名城大特尔诺沃市中心统一广场（SaedinenieSqr）南侧一栋奥斯曼时期建造的石头建筑内，是保加利亚唯一保存完整的东方风格监狱遗址。大特尔诺沃监狱建于1854 年，为奥斯曼“科纳克”（Konak）行政建筑的一部分。"},
{id:98, name:"克罗地亚·戈利岛", region:"欧洲", country:"克罗地亚", lat:42.641786, lng:18.11784, address:"克罗地亚北部亚得里亚海", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/092_克罗地亚·戈利岛.jpeg", desc:"戈利岛（Goli Otok）位于克罗地亚北部亚得里亚海，靠近普里莫耶-戈尔斯基科塔尔县，是一座面积约4.5 平方公里的无人岛。1910 年代到1988 年间，戈利岛被用作监狱。"},
{id:99, name:"冰岛·赫宁加胡斯监狱博物馆", region:"欧洲", country:"冰岛", lat:64.149065, lng:-21.940444, address:"首都雷克雅未克Skólav?reustígur 9", ticket:"", hours:"为每日10:00-16:00，建议提前联系（+354545 1800）。冰岛的监狱数量很少，目前全国仅有五所监狱，其中两所是开放式监狱（如克维亚布吕加监狱）。这些监狱更注重康复而非惩罚，例如没有围墙或锁门。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/069_冰岛·赫宁加胡斯监狱博物馆.jpeg", desc:"冰岛的赫宁加胡斯监狱博物馆（Hegningarhúsie Prison Museum）位于首都雷克雅未克市中心，是一座由冰岛最古老监狱改建而成的文化空间。赫宁加胡斯监狱，冰岛语意为“惩罚之家”（Hegningarhúsie），始建于1872 年，是冰岛第一座现代监狱。"},
{id:100, name:"匈牙利·监狱服务博物馆", region:"欧洲", country:"匈牙利", lat:47.7847, lng:19.932177, address:"匈牙利东北部城市萨托拉尔尧伊赫伊市中心（Sátoraljaújhely）", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/084_匈牙利·监狱服务博物馆.jpeg", desc:"匈牙利监狱服务博物馆（Exhibition of Hungarian PrisonService Museum）坐落于匈牙利东北部城市萨托拉尔尧伊赫伊市中心（Sátoraljaújhely），萨托拉尔尧伊赫伊监狱旁一栋建筑的地下室。博物馆最初的藏品由来自布达佩斯国家监狱典狱长卡罗伊·瓦伊纳（Károly Vajna），他收集了大量与监狱相关的物品，并编纂了《匈牙利古老刑罚》一书，这些文物最初被安置在布达佩斯其他监狱里，后由于空间不足，展览条件受限。"},
{id:101, name:"塞尔维亚·斯雷姆斯卡米特罗维察监狱博物馆", region:"欧洲", country:"塞尔维亚", lat:44.9698, lng:19.6089, address:"塞尔维亚北部沃伊沃迪纳省斯雷姆斯卡·米特罗维察市斯雷姆酒店（Srem）的地下室", ticket:"", hours:"博物馆每日开放（9:00-14:00），每次最多接待8 人。", image:"", desc:"斯雷姆斯卡·米特罗维察监狱博物馆（Museum of the Prison inSremska Mitrovica）位于塞尔维亚北部沃伊沃迪纳省斯雷姆斯卡·米特罗维察市斯雷姆酒店（Srem）的地下室。展示该监狱见证的两次世界大战期间塞尔维亚人、罗姆人和犹太人所遭受的苦难。"},
{id:102, name:"奥地利·毛特豪森纪念馆", region:"欧洲", country:"奥地利", lat:47.787906, lng:13.757745, address:"奥地利上奥地利州毛特豪森镇Erinnerungsstra?e 1", ticket:"", hours:"3 月1 日至10 月31 日每日9:00-17:30；11 月1 日至次年2 月28 日周二至周日9:00-15:45（周一及圣诞节等闭馆）。建议查阅", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%A5%A5%E5%9C%B0%E5%88%A9%C2%B7%E6%AF%9B%E7%89%B9%E8%B1%AA%E6%A3%AE%E7%BA%AA%E5%BF%B5%E9%A6%86.jpg", desc:"毛特豪森纪念馆（Mauthausen Memorial）位于奥地利上奥地利州毛特豪森镇，坐落在多瑙河北岸的一座山丘上。这里是纳粹时期最臭名昭著的集中营之一——毛特豪森集中营所在地，1938 年启用，1945 年解放。"},
{id:103, name:"安德烈亚斯街纪念和教育中心", region:"欧洲", country:"德国", lat:52.76628, lng:13.262805, address:"德国图林根州埃尔福特市市中心安德烈亚斯街37a 号（Andreasstra?e 37a, 99084 Erfurt）", ticket:"成人门票6 欧元", hours:"周二至周日10:00-18:00（17:30停止入场），周一闭馆（节假日除外）。建议查阅", image:"", desc:"安德烈亚斯街纪念和教育中心（Andreasstra?e Memorial andEducational Centre）位于德国图林根州埃尔福特市市中心安德烈亚斯街37a 号（Andreasstra?e 37a, 99084 Erfurt），毗邻大教堂广场（Domplatz）。这座博物馆也是东德时期国家安全部（Stasi，斯塔西）的调查拘留所遗址。"},
{id:104, name:"霍恩施豪森纪念馆", region:"欧洲", country:"德国", lat:52.52844, lng:13.372039, address:"柏林Kantstra?e 79 号前身：女子监狱及法院", ticket:"门票：展览免费，导览9 欧元，需提前预约（官网：https://www.stiftung-hsh.de/ihr-besuch Email：besucherdienst@stiftung-hsh.de，tel：+49 30 98608230）", hours:"每日9:00-18:00（17:30 停止入场），全年无休（12 月24、25、31 日及1 月1 日除外）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/076_霍恩施豪森纪念馆.jpeg", desc:"柏林- 霍恩施豪森纪念馆（Gedenkst?tte Berlin-Hohensch?nhausen）位于柏林东北部利希滕贝格区霍恩施豪森老城根斯勒街66 号。这座博物馆是前东德国家安全部（Stasi，简称斯塔西）的主要政治监狱遗址。"},
{id:105, name:"布痕瓦尔德集中营纪念馆", region:"欧洲", country:"德国", lat:52.512335, lng:13.410175, address:"德国图林根州魏玛市以北8 公里", ticket:"", hours:"布痕瓦尔德纪念馆每日9:00-17:00 开放（冬季16:30 闭馆，12 月24 日及1 月1 日闭馆），每年4 月11 日举办解放纪念仪式。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/071_布痕瓦尔德集中营纪念馆.jpeg", desc:"布痕瓦尔德集中营纪念馆（Buchenwald Concentration CampMemorial）位于德国图林根州魏玛市以北8 公里，这座集中营于1937年7 月15 日启用，是德国本土最大的集中营之一，至1945 年4 月11 日，关押了约28 万囚犯。1945 年美军解放该营后，苏联将其短暂用作特别营（Special Camp No.2），1958 年由东德政府转型为纪念馆。"},
{id:106, category:"hotel", name:"威尔米娜酒店（Wilmina Hotel）", region:"欧洲", country:"德国", lat:52.5047, lng:13.3042, address:"柏林Kantstraße 79号", ticket:"150欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/9.%E5%A8%81%E5%B0%94%E7%B1%B3%E5%A8%9C%E9%85%92%E5%BA%97.png", desc:"前身为女子监狱及法院，1896年至1985年运行。电影《朗读者》有在此取景。锻铁栏杆和走廊保留了原监狱风格，窗户外的铁栅栏锯掉了一半。"},
{id:107, name:"弗洛森堡集中营纪念馆", region:"欧洲", country:"德国", lat:51.759852, lng:14.334489, address:"巴伐利亚州弗洛森堡镇Ged?chtnisallee 5", ticket:"", hours:"弗洛森堡纪念馆每日9:00-17:00 开放（冬季16:00 闭馆，12 月24-26 日及1 月1 日闭馆），每年4 月23 日举办解放纪念仪式。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/073_弗洛森堡集中营纪念馆.jpeg", desc:"弗洛森堡集中营纪念馆（Flossenbürg Concentration CampMemorial）位于德国巴伐利亚州弗洛森堡镇附近，弗洛森堡集中营于1938 年5 月3 日启用，是纳粹集中营系统中规模较小但死亡率极高的营地之一。1945 年4 月23 日被美军解放，期间因恶劣条件和“死亡行军”导致大量囚犯丧生。"},
{id:108, name:"拉文斯布吕克集中营纪念馆", region:"欧洲", country:"德国", lat:51.661832, lng:12.932131, address:"勃兰登堡州菲尔斯滕贝格/ 哈弗尔Stra?e der Nationenl", ticket:"", hours:"拉文斯布吕克纪念馆每日9:00-17:00 开放（冬季16:30 闭馆，12月24-26 日及1 月1 日闭馆），每年4 月30 日举办解放纪念仪式。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/075_拉文斯布吕克集中营纪念馆.jpeg", desc:"拉文斯布吕克集中营纪念馆（Ravensbrück Concentration CampMemorial）位于德国勃兰登堡州菲尔斯滕贝格/ 哈弗尔（Fürstenberg/Havel Brandenburg）附近，这座集中营于1939 年5 月18 日启用，是纳粹专为关押女性囚犯的主要集中营，也是二战期间为数不多同时关押女性与少量儿童的营地。以其残酷的劳动条件和医学实验而闻名。"},
{id:109, name:"萨赫森豪森集中营纪念馆", region:"欧洲", country:"德国", lat:51.180245, lng:14.427075, address:"奥拉尼恩堡市Stra?e derNationen 22", ticket:"", hours:"萨赫森豪森纪念馆每日8:30-18:00 开放（冬季16:30 闭馆，12月24 日及1 月1 日闭馆），每年4 月22 日举办解放纪念仪式。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/072_萨赫森豪森集中营纪念馆.png", desc:"萨赫森豪森集中营纪念馆（Sachsenhausen ConcentrationCamp Memorial）位于德国勃兰登堡州奥拉尼恩堡市（OranienburgBrandenburg）以北，该集中营于1936 年建成，是纳粹政权在柏林附近建立的首座集中营，也是党卫队集中营体系的行政与培训中心。1961 年由东德政府转型为纪念馆。"},
{id:110, name:"德国·达豪集中营纪念馆", region:"欧洲", country:"德国", lat:51.112635, lng:13.782846, address:"达豪Alte R?merstra?e 75", ticket:"", hours:"达豪集中营纪念馆每日9:00-17:00 开放（12 月24-26 日及1 月1日闭馆），入场免费。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/070_德国·达豪集中营纪念馆.jpeg", desc:"达豪集中营纪念馆（Dachau Concentration Camp MemorialSite）位于德国巴伐利亚州达豪镇，达豪集中营建立于1933 年，是纳粹建立的第一座集中营，成为后面无数集中营的“样板营”，也是二战期间运营时间最长的集中营之一（1933-1945）。1945 年解放后，遗址于1965 年转型为纪念馆，成为德国最著名的二战纪念地之一。"},
{id:111, name:"贝尔根- 贝尔森集中营纪念馆", region:"欧洲", country:"德国", lat:50.7146, lng:12.4869, address:"下萨克森州贝尔根镇Anne-Frank-Platz", ticket:"", hours:"贝尔根- 贝尔森纪念馆每日9:00-18:00 开放（冬季16:00 闭馆，12 月24-26 日及1 月1 日闭馆），每年4 月15 日举办解放纪念仪式。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/074_贝尔根-_贝尔森集中营纪念馆.jpeg", desc:"贝尔根- 贝尔森集中营纪念馆（Bergen-Belsen ConcentrationCamp Memorial）位于德国下萨克森州贝尔根镇（Bergen LowerSaxony）附近，这座集中营于1940 年启用，最初作为战俘营，后转型为集中营。它因安妮·弗兰克和大规模疾病死亡而广为人知。"},
{id:112, category:"hotel", name:"恶魔岛酒店（Alcatraz Hotel）", region:"欧洲", country:"德国", lat:49.4447, lng:7.7691, address:"凯撒斯劳滕Morlauterer Str. 1", ticket:"25欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/10.Alcatraz%20Hotel.jpg", desc:"前身为凯撒斯劳滕监狱（1867年启用），56间客房中有21间是牢房式房间，保留原始铁门、铁栏窗和狭小布局。前台在黑色铁笼内，住客可选择通过牢门小窗口接收早餐。"},
{id:113, name:"圣天使堡监狱", region:"欧洲", country:"意大利", lat:53.446019, lng:19.919046, address:"罗马圣天使街50 号（Lungotevere Castello 50）", ticket:"成人门票为15 欧元", hours:"每日9:00-19:30，12 月25 日与1 月1 日闭馆。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/087_圣天使堡监狱.jpeg", desc:"圣天使堡（Castel Sant'Angelo）位于意大利罗马市中心的台伯河右岸。是一座历史悠久的要塞，最初是古罗马皇帝哈德良的陵墓，后来成为中世纪和文艺复兴时期的监狱与军事堡垒，现属于国家博物馆的一部分。"},
{id:114, name:"意大利·圣利奥堡垒", region:"欧洲", country:"意大利", lat:43.8969, lng:12.3434, address:"Via Giacomo Leopardi, San Leo", ticket:"成人门票为11 欧元（26岁以上），18-25岁2 欧元，17岁以下免费", hours:"为每日9:00-18:45（冬季可能调整），成人", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/086_意大利·圣利奥堡垒.jpeg", desc:"意大利圣马力诺共和国附近的圣利奥堡垒（Forte di San Leo）是一座历史悠久的建筑杰作，这座堡垒坐落于艾米利亚- 罗马涅大区圣利奥小镇的山顶上，俯瞰瓦尔马雷基亚谷，17、18世纪期间曾被被改作监狱。如今，它作为博物馆向公众开放。"},
{id:115, name:"威尼斯总督宫秘密监狱", region:"欧洲", country:"意大利", lat:43.467837, lng:11.043182, address:"威尼斯总督宫（Palazzo Ducale）内", ticket:"成人门票为30 欧元，含总督宫全馆与秘密行程", hours:"夏季（4 月1 日-10 月31 日）：每日8:30-19:00；冬季（11月1 日-3 月31 日）：8:30-17:30。12 月25 日闭馆。秘密行程需预约，英语导览每日10:00、11:10、12:20。建议查阅", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/088_威尼斯总督宫秘密监狱.jpeg", desc:"威尼斯总督宫秘密监狱位于威尼斯总督宫（Palazzo Ducale）内，是威尼斯共和国最臭名昭著的政治监狱之一。总督宫始建于9 世纪，14 世纪哥特式重建后成为威尼斯共和国的大公官邸和政府中心。"},
{id:116, name:"意大利·马梅尔蒂诺监狱", region:"欧洲", country:"意大利", lat:41.890942, lng:12.491903, address:"阿根塔里奥坡道1 号（Clivo Argentario 1）", ticket:"成人门票为10 欧元，需在线预订（提前24 小时）", hours:"每日9:00-18:30（18:00 停止入场），12 月25 日与1月1 日闭馆。建议查阅", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/085_意大利·马梅尔蒂诺监狱.jpeg", desc:"马梅尔蒂诺监狱（Mamertine Prison），也叫图里亚诺监狱（CarcerTullianum），位于罗马市中心圣马可区阿根塔里奥坡道1 号，紧邻罗马广场与卡比托利欧山。是古罗马唯一的监狱遗址。"},
{id:117, name:"拉脱维亚·卡罗斯塔海军监狱博物馆", region:"欧洲", country:"拉脱维亚", lat:56.941376, lng:24.117823, address:"Invaidu iela 4, Liepaja, LV-3414, Latvia", ticket:"门票之外可以选择“Behind Bars”项目（约10-15 欧元），入住的游客在基础住宿费之外选择“Extreme Night”项目（20-30 欧元）", hours:"夏季（6 月-8 月）：每天9:00-19:00。春/ 秋季（4-5 月、9 月）：每天10:00-18:00。冬季（10 月- 次年3 月）：周五至周日12:00-16:00。博物馆", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/117_拉脱维亚·卡罗斯塔海军监狱博物馆.jpeg", desc:"卡罗斯塔海军监狱博物馆（Karosta Naval Prison Museum）位于拉脱维亚西部港口城市利耶帕亚（Liepaja），前身为一座军事监狱。跨越了多个历史时期，1997 年关闭后，改为监狱博物馆与酒店结合的运营方式，被称为“最令人惊讶和不寻常的酒店”之一。"},
{id:118, category:"hotel", name:"卡罗斯塔酒店（Karosta Prison Hotel）", region:"欧洲", country:"拉脱维亚", lat:56.543, lng:21.017, address:"利耶帕亚Invaliidu iela 4", ticket:"30欧元/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/22.%E5%8D%A1%E7%BD%97%E6%96%AF%E5%A1%94%E9%85%92%E5%BA%97%EF%BC%88Karosta%20Prison%20Hotel%EF%BC%89.jpg", desc:"前身为卡罗斯塔海军监狱，建于1890-1900年间，1997年关闭。提供Behind Bars和Extreme Night等监狱体验项目。"},
{id:119, name:"斯洛文尼亚·斯塔里- 皮斯卡监狱博物馆", region:"欧洲", country:"斯洛文尼亚", lat:46.2305, lng:15.2644, address:"Metelkova ulica 8, 1000 Ljubljana房价：约23 欧元/ 晚详见", ticket:"成人门票为5 欧元，需提前两天预约", hours:"周二至周六10:00-13:00，建议查阅", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%96%AF%E5%A1%94%E9%87%8C%C2%B7%E7%9A%AE%E6%96%AF%E5%8D%A1%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpg", desc:"斯塔里·皮斯卡监狱博物馆（Stari Pisker Prison Museum）位于斯洛文尼亚采列市市中心，是采列最古老的监狱遗址，见证了二战期间的纳粹暴行。斯塔里·皮斯卡原为米诺利特修道院，始建于13 世纪，18 世纪末被改建为地方监狱。"},
{id:120, category:"hotel", name:"塞丽卡酒店（Hostel Celica）", region:"欧洲", country:"斯洛文尼亚", lat:46.0559, lng:14.5172, address:"卢布尔雅那Metelkova ulica 8", ticket:"23欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/21.%E5%A1%9E%E4%B8%BD%E5%8D%A1%E9%85%92%E5%BA%97%EF%BC%88Hostel%20Celica%EF%BC%89.jpg", desc:"前身是1882年建成的梅特尔科瓦军事监狱，1991年关闭。保留了牢房、铁栏和庭院等元素，并设有地下禁闭博物馆。"},
{id:121, category:"hotel", name:"阿尔卡特兹监狱青旅（Alcatraz Jail Hostel）", region:"欧洲", country:"格鲁吉亚", lat:41.69, lng:44.806, address:"第比利斯28/30 Betlemi St", ticket:"22欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/23.%E9%98%BF%E5%B0%94%E5%8D%A1%E7%89%B9%E5%85%B9%E7%9B%91%E7%8B%B1%E9%9D%92%E6%97%85%EF%BC%88Alcatraz%20Jail%20Hostel%EF%BC%89.jpg", desc:"监狱主题青旅，并非在旧监狱基础上改造，而是以监狱风格设计的特色旅馆。"},
{id:122, name:"比利时·布兰登克堡", region:"欧洲", country:"比利时", lat:51.240849, lng:2.964791, address:"Brandstraat 57, 2830 Willebroek", ticket:"门票：11 欧元，包含音频导览", hours:"每日9:30-17:30（夏季延长至18:00）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/059_比利时·布兰登克堡.jpeg", desc:"布兰登克堡（Fort Breendonk，荷兰语：Fort van Breendonk）位于比利时梅赫伦（Mechelen）。这座堡垒最初是为军事防御而建，二战期间，纳粹将其改造成监狱营。"},
{id:123, name:"梅克斯普拉斯监狱博物馆", region:"欧洲", country:"比利时", lat:51.056525, lng:4.341316, address:"Kapelstraat 10, 2330 Merksplas", ticket:"门票：约5 欧元，建议提前联系确认（电话：+32 14 63 3311）", hours:"每周三、周六和周日13:00-17:00", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/060_梅克斯普拉斯监狱博物馆.jpeg", desc:"比利时的梅克斯普拉斯监狱博物馆（Gevangenis museumMerksplas）位于安特卫普省梅克斯普拉斯镇，前身为一座200 年历史的监狱。梅克斯普拉斯监狱始建于1825 年，最初是荷兰王国时期慈善协会设立的农业定居点，旨在通过开垦荒地和农业劳动为流浪者、乞丐和失业者提供新生活。"},
{id:124, name:"蓬莱韦克监狱博物馆", region:"欧洲", country:"法国", lat:49.371532, lng:-0.878736, address:"法国卡尔瓦多斯省庞特勒韦克镇尤金- 皮昂街5 号", ticket:"成人门票为4.6 欧元，需预约（+33 2 31 64 89 33）", hours:"夏季（7-8 月）：周三、周六、周日11:00-12:00 及14:00-17:00。其他月份：每月第一个周六11:00-12:00，或节假日特别开放。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/052_蓬莱韦克监狱博物馆.jpeg", desc:"庞特勒韦克监狱博物馆（Pont-l'évêque Prison）位于法国卡尔瓦多斯省庞特勒韦克镇尤金- 皮昂街5 号。因1940 年代的放任管理，被戏称为欢乐监狱（La Joyeuse Prison）。"},
{id:125, name:"法国·巴黎古监狱", region:"欧洲", country:"法国", lat:48.855657, lng:2.345051, address:"巴黎第一区西岱岛圣礼拜堂路1 号（1 Quai de l’Horloge）", ticket:"成人门票为11.5 欧元", hours:"每日9:30-18:00，全年无休（1 月1 日、5 月1 日、12月25 日除外）。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/051_法国·巴黎古监狱.jpeg", desc:"巴黎古监狱（La Conciergerie）位于巴黎西岱岛圣礼拜堂路1 号。是法国最古老的皇家宫殿遗址之一，也是法国大革命期间最具象征意义的监禁与审判场所。"},
{id:126, name:"蒙卢克监狱", region:"欧洲", country:"法国", lat:45.746516, lng:4.82633, address:"里昂4 rue Jeanne Hachette", ticket:"免费入场", hours:"冬季（9 月至6 月）：周三至周六，14:00-18:00（16:00 导览）夏季（7月至8月）：周二至周六，10:00-12:30和14:00-18:00（10:30和16:00 导览）。公共假日、圣诞节至新年期间闭馆。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/055_蒙卢克监狱.jpeg", desc:"蒙卢克监狱（National Memorial Prison of Montluc）是法国里昂一座历史悠久的监狱，位于里昂第3 区的Jeanne Hachette 街，靠近同名的蒙卢克堡垒。如今作为纪念馆向公众开放。"},
{id:127, name:"圣米歇尔监狱", region:"欧洲", country:"法国", lat:43.5811, lng:1.4381, address:"图卢兹市圣米歇尔大街18bis 号", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/054_圣米歇尔监狱.jpeg", desc:"圣米歇尔监狱位于图卢兹市圣米歇尔大街18bis 号，始建于1861年，占地约2 公顷，耗资80 万法郎，采用全景监狱理念，中央圆形大厅连接五条辐射状翼楼，外墙镶嵌鹅卵石，外观似中世纪城堡。设计容量400 人，20 世纪末高峰期超载至600 人以上。"},
{id:128, name:"伊夫堡监狱", region:"欧洲", country:"法国", lat:43.279856, lng:5.325284, address:"法国南部马赛市以西约1.5 公里的伊夫岛上", ticket:"门票：成人6 欧元，18 岁以下免费，含语音导览", hours:"4 月1 日至9 月30 日：每日9:30-18:00。10 月1 日至3 月31 日：每日9:30-17:00（周一闭馆）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/053_伊夫堡监狱.jpeg", desc:"伊夫堡（Chateau d'If）位于法国南部马赛市以西约1.5 公里的伊夫岛上，是法国著名的监狱。这座堡垒最初作为防御工事，1540 年，转为监狱。"},
{id:129, name:"新喀里多尼亚监狱", region:"欧洲", country:"法国（新喀里多尼亚）", lat:-21.3089, lng:165.376, address:"澳大利亚以东1210 公里处", ticket:"", hours:"为周三至周日，9:00-17:00），去新喀里多尼亚通常飞到努美阿的拉通图塔国际机场，再租车前往各监狱博物馆或遗址，松岛监狱需渡轮或飞机。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/058_新喀里多尼亚监狱.jpeg", desc:"新喀里多尼亚是南太平洋的一组群岛，位于澳大利亚以东1210 公里处，属于法国的海外领地，包括主岛大特雷岛（Grande Terre）、松岛（?le des Pins）、忠诚群岛（Loyalty Islands）等。新喀里多尼亚监狱（Prison of New Caledonia）是法国新喀里多尼亚运营的多个监狱，1853 年，新喀里多尼亚成为法国殖民地，1864 年，法国将新喀里多尼亚指定为流放地，首批囚犯于同年5 月抵达大特雷岛努美阿（Nouméa）。"},
{id:130, name:"救赎群岛", region:"欧洲", country:"法国（法属圭亚那）", lat:5.157983, lng:-52.64242, address:"南美洲东北部法属圭亚那（FrenchGuiana）海岸约15 公里处的三个小岛组成的群岛", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/056_%E6%95%91%E8%B5%8E%E7%BE%A4%E5%B2%9B.jpeg", desc:"救赎群岛（?les du Salut）是位于南美洲东北部法属圭亚那（FrenchGuiana）海岸约15 公里处的三个小岛组成的群岛，包括：皇家岛（最大岛屿，行政中心和主要监狱设施所在地）。圣约瑟夫岛（以单人牢房和恶劣条件著称）。"},
{id:131, name:"Pawiak监狱博物馆", region:"欧洲", country:"波兰", lat:52.25, lng:21.0, address:"华沙老城区西北侧 ul. Dzielna 24/26", ticket:"周四免费，其他日成人约10 兹罗提", hours:"", image:"", desc:""},
{id:132, name:"索比堡灭绝营遗址", region:"欧洲", country:"波兰", lat:52.231694, lng:21.024771, address:"索比堡Wlodawa", ticket:"", hours:"为每日9:00-16:00（冬季15:00 闭馆，12 月24-26 日及1 月1 日闭馆），每年10 月14 日举办起义纪念仪式。入场免费。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/081_索比堡灭绝营遗址.jpeg", desc:"波兰卢布林省索比堡村附近的索比堡灭绝营遗址（SobiborExtermination Camp），是纳粹德国“莱因哈德行动”三座死亡营之一（另为贝乌泽克和特雷布林卡），运营期间为1942 年5 月至1943 年10 月。1943 年关闭后，纳粹将其拆除并伪装为农田，战后长期被忽视。"},
{id:133, name:"华沙莫科图夫监狱旧址（Muzeum Żołnierzy Wyklętych i Więźniów Politycznych PRL）", region:"欧洲", country:"波兰", lat:52.2, lng:21.0, address:"", ticket:"", hours:"", image:"", desc:""},
{id:134, name:"马伊达内克集中营纪念馆", region:"欧洲", country:"波兰", lat:51.225319, lng:22.606258, address:"卢布林市Droga Meczenników Majdanka 67", ticket:"", hours:"为每日9:00-17:00（冬季16:00 闭馆，12 月24-26 日及1 月1 日闭馆），每年7 月23 日举办解放纪念仪式，11 月3 日悼念“丰收行动”受害者。入场免费，导览费约20 兹罗提（约5 美元）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/082_马伊达内克集中营纪念馆.jpeg", desc:"马伊达内克集中营纪念馆（Majdanek Concentration CampMemorial）位于波兰卢布林市东南郊。这座集中营于1941 年10 月1 日启用，是二战期间纳粹在波兰占领区建立的第二大集中营（仅次于奥斯维辛- 比克瑙），兼具劳役、拘禁和灭绝功能。"},
{id:135, name:"特雷布林卡灭绝营遗址", region:"欧洲", country:"波兰", lat:51.221693, lng:22.597504, address:"Treblinka, 08-330 Kosów Lacki", ticket:"", hours:"每日9:00-18:30 开放（冬季16:00 闭馆，12 月24-26日及1 月1 日闭馆），每年8 月2 日举办起义纪念仪式。入场免费。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/080_特雷布林卡灭绝营遗址.jpeg", desc:"波兰马佐夫舍省特雷布林卡村附近的特雷布林卡灭绝营遗址（Treblinka Extermination Camp）是纳粹“莱因哈德行动”中规模最大、杀戮效率最高的死亡营，分为特雷布林卡I（劳改营）和特雷布林卡II（灭绝营），运营时间为1941 年至1943 年。以大规模屠杀犹太人和彻底的罪证销毁而臭名昭著。"},
{id:136, name:"贝乌泽克灭绝营遗址", region:"欧洲", country:"波兰", lat:50.57964, lng:21.676697, address:"贝乌泽克,22-680", ticket:"", hours:"每日9:00-17:00（冬季16:00 闭馆，12 月24-26 日及1月1 日闭馆），入场免费。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/079_贝乌泽克灭绝营遗址.jpeg", desc:"位于波兰卢布林省贝乌泽克村附近的贝乌泽克灭绝营遗址（BelzecExtermination Camp）是一处见证纳粹德国“最终解决方案”暴行的关键遗迹。这座灭绝营是“莱因哈德行动”中首个投入运营的死亡营，专为大规模屠杀犹太人而设计，运营时间为1942 年3 月17 日至1943 年6月。"},
{id:137, name:"波兰·奥斯维辛集中营", region:"欧洲", country:"波兰", lat:47.495458, lng:19.040499, address:"波兰奥斯维辛镇乌卡苏·皮尔斯捷基街20 号", ticket:"免费入场", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/078_波兰·奥斯维辛集中营.jpeg", desc:"奥斯维辛集中营（Auschwitz-Birkenau State Museum）位于波兰奥斯维辛镇乌卡苏·皮尔斯捷基街20 号，距克拉科夫约60 公里。是纳粹德国在二战期间实施种族灭绝的核心遗址，也是最具象征意义的集中营纪念地。"},
{id:138, name:"爱尔兰·凯尔梅尼监狱", region:"欧洲", country:"爱尔兰", lat:52.366872, lng:4.91101, address:"都柏林英奇科路（Inchicore Road, Kilmainham,Dublin）", ticket:"成人门票为9 欧元，仅限在线预订（提前28 天开放票），无现场售票", hours:"夏季（6 月-9 月）：每日9:30-18:00；冬季（10 月-次年5 月）：周一至周六9:30-17:15，周日10:00-18:00。12 月24-26日闭馆。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/050_爱尔兰·凯尔梅尼监狱.jpeg", desc:"凯尔梅尼监狱（Kilmainham Gaol）位于爱尔兰都柏林基尔梅因汉姆区英奇科路。1796 年，基尔梅因汉姆监狱由都柏林郡大陪审团建造，初名为“新监狱”（New Gaol），以取代几百米外条件恶劣的地牢。"},
{id:139, name:"爱沙尼亚·帕塔雷监狱博物馆", region:"欧洲", country:"爱沙尼亚", lat:58.373545, lng:26.722164, address:"爱沙尼亚塔林卡拉兰纳街28 号，10415", ticket:"成人门票为10 欧元，需在线预订", hours:"5 月-10 月：周二至周日10:00-18:00，11 月-4 月闭馆，", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/115_爱沙尼亚·帕塔雷监狱博物馆.jpeg", desc:"帕塔雷监狱博物馆（Patarei Prison Museum）位于爱沙尼亚塔林市卡拉兰纳街28 号（Kalaranna 28, 10415 Tallinn），是爱沙尼亚最臭名昭著的海堡监狱遗址，见证了苏联与纳粹的双重暴行。1830 年，沙皇尼古拉一世下令修建塔林湾军事要塞，占地约4 公顷，建筑面积约2 万平方米，采用砖石与混凝土结构，1840 年完工。"},
{id:140, category:"hotel", name:"兰霍尔曼酒店（Långholmen Hotell）", region:"欧洲", country:"瑞典", lat:59.3215, lng:18.03, address:"斯德哥尔摩Långholmsmuren 20", ticket:"床位250瑞典克朗起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/12.%20%E5%85%B0%E9%9C%8D%E5%B0%94%E6%9B%BC%E9%85%92%E5%BA%97%EF%BC%88L%C3%A5ngholmen%20Hotell%20%26%20Vandrarhem%EF%BC%89.jpg", desc:"前身为朗霍尔门监狱，1835年转为监狱，1972年关闭。保留了牢房、中庭和红砖外墙，并设有监狱博物馆展示历史。"},
{id:141, name:"瑞典监狱博物馆", region:"欧洲", country:"瑞典", lat:59.319595, lng:18.071261, address:"Hamiltongatan 1 & 3，靠近加夫勒城堡和郡博物馆", ticket:"门票：成人80 瑞典克朗，含音频导览，儿童免费", hours:"周二至周日10:00-16:00（周三延长至18:00），", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/067_瑞典监狱博物馆.jpeg", desc:"瑞典监狱博物馆坐落于耶夫勒市中心加夫勒河（G?vle River）南侧。由两座历史建筑组成：城堡监狱（Castle Jail）和加夫勒堡郡监狱（G?vleborg County Prison），分别建于1732 年和1847 年。"},
{id:142, name:"瑞典·朗霍尔门监狱博物馆", region:"欧洲", country:"瑞典", lat:57.639375, lng:18.293588, address:"瑞典斯德哥尔摩L?ngholmsmuren 20 号", ticket:"成人门票为90 瑞典克朗，酒店住客免费参观", hours:"夏季（6 月-8 月）：每日11:00-16:00；冬季（9 月-5 月）：周六、周日11:00-16:00，其他时间需预约。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/066_瑞典·朗霍尔门监狱博物馆.jpeg", desc:"朗霍尔门监狱博物馆（L?ngholmen Prison Museum）位于瑞典斯德哥尔摩朗霍尔门岛。是瑞典最古老的监狱之一，目前转型为酒店与博物馆的创新经营模式。"},
