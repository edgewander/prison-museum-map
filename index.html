<p>## 2. 翼状监狱时期</p>
<p>从19世纪中后期到20世纪中期，长达近一个世纪的时间里，“风车式”监狱和“电线杆”监狱这两种监狱建筑的布局形式占据了美国监狱建筑的主流。这两种监狱均采用囚犯监房分区的翼状布局，可将其合称为“翼状”监狱。</p>
<p>据《监狱建筑》一书记载，19世纪中期，“ 风车式（Radial Wings）”监狱开始在美国出现。这种监狱建筑由一座中心岗楼和放射状环绕在岗楼周围的若干监房单元组成。监房单元一般有3－4层高，两侧布置细胞式监房，中间为中庭和走廊；中央岗楼一般比较高，集合办公、监控及辅助功能，可以有效地监督囚犯的行为而又不至于对囚犯造成太重的心理负担。采用这种布局形式的监狱有新泽西州特顿州立监狱（Trenton_State Prison）、费城东州惩教所（Eastern State Correctional Facility）等。</p>
<p>费城东州惩教所</p>
<p>由《西方监狱建筑的空间特征及其演化》一文的研究可知，19世纪末，法国建筑师范西斯科·珀辛的“电线杆式（Telephone-Pole）”设计理念被引入美国。这种布局形式用通长的走廊将若干个平行布置的监房从中间串联起来，人员与物资的流动都通过中央走廊完成。“电线杆式”的监狱设计由于占地面积比以往的监狱小，管理效率高，因而随即在美国得到广泛使用，如阿肯色州的康明斯监狱（Cummins Prison）、德克萨斯州的伊斯特汉监狱（Eastham Unit）等。</p>

<p>## 3. 多元化时期</p>
<p>1960年代，美国联邦及各地方政府相继推出各种有关囚犯权利的法律法规，而美国惩教协会也逐渐开始推广相关的监狱建筑建设标准。美国监狱建筑的形制开始变得更为多元，三角型、L型等新型监舍单元布置形式开始出现，内置监房式的布局方式被摒弃等。而1980年代之后，美国囚犯人口数量剧增，开始了新一轮监狱建筑的建设，这一时期的监狱建筑在兼顾科学的同时，也注重考虑监狱的经济性，位于城市或郊区的监狱日渐增多，各种新型的监狱不断涌现，如北支流监狱（North_Branch Correctional</p>
<p>Institution）、河边监狱（Riverside State Prison）、卡伦监狱（Curran Reception and Detention ）等。</p>

  {
    id: 8,
    title: '米尔班克监狱',
    date: '2026-06-05',
    content: `<p><img src="2.23.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>米尔班克监狱平面图</p>
<p><img src="2.23.2.JpG" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>米尔班克监狱，全称米尔班克国家感化院（Millbank National Penitentiary），原址位于伦敦晤士河畔威斯敏斯特区米尔班克路，它不仅是英国第一座感化院，也世界监狱走向现代化的第一个里程碑式实验。从1816年运营至1890年，1892年起逐步拆除，原址目前为泰特英国美术馆等。</p>
<p><img src="2.23.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>18世纪中期，工业革命兴起，犯罪率飙升，当时英国还没有完善的监狱系统，以身体刑为主。所谓监狱，大多由城堡、塔楼、地牢等充当临时拘留所，如伦敦塔、牛津城堡、兰开斯特城堡。其管理混乱，条件恶劣，疾病滋生。</p>
<p><img src="2.23.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1777年，改革家约翰·霍华德发表了《英国及威尔士监狱状况》，呼吁监狱改革，建立行之有效的改造系统，改善卫生条件和引入感化理念。他与威廉·布莱克斯通、本杰明·富兰克林等人促成了1779年《监狱法》（Penitentiary Act）的出台，米尔班克感化院正是这一法案的产物。</p>
<p><img src="2.23.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1799年，英国王室委托同样是改革家的杰里米·边沁以1.2万英镑从索尔兹伯里侯爵手中购得米尔班克的土地，用于建造边沁构想的全景敞视监狱（Panopticon）作为全新的英国国家监狱。由于种种原因，边沁的方案不幸于1812年搁浅，他黯然离场。之后，由43家参赛者投标角逐该项目，桑赫斯特皇家军事学院的设计师威廉·威廉姆斯（William Williams）胜出，他设计了精妙的六边形辐射监狱。同年，建筑师托马斯·哈德威克（Thomas Hardwick）在对方案进行调整后开始施工建造。18个月后，地基出现了沉降，已经建到六英尺高的外墙开始倾斜并开裂。至此已经花费了26000英镑，哈德威克被开除。约翰·哈维（后赴美建了东州监狱）接手了该工程。1815年，哈维被解职，由罗伯特·斯米尔克（后设计大英博物馆）接替，后者于1821年完成了该项目。</p>
<p><img src="2.23.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>米尔班克监狱的设计独具匠心：中间是六边形的中央庭院，环绕中央庭院的是六座五边形建筑，每座五边形有三层牢房和五个小庭院，庭院中央设有瞭望塔。围墙为八边形，高约5米，配护城河。整体占地超过16英亩，宛如一座“美轮美奂”的堡垒。每一座五边形建筑的三个外角都有一座马特洛式（Martello-like）圆塔，高出主体建筑一层，既是瞭望点，又容纳楼梯和卫生设施。整个监狱有约1000间牢房，每间约4米×2.5米，带小窗、木床、吊床、木凳、洗盆和书籍（包括《圣经》、祈祷书和算术书）。设计为单独监禁，意图通过宗教和教育感化囚犯。中央建筑内设一教堂，用于宗教服务和教育。劳动区包括纺织车间、制鞋房和洗衣房。</p>
<p><img src="2.23.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>米尔班克监狱与威斯敏斯特钟相距不远，威斯敏斯特钟每十五分钟它会响一次，囚犯在牢房能清楚地听到。曾有囚犯在日记里说，每天只能听到这一种声音让自己倍感孤独：“日夜不息，声声入耳...如怪兽之声，唱着时间的挽歌。”</p>
<p><img src="2.23.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>然而，这座宏伟的建筑从一开始就问题重重。1816年6月，第一批女囚入住时，建筑仍在施工中：墙体吱吱作响，几扇窗户无端碎裂。于是，斯米尔克与工程师约翰·雷尼又拆除了三座塔楼并用混凝土“筏式基础”加固地基——这是自罗马帝国以来英国首次使用混凝土基础。大大增加了建筑成本，最终总共花了50万英镑，是原预算的两倍还多。</p>
<p><img src="2.23.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1816年6月26日首批女囚入住后，1817年1月男囚进入。到1822年底，这里关押了452名男囚和326名女囚。米尔班克监狱的初衷是通过单独监禁（18个月）和劳动（如纺织、制鞋）改造囚犯，替代流放澳大利亚的刑罚。然而，现实打败了理想。</p>
<p><img src="2.23.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>首先，单独监禁让人难以承受，导致精神疾病频发，1823年，监狱不得不考虑采用混合模式：初期隔离+后期集体劳动。</p>
<p><img src="2.23.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>其次，疾病肆虐，囚犯饮食匮乏（面包、稀粥为主），米尔班克的潮湿环境滋生疾病，加之卫生条件差，痢疾、坏血病和抑郁症频发。1822-1823年的疫情迫使监狱暂时关闭，女囚获释，男囚转移至伍尔维奇（Woolwich）的监狱船（hulk）。1837年的疫情更是致死数十人。</p>
<p><img src="2.23.12.webp" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>第三，管理混乱，成本高企。米尔班克巧妙的走廊有如迷宫，连狱卒都会迷路；囚犯利用通风系统传声，隔墙交流，违背了隔离初衷；年运营成本高达1.6万英镑，难以承受。</p>
<p><img src="2.23.13.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1842年，本顿维尔监狱启用，1843年米尔班克监狱被降级为普通监狱和流放前拘留所。之后，每年有数百名囚犯在此等待3个月，之后被流放至遥远的澳大利亚。1853年英国议会废除流放政策，大规模流放结束，米尔班克转型为地方监狱和军事监狱，直至1886年政府决定逐步关停米尔班克，1890年正式关闭，囚犯转移至本顿维尔等监狱。</p>
<p><img src="2.23.14.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1892年起，米尔班克监狱逐步拆除，至1903年完成。原址被重新开发建造为泰特英国美术馆和其他设施。泰特英国美术馆（1897年启用）：占据核心区域，花园中保留原监狱护城河遗迹。河边有一座低矮粗壮护柱，上铭刻：“附近曾有米尔班克监狱，该监狱于1816年启用，1890年关闭。这个护柱在河阶的顶端，直到1867年，被判处流放的囚犯都是从这里登船前往澳大利亚。（Near this site stood Millbank Prison which was opened in 1816 and closed in 1890. This buttress stood at the head of the river steps from which, until 1867, prisoners sentenced to transportation embarked on their journey to Australia.）</p>`
  },
  {
    id: 9,
    title: '旋转监狱——镀金时代的机械囚禁史',
    date: '2026-06-06',
    content: `<p><img src="2.24.1.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="2.24.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="2.24.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="2.24.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>当监狱成为一台机器</p>
<p><img src="2.24.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="2.24.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1881年，美国印第安纳波利斯（Indianapolis, Indiana）的建筑师威廉·布朗（William H. Brown）和铸铁厂老板本杰明·霍尔（Benjamin F. Haugh）脑洞大开，发明了他们认为既安全性又能提高管理效率的监狱——旋转监狱（rotary jail）。“一种无需狱警与囚犯直接接触即可控制的监狱”。该监狱以带可旋转轴承的圆柱形监区为核心，圆柱被分割为若干个楔形牢房，可叠加数层（如下图所示），牢房的外面有一圈铁笼，铁笼只有一个门，只有当牢房旋转至与笼门对齐时，该牢房的犯人才能出来。而这一切，只需要一个狱警转动曲柄就能实现。狂喜之下，他们为自己的发明申请了专利并积极进行推广。</p>
<p><img src="2.24.7.webp" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="2.24.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>维多利亚牢笼</p>
<p><img src="2.24.9.webp" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="2.24.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1882年6月，首座旋转监狱——蒙哥马利县旋转监狱 （Montgomery County Rotary Jail）在印第安纳州克劳福兹维尔（Crawfordsville, Indiana）启用，由霍夫的铁厂建造，有两层16间牢房，旋转牢房重约27吨，直径约6米，耗资3万美元（含旁边的警长住宅）。</p>
<p><img src="2.24.11.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="2.24.12.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>蒙哥马利县旋转监狱外观</p>
<p><img src="2.24.13.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="2.24.14.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1885年，通过发行债券募足工程所需资金后，爱荷华州波塔瓦塔米县（Pottawattamie County ）耗时五个月建成了一座古典与未来糅合的监狱：40多吨重的三层旋转铁笼暗藏于维多利亚风格的红砖墙内。罗马式拱窗、石灰石雕饰与精致的砖砌，让这座监狱宛若豪宅，成为当时世界上最大的旋转监狱（康瑟尔·布拉夫斯监狱）。</p>
<p>康瑟尔·布拉夫斯监狱（Council Bluffs jail）1889年密苏里州加勒廷戴维斯县（Gallatin）的单层旋转监狱</p>
<p>1882-1889年间，美国中西部共建造了6至18座旋转监狱（具体数量因记录不全而存疑），分布在印第安纳州、爱荷华州、密苏里州等地。因牢房像旋转轮中的笼子，它们被称为“松鼠笼监狱”（Squirrel Cage Jail）。</p>
<p>机械乌托邦的残酷现实</p>
<p>然而，问题很快显现：牢房通风和采光都不够，还有火灾疏散隐忧。1904年，密苏里州玛丽维尔监狱的一名囚犯的头被旋转的铁笼夹伤，成为第一家放弃旋转模式的监狱。1930年代，大多数铁笼被焊死或弃用。1969年，康瑟尔·布拉夫斯监狱将囚犯送走；1973年，服役91年，关押过数千人后，蒙哥马利县监狱永久关闭，1975年，蒙哥马利县文化基金会将其改造为博物馆，同年，加勒廷监狱关闭。</p>
<p>从机械奇观到历史遗存</p>
<p>70年代末尾，所有旋转监狱被关闭，堪萨斯州威奇托旋转监狱的笼子被送到本地动物园再就业。之后，仅剩的三所旋转监狱陆续转为博物馆。1996年，蒙哥马利县恢复了该监狱铁笼的旋转，供游客参观。</p>`

    id: 10,
    title: '监狱界的徐霞客：约翰·霍华德与他的暗黑苦旅',
    date: '2026-06-06',
    content: `<p>前两天发了一篇推文，里面附了张照片（上图），这是美国人Sidney D. Gamble拍的京师模范监狱的教诲室。墙上挂了六张画像，分别是孔子、老子、观音菩萨、耶稣、穆罕默德、约翰·霍华德。有读者问，约翰·霍华德是谁？今天就来介绍一下约翰·霍华德。</p>
<p>18世纪的欧洲，当贵族们流连于社交沙龙，旅行家们热衷于游历名山大川时，有一位英国绅士却把余生所有的精力、财富，甚至生命，都投入到了人类文明最阴暗的角落——监狱。他就是被誉为英国“监狱改革之父”的约翰·霍华德。</p>
<p>霍华德（John Howard，1726–1790）并非法律学者，也不是狱政官员。他家境优渥，生活平静。乐善好施，是一位虔诚的加尔文教徒。一次意外，开启了他与监狱的缘分。1756年，在前往葡萄牙途中，霍华德被法国私掠船俘虏，亲身体验了监狱的阴冷与饥饿。不过很快，他就得到释放。</p>
<p>17年后（1773年），霍华德被任命为贝德福德郡的高级治安官。在视察本地监狱时，他被眼前的景象震撼：管理混乱，肮脏不堪，犯人挤在潮湿恶臭的地牢里，疾病肆虐。更令人愤慨的是，许多被判无罪的人，因为交不起给狱卒的出狱费被超期羁押，无法出狱。</p>
<p>霍华德决心为这片“人间地狱”做些事情，他决定考察监狱的普遍情况，用数据和报告呼吁改革。</p>
<p><img src="2.32.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>这场“监狱考察之旅” 持续了17 年，足迹遍布英国本土及欧洲大陆大部分国家，甚至延伸到土耳其和俄国，亲自踏入并记录了超过300所监狱。</p>
<p>当时的监狱狭小拥挤、污秽肮脏、通风又差，极易感染和传播斑疹伤寒，以至于人们把这种病叫监狱热。普通人自然避之唯恐不及，连法官都不愿靠近。霍华德则毫不畏惧，他认真记录下各项细节：监狱平面图、牢房数量与尺寸、通风采光、饮水排污、犯人数量、刑期、伙食、健康状况、死亡率、管理人员数量及薪资情况等。</p>
<p>1774年，他向英国下议院委员会提供的证据促成了两项改善监狱状况的法案通过——《废除出狱费法案》和《囚犯健康法案》。</p>
<p>1777年，霍华德出版其心血之作：《英格兰和威尔士监狱状况》（The State of the Prisons in England and Wales, with Preliminary Observations on some Foreign Prisons），把问题摆在所有文明人的桌面，开启了世界范围内的监狱改革进程。</p>
<p>由是，霍华德成为议会监狱改革的权威人物，并参与起草了1779年的《监狱法》，首次引入了英国公立监狱政策。他率先提出了单人牢房的概念，倡导清洁卫生、分类关押、单独监禁、强制劳动、宗教教育及狱卒薪资制度。</p>
<p>1789年，年逾六旬的他再次远赴俄国。在赫尔松（现属乌克兰）考察时，为救治感染者不幸染上伤寒，于1790年初病逝于俄国。</p>
<p>霍华德与徐霞客有诸多相似之处：二人都身体力行，不畏艰险，旷日持久地行走在路上，并将这种“行走”当作毕生志业；二人都有理工男的冷静，留下大量详实的记录；其成果皆超越了个人经验，转化为公共财富，改变了人们对他们各自领域的认知方式。且最后二人都献祭于自己的事业，为后人所称道。只是，一个记录了地理的景观，一个记录了文明的溃疡。</p>
<p><img src="2.32.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>附上英国资深大律师哈利·波特（Harry Potter）的著作《牢影》（Shades of the Prison House: A History of Incacreration in the British Isles）中关于约翰·霍华德的部分，该文专业而优美，值得一读。</p>
<p>霍华德的努力和著作为打开人类心智做了大量工作。他的足迹遍布欧洲，到过地牢深处，了解过悲哀和痛苦之所，丈量过苦难、抑郁和蔑视的深渊，缅怀被遗忘之人，陪伴被忽视之人,拜访被遗弃之人，比较、整理全英格兰所有人的苦难。这是一次发现之旅，一次慈善的环球航行。</p>
<p>——埃德蒙·伯克(Edmund Burke)</p>
<p>他为人类所做的，很少有人能做到，除了他，没人愿意做。道德荒漠的天平上，立法者和作家的辛劳远不及他，就像地球在天堂之下。他的国度是一个更好的世界;他以信徒的身份而生，以殉道者的身份而亡。</p>
<p>——杰里米·边沁</p>
<p>第十一章：在地牢深处用餐</p>
<p>1777年，《英格兰和威尔士监狱状况》(The State of The PrisonsinEngland andWales)一书出版，为了能够广泛传播，定价十分低廉。对监狱来说，此书仿若一部《末日审判书》。它全面调查了不列颠群岛及其他地区的监禁机构。虽然之前也有关于英格兰监狱情况的出版物，例如十六世纪末，约翰·斯托就曾将伦敦监狱列人了他的调查著作，并发表了关于马歇尔希监狱和舰队监狱的报告。但还从未有过如今这样一本书。该书的编写时间比当年征服者那部《末日审判书》编纂时间还要长，后者经王室下令编纂，由一整支文官队伍合力完成。而这本书仅仅是由一位不知疲倦的谦逊的中年中产阶级地主完成的。他不惧恶劣天气，骑马走遍全国，多次走访了无数监狱机构，收集了大量事实，并把他的发现和建议落于笔端，完成了这部鸿篇巨制。他把自己的大仁大义之作献给了下议院的议员们，感谢他们的鼓励。而他们也对他的非凡努力表示了应有的感谢。</p>
<p><img src="2.32.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>这些努力的非凡之处，不仅体现在调查范围和细节上，也体现在做出这些努力本身的伟大理想中。谁愿意在生命的最后几十年里，以巨大的个人健康和财富为代价，不断奔波于国内外，并非去参观不列颠和欧洲的名胜古迹和城市，而是去走访各地最阴湿、最肮脏、最恶臭的死亡陷阱?是谁不仅要去监狱，还要去传染病院和其他监禁机构?答案就是约翰·霍华德。</p>
<p>本章中这位超凡的英雄，在1773年开始了他这一伟大的慈善事业，时年四十七岁。他在卡丁顿过着平静的小地主生活，始终从事慈善事业。这一年，这位在班扬传教的独立教堂做礼拜的小个子，一个不起眼的异见人士，出人意料地成为贝德福德郡的高级治安官。与其他担任这一职务的人不同，他毫不推卸自己的责任(其中之一便是走访郡里的监狱)。他对他所发现的一切感到震惊——肮脏、苦难、贪赃枉法、不人道，最可恶的是本该无罪释放的犯人被继续关押，因为他们无法支付出狱费。他决心用余生来做些事。世人同情人类的苦难，而他却同情最可悲、最无助之人遭受的苦难。他是一个虔诚随和的加尔文教徒，此次是奉主之神圣使命去看望被监禁的人。当然，这也可能是魔鬼的诱惑，因为两次丧偶的霍华德只有一个孩子，他很可能想逃避他为人父母的责任。他的孩子不安分，是个叛逆的青年，最终被送进了疯人院。同时，也可能出于对自己是个不合格父亲的忏悔。或者三者兼而有之。</p>
<p>无论动机是什么，霍华德开始改变债务人、不法之徒和重刑犯们的生活；并以此来改变自己的生活。他的生命有了新的意义。他的努力、感悟和坚持护佑着刑罚改革的微弱火光，最终使之燎原。他人生剩下的十七年将在马鞍上度过，足迹遍布不列颠群岛和欧洲大陆，为他伟大的批判著作收集证据。尽管他全情投入，但在宗教方面并不偏执。他甘愿冒着生命危险去减轻教皇党人、伊斯兰教徒或印度教徒的痛苦，就像冒着生命危险去减轻加尔文教徒、浸礼会教徒或独立派教徒的痛苦一样。他常常冒着生命危险做事。霍华德的体魄从来不算健壮，计划和行程无情逼人，但他为了理想都忍受下来了。最终，这要了他的命。在俄国鞑靼传染病院旅行走访时，霍华德被感染，继而高烧不退，于1790年1月20日在黑海附近的切尔森病逝，并长眠于此。鉴于他经常游走在这样的环境中，竟然能活这么久，也算是令人吃惊。克制、清洁以及对上天的信任是他的保命神药，这似乎对他很有帮助，一直保护他到工作几近完成为止。”</p>
<p>全欧洲都称颂他是伟大的慈善家，他是第一位本人雕像被放进圣保罗大教堂的人。主任牧师米尔曼称，也许没有人能像约翰·霍华德那样减轻了如此多的人类苦难。但霍华德不会同意这种看法。他曾叫停了为他匆忙树立雕像的公开募捐，他认为这种做法可悲而不仁慈。他从来不为肖像而生，就连最后的愿望都是谦虚的:把我静静地埋在土里，在我的坟墓上放一个日晷，让我被遗忘。他谦逊而期待被遗忘。最终，他没有得到日晷，但也从未被遗忘。在为他竖立的众多雕像中，有两座异常引人注目:一座在贝德福德，那里是他伟大事业的开始；另一座在切尔森，他的生命在那里结束。但是，他最伟大的丰碑，也是他持久影响力的证明，却并不在伦敦的大教堂，而是在教堂最著名监狱的入口处。霍华德和伊丽莎白·弗赖的上半身像立在苦艾监狱的门楼之上。镶嵌在石料上的他们，比其他所有监狱改革者都要高出一截。</p>
<p>在霍华德的时代，中央政府既不管理监狱，也不管理惩教所。它们都由伦敦城不同部门和地方治安官员负责，而具体管理则更多出于商业目的。霍华德特别关注贝德福德郡监狱的收费制度。根据该制度，应刑满释放的囚犯只有在支付食宿费和其他账单后才会被释放。牧师劳埃德(Lloyd)每年因其牧师工作而获得二十英镑的报酬，医生盖兹比(Gadsby)因其在监狱和惩教所的工作而获得十二英镑的报酬，狱吏没有工资，完全靠向囚犯收取费用。每个债务人都要支付十七先令四便士的释放费，还要向狱吏额外支付两先令，那些没有担保人的囚犯和轻罪囚犯也会被收取同样的费用。即使是无罪释放的人也要在交钱后才能获得自由。这一切都稀松平常，开诚布公:板子上画了一张费用表，所有人都能注意到。霍华德向郡治安法官申请，要求给狱吏发工资以代替他们收取费用的行为。法官们非常赞同，但希望有先例可循。</p>
<p>霍华德想找出一个先例。他决定走访邻近各县的十六所监狱，看看贝德福德郡有多特别。这些监狱没什么不同，都不公正，藏着许多不幸的故事。"这是对进一步行动的鞭策。在随后的十七年里，霍华德对英伦三岛进行了三十八次旅行走访，对欧洲大陆进行了七次，这仅仅是第一次。他四处走访、回访了许多监狱，深人到监狱的最深处，审问关在里面的人，收集整理了大量关于监狱和监狱工作人员的事实和资料。</p>
<p>在每个监狱机构，他都记录了狱吏、牧师和医生的名字，以及这些人收取的费用；还有其他人收到的工资。工作人员的品格甚至比建筑物的状况更重要。在走访位于切斯特城堡的郡监狱时，他就指出重刑犯日间房不安全，城堡的墙体已经腐坏(在1775年发生了一次大越狱事件)。同时他也评论说，看守人小心谨慎，富有人情味，不应受到责罚。"</p>
<p><img src="2.32.4.webp" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>尽管他语气冷静，但还是说出了对所遇之事的反感。例如，在访问卡迪夫郡监狱时，他站在一个新近被腾空的地牢里，深感震惊。那名囚犯仅仅因为七英镑的债务，在那里待了十年，最后绝望而死。在伊利主教的监狱里，由于想确保安全没有漏洞，看守人对囚犯采取各种安全措施，手段残忍。他们被锁在地上，腿上套着沉重的铁条，脖子上套着带刺的铁圈。霍华德对此深感愤怒。还有一间牢房，他发现异常拥挤、肮脏不堪，里面的可怜虫更宁愿被绞死。他看得越多，工作范围就变得越大。他在两三个郡监狱里发现一些可怜人，长得就非常悲惨。他们来自布菜德维尔监狱，于是他把这些机构也囊括进了调查的范围。他做事有条不紊。他并不是心怀偏见的人，该赞美的地方也会赞美。在约克城堡辖区内，有一座“为债务人而建的高尚监狱，为本郡争得了荣誉”。他指出，这些房间通风良好，环境健康。这毫不意外，因为这座1705年建造的建筑是英格兰第一批专门设计的监狱之一，就像巴洛克式宫殿一样。”</p>
<p>他把发现的情况记录在案，旁边加上批注。他提出了许多合理的建议，特别是关于监狱人员配置的问题。为避免囚犯遭到剥削，他敦促各监狱都应该配一名领工资的看守人，因为如果工作尽忠职守，再怎么鼓励都不为过。同样，还应任命一位在专业上有声望的医生；任命一位基督牧师，他不应满足于主持公共仪式，而应与囚犯交谈，告诫挥霍的人，劝诫没有思想的人，安慰身患疾病的人。”为此，他每年应得到五十英镑的报酬。</p>
<p>他提出了如此彻底的方法，做出了极富洞见性的研究，得出的关于英国监狱悲惨状况的结论无可辩驳。在旅行走访中，霍华德寻找并发现了其他路径。苏格兰的监狱就很反常，只关押了很少的囚犯，这要归咎于监禁所带来的羞耻感，也得益于家庭教育所倡导的端正言行，以及快速的审判和处决。虽然债务人被赶进肮脏且令人反感的牢房，贫穷的罪犯被关在爱丁堡市政厅可怕的牢笼里，但监狱从不会给妇女上铁链，被判无罪的人也会立即从法庭上被释放，不用支付任何看守费用。”苏格兰模式所提供的并不是一个监狱的样本，而是给人们上了一课:少用监狱。</p>
<p>为了找到他心目中的理想监狱，霍华德必须要将目光投向更远的地方。荷兰赢得了他的钦佩。他详细记述了在荷兰的所见所闻。监狱安静而整洁，囚犯都没闲着，他们努力工作，秩序井然。男人在木材厂(即劳改厂，将木头锉成木屑作染料用)劳动，女人在纺纱厂干活。目的就是让他们勤奋工作，这样他们就会保持诚实的品格。道德和宗教教育是最重要的。每个惩教所都任命了牧师，他们不仅要进行公共礼拜，还要指导和教诲囚犯。阿姆斯特丹的拉斯维斯监狱建于1596年，在一座修道院的基础上改造而成，以帮助囚犯改过自新为目的。这里的刑期很长，条件简陋，铿木工作也很辛苦(包括粉碎巴西染料木原木，以生产染料粉)。在屹立不倒的大门上，刻着寓意深刻的铭文，大意是“野兽必须被人类驯服”。被人类驯服，被基督教改造。霍华德不舍得离开这个国家，这里为他所关注的重要主题提供了大量信息。他不知道最该欣赏哪一个?干净整洁的监狱，囚犯的勤奋和有规律的劳作，还是行政官和摄政官们展现出来的人文关怀和对此问题的重视？洁净显然是离虔诚信仰最近的那一个。</p>
<p>......</p>
<p>他的工作很快就传开了。1774年3月，在开始旅行走访后不久，下议院就传唤他，要求他对刑事问题提供专业意见，那时距离他第一次出版研究成果还有很久。他强调，...监狱不应该复制这个堕落的世界，而应该从更高的理想出发。监狱应该产生善，而不是恶。闲散、赌博、咒骂、酗酒、通奸等行为不应被容忍，更不应被鼓励，而应以实干、秩序和正直取而代之。监狱文化形成了无秩序的“自治”，一批又一批的囚犯靠着这种文化在社会中创造了自己的另一个社会，并找到了忍受甚至享受监禁的方法，让身体和道德污染比比皆是。施政者应该压制这种文化，并以外部管控取而代之。独处、沉默等政策应当强制实行，以有利于悔改。自我控制和自我尊重是要达到的目的。纯粹从实践的角度来看，严格的隔离政策可防止越狱，保护弱者不被剥削，并保证那些检举同伙者的人身安全，这些都是显而易见的好处。</p>
<p>尽管改革萌芽缓慢，但霍华德还是在肥沃的土壤上播下了他的种子，有越来越多的声音支持对监狱系统进行重大改革。......务实的霍华德列举了事实和数字，为日后政治行动提供了根本支撑，本顿维尔监狱也因此而动工建造。</p>
<p><img src="2.32.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>在他的努力下，两项法律立即制定完成:一项是取消出狱费，另一项是引人卫生措施以对抗“监狱热”。霍华德亲自确保这些措施得到执行，因为他自掏腰包印制了这些法律文本，并将其送至英格兰各郡的监狱。</p>
<p>他的影响远没有消失。他长期坚持的目标是建立一个全国性的监狱系统，定罪之人在晚上被关在单人牢房，保证他们的隐私和安全，白天一同干苦工，始终接受着虔诚的改造制度的影响。......伦敦地区建了两所国家监狱，男女各一所。狱吏有工资，看守人的工资与监狱劳动利润成正比。囚犯们将穿上囚服，通过良好举止和努力工作来获得减刑。霍华德是三个监工之一，任务是为第一所这样的监狱寻找一处合适的落脚地。但三人对此一直无法达成一致意见。两年后，无法妥协的霍华德辞职，重新开始了他的旅行走访。没有了他雷厉风行的支持，同时因为成本增加，以及流放工作的重启迫在眉睫，人们热情减退，工程停滞不前。</p>
<p>尽管在政府层面受挫，但监禁作为惩罚的观念得到了广泛接受，霍华德的刑罚思想也得到了广泛的渗透。但他对长期独立监禁所持的保留意见似乎并没有被大多数人采纳。社会坚信犯罪会传染，并希望找到灵丹妙药来解决问题，再加上基督教的热情等因素，英格兰对监狱建设和重建的需求增大，时间和金钱投人不断增加。1784年，议会明确授权法官拆除并重建郡监狱，并为此以财产税为担保发债借钱。当局禁止使用地牢，并实行分类管理。......</p>
<p>1775年，里士满公爵开始重建位于霍舍姆的苏塞克斯郡监狱。他听取了霍华德的建议并与之合作。霍舍姆监狱于1779年投人使用，目的是遏制和减轻社区监禁的不良影响，防止初犯再次犯罪。这里位置很好，并根据医生的建议处理好空气流通，以防止"监狱热”。债务人和重刑犯被分开关押，每个重刑犯都有一个单人牢房。人们既怕疾病传播，也怕恶习传染。这里不收费，狱吏有报酬，牧师也有。新的监狱制度令该地区犯罪率减少一半。这一新尝试与《监狱法案》无可争议地确立了独立监禁的做法，辅之以囚犯有序的劳动，同时进行宗教教育。...</p>
<p>开拓者不止里士满一人。1791年，乔治·阿尼色佛菜斯·保罗爵士(Sir George.Onesiphorus Paul)在重建格洛斯特监狱时采纳了霍华德的建议。该监狱以霍华德称赞过的根特监狱为蓝本，由霍华德的首选建筑师威廉·布莱克本(WilliamBlackburn)设计，他认为监狱的主要任务是规范囚犯的社会能力。他为利物浦(1786年)、曼彻斯特(1787年)和普雷斯顿(1788年)设计了诸多监狱，理念上将待审嫌疑犯与已定罪的犯人分开，将刑事犯与债务人分开，将男女分开，将成年男子与男孩分开，旨在防止污秽传播。他的规范化社会交往理念在格洛斯特监狱付诸实践，这在世界范围内是一次创举。这一理念后来颇具竞争力，倡导夜晚独立监禁，白天沉默工作。约翰·贝歇尔(JohnBecher)牧师同样推崇霍华德，也很积极。1808年，在他的动下，索斯韦尔惩教所也按类似思路建造。</p>
<p>在战争、高课税和国家危机时期，竟然有这么多钱投入到地方监狱改造中，确实挺让人吃惊。在不到十年的时间里，有四十二所监狱和惩教所经历了重建，其中许多都以霍华德命名，甚至有些监狱的门楼上还装饰着这位改革者的半身像，什鲁斯伯里监狱就是一个例子。这些监禁之所在地方上受到如此重视，表明公众——或至少是出钱最多、掌握财政大权的贵族——内心已经被深深地刺痛了。</p>
<p>然而，霍华德并不满意。他在其伟大著作的第二版中坦言，由于地方当局的关注，保护囚犯健康的法案付诸实施，监狱已不再是让刽子手都自愧不如的疫病栖身之所。同时，公众被自由和人道主义精神所熏陶，一直关注减轻囚犯痛苦的事业。所有一切都挺好，但进步精神似乎令人意外地停止了，几乎没有触及那个更重要的目标，即监狱的道德改革。维多利亚时代的法官马修·达文波特·希尔(MatthewDavenport Hill)对此表示认同。他认为，除了在清洁、通风、排水等符合公众仁慈认知方面发生的变化外，霍华德的其他种子都落在了荒石堆中。他痛心疾首地表示，哪怕只要用一丁点儿哲学思维考虑的问题都已不再被关注，这些问题必须被重新拾回。</p>`
  },
  {
    id: 11,
    title: '说说狱神庙',
    date: '2026-06-06',
    content: `<p>参观过内乡县衙、密县县衙的朋友会发现，古代的监狱设于州县衙署内（大多坐落于衙署的西南区）。而这两座县衙的监狱院落中，还有一个特殊的空间——狱神庙。</p>
<p>狱神庙是一个什么样的存在呢？</p>
<p>顾名思义，狱神庙是修建在监狱内、专门供奉狱神的祠庙，属于古代监狱的配套附属建筑。</p>
<p>狱神庙承担多重功能。对狱吏而言，祭拜狱神是祈求监区安稳，避免囚犯暴动、越狱等事端；对在押人员来说，狱神庙是他们的精神寄托：蒙冤者祈求沉冤得雪、早日获释；未决犯希望量刑宽宥，从轻发落，不受苛待；死囚临刑前，也会借祭拜求得内心安宁。同时古人认为监狱阴气重，狱神庙兼具镇煞辟邪的作用，以减少监内疫病与意外死亡。</p>
<p>狱神庙供奉的是何方神圣呢？并非所有狱神庙供奉的是同一个神祇，供奉比较多的有三位：虞舜的臣子皋陶、汉代的萧何、明代万历年间宅心仁厚的狱卒亚孻（nái，民间尊称其为亚爷）。其中供奉皋陶的狱神庙最为普遍。相传，他是上古舜帝的重臣，掌管刑狱，公正严明。被后世尊为司法公正的象征。</p>
<p>按说要祈求司法公正，理应在审案断狱的衙门供奉皋陶，但古代没有嫌疑人和已决犯分离关押的制度，没有看守所。已决犯未决犯统统关押于监狱（以外监、内监划分轻重管控层级）。而衙署另设有衙神庙，衙神庙多供奉萧何和曹参。与狱神庙功能互不重叠。萧萧何身为开国功臣，主持修订汉代核心法典《九章律》，早年还曾任沛县狱吏，这也是各地狱庙同样供奉他的原因。</p>
<p>第三位狱神亚孻的故事，记载于清代钮琇《觚剩・续编》：某年除夕，作为狱卒的亚孻心怀仁善，破例给狱中所关押的五十多名囚人放假，让他们回家与亲人团聚。约定节后按期返狱。节后所有囚犯悉数归来，无一缺席。“亚孻鼓掌大笑曰：「善哉！」遂趺坐而逝”（这个转折有点硬）。“狱众感德，浣濯其体而加漆焉。以其事言于县，县上巡按御史，请为县狱之神。”至于有多少狱神庙供奉亚孻，如今已无从考证。</p>
<p>最早关于狱神庙的文字记载，见于《后汉书·范滂传》：后牢修诬言钩党，滂坐系黄门北寺狱。狱吏谓曰：“凡坐系皆祭皋陶。” 滂曰：“皋陶，古之直臣。知滂无罪，将理之于帝；如其有罪，祭之何益！” 众人由此亦止。从这段话来看，东汉时期的监狱已有祭拜皋陶的习俗。</p>
<p>宋代方勺在《泊宅编》卷中记载：“今州、县狱皆立皋陶庙，以时祠之。……皋陶大理善用刑，故后享之。”如果此说可信，狱神庙在宋代就比较普及了。</p>
<p>到了明代，狱神庙还衍生出特殊用途：用于关押身份特殊的在押人员。这里的待遇远优于普通牢房。特殊在押人员包括：尚未定罪的官员、贵族，或是有一定身份地位、罪行较轻的人，也不免随之滋生出权力寻租的乱象。</p>
<p>狱神庙也出现在文学与戏曲作品中。元代关汉卿的杂剧《四春园》中，有“令史将这小厮枷锁开了，拿他去狱神庙里歇息”的台词。蒲松龄在《聊斋志异》中也写到狱神庙，如《胭脂》一篇中，蒙冤入狱的主角胭脂也曾在狱神庙虔诚祈愿，最终冤屈得雪。</p>
<p>《红楼梦》脂砚斋批语中几次提及神庙情节，表示《红楼梦》八十回后的佚稿涉及到“狱神庙”情节，庚辰本第20回批语：“茜雪至狱神庙，方呈正文”“与‘狱神庙慰宝玉’第五、六稿，被借阅者迷失”；庚辰本第26回批语：“‘狱神庙’回有茜雪、红玉一大回文字，惜迷失无稿”。这些批语表明，贾府被抄家后，宝玉、凤姐曾被关押在狱神庙，昔日的丫鬟茜雪、小红前往探望慰问。</p>
<p>京剧《苏三起解》中，苏三蒙冤羁押于洪洞县监狱，起解赴太原复审前，她特意请求解差崇公道稍等，“待我参拜了狱神再走”，并在狱神庙前唱道：“低头出了虎头牢，狱神庙前忙跪倒。望求爷爷多保佑，我三郎早日得荣耀。”</p>
<p>清末新政推行近代监狱改革，西方近代监狱制度进入中国，传统监狱体系逐渐被淘汰。旧式监狱及其附属的狱神庙大多被拆除或改建，逐渐退出历史舞台。</p>
<p>国内现存的狱神庙有：</p>
<p>1. 山西洪洞苏三监狱狱神庙：洪洞苏三监狱内，在虎头牢对面，墙内嵌一砂石雕刻的神龛，内供三尊砖刻小像。正中为狱神皋陶，两侧胁侍皂隶小鬼。该监狱始建于明洪武二年，1970年代被拆毁，但狱神庙的神龛、墙基等得以保留，1984年按明制原址修复。</p>
<p>2. 河南内乡县衙狱神庙：位于内乡县衙监狱区，主祀皋陶。</p>
<p>3. 山西榆次县衙狱神堂：位于榆次县衙监狱内，主祀亚孻并配衙役侍从，建筑为明清风格。</p>
<p>4. 密县县衙狱神庙：位于密县县衙内，始建于隋代，历代屡毁屡修，主体留存为明清形制，主祀皋陶。</p>
<p>5. 河北河间府署狱神庙：位于沧州河间府署监狱院内，始建于明代，清代多次修缮，主祀皋陶，现建筑为2013 年按明清形制复建而成。</p>
<p>6. 山东泰安狱神庙：依附于泰安府衙监狱，始建于宋代，明清时期多次重修，供奉皋陶，现存建筑依据清代风格于2000年后复建而成。</p>
<p>7. 河南开封府（府司西狱）狱神庙：位于开封府复建区的府司西狱内，主祀皋陶，再现宋代府狱场景。</p>
<p>8. 山西浑源州署狱神庙：大同浑源州署内，狱神庙面阔三间，主祀皋陶，配祀关帝、北岳神君。</p>
<p>9. 河南商丘永城夫子山狱神庙：位于永城夫子山景区内，主祀萧何，为景区复建建筑。</p>
<p>10. 景德镇市浮梁古县衙狱神庙，本体道光建，2007 年复建。主祀皋陶。</p>`
  },

    content: `<p>​电影《肖申克的救赎》中，安迪给狱友争取来一箱冰啤酒，瑞德感慨的说：“我们坐着喝酒，阳光洒过肩头，觉得自己是个自由人。”</p>

<p>这小酒，喝的可是自由。</p>
<p><img src="5.1.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>大概全世界的监狱都不允许犯人喝酒。倒是也有些例外，18世纪法国的贵族监狱会给被监禁者提供酒水。伏尔泰在巴士底狱住了11个月，他除了可以带着自己的仆人随侍左右，还能免费得到国王提供的优质葡萄酒。狄德罗在同是贵族监狱的文桑监狱坐牢时，每天也可以得到一瓶酒。希特勒在啤酒馆暴动失败后被关在德国兰茨贝格监狱，在那里他两个月喝了124听啤酒。</p>
<p><img src="5.1.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>（希特勒在兰茨贝格监狱）</p>
<p>虽然管理不规范的监狱犯人也能想办法带酒进去。但大部分情况下，还是只能靠犯人们战天斗地各显神通。 世界各地监狱私酿的新闻屡见不鲜不胜枚举，比如2015年澳大利亚新南威尔士的监狱就一共查出了8604升烈酒。</p>
<p><img src="5.1.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>英语中专门有一个词表示监狱私酿，叫“Pruno”。 显然，它已是是监狱文化以及酒文化的一部分，Pruno也成了自酿酒的一支，这个门类下也成长起了不少品牌，2004年美国自酿协会的酿酒大赛中就加了Pruno专场。</p>
<p><img src="5.1.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>说回正宗监狱私酿，原料自然不拘一格，土豆、苹果、橙子、糖、番茄酱、牛奶等等，估计能到手的食物都是宝贝，酵母则多用面包屑，调和好装在塑料袋中让其发酵。装好的袋子要藏起来，因例行检查囚室多不触及马桶的水箱，故袋子常常藏在马桶的水箱里，所以，不少地方也将这种酒称为马桶酒（Toilet Wine）。</p>
<p><img src="5.1.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>具体的酿造方法我就不扒了，文末附一首诗：《监狱私酿配方》，作者是圣昆丁监狱的死刑犯Jarvis Jay，他把酿酒过程捋了一遍。</p>
<p>怎么说呢，酿的好，可能就是自由的味道。失手的话，你想想，在监狱里喝自己亲手酿下的苦酒，什么滋味？ 意大利的托斯卡纳地理和自然优势全球闻名，成片的葡萄藤在托斯卡纳阳光下等着被加工成葡萄酒。同一片天空下，托斯卡纳还有个监狱小岛：戈尔格纳。那里不仅有成片的葡萄藤，还有几十名重刑犯。上世纪八九十年代，狱方指挥犯人开辟了一片1公顷大小的葡萄园，但由于疏于打理，这片园子逐渐变成了杂草丛生的荒地。2008年，一名有栽培经验的囚犯设法让这片园子重见天日，拯救了那些毫无生机的葡萄藤。2010年，另一名罪犯用这些果实酿造了葡萄酒。虽然这些酒的口感实在不敢恭维，但监狱总管却萌生了一个念头：让葡萄酒专家来帮忙指导犯人酿造葡萄酒。2012年，监狱当局与意大利著名葡萄酒家族花思蝶（marchesidi frescobaldi）接洽，请花思蝶家族亲自指导犯人，从种植、采摘到酿造成品。如今，犯人们把这片葡萄园打理得像模你像样。健康的葡萄藤扎根在富含铁元素的火山岩土里，享受着海上微风的吹拂，长势颇为喜人。耕耘与收获的同时，犯人还可以获得同等的薪水报酬。弗朗西斯教皇、意大利总统都品尝过这所监狱酿出来的酒，“浓烈而有惊人的品质”。</p>
<p><img src="5.1.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>德国塔尔海姆（talheim）市的施腾塔斯监狱（staatsdomane hohrainhof）也让重刑犯酿造葡萄酒，一位品酒师品尝之后赞不绝口，知悉该酒售价很低时，她忍不住说：“这简直是犯罪。”</p>
<p>国内也曾曝出过这种喜闻乐见的新闻：阆中看守所为弥补资金不足，在看守所办起酿酒作坊。</p>
<p>还有一些并没有犯人参与酿造，走“监狱”路线的精酿啤酒。</p>
<p><img src="5.1.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>ALCAPONE 艾尔·卡彭，“疤面煞星”，美国禁酒令时期最大的私酒制售商人，芝加哥黑手党党魁，罪案累累，曾被关押在恶魔岛等监狱。这家啤酒公司的名字叫私酿者（Bootlagger），延续了禁酒令时期走私酒贩的说法。</p>
<p><img src="5.1.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>已经开辟为观光点的恶魔岛（阿尔卡特兹）监狱的礼品店就有卡尔卡特兹啤酒出售。</p>
<p><img src="5.1.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>日本北海道网走监狱啤酒</p>
<p><img src="5.1.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.1.12.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>Jailhouse brewing 2009年成立于美国佐治亚州的一家精酿啤酒制造厂，厂房原来就是Hampton监狱。</p>
<p><img src="5.1.13.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>美国俄克拉荷马州PrairieArtisan Ales公司的生产一款监狱牛仔啤酒，当地的监狱牛仔比赛曾经相当火爆。</p>
<p><img src="5.1.14.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>越狱   加拿大精酿啤酒</p>
<p><img src="5.1.15.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>断头台     比利时老牌酒厂粉象的一款产品</p>
<p><img src="5.1.16.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>囚犯   美国葡萄酒</p>
<p><img src="5.1.17.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.1.18.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>19宗罪   澳大利亚酒</p>
<p><img src="5.1.19.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>Crude Oil 也是监狱私酿的一种</p>
<p>《肖申克的救赎》中犯人们在屋顶喝啤酒的场景。</p>
<p>下附美国加州圣昆汀监狱死刑犯Jarvis Jay 写于1991年的诗：监狱酿酒配方。本诗获得美国笔会91-92年诗歌类三等奖。</p>

    date: '2026-06-01',
    content: `<p><img src="5.5.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>​ 加州福尔松监狱博物馆有一座1.8米高，名为幸运之轮的摩天轮。这座神奇的摩天轮全部由牙签胶合而成，上面32个位置，坐了两个小人。而且还装了电动马达，各个部位运转如仪，每个细节都处理的特别精致。</p>
<p><img src="5.5.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.5.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.5.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.5.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>牙签摩天轮的制作者叫布莱恩·伯克（Billy Burke），是福尔松监狱的一名囚犯。</p>
<p><img src="5.5.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>布莱恩·伯克，19岁（1928年）入狱。起先他琢磨怎么越狱，挖墙、钻地道......他甚至搞了个热气球准备飞越。最后......他还真出去了。伯克做了个假人放在床上应付了查房，他自己藏在监狱太平间里，夜深人静后，他爬过了草地和守望塔，跳进监狱旁的河沟里溜之大吉。</p>
<p>但是重获自由的他没有珍惜自由，重操旧业，两个月后，作死的他回到了监狱。因为越狱他被关6个月禁闭。</p>
<p><img src="5.5.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>（记者采访布莱恩·伯克越狱经历之后写的一本书《逃离福尔松监狱》）</p>
<p>关在禁闭室里的伯克并没有放弃越狱，但是在狱方的“亲切照看”下他再也没有成功过，几次禁闭后，伯克决定安住地狱，立地成佛。</p>
<p>安下心之后，闲不住的伯克开始了创作。“不做无聊之事，何遣有涯之生。”他根据儿时的记忆，用牙签和小刀开始了浩瀚的牙签工程。</p>
<p>由于伯克对于牙签的需求量太大，加上越狱的前科，监狱甚至一度把牙签列为违禁品。不过，监狱长很看好他，这一切的禁令对他毫无影响。好心的监狱长时不时的带一堆牙签给伯克，还让警卫离他远点，给他一个安静的空间创作。伯克还被特批可以随身带把小刀。五年之后，大功告成。伯克提刀而立，为之四顾，为之踌躇满志。摩天轮上还有一位心爱的女士陪他一起转转转。</p>
<p><img src="5.5.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1959年，伯克刑满释放。出狱后他意犹未尽，继续建造牙签王国，规模甚至大过监狱里那一个。</p>
<p><img src="5.5.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.5.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.5.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.5.12.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.5.13.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>这些牙签艺术品也经常展出，但伯克不收门票。万不得已的时候卖出过两个作品（美国Musee Mecanique博物馆收藏了一件），心疼的他赶紧做出新的补上。</p>
<p>2001年91岁的布莱恩·伯克走完了他的一生，但他的牙签们还在继续吸引着大众。</p>
<p><img src="5.5.14.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>回到第二故乡</p>
<p><img src="5.5.15.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="5.5.16.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>84岁的伯克与他的牙签摩天轮。</p>`
  },

    title: 'B.B.King',
    date: '2026-06-01',
    content: `<p>布鲁斯之王B.B.King也是一位关注监狱的音乐家，他一生在监狱等刑事机构演出70多场。</p>
<p>B.B.KING的监狱演出缘于WinstonMoore。Moore是美国第一位黑人典狱长，同时是一位心理学家。担任芝加哥cook县立监狱典狱长之后，Winston Moore列了一个拟邀请歌手的名单，他去B.B.King演出的酒吧邀请他，“你说个时间吧。” King很爽快的答应了他。于是1970年，B.B.King在cook县立监狱做了一场免费的现场演出。那场演出的现场CD“Live in Cook County Jail”成为B.B.King最畅销的专辑之一，连续三周高居灵歌榜单榜首。</p>
<p>随后（1971年），B.B.King与一位律师F. Lee Bailey共同发起成立了一个关注监狱改革的NGO犯人改造和娱乐发展基金会“Foundation for theAdvancement of Inmate Rehabilitation and Recreation”。旨在推动监狱条件的改善、囚犯的教育和培训以及将更多的音乐和艺术引入监狱。为了表彰他的贡献，1972年联邦监狱局授予他人道主义奖。</p>
<p>1972 B.B.King邀请Joan Baez 姐妹以及少女唱团The Voices Of East Harlem去Sing sing监狱演出。</p>
<p>1975年他去各监狱演了近30场。 1981年，B.B.King在密歇根州州立监狱为3000多名犯人演出，这里号称是世界上最大的监狱。 1991年他的《圣昆丁现场音乐会》获格莱美最佳布鲁斯专辑奖。</p>
<p>（九十年代前后，King的女儿也曾两度入狱。）</p>

    id: 16,
    title: '20首与监狱相关的歌',
    date: '2026-06-01',
    content: `<p>​1.Jailhouse Rock</p>
<p><img src="6.3.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1957年米高梅出品了一部歌舞片《监狱摇滚》，由猫王出演，大获成功。《Jailhouse rock》为该片同名主打歌，甫一面世便成为最红的打榜歌，并成为猫王的代表作之一，披头士、皇后等乐队都翻唱过。歌里唱的典狱长和犯人欢聚一堂开趴体，大家互相关怀，相亲相爱。好一似进了加州旅馆。欢乐的很。</p>
<p>这段舞蹈段落被称为“猫王最伟大的银幕瞬间”。</p>
<p>2.San Quentin</p>
<p>说到趴体，之前写过jonnhy cash特别热衷于去监狱跟犯人趴体，1969年他去圣昆汀监狱演出他就唱了这么一首歌。</p>
<p>开篇就是“圣昆汀啊你简直就是地狱”。然后“我恨透你了...希望你朽烂、在地狱里燃烧。希望我能见证你垮掉，希望人们忘了你曾经存在，希望你世界对你的所作所为感到后悔。” San Quentin, you've been livin' hell to me......San Quentin, I hate every inch of you.......San Quentin, may you rot and burn in hell./May your walls fall and may I live to tell./May all the world forget you ever stood./And may all the world regret you did no good. 典狱长和看守都在现场，犯人听的忍不住阵阵鼓掌尖叫。</p>
<p>3.Greystone Chapel</p>
<p>1968年卡什去福尔松监狱（Folsom）监狱演出。前一晚，监狱教堂的牧师给了卡什这首歌，词曲作者是正在服刑的犯人Glen Sherley，Sherley对此并不知情，当舞台上的卡什说，接下来我要唱一首在场的一位兄弟写的歌，他叫Glen Sherley，可想这哥们当时飞了起来，他激动的到前面跟卡什握手，卡什说希望我能演绎好你的歌，我会全力以赴的。</p>
<p>4.Folsom Blues</p>
<p>这是卡什第一首监狱主题的歌，写于1953年他在西德作为空军服役期间。20首歌卡什就占了三首，着实有点多，但其实单卡什关于监狱的歌我就想推荐20首，如A Boy Named Sue、Cocaine Blues 、Joe Bean等等。他实在是能唱到犯人心里。不玩荷尔蒙不玩忧郁伤感，也不作是非判断，像多年不见的老朋友促膝聊天，互道往事，插科打诨、轻松随意。对人生遭际的无奈满是同情。稳稳的坐到本主题歌曲的头把交椅。</p>
<p>5.Old Alabama</p>
<p>美国的劳动号子，大部分是由非裔美国黑人唱的，他们在南方的种植园、铁路等地方干活，备受奴役。这个录音是艾伦·洛马克斯在路易斯安那州的监狱种植园录的犯人原声。里面的节拍是砍树的声音，汤姆·汉克斯演的电影《绿里奇迹》里用过这一段。 这种音乐错落而有层次，歌词简洁质朴。我之前把它和诗经的“坎坎伐檀”做了一个简单的呼应。 号子保证了大家在一个节奏上干活，能避免有人偷懒还有安全上的好处。后来修铁路的时候工地上就雇有专门的领唱，不需要他干别的工作。从录音能听出来比一般的工人声音温柔很多。</p>
<p>6.No More My Lawrd</p>
<p>这首歌最初也是劳动号子，但被不断翻唱，这里选了一个当代法国爵士歌手波尼法西的版本。她2014年出了一张全是翻唱劳工号子的专辑。</p>
<p>7.Chain Gang 黑人福音歌手山姆·库克坐火车回家的时候看到一队队被锁在一起的黑人劳工在铁路上唱着劳动号子干活，他很受触动，写了这首歌。</p>
<p>8.Work Song</p>
<p>也是劳动号子主题</p>
<p>9.Midnight Special</p>
<p>这首歌的作者铅肚皮是一位黑人囚犯，1933年被洛马克斯父子在路易斯安那的糖地监狱发现，后来一直扶持他，做了世界级的明星。那首《Where Did U Sleep Last Night》便是由他原创。 这首歌叫《午夜列车》，糖地监狱挨着铁路，从囚室狭小的窗子能看到火车经过。久了，该监狱就流传这么个说法：如果火车车灯照到谁的床头，就喻示着他的家人要来看他了。于是看火车成了犯人为数不多的消遣，调剂单调的生活。铅肚皮据此写下这首歌。</p>
<p>10.立场记</p>
<p>这首歌听起来是跟监狱没有一点关系。我问了一下在里面呆过的朋友，他们说这首歌在监狱传唱度极高，也许他们很少人听过杨一的版本，完全出于对此类酸曲的热爱。 ​11.Fish in the Jailhouse</p>
<p>老汤这歌唱的什么我也拿不准，不过好像也可以意会一点。</p>
<p>12.George Jackson</p>
<p>乔治·杰克逊是一位激进的黑人民权活动家，参加黑豹党什么的，1971年在圣昆汀监狱试图越狱被击毙了。他的死间接引发了阿提卡监狱的暴动。那时候种族歧视还很严重，乔治·杰克逊的死被很多人认为是受了诬陷，迪伦愤怒的唱到：有时候我觉得整个世界就是一个监狱，一些人是犯人，其余的是看守。“Sometimes I think this whole world/Is one big prison yard./Some of us are prisoners/The rest of us are guards/Lord, Lord/They cut George Jackson down/Lord, Lord/They laid him in the ground.” 监狱方面的歌迪伦也没少写，比如“hurrican”、"the aulttriangle"、"I shall be released"等等。</p>
<p>13.Prison Trilogy</p>
<p>与迪伦变换风格不同，琼·贝兹一直特别关注时事和社会问题，一副温柔的嗓子充满力量。</p>
<p>14.Jail Guitar Doors</p>
<p>The Clash代表作之一，The Clash的吉他手Billy Bragg也很关注社会问题，他成立了一个音乐介入监狱的机构“Jail Guitar Doors”，给监狱募捐乐器，并教犯人学音乐写歌。2009年MC5的吉他手Wayne Kramer把这个活动带到了美国。</p>
<p>15.The Mercy Seat</p>
<p>说的是一个即将坐电椅被执行死刑的犯人，歌里有不少宗教的语言表述，The Mercy Seat也指即将去亲近的上帝的宝座。Nick Cave沉郁的嗓子像杀手一样迷人。</p>
<p>16.Please,Don't Kill My Child</p>
<p>这首歌来自宗巴监狱项目的专辑《I Have No Everything Here》（在这里我一无所有），该专辑由几十位非洲东南部的贫穷国家——马拉维最大的监狱里的囚犯演唱。获2016年的格莱美“世界音乐”奖项的提名。虽然听不懂歌词，但是他们简单的旋律、朴素的声音依旧非常动人。2016年9月他们出了第二张专辑《我不会停止歌唱》。</p>
<p>17.Sing Me Back Home</p>
<p>这首歌的原唱是梅尔·哈格德，卡什去圣昆汀演出的时候哈格德正在里面服刑，很受卡什感召，他后来也进了摇滚名人堂。哈格德有一张名为“prison”的创作专辑。这首说的是一个狱友，因越狱导致一名看守死亡要被处决。临死之前，他请求再给朋友弹唱一曲，唱了首关于回家的歌。</p>
<p>18.Prison Grove</p>
<p>19.托锁</p>
<p>基本属实</p>
<p>20.充满希望</p>
<p>末了，借监狱风云励志一把。</p>`
  },

    id: 17,
    title: 'jail time records',
    date: '2026-06-06',
    content: `<p><img src="6.9.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="6.9.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>Jail Time Records是由曾被关押在喀麦隆杜阿拉中央监狱的歌手、制作人和电影制作人共同创办的非营利性音乐厂牌，于2018年启动。2022年11月，Jail Time Records推出了他们的首张合辑《Jail Time，Vol.1》，这张专辑揉杂了痛苦、爱情、内疚、希望、抑郁、对社会和政治问题的看法和感受，展现出了一个团结的社群，传递了音乐带给他们的慰藉和力量。</p>
<p><img src="6.9.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>该厂牌致力于扩展到非洲和世界上其他的监狱，希望通过音乐改变人们对监狱生活的看法，以及帮助囚犯们在出狱之后更好地融入社会。</p>
<p><img src="6.9.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="6.9.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="6.9.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="6.9.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>2017—2018年间，艺术家Dione Roach以意大利非政府组织COE（东方教育中心）义工的身份在喀麦隆做志愿者，得以进入当地最大监狱杜阿拉中央监狱（被称为喀麦隆条件最恶劣的监狱。目前关押了约4700人，是其容量的四倍。）内举办绘画工作坊。随后，她还开设了舞蹈和音乐课，通过这些活动，她结识了许多才华横溢的被监禁音乐家和说唱歌手。</p>
<p><img src="6.9.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="6.9.9.jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>2018年7月，Dione Roach启动了一个音乐项目，为说唱团体La meute des pensers制作了一张专辑，并成功地说服COE出资在监狱内建造了一个录音室，以支持囚犯重新融入社会。艺术家们积极性很高，录音室于2018年10月投入运营。11月，音乐制作人Vidou H成为该项目的联合创始人，成为第一位负责工作室的被监禁制作人。随后，他们获得授权在监狱内拍摄MV，第一个于2019年1月发布。Vidou H获释后，工作室由被监禁的艺术家Stone Larabik接手负责。四五年间，数百名艺术家进入录音室，录制了近500首歌曲，涵盖了嘻哈、R&B、非洲传统音乐和福音音乐等众多音乐流派。</p>
<p><img src="6.9.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="6.9.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>如今，该厂牌已经发展为一个多媒体唱片公司，为那些目前正在接受监禁或之前接受过监禁的艺术家提供一个强有力的平台。2021年12月，Jail Time Records在监狱外成立了一个新的录音室。新工作室对于前被定罪的艺术家重新融入社区起到很大的作用。他们得以继续发挥自己的音乐天赋，极大的降低了再次犯罪的可能。2023年7月，Jail Time Records在西非国家布基纳法索瓦的加杜古监狱内开设了一个新的录音室。</p>

<p>Dione Roach，1989年出生于意大利。2012年毕业于伦敦UEL美术学院。她是一位多学科艺术家，从事摄影、视频和绘画以及社区艺术项目。2018年以来，Dione Roach常驻喀麦隆，在那里创立了Jail Time Records。同时，Roach还用相机记录了被监禁的人和他们的生活。她的摄影在纪实和实验之间切换。Dione Roach的摄影作品：</p>

<p>1923年，戴望舒考入上海大学文学系，师从田汉。1927年写出《雨巷》，1929年，出版了第一本诗集《我的记忆》。1932年，任《现代》编辑；11月初，赴法国留学，先后入读巴黎大学、里昂中法大学。1935年春，被里昂中法大学开除回国，1936年10月戴望舒与卞之琳、孙大雨等人创办了《新诗》，抗战爆发后，戴望舒转至香港主编《大公报》文艺副刊，创办《耕耘》杂志。1938年3月，一起发起成立中华全国文艺界抗敌协会；5月，抵达香港；8月，主编《星岛日报·星岛》副刊。</p>
<p>1939年3月，“文协”香港分会成立，为适应环境，改称为“中华全国文艺界协会留港通讯处”，戴望舒当选为首届干事，同时兼任研究部和西洋文学组负责人，《文协》周刊编辑委员；7月，和艾青主编《顶点》；10月，参与“ 文协” 香港分会、中国文化协会、中华漫画界协会香港分会、中国青年新闻记者学会香港分会联合举办的“ 鲁迅逝世三周年纪念会” 的策划和筹备工作。</p>

    title: '埃贡·席勒的画与日记',
    date: '2026-06-01',
    content: `<p><img src="8.4.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>​作为囚徒的自画像</p>
<p>1912年春天，席勒（Egon Schiele），因勾引未成年少女而被逮捕。警方前往工作坊逮捕席勒的同时，也扣押了一百多张被认为是色情物品的画作。席勒在开审之前被收押。开庭审理时，席勒诱拐的罪名被判不成立，但由于在幼童可接触的公共场合展示色情图象，席勒被判有罪。在被收押21了天后，席勒被判入狱3天。在狱中席勒绘制了12幅画，还写了一些日记，描述被关在监狱牢房中的不适与不快。</p>
<p><img src="8.4.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1912年4月16日</p>
<p>终于！终于！终于！终于有了缓解痛苦的东西！纸、铅笔、画笔、绘画和写作用的颜料。在这里最大的折磨就是我不得不像畜生一样度过的那些折磨人的、野蛮的、令人困惑的、粗鲁的、穿着制服的、一成不变的、单调的灰色时间。</p>
<p>这种监禁的时光会很快地把那些精神上软弱的人逼疯；很快地我也终将走向疯狂，变得麻木，日复一日地这样持续下去。因此，为了不真地走向疯狂——我感到被从我的土壤中连根拔起了——我用我颤抖的手指蘸着苦涩的唾液去绘画，用石膏灰泥中的污渍在牢房中的墙上绘制风景和人头像。然后我看着它们一点一点地风干，消退并最终消失在砖墙的深处，就像是被一双隐形的有强大魔力的手擦掉了。</p>
<p>现在，幸运的是，我再一次有了绘画和写作用的材料；就连“危险的”削铅笔用的折叠小刀都还给了我。我可以忙碌起来了，因此我将会忍受住那些本是不可忍受的。我曾经低声下气，低三下四地请求、恳求这个机会，如果没有别的办法的话，我可能还会抽泣哭闹。啊，艺术！还有什么是为了你我不敢去做的！</p>
<p><img src="8.4.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1912年4月17日</p>
<p>十三，十三，十三——十三次4月13日！我从来没有迷信地并且恐惧地去想过十三这个数字，结果现在这个月的十三号变成了我的灾难。1912年4月13日，我被逮捕，并且在新伦巴赫区的法庭上被戴上了镣铐。</p>
<p>为什么？为什么？为什么？</p>
<p>我不知道。没人为我的问题给出回应。</p>
<p>还没有有关我被捕的声音传到维也纳。还没有人知道我已经被拘捕并且仿佛消失在了一扇活板门之中。即便这个消息被他们知道了，会有人为我强烈抗议吗？会有人想要帮我吗？G.K.和A.R.。也许吧。其他人也许会悄悄地滑向怯懦，还有T.F.，会显露出他那张虚伪狡诈的冷漠的脸和一眨不眨的双眼[1]。他会耸一耸肩然后想要从挡住他去路的人面前溜走。</p>
<p>地狱！这里简直就是地狱，一个卑鄙的、粗俗的、肮脏的、悲惨的、可耻的地狱，我突然被意想不到地扔了进来。</p>
<p>尘土、蜘蛛网、咳嗽出的唾沫、汗渍，还有我的泪水洒在了从墙上剥落的灰泥碎屑上。床铺贴墙位置的污渍是最厚的，粉刷的石灰都已经被蹭掉了。砖墙好像被抛过光一样，似乎占了血迹一样，光滑的表面散发出黯淡油腻的光亮。</p>
<p>我现在知道地牢是什么样子了——这儿看起来就跟地牢一样。如果仔细观察那些厚重粗糙的沉重牢门，上面那些巨大牢固的门锁绝不会被肩撞或者脚踢损坏——锁眼带有遮挡；粗制滥造的床铺或者长凳被笨拙简陋地堆放在一起，那些粗糙、凹凸不平的毯子（大概马背盖上这种东西都会被硌得难以忍受）散发出奇怪的碳酸的或者来苏尔消毒剂的臭味儿，还有人的汗臭味儿、发霉的潮湿味道、畜生皮毛的味道，当你仔细观察了所有这些，你就体验到了旧时代的那种地牢、古老堡垒或者市政大厅的恐怖墓穴——囚徒们被扔进去并在那里慢慢腐烂。</p>
<p>只有在床头上方的那个电铃按钮不属于地牢，它是今天的，是现代的。它提醒我，这一切不是在做梦，也不是一些幻觉。不，我不是在做梦，我醒着，体验着这一切——除非活着就只是一场梦，在这梦中有着其他的噩梦。</p>
<p><img src="8.4.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1912年4月18日</p>
<p>我现在只能生活在自己的排泄物中，呼吸我自己散发出的有毒的粘稠烟雾，不能刮脸，甚至不能好好地洗洗我的脸。就算是在蹲监狱，但我也还是个人啊！就没人想到这一点吗？</p>
<p>挂着狱门钥匙的看守叮当作响的走过来了，在牢房里放了水桶、扫帚和墩布，命令我擦洗地板。这合法吗？卑鄙的要求！然而我对此还是感到高兴；能够有点儿事可忙已经是上帝保佑了。我用尽我全部的力气去擦洗地板，冲刷，再擦拭干净。之后很久的时间里我的膝盖、脊椎和胳膊都在疼，我的手指红肿，指甲也磨破了。我几乎对我的劳动成果感到骄傲了，我等到看守回来，觉得他为此会表扬我。他回来了，看了看地板，往地上吐了口水，然后冲我咆哮到：“你管这个叫擦地板吗？猪跟这儿打了几个滚儿吗？马上再擦一遍，我警告你，这次好好干！”我把水桶拖过来，又跪下去，反复地擦洗。</p>
<p>人们怎么能以侮辱别人取乐呢（寻欢作乐！不道德的灰光之源！）这种邪恶的欲望从何而来？</p>
<p>这种卑劣真让人不敢相信！毕竟，我还没有被最终宣判呢！他们为什么想要这样惩罚我？</p>
<p>这儿还没有人知道我是清白的还是有罪——如果我真是清白的，他们凭什么这么恶劣地对待我？他们对看守所的所有犯人都是这样的吗？要是有一天能够没理由地把这些法律代表都关起来就好了，就跟我关在一起，这样这些自私轻率的法律制订者就可以亲身（显然他们根本就没有灵魂，有也是发育不良的）感受一下儿并且理解被囚禁起来意味着什么了。</p>
<p><img src="8.4.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1912年4月19日</p>
<p>今天我画了我牢房里的小床，在那些毯子组成的脏灰色当中有一个鲜艳的桔子，那是V带给我的[2]，这个房间里唯一的光亮。这个鲜艳的小东西带给我一种无法形容的好感觉。</p>
<p><img src="8.4.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>热衷于画自画像的席勒 1912年4月20日</p>
<p>给牢房前面的走廊画了素描。画上了过道角落里的垃圾还有犯人用来清洁他们牢房的用具。这让我平静下来了，我感觉自己得到了净化，而不是在受惩罚。</p>
<p><img src="8.4.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1912年4月21日</p>
<p>自从我可以开始工作之后，监禁的日子慢慢变得可以忍受了。我给那把简陋的椅子和水壶画了些素描，简单地上了些颜色。我还画了我的两块彩色手帕与椅子的组合。</p>
<p><img src="8.4.8.jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1912年4月22日</p>
<p>原初的永恒便是上帝。人们叫他佛祖、琐罗亚斯德、欧西里斯、宙斯，或者基督，在上帝之后最似神的便是艺术——它像上帝一般不受时间的影响。艺术不可能是现代的，艺术是原初的永恒。</p>
<p><img src="8.4.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1912年4月23日</p>
<p>请俯望这里，无处不在的万能的圣父，以太阳为眼的伟大创世者，请考虑一下您是否真的容忍这些——这些可耻的令人蒙羞的折磨竟然是为我而准备的。您洞察一切的目光显露了我最隐秘的心思，您了解我，我在您面前是赤裸的、毫无保留地为您所审视的您的造物。因此当我步履踉跄，必是您的意志令我蹒跚在通向您的小径上。但为了您的意愿真要我痛苦如斯吗？为了您的意愿真的要我监禁于此？也许，只是一瞬，在您繁星环绕的大地闪耀出的银色光芒前，在您被金色融化的太阳那火光四射的巨轮前，您闭上了您仁慈的、如大海天空一般碧蓝的眼睛，因而忘却了我？可能吧。正因如此我呼唤您，借与我您的耳吧，请倾听我的声音。</p>
<p><img src="8.4.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1912年4月24日</p>
<p>离我不是很远的地方，一位法官——或者别的什么人——就坐在治安法官办公室里，如果我喊叫起来的话他就会听到我的声音。那个人，一定相信他自己是个特别的人物，受过教育，住在城市里，参观过教堂、博物馆、剧院、音乐会，甚至很可能还去过艺术展览；就是这么一个可以算是有教养的阶层的人，肯定读过或者至少是听说过这位不幸艺术家的生活；这个人竟然可以容许我被关在这间牢笼里！一个又一个小时，一天又一天，他竟然就任由我被关在这儿，毫不关心。这就不困扰他吗？他在想什么？这个男人到底还有没有道德良心？</p>
<p>也许他却有担忧，也许他漠不关心，也许他根本就把我给忘了！也许我必须在这儿待上好几个月；是的，也许我会染上什么病然后在我的清白得以沉冤昭雪之前死在这儿。</p>
<p>看不到任何得到帮助的可能，联系不上任何的朋友，我不能通知任何人。Ｋ正在在阿特湖，Ｒ正在加尔达湖——谁知道其他的人在哪儿？但就算他们都在维也纳，也没人能立刻的帮我从这里出去，因为我被禁止给任何人写信。</p>
<p>昨天：哭泣——软弱的、怯懦的痛哭；叫喊——激烈的、急促的、哀求的；呻吟着啜泣——绝望的、可怕的绝望。终于开始麻木不仁地伸展我冰凉的四肢，令人联想到死亡的那种恐惧，浑身被颤抖的汗水浸湿。可是，为了我的艺术和我爱的人们，我愿意忍受到最后。</p>
<p><img src="8.4.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>奥地利席勒博物馆复原的囚室</p>
<p>[1]G.K.指古斯塔夫.克林姆特，A.R.指阿图尔.罗斯勒尔，T.F.指安通.“托尼”法伊斯陶尔。 [2]V指席勒的模特情人威利.诺依齐。</p>
<p><img src="8.4.12.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>照片与自画像</p>
<p>埃贡·席勒（1890年—1918年）奥地利绘画巨子，维也纳分离派重要代表，是20世纪初期一位重要的表现主义画家。</p>
<p>1890年，席勒生于奥地利图伦。他的父亲，阿道夫·席勒是任职于奥地利国家铁路局的火车站站长。</p>
<p>1905年，席勒15岁时，父亲死于梅毒。</p>
<p>1906年，16岁的席勒在维也纳分离派领导人、装饰画家古斯塔夫·克里姆特指导下学习，在线条和构图上得益于他的优雅的装饰手法。后来他结识了科柯施卡。他的画最初受学院派和印象派影响，打下了造型基础。受克里姆特和科柯施卡之后，他的作品具有明显的装饰风格。</p>
<p>1908年，18岁的席勒在克洛斯特新堡举办了第一场展览。</p>
<p>1911年，席勒与17岁的维拉妮·维拉尼·诺依齐相识并同居，维拉妮也是席勒不少知名画作的模特。</p>
<p>1915年，席勒与爱迪丝订婚。</p>
<p>1915年，因为第一次世界大战，席勒被陆军征召。他起先于布拉格服役。在军中，席勒的长官很尊敬他的艺术才能，因此他从未被派到前线战斗，在监狱担任守卫，看管俄国的战犯。1917年，席勒回到维也纳，得以专心从事绘画工作。在此期间他产出大量且成熟的作品，并在1918年，受邀参加维也纳分离派在维也纳的第49届展览。席勒共有50件作品在主厅展出，他还以《最后的晚餐》为灵感，设计了展览的海报，并把自己的肖像放在中央，取代耶稣的位置。</p>
<p>1918年10月31日，天妒英才，席勒因流感病逝，年仅28岁。留下三百多幅油画，几百张素描。</p>
<p><img src="8.4.13.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>自画像</p>`
  },

    content: `<p><img src="8.7.1.jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>大卫·阿尔法罗·西凯罗斯（David Alfaro Siqueiros，1896－1974），墨西哥画家。与迭戈·里韦拉、奥罗斯科一同发起了墨西哥壁画运动，同称墨西哥壁画三杰。作品轮廓清晰，色彩鲜明，富有趣味和情感。代表作有幅面4600平方米的壁画《人类的进军》，以及《新MZ》、《第三世界》等。</p>
<p><img src="8.7.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.7.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>（人类的进军  1971）</p>
<p>西凯罗斯同时也是一个斯大林主义者，墨西哥GCD党员。作为墨西哥GCD领导人之一，西凯罗斯一生7次入狱，多次流亡国外。所作壁画也常表现社会革命与斗争的主题。1940年5月西凯罗斯策划了一起刺杀托洛茨基的行动，但未成功。</p>
<p><img src="8.7.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1910年，墨西哥民族MZ革命爆发，14岁的西凯罗斯参加了革命军。1919～1921年他远赴法国学画，在巴黎接触到当代艺术，还遇到了另一位墨西哥画家迭戈·里维拉，并与他一起去意大利旅行，研究文艺复兴时期的壁画。西凯罗斯回国之后，成为墨西哥革命画家工会总书记，并创办《砍刀》杂志，提倡新的民族的大众艺术。20年代晚期从事矿工工会的组织活动。1930年在一次罢工中被捕，流亡国外。1934年回国后又参加反法西斯和反战运动，再次被捕，随后迁居美国。1936年西班牙战争爆发，他参加西班牙共和军的反法西斯战争。</p>
<p><img src="8.7.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1940年5月24日凌晨，他策划并参与实施了墨西哥城科约阿坎郊区托洛茨基家中的袭击。（托洛茨基受墨西哥总统庇护，当时居住在墨西哥。）在用机关枪和爆炸物彻底毁了该处房屋。但托洛茨基并未受伤，他于当年八月被一名刺客挥舞着冰镐杀死。</p>
<p><img src="8.7.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1960年西凯罗斯因组织抗议活动及批评总统再次被捕，被判8年徒刑，由于多方呼吁，他于1964年春提前获释。</p>
<p><img src="8.7.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>以下是一些西凯罗斯在狱中的画作：</p>
<p><img src="8.7.8.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>

<p>西凯罗斯在监狱期间于1963年8月至9月间创作了四幅基督小画。</p>
<p>表现一位土著基督饱受血腥，为他的子民受苦。西凯罗斯用一种富有表现力的悲哀来表达基督的自我牺牲。</p>

    content: `<p><img src="8.9.1.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>​小圃千浦（Chiura Obata 1885年——1975年）是一位日裔美国艺术家和艺术教师。</p>
<p><img src="8.9.2.gif" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>小圃1885年出生于日本冈山县，自幼学画，表现优异。于1903年前往到美国，打算先学习美国艺术，然后再去巴黎学习欧洲艺术。他积极活跃，很快就融入了美国社会，为不同的报纸，包括旧金山的两份日本报纸《新世界》和《日裔美国人》担任插图师及商业设计师，创作了大量插图和封面设计。并参与创建了美国第一支日美棒球队富士俱乐部。</p>
<p>在20世纪20年代，小圃花了很多时间在加州各地绘制风景画。1921年，他在旧金山参与创立了东西方艺术协会。1928年，小圃举办了第一次展览，并于之后多次举办展览。1932年，小圃千浦被任命为加州大学伯克利分校艺术系的讲师。</p>
<p>小圃还与他的妻子Haruko在伯克利经营一家艺术用品店，1941年12月珍珠港袭击后，这家店遭到枪击，最终小圃被迫关闭门店。</p>
<p>第9066号行政命令迫使小圃千浦拍卖了自己多数的油画和木版画，他将拍卖所得设立了一个奖学金，以奖掖资助学生，“不分种族或信仰”。1942年4月，小圃和家人被关押在坦福兰拘留中心。5月，他和其他艺术家们在坦福兰创建了一所拥有900名学生的艺术学校，经费靠他自己和加州大学伯克利的朋友的捐赠。他们的课程很全面，每周提供95门课程，涉及25个科目。营地管理人员也表示支持，认为艺术是一种打发被拘留者时间的建设性方式。学校非常成功，7月他们就在营地外展出作品。</p>
<p><img src="8.9.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.9.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1942年9月，小圃被转移到犹他州托帕斯的托帕斯战时安置中心。在那里，小田又创办了托帕斯艺术学校，该学校有16位艺术家老师，为600多名学生教授了23门课程。期间，小圃用所有能找到的材料制作了大约100幅素描、绘画和版画，甚至在多余的油毡上制作浮雕版画。</p>
<p><img src="8.9.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.9.6.jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.9.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.9.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>小圃千浦画的詹姆斯•鸠山由纪夫（James Hatsuki Wakasa）。鸠山由纪夫是托帕斯拘留营一名63岁的听障囚犯，他找狗的时候靠近了铁丝网，哨兵警告他离开，他没听到，于是哨兵射杀了他。</p>
<p><img src="8.9.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>作为艺术学院的院长，小圃千浦与拘留营管理部门密切合作。1943年春天，拘留营的气氛紧张，小圃千浦签署了有争议的效忠誓词，被认为是“忠诚的”，并被授予离开拘留营到附近大学和教堂教课的特权。一天晚上，在离开淋浴间时他遭到一名认为他是间谍的狱友的袭击。在营地医院康复两周后，为了他的安全，他被从营地释放。</p>
<p><img src="8.9.10.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1945年，军事禁令解除后，小圃千浦重新回到加州大学伯克利分校。1949年，他被提升为艺术副教授。1953年，他从加州大学伯克利分校退休，1954年，他成为一名美国公民。之后为日美艺术交流做了不少贡献。1965年，他因促进美国和日本之间的友好和文化交流获得第五级天皇勋章。小圃千浦于1975年去世，享年89岁。</p>
<p><img src="8.9.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>“如果我没有去那种地方，我就不会意识到在这种巨大的荒凉中存在的美。”</p>

    date: '2026-06-01',
    content: `<p><img src="8.14.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>​ 大久保美奈（Miné Okubo 1912——2001）是一位美国艺术家和作家。她最著名的作品是《公民13660》（Citizen 13660），一本包含189幅图画和相关文字的漫画，记录了二战期间她在日美拘留营的经历。</p>
<p><img src="8.14.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.14.3.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>大久保美奈出生于加利福尼亚，1938年获得加州大学伯克利分校美术硕士学位，同年获得Bertha Taussig旅行奖学金，于是她前往法国和意大利旅居了两年，在巴黎，她师从于20世纪著名的先锋画家费尔南德·莱格(Fernand Leger)，1939年美奈回到美国。</p>
<p>珍珠港事件发生后，美国政府对居住在美国太平洋沿岸的日裔美国人进行了拘禁。1942 年2月，罗斯福总统下达了“9066 号行政命令”，以种族背景划分，将美国西岸的 12 万日裔美国人转移到拘留中心，其中有 62％ 是美国公民。全美国有十个这样的拘留营。美籍日裔的被囚者在带刺的铁丝围栏内过了三年，直到战争结束美国才陆续解散了这些集中营。</p>

<p>美奈和她在伯克利读书的哥哥德库大久保一道，被转移到了坦福兰的日本拘留营。他们住在一个马厩改装的房子里，睡在行军床上，在那里，他们逐步适应了每天两次的点名、宵禁和缺乏隐私的生活。在坦福兰关了六个月之后，大久保兄妹被转移到犹他州的托帕斯战时定居点（Topaz War Relocation Center ）。在拘留营里，美奈用她的画板记录下她的屈辱和斗争的形象，她画了2000多张素描，其中的一部分后来收录在她的书中。在拘留营期间，美奈还教授孩子们艺术，并凭借一副营卫的绘画进入一个杂志大赛。</p>

    date: '2026-06-01',
    content: `<p><img src="8.17.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>​科斯特勒Koestler刑事司法艺术奖始于1962年，至今已经举办57届，是为英国在押群体设立的艺术奖项。每年有数千名（2019年3500多位）被拘押者和社区人士参与分享他们的作品。科斯特勒奖不仅是绘画作品，还包括其他视觉艺术、手工、设计、写作和戏剧、音乐、电影等领域。</p>
<p>1950年代，作家亚瑟·科斯特勒（Arthur Koestler，1905-1983年）提出废除死刑的主张，他不遗余力的在《观察家报》发表上的一系列文章并出版了《Reflections on Hanging》（悬吊的倒影，1956年）一书。最终英国于1965年废除了绞刑。之后他便将注意力转向“一种富有想象力和令人兴奋的方式，以尽可能多地激发在押人士的思想和精神。”</p>
<p>亚瑟·科斯特勒随后设立年度奖项，以表彰“那些身体受限的人在文学、艺术或科学领域的创造性工作”。囚犯的工作首次可以得到监狱系统之外的专家的评判和奖励，内政大臣RA Butler对此表示欢迎。他们成立了一个指导委员会，由科斯特勒的文学经纪人AD Peters担任主席，并包括The Observer David Astor的编辑。科斯特勒不愿以他的名字命名该计划，但委员会坚持这一主张。 1962年，第一届科斯特勒奖颁奖典礼上，收到约200个参赛作品，获奖作品在Foyle书店的画廊中展出。自那时以来，科斯特勒展览一直在继续，现在包括英国各地的展览。</p>
<p>该计划迅速扩大，科斯特勒最初是个人支付奖金，但不久之后机构需要更多资金，1969年科斯特勒奖项正式确立为慈善信托。科斯特勒去世前，向该机构捐了10,000英镑。</p>
<p>2019年5月1日，科斯特勒信托基金会（Koestler Trust）采用了新的名称科斯特勒艺术（Koestler Arts）和新的口号：“解锁在押人才”（Unlock the talent inside）。</p>
<p><img src="8.17.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>每年9-11月的科斯特勒艺术节都会在英国多地、数家美术馆、剧场、书店等做展览、放映、演出等活动，给大墙内外提供了艺术饕餮盛宴。</p>

    title: '南非前总统曼德拉的狱中画作',
    date: '2026-06-05',
    content: `<p><img src="8.37.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>​南非前总统曼德拉（1918-2013年）</p>
<p><img src="8.37.3.jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.4.jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>除了是享誉世界的政治领袖外，曼德拉还喜爱绘画。27年的铁窗生涯中，他用木炭和蜡笔创作了大批小尺幅的手绘作品，讲述自己的铁窗故事。</p>
<p><img src="8.37.5 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.6 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>曼德拉用明亮轻快的色彩来表现自己乐观积极的心态。画面线条简单、色彩丰富。</p>
<p><img src="8.37.7 .jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.8 .jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>罗本岛的码头，是犯人被押往岛上监狱的第一站，曼德拉把它画成了让人感觉轻松的淡蓝色。</p>
<p><img src="8.37.9 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.10 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>“我之所以用乐观的色彩画下罗本岛，是因为我想把那种感觉与人分享。我想告诉大家，只要我们能坦然接受生命中的挑战，那么任何奇异的梦想都可以实现！”</p>
<p><img src="8.37.11 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.12 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>——曼德拉</p>
<p><img src="8.37.13 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.14 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1990年获释后，曼德拉与“一名画家合作，创作由他签名的限量版画”。这些版画为线条简洁的素描，其中部分素描上了色：有紫色天空下的灯塔，有窗外绿色的景象，有罗本岛上的教堂，也有牢房……曼德拉的版画一经问世，海外名流竞相购买。拍卖所得的收入，大部分都捐赠给了南非的艾滋病治疗及用于儿童教育发展等的慈善机构和基金会。</p>
<p><img src="8.37.15 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.16 .jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>——作品欣赏——</p>
<p><img src="8.37.17 .jpeg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.18 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>南非纳尔逊·曼德拉大都会艺术博物馆是南非最知名的艺术博物馆之一，位于东开普省伊丽莎白港，前身为英王乔治六世美术馆，1956年6月22日开业，2002年12月为了纪念曼德拉而更名，同年，84岁的曼德拉在这里举办了以监狱生活为主题的个人画展。</p>
<p><img src="8.37.19 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.20 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>纪念曼德拉入狱50周年,在其当年被捕之地设计的纪念雕像</p>
<p><img src="8.37.21.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="8.37.22 .jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>`

    id: 27,
    title: '废弃的美国霍姆斯堡监狱',
    date: '2026-06-01',
    content: `<p><img src="9.19.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>​ 霍姆斯堡监狱（Holmesburg Prison）位于宾西法尼亚州费城霍姆斯堡区的Torresdale Ave 8215号，1896年开始运营，百年之后，1995年关闭退役。是美国历史上最臭名昭著的监狱之一。</p>
<p><img src="9.19.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>美国摄影师马修·克里斯托弗多次探访该监狱，记录了自然状态下迅速锈蚀的霍姆斯堡监狱。</p>
<p><img src="9.19.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>霍姆斯堡监狱最黑暗的时期是由阿尔伯特·M·克里格曼博士（Dr. Albert M. Kligman）对囚犯进行的各种医学实验的二十多年，该实验使犯人们暴露于多种化妆品、皮肤起泡化学药品、疱疹、葡萄球菌、放射性同位素、精神药物和致癌化合物如二恶英等。强生医药、陶氏化学和美国陆军等33个不同的赞助商资助了该项目。团队以支付报酬为名诱使犯人参加实验，但没有告知相应的风险。</p>
<p>据报道，在1951年至1974年期间，多达90%的犯人参与了这些实验。由于公众强烈抗议并指控该试验违反《纽伦堡法典》，上诉至国会听证会而告终。相关记录被销毁，诉讼被驳回，但促成了有关在医学研究中使用囚犯的严格规定。 艾伦·霍恩布鲁姆（Allen Hornblum）1998年出版的《皮肤的英亩：霍姆斯堡监狱的人体实验》（Acres of Skin: Human Experiments at Holmesburg Prison）记录了针对霍姆斯堡监狱囚犯的临床非治疗性医学实验。书名来自于克里格曼博士讲述他首次进入霍姆斯堡监狱的观感，“目力所见只是一英亩的皮肤，如同农民第一次看到一片肥沃的土地。”</p>
<p><img src="9.19.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.19.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>霍姆斯堡监狱发生的另一可怕的事件是1938年犯人的绝食，约一半犯人由于对食物的投诉而拒绝进食。25名带头的囚犯被带到一栋名为Klondike的建筑物内，这是一个狭窄的牢房，狱方关闭了窗户和通风格栅，打开房间的散热器和蒸汽管，与8月的热浪一起，将建筑物中的温度升高至近100度。致使四名之前遭狱警殴打的犯人死亡。由于公众的强烈抗议，宾州州长对该事件进行了调查。14名监狱工作人员被指控，但只有两人被处以轻刑。Klondike于70年代被拆毁。</p>
<p><img src="9.19.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1968年霍姆斯堡监狱发布了一份报告，该报告由费城警察局长办公室和费城地方检察官进行了为期两年的广泛调查，披露了数百起囚犯间的强奸案。</p>
<p><img src="9.19.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>70年代初期霍姆斯堡监狱还发生了几次大骚乱。1970年7月4日美国国庆节爆发的暴力冲突造成100多人受伤，据《公报》报道，囚犯“手持切肉刀，剔骨刀，叉子和桌腿”，摧毁了食堂并攻击其他囚犯和警卫。市长里佐（Rizzo）将之归咎于非裔美国人，随之在监狱内进行了种族隔离。</p>
<p>1973年5月31日，监狱长帕特里克·柯伦（Patrick Curran）和副监狱长罗伯特·弗罗德（Robert Fromhold）因穆斯林集会场所发生的争端被囚徒刺死。</p>
<p><img src="9.19.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>

    date: '2026-06-01',
    content: `<p>​弗兰克·谢尔舍尔（Frank J. Scherschel 1907 - 1981），美国《生活》杂志的资深摄影师。二战期间在欧洲（包括巴黎的解放）和太平洋地区做了大量拍摄报导。</p>

<p>这组照片1950年拍摄于墨西哥Black Palace 监狱。</p>
<p><img src="9.22.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>Black Palace 监狱是一座全景敞开式监狱，于1900年投入使用，1976年废弃，1980年改为墨西哥国家档案馆。</p>
<p><img src="9.22.3.png" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>监狱可容纳800名男子，180名妇女和400名儿童。有804间牢房，并有车间、苗圃、烹饪和烘烤车间。</p>
<p><img src="9.22.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>曾在此关押的名人有：墨西哥壁画三杰之一的西凯罗斯、墨西哥歌手胡安·加布里埃尔，谋杀托洛茨基的凶手拉蒙·默卡迪尔、作家何塞·雷维尔塔斯等。</p>
<p><img src="9.22.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>在被用作监狱的76年中，有两名犯人成功越狱。一位是Pancho Villa，他是一名将军，于1912年逃脱。第二名是德怀特·沃克，一名因走私可卡因被定罪的美国人。在妻子的帮助下，沃克于1975年12月17日化装为妇女逃脱，他将自己的经历写成一本名为《逃生》的书。</p>

    title: '百年变迁饮马塘',
    date: '2026-06-06',
    content: `<p><img src="9.53.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.53.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.53.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.53.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>饮马塘监狱, 安徽省唯一一所有着百年变迁史的老监狱。</p>
<p><img src="9.53.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.53.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>饮马塘监狱源于清代安庆习艺善堂。习艺善堂为收容偷窃等轻罪犯处。清光绪三十二年(1906年)四月, 清廷准于在安徽省省府安庆设罪犯习艺所。安徽布政使司遂将习艺善堂改为习艺所，立"习艺所"石碑一块，至今犹存，镶嵌在原监区大门旁的围墙上。</p>
<p><img src="9.53.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.53.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>习艺所由手工业艺人传授生产技艺，先后开办的生产项目有：印刷、织布、缝纫、碾米、刺绣、藤竹、雨伞，木器等科。其产品对外销售，每月"收入约千元，内盈余百元"。1915年、1919年和1923年，曾参加全国京外监狱第一、二、三次出品展览会，并获奖。习艺所内还附设讲习所，"于罪犯习艺之余，教以识字明理，学习算术"。</p>
<p><img src="9.53.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.53.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>习艺所于宣统二年(1910年), 改为模范监狱, 省城府司县三狱和习艺所、新羁所各犯全部划入。1916年扩建后，改为安徽省第一监狱，又称安徽省第一模范监狱。1919年，怀宁地方看守所并入，1924年，饮马塘增设安徽省第一监狱分监。1930年，安徽省反省院成立，亦设于饮马塘看守所内。1933年，反省院迁往黄家狮陆军监狱，1938年，安庆沦陷，饮马塘狱所为汪伪所控，名为"怀宁县地方法院看守所"。1945年8月，抗日战争胜利后，饮马塘监狱由国民党安徽省高等法院和怀宁县法院共同接收使用。</p>
<p><img src="9.53.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.53.12.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>中共领导人任弼时、安徽省委第一任书记王步文等, 都曾被国民党当局关押在此。</p>
<p><img src="9.53.13.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1949年４月，由新政府接管。饮马塘监狱定名为"皖北安庆行政区监狱"。1952年6月，改为"安庆专员公署公安处直属劳改大队"。1955年6月，由安徽省公安厅正式定名为"安徽省第二监狱"。1994年底, 《监狱法》颁布实施。次年初, 按照司法部统一部署, 更名为"安徽省安庆监狱"，也就是后来的安徽省第一监狱。</p>
<p><img src="9.53.14.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>2009年9月, 安庆监狱老监区近千名在押犯转移至新监区, 饮马塘监狱空置后曾对外出租，现空置。</p>
<p><img src="9.53.15.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>

<p><img src="9.54.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.54.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>

<p>摄影：相城三鑫</p>
<p><img src="9.54.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.54.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>江西省渡埠农场距离高安县城约45公里的相城镇华阳行政村境内，1955年江西省劳改局在此开办劳改农场，取名为“江西省渡埠农场”。农场占地面积7000亩，其中耕地3200亩。</p>
<p><img src="9.54.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.54.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1968年为贯彻毛泽东的“五七”指示，中国人民解放军驻江西124部队接管了渡埠农场，更名为“江西渡埠五七农场”。农场共设5个中队，还开办了医院、学校、农机厂、加工厂、造纸厂、农业科学研究所等单位。</p>
<p><img src="9.54.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.54.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>十年后的1978年，江西渡埠五七农场又回归江西劳改局，更名为“江西省劳改局农科所”，1981年复名为“江西省渡埠农场”。</p>
<p><img src="9.54.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.54.12.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>渡埠农场后改名为瑞州监狱，主要从事水稻种植、茶叶生产和二极管加工，由于监狱地处偏僻、交通闭塞、自然环境艰苦、基础设施落后，历来存在诸多不便。进出农场有一条长三公里处于交通盲区的山路，始终没有交通车通行，途中有一个高坡，左右邻山，原名“跃进门”，人们戏称“鬼门关”，农场流传着“走进跃进门，踏入鬼门关”、“稍有风吹雨打，就要停水断电”、“高墙不高、电网不电”等顺口溜。</p>
<p><img src="9.54.13.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.54.14.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>2008年11月，瑞州监狱600余名罪犯搬迁至新址江西省吉安监狱。</p>

  {
    id: 33,
    title: '监狱摄影  21世纪仍然在役的古拉格监狱',
    date: '2026-06-06',
    content: `<p><img src="9.62.1.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>我质疑我们记忆中的图像。我的工作总是双重性的。你所看到的图像是真实的,同时也不是真实的。</p>
<p><img src="9.62.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>——卡尔·德·凯泽</p>
<p><img src="9.62.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>2000年，比利时摄影师卡尔·德·凯泽（Carl De Keyzer）去俄罗斯西伯利亚参加一个马格南主题的展览并主持一个摄影工作坊。工作坊需要摄影练习，德·凯泽向学员咨询拍摄主题，一位当地颇有声望的新闻摄影师告诉他：有一个监狱可以进去拍，那里以前属于古拉格劳改营。德·凯泽很吃惊，他看过索尔仁尼琴的《古拉格群岛》，但完全没想到那些集中营仍旧被当作监狱使用。“我们无法想象奥斯维辛仍被当作监狱使用”。在那位摄影师的安排下，他们去了编号27的监狱，一个供外国大使及媒体记者参观的模范监狱，有约2000名囚犯。在德·凯泽的想象中，古拉格是一张透着阴森、贫瘠、发出凄厉的惨叫的黑白照片，但27号监狱却给人一种迪斯尼的错觉。</p>
<p><img src="9.62.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>监狱大门口左右各有一个由犯人焊制的金属哨兵</p>
<p><img src="9.62.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.12.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>入口处的俄罗斯壁画，讲述着这片土地中世纪或更早时期的辉煌。</p>
<p><img src="9.62.13.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.14.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>入口处还有一列蒸汽火车，一台风车，一座金字塔......，监狱警卫室像廉价游乐场的门房，到处都是彩色的，大部分墙壁被刷成浅蓝色及浅绿色。</p>
<p><img src="9.62.15.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.16.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>工作坊结束后，德·凯泽提出希望能进入这里的其他监狱拍摄，几个月后，他得到了肯定的答复，那位摄影师与负责本区监狱的将军进行了沟通，将军特批了德·凯泽的拍摄，本区（西伯利亚克拉斯诺亚尔斯克区）方圆六七百公里内有约130所监狱，德·凯泽得到授权可以一一拜访。当年冬天，德·凯泽开始了他的古拉格拍摄之旅。</p>
<p><img src="9.62.17.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.18.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>这个项目德·凯泽分三趟完成，前后拍了七个月，去了50所监狱。这些监狱大多数从古拉格时期沿用下来，所以德·凯泽这趟拍摄既是游走在21世纪的俄罗斯监狱，又穿行于苏联的古拉格劳改营。而虽然名义上他被允许进入所有的监狱，但他所看到的场景都是经过安排的，他的拍摄也是被监督的，所以，我们看到的这些照片即是艺术家的表达，又处处凸显着监狱管理局的意志，他们希望借助这位马格南摄影师传递自己的正面形象。整个拍摄过程，一直有两个人陪同德·凯泽，以保证他拍摄的内容符合当局的意愿。</p>
<p><img src="9.62.19.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.20.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>德·凯泽走访的监狱分为三种类型：第一种坐落在城市，大部分是工业型，手工家具厂、拖拉机修理厂等，还有一个狗熊木雕工艺品厂。第二种监狱远在乡下。有些离市区六七百公里，德·凯泽和陪同人员租车过去，路况还不好，两天才能到，而且最后的100公里车子往往陷在泥里无法动弹，要等狱方派车救援。这类监狱跟村庄混在一起，没有围墙。围绕村庄有面积巨大的农场，养着牛马猪鸡等家畜，犯人的主要工作是种庄稼和伐木。如果他们能说服家人搬来同住，狱方也会给他们单独的房间。第三种监狱在森林中的木屋内，犯人的主要工作是伐木，这类监狱的犯人比前两类要辛苦的多。营区内不时能看到报废的拖拉机等设备。</p>
<p><img src="9.62.21.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.22.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>有时，他们到了一个监区后，需要等待两三天才能进去。没有人告诉他为什么要等，在等什么。进去之后，看到刚刚粉刷的墙壁和犯人的新囚服他就明白了。之后也就习惯了。</p>
<p><img src="9.62.23.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.24.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>每个监狱都有图书室，狱方也会主动邀请德·凯泽拍摄读书的犯人，德·凯泽发现有时候犯人把书都拿反了。</p>
<p><img src="9.62.25.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.26.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>有时候，狱方没有做好充足的准备，如果德·凯泽拍了他们不喜欢的照片，他会很快被很礼貌的带向门口，喝点茶，然后离开。之后，德·凯泽明白了游戏规则，他会记下来，在拍摄要结束的时候再去拍。</p>
<p><img src="9.62.27.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.28.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>在德·凯泽的大部分镜头中，犯人都穿着整洁的囚服，这张光膀子干活的照片就是德·凯泽在离开监狱之前抓拍的，拍完就被请了出去。</p>
<p><img src="9.62.29.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.30.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>在一个监狱，德·凯泽看到一个网球场，他问是给谁用的，陪同人员说犯人，随即吩咐叫两名犯人去打网球。但没有球拍，找了半个小时后，工作人员得意地拿来了球拍。德·凯泽问球在哪，于是又等了一个小时，但终究没能找到。于是，德·凯泽拍下了两个打空气网球的囚犯，“像一个疯狂的哑剧场景。”当德·凯泽进到一个牢房，即使在没有事做的时候，陪同的官员也会命令犯人动起来，打扫房间、阅读、打乒乓球或别的什么。</p>
<p><img src="9.62.31.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.32.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>在监狱结婚的犯人也为数不少，德·凯泽拍摄的几个月里就有30-40场婚礼，狱方为夫妻探视准备了亲情客房，房间里有沙发和床，他们可以锁上门享用三个小时的亲密时光。</p>
<p><img src="9.62.33.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="9.62.34.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>

<p><img src="9.74.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>拉各斯摄影双年展（Lagos Photo Biennial）</p>
<p><img src="9.74.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>主题：“囚禁”（Incarceration）</p>
<p><img src="9.74.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>时间：2025年10月25日 – 11月29日</p>
<p><img src="9.74.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>地点：尼日利亚前首都拉各斯</p>
<p><img src="9.74.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>主办机构：非洲艺术家基金会（African Artists’Foundation，AAF）</p>
<p><img src="9.74.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>官网：www.lagosphotofestival.com</p>
<p><img src="9.74.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>拉各斯摄影节（lagos photo festival）创办于2010年，2025年转型为双年展，2025年双年展活动还扩展到尼日利亚另一大城市伊巴丹（Ibadan）。</p>
<p><img src="9.74.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>汇集了来自非洲大陆、非洲侨民以及全球其他国家的约50位艺术家与项目，涵盖摄影、录像、装置、表演与混合媒介等多种表现形式。</p>
<p><img src="9.74.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>The rise of Jobalè, 2025. From the series les Réenchanteresses. Courtesy of the artist and AAFArnold Tagne Fokam</p>
<p><img src="9.74.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>San Quentin State Prison, 2004. Courtesy of the artist and AAFStefan Ruiz</p>

<p>智利首都圣地亚哥有一座记忆与人权博物馆（The Museum of Memory and Human Rights），该博物馆于2010年开馆，大部分馆藏来自于智利的人权组织以及该国真相与和解委员会，这些展品讲述的是智利独裁军政府在皮诺切特当政的十七年间（1973-1990），对反对者和平民犯下的人权暴行。该博物馆由巴西圣保罗的Estudio America事务所完成。建筑主体为纯净的体块，两个池塘之间的悬挑形成一道阴影，使体块漂浮起来。</p>

<p>二楼中心是一个室内天台，从天台望出去，眼前是一面巨大的贴有3197位逝者照片的墙面。这3197条生命都消逝于军政府的秘密逮捕和处决。他们或是被押解至荒无人烟的郊外执行枪决，或是被毛骨悚然的酷刑折磨到奄奄一息后埋葬于不为人知的坑洞，或是被当着家人的面逮捕从此音讯全无。其中有1102人的尸骨至今下落不明。围绕室内天台的内侧点燃着一圈永不熄灭的烛光，令天台本身成为了一个祭坛，天台中间是一个对应照片墙的可缩放触摸屏，点击其中某一张照片，会出现对应的具体信息。可见馆方对每一位逝者的尊重。另一个9·11上世纪六七十年代，在冷战背景下，智利国内政陷入僵局，马克思主义者阿连德在1970年的总统大选中辗转上位，踌躇满志的阿连德连续发力，要在智利实现自己的共产主义梦想，他马不停蹄地推行计划经济，限制物价，提高工资，进行国有化改革，将私人拥有的农地庄园强行没收改造成农民合作社。还将国内最大的美资铜矿公司收归国有，一毛钱补偿都不付（阿连德的理由是贪婪的资本已经赚取了“过分的”利润，没必要再对他们进行补偿），让原本就很恼火的美国对阿连德再添恨意。意识形态方面，阿连德把一些教育改革的课程强行推向了私人天主教会学校，将大量的学生送往乡村田头，以培养新一代无私的“革命接班人”。并邀请卡斯特罗来智利进行了为期五周的访问并接受了后者的一把冲锋枪作为礼物，以及大量引入来自古巴的移民。毫无悬念的财政赤字和生活的困苦将阿连德原先的支持者——工人阶级也逼到他的对立面，智利人民走上街头，全国上下弥漫着一股“山雨欲来风满楼”的政变气息。街头抗议者们嘶声竭力地高喊着“雅加达来了”——期盼着1965年印尼军方和右翼发动的摧毁世界第三大共产党——印尼共产党的政变降临在自己的国家。1973年9月11日，智利军队三军用命。空军出动飞机轰炸阿连德的总统官邸拉莫内达宫，随后而来的陆军坦克将其推成了一片废墟。自知大势已去的阿连德，用卡斯特罗赠予他的冲锋枪，饮弹自尽了（阿连德究竟是被破门而入的军队打死还是死于自杀，这点尚有争议）。</p>

<p>在右翼势力的簇拥下，在中产阶级的欢呼下，军方踏着阿连德总统的尸体接管了国家的最高权力。自诩拥有悠久民主政治传统的大部分智利人认为，军方的控制是国家在非常状态下的权宜之计。待时局稳定，一个代表中产阶级利益的文官集团会重新通过选举从军方手中接回政权（智利历史上也确实有过多次军方和文官政府间的权力交接）。</p>

<p>然而，这次智利人失算了，他们刚走出火海，又掉进了油锅。这一掉，就是十七年。十七年里，笼罩在智利人头上的是那个“誉满天下谤满天下”的奥古斯托·皮诺切特。皮诺切特一方面利用自己在军中建立的特勤组织，秘密地用武力恫吓军方委员会的其他成员。另一方面，利用掌控的媒体资源把自己塑造成一个信仰虔诚，家国为先的传统人士，在民众中赢得声望，巩固权力。几乎在军方掌握权力的同时，皮诺切特就开始了对左翼人士的大清洗和迫害，目标把他们斩尽杀绝。他派兵包围并逮捕阿连德所属政党的党员和同情左派组织的大学生。政变成功后的10天内，数以千计的智利左翼人士被押解到圣地亚哥的两个体育场内。他们在那里被系统有序地审问和严刑拷打后，全部被残忍地杀害了。1973年9月23日，智利享誉世界的诗人、诺贝尔文学奖得主、外交官、阿连德的好朋友和战友聂鲁达在医院去世，终年69岁，官方宣布其死于“前列腺癌和营养不良”，但这个说法一直存在质疑，因为诗人临终前几个小时被注射了某些东西，而该部分医疗记录离奇失踪。2011年，智利对聂鲁达的死因展开调查，发掘了他的遗体，2015年的鉴定显示，“极有可能是第三方”造成聂鲁达的死亡。今年的二月，法医专家确认，聂鲁达是被一种“强效毒素”毒死的。另一位中国读者熟知的拉美作家波拉尼奥也坐了几天牢，波拉尼奥生于智利，15岁时全家移居墨西哥，1973年，20岁的波拉尼奥返回智利投身社会主义革命，被军政府逮捕，差点被杀害，之后逃回墨西哥。</p>

<p>智利著名诗人歌手Victor Jara被逮捕到爱斯达迪奥体育馆，遭到数日的非人折磨，手指被切断，舌头被割掉，身上被烟头烫伤。一个星期的酷刑虐待后，这位智利的民族歌手被军警射杀了，身中44枪后被抛尸灌木丛。（智利之声 维克多·哈拉）</p>

<p>政变五周后，皮诺切特派遣一名军方将领在智利全国的各个城市开展了一场臭名昭著的“死亡大巡游”，四处围捕猎杀此前还未来得及消灭的左派人士和前朝余孽。与此同时，全国所有的政治活动被取缔，国会被关闭，大学校园也被军方接管。又过了大约一个月的时间，皮诺切特正式成立了名为DINA的情报和秘密警察组织，成为了他肃清异见人士的马前卒。DINA以其血腥和残暴的镇压手段令全国上下噤若寒蝉。无处不在的特务们在智利全境设立了上千座秘密集中营，发明各种新式酷刑，并且随时能让一个人无声无息地“消失”。其中以一个名为La Venda Sexy的集中营最为恐怖，以近乎变态的性虐待对受害者进行刑讯逼供。譬如，在被囚禁者的面前对他的家人实施性侵，令他精神奔溃。抑或是用啮齿类动物或者恶犬撕咬被害者的敏感部位，使其生不如死等等。</p>

<p>巅峰时期的DINA组织拥有超过4000名工作人员，他们不分昼夜地对异见者进行拷问，凌辱和杀戮。政变后的三年内，被DINA逮捕的智利人有13万之多，占到全国总人口的1%。虽然其中大部分人最终都被释放，但是可怕的暴行和血腥的气氛迫使大约10万名智利人流亡海外。</p>

<p>说来也颇为可笑，作为一介武夫的皮诺切特，对如何治理经济一窍不通。而他也很“难能可贵”地意识到了这点，将国家经济事务一股脑地交给了一群笃信“芝加哥学派”的新自由主义者。被计划经济折腾地千疮百孔的智利经济在自由贸易，市场导向，平衡预算和控制通胀的药方下，渐渐恢复了元气，最高时可以获得年均10%的增长。一时间外国投资纷至沓来，国内消费逐年增长，出口也呈多元增长态势。</p>
<p><img src="11.2.38.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>

<p>物极必反，暴虐统治终有寿数，在国内外巨大的压力下，1987年皮诺切特被迫同意开放党禁，并决定遵从1980年宪法有关在1988年举行全民公投的条款。该公投将由全民投票决定皮诺切特是否有资格担任智利总统至1997年。</p>
<p><img src="11.2.40.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.2.41.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>智利人民发动了浩浩荡荡的“No运动”，意在否决皮诺切特继续领导这个国家。公投的结果是58%的智利人反对皮诺切特继续担任总统，42%选择同意。在万般不情愿和军方反对势力的强压下，皮诺切特只能接受这一结果，同意在1989年举行大选。1989年12月，智利左派总统候选人帕特里西奥·埃尔文以55%的得票率当选总统并于次年宣誓就任，正式终结了皮诺切特长达十七年的独裁统治。根据1980年过渡宪法的条款，皮诺切特仍将担任三军总司令至1998年，并保有终身参议员的头衔，免于刑事起诉。1998年10月，移居伦敦接受治疗的皮诺切特被西班牙法官以侵犯人权罪起诉，并以国际法庭逮捕令将其软禁。经过一年半的英国议会辩论和国际社会大讨论，皮诺切特于2000年3月被英国政府释放并回到智利。2006年11月25日，皮诺切特在他91岁生日时，让他的夫人向想来祝寿的支持者宣读了一条声明：“我对所有发生的一切承担政治责任。”2天后，他再次被智利当局软禁。12月10日，皮诺切特突发心梗去世，生前未就其犯下的任何罪行在智利国内被起诉。第二天，我和朋友去了圣地亚哥东边100多公里外的小城瓦尔帕莱索，很巧的逛到瓦尔帕莱索文化公园，这个公园之前就是皮诺切特关押政治犯的监狱，现在瓦尔帕莱索当局将其改造为文化活动场所，有剧场、有画廊、还有不少舞蹈和音乐排练房。</p>

<p>这次出行比较即兴，7月初开通了太原和大同往返莫斯科的北方之星航线，往返只要一千多（据说10月中旬就停飞了，不知道什么时候能恢复）。俄罗斯电子签也好办，四天下签。现在签证有效期四个月，可以停留30天。</p>
<p><img src="11.7.3.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>战争期间去俄罗斯的确有一些不方便，比如刷不了国内银行卡，大部分人都是带着现金在当地银行换汇；比如退房时需要让酒店开居住证明，如果没开，就会有无法入住下一家的风险（其实没那么严，我就只在离开莫斯科的时候开了一次，后面的行程没有开，也没人说要看。当然保险起见，开了更好）；再比如为了防止无人机袭击，红场附近GPS信号很差，有导航困扰（的确我也有迷路的经历，大半夜的俄罗斯小姐姐主动带我找路）等等。总之，办法比困难多。</p>
<p><img src="11.7.4.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>8月16号，飞机--卢比扬卡广场--红场</p>
<p><img src="11.7.5.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>六点半的飞机，在机场看到两个赴俄的旅游团，加起来得有五六十人。问了一个跟团的小伙子，六天团费4800，莫斯科和圣彼得堡各住两晚，火车上两晚。导游提前打预防针，说咱们住的是四星级酒店，但俄罗斯的四星酒店也就国内三星的样子，普遍人高马大床窄。吃的也不如咱国内。另一个团的导游高兴地告诉团员，这次旅行我们将特别安排两顿面食，虽然到不了咱们山西刀削面的水准，也是尽量满足大家的中国胃！海关只简单问去干嘛，去几天，返程机票买没就放行了。候机的时候闲聊，有一个从14年就开始在俄罗斯出差的哥们，一个在彼得堡学医的大三小伙子，一个自由行的江苏女孩。出差的87年小哥在东北上的大学，专业是俄语，14年毕业，随即找了可以去莫斯科出差的工作。中间停了几年，20年又续上了。现在在石家庄一家做化妆工具如梳子等的外贸公司上班。过去一般待三个月，公司在三环内租的两居室，房租一个月不到五千，十年没涨，在莫斯科算比较便宜的。他说俄罗斯经济下行，汇率跌的厉害，外贸不如战前景气，治安倒是比以前好。学医的小伙子暑假带俄罗斯女朋友回太原，他说几乎感觉不到战争的影响，他女朋友也说感觉不到。他23年上的大学，选俄罗斯的理由是花费低(一年学费两三万，学生宿舍有厨具冰箱等，刚开始节约，一个月1000块钱生活费都够)，且做贸易机会多，他对毕业后的设想是留在俄罗斯做中俄外贸。</p>
<p><img src="11.7.6.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>整个航程10个小时，发两次飞机餐，11点多在克拉斯诺亚尔斯克停一个小时，加油和机组人员休息，乘客不能下飞机。从空中可见，克拉斯诺亚尔斯克不算小，纵贯俄罗斯的叶尼赛河穿城而过，再流向北极。莫斯科时间12点多，飞机准时落地莫斯科城南不大的多莫德多夫国际机场。</p>
<p><img src="11.7.7.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>公交+地铁进城，办完入住就剩半天时间了。我打算先热热身，简单溜达溜达：经过卢比扬卡广场去红场转转。路过一个叫Eurospar的超市，吃了点披萨（之后经常在这个超市吃饭）后继续前往卢比扬卡广场。没多远看到左手边有一个露天演出，猴急的我踩着草坪就过去了，这是一个下沉的露天剧场，正在演的是古典音乐。</p>
<p><img src="11.7.8.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>看了一小会，想着还有任务，就往出走，在剧场外被热情的大学生志愿者拦下来问觉得怎么样什么的，并告知这里今晚和明天也有演出。我边往出走边回头看（主要是看大学生）。一转身，索诺维茨基石撞进眼里，原来剧场就在卢比扬卡广场，如果我刚才不走捷径，先看到的就是索诺维茨基石。</p>
<p><img src="11.7.9.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>背后黄色大楼为卢比扬卡大楼</p>
<p><img src="11.7.10.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>（1990年10月30日，人权机构于广场西北角设立了古拉格系统受害者纪念碑，这是一块未经雕琢的来自1400公里外的索诺维茨群岛的花岗石。当时，契卡创始人杰尔任斯基的雕像仍矗立在的卢比扬卡大楼前，1991年8月才被拆除。卢比扬卡大楼是契卡、内务人民委员部和克格勃的总部，目前是联邦安全局的办公所在地。上世纪20年代到60年代初，大楼里面有一座黑洞一样有去无回的卢比扬卡“监狱”。）</p>
<p><img src="11.7.11.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>石头旁边的说明牌</p>
<p><img src="11.7.12.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>卢比扬卡广场往西走不了多远就到了红场，20多号有大型纪念二战胜利的演出，红场的很大一块被围了起来。在圣瓦西里主教座堂外面，看到一哥们单膝下跪求婚，姑娘感动落泪。又溜达到国家历史博物馆、朱可夫雕像、马克思雕像、无名烈士墓等，最后在古姆商场旁边的展馆看了个未来展。</p>
<p><img src="11.7.13.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>回程又顺路看了会演出，刚刚下了雨，观众穿着雨衣，满满当当，安安静静，莫斯科人真是有艺术素养。</p>
<p><img src="11.7.14.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>演的是关于阿赫玛托娃和茨维塔耶娃的剧，可惜我听不懂。</p>
<p><img src="11.7.15.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>17号，哀恸之墙--古拉格博物馆--犹太人迫害与宽容中心--布提尔卡监狱--武装力量大教堂</p>
<p><img src="11.7.16.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>一早出门，沿着萨哈罗夫大街去看镇压受害者纪念碑「哀恸之墙」（The Wall of Grief），这座大型雕塑于2014年10月30日揭幕，纪念在苏联时期被压迫和迫害的受害者，尤其是在古拉格劳改营中受苦的人们。</p>
<p><img src="11.7.17.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>（10月30日是俄罗斯的政治迫害受害者纪念日，每年的这一天，这两处纪念碑都会有纪念活动。去年纳瓦尔尼去世的时候，莫斯科市民也是到这两个地方对他表示哀悼。）</p>
<p><img src="11.7.18.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>青旅门口在修路，萨哈罗夫大街在修路，去红场的路也在修。莫斯科到处修路，不知道是不是在通过这种方式拉动内需。</p>
<p><img src="11.7.19.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>萨哈罗夫大街上一个巨长的银行大楼</p>
<p><img src="11.7.20.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>大楼前划过的两个独轮车</p>
<p><img src="11.7.21.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>古拉格历史博物馆，创立于2001年，2012年搬迁至现址，但去年11月该馆因“消防安全违规”关闭，至今未开放，颇为遗憾。</p>
<p><img src="11.7.22.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>好在附属的记忆花园开着。有约五六百平米，里面种着从各个古拉格集中营移栽的不同植物，还有一座马加丹集中营的了望塔。</p>
<p><img src="11.7.23.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>再之后我去了犹太人迫害与宽容中心，里面讲述俄罗斯犹太人的复杂历史。俄国也有不少犹太土著，在二战以及后面的大清洗期间，遭了不少罪，他们建了一个挺大的纪念馆讲自己的故事。不过由于不懂俄语，也没那么多时间用软件翻译，跟瞎子差不多。</p>
<p><img src="11.7.24.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>纪念馆里复原的卢比扬卡的囚室</p>
<p><img src="11.7.25.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>再之后去了布提尔卡监狱（Butyrka）。这座监狱建于1879年，苏联时期关押过许多政治犯，如今仍是莫斯科最大的还押监狱（审前拘留所）。巴别尔、马雅科夫斯基、捷尔任斯基、普加乔夫、萨拉莫夫、索尔仁尼琴、特雷门等曾被关押于此。140多年了，它还在运营。</p>
<p><img src="11.7.26.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>我绕着这座监狱走了大半圈，感觉它的建筑在不同的年代缝缝补补，然后停在了八九十年代。我想象里面裸露的砖墙，生锈粗粝的铁门和水管，可能窗子还漏着风......真是一处恐怖的所在。（网图）</p>
<p><img src="11.7.27.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>下午，跟几名小伙伴一起去了离莫斯科有80公里之遥的武装力量大教堂，这座普京的军国主义教堂于2020年建成。说是纪念二战胜利75周年，选址在二战德军推进的最后防线附近。教堂里的镶嵌画描绘了俄罗斯“历次主要战争”，不少材料是用缴获的武器融化而成，高度穹顶直径等用了一些战争中的标志性数据，大概是战争与宗教结合的最紧密的一座教堂。教堂所在公园叫爱国者公园，有复原的二战战争场景和不少军备展出。该教堂还有很多中文标识。虽然离城很远，交通不便，仍然是中国人密度最高的莫斯科景点。</p>
<p><img src="11.7.28.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>很巧在教堂里看到了绍伊古，他着便装，有七八个随行保镖。一开始我只是觉得这个人不一般，告诉同行的几个人，同行的一个哥们会俄语，大概对俄罗斯更熟悉一些，说那是绍伊古，我才反应过来。那哥们还跟绍打了招呼。没看到其他俄罗斯人有什么异样表现。这座教堂就是绍伊古主持修建的。网上说教堂镶嵌画上有一句耶稣的话：「收刀入鞘吧！凡动刀的，必死在刀下。」</p>
<p><img src="11.7.29.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>18号，国家历史博物馆--新圣女公墓--麻雀山--莫斯科大学</p>
<p><img src="11.7.30.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>国家历史博物馆，位于红场，藏品好又多。不知道是不是周内的原因，里面可以用冷清来形容，好几个小时只看到一个旅游团，一个讲解。</p>
<p><img src="11.7.31.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>之后我去了新圣女公墓，在上篇里我说它需要买票，其实没有门票，自由进出，导览图400卢布。（新圣女公墓安葬了不少名人，号称欧洲三大著名公墓之一，安葬的名人包括王明夫妇、赫鲁晓夫、戈尔巴乔夫、叶利钦、肖斯塔科维奇、果戈里、屠格涅夫、契诃夫、马雅可夫斯基、法捷耶夫、米高扬、纳杰日达（斯大林老婆）、卓娅和舒拉、奥斯特洛夫斯基、克鲁鲍特金、布尔加科夫、斯坦尼斯拉夫斯基、爱森斯坦、乌兰诺娃、狙击手柳德米拉、画家塔特林、列维坦、尼库林等等）。俄罗斯人很喜欢逛墓地，有不少旅游团。这个墓地不小，没有导游真是够废腿的，尤其不认识俄语的人。一位在里面做养护的大姐指着一个墓地跟我说pushiking！pushiking！我懵了一会才听出来是普希金，拍照翻译才知道那是普希金的孙女。不明白当时Pushkin为啥不翻译成普什金。大姐说这是露天博物馆；你们中国也有伟大的人，比如kongfuzi。我听了好几遍才听出来她说的是孔夫子。</p>
<p><img src="11.7.32.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>路上看到的俄式公园健身</p>
<p><img src="11.7.33.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>来莫斯科旅游的人经常晒莫斯科的地铁，莫斯科的地铁系统是挺发达的，线路不少，建于不同的年代，都有相应的设计。</p>
<p><img src="11.7.34.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>但那种审美总体上没有摆脱苏联那一套：集体、团结就是力量、劳动光荣、奉献、战斗......并不耐看。地铁都很深，好些线路的系统也比较老旧了，有一种老大哥的暮气。扶梯底端有个狭小的亭子，里头坐个老头👴或中年妇女，面无表情，面前有个屏幕里面是分成九宫格还是多少的监控画面，有几次看到他（她）们握着座机打电话，非常诡异。</p>
<p><img src="11.7.35.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>相比而言，俄罗斯人都很显个性，衣品特别好，染各种发色，打各种钉子，哥特装扮很常见。我停下来看街头艺人的时候，也喜欢看来来往往的路人。</p>
<p><img src="11.7.36.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>19号，克里姆林宫--国家图书馆--火车到圣彼得堡</p>
<p><img src="11.7.37.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>又去红场，才发现原来克里姆林宫没有因为演出关闭，我之前没找到入口。于是进去参观，教堂群太棒了。</p>
<p><img src="11.7.38.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>国家图书馆外的街头艺人</p>
<p><img src="11.7.39.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>20号，圣彼得堡：彼得保罗要塞--索诺维茨基石--十字监狱--政治压迫受害者纪念碑和阿赫玛托娃像</p>
<p><img src="11.7.40.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>圣彼得堡西北距莫斯科700公里，是俄罗斯第二大城市，有560多万人。1712-1917年的200年里曾作为沙俄首都。这座充满欧洲风情的城市不是因人类聚居发展而来，而是1703年由彼得大帝下令建造。</p>
<p><img src="11.7.41.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>一战期间，为了消除带有德国色彩的名字，改名为彼得格勒，1917年，十月革命发生在这里。1924年，为纪念列宁，改为列宁格勒。二战期间，被德军围城封锁长达872天，多达150万人死于饥饿。1991年苏联解体，这座城市又恢复了原名圣彼得堡。圣彼得堡毗邻芬兰湾，城里河道交错，有200多座桥，有众多的博物馆，有普希金、陀思妥耶夫斯基、纳博可夫、阿赫玛托娃、左琴科、布罗茨基等名人的故居。</p>
<p><img src="11.7.42.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>圣彼得堡的第一座建筑为扼守涅瓦河河口的彼得保罗要塞，圣彼得堡也因之命名。该要塞并没有用于战争，倒是在很长的时间里被作为监狱使用，号称俄国的巴士底狱。关押过的名人有不少十二月党人、陀思妥耶夫斯基、巴枯宁、车尔尼雪夫斯基、铁托、高尔基以及无政府主义者克鲁泡特金等。这当然是我要去的地方，从青旅出来，先到涅瓦大街边的喀山大教堂和胜家书店，经过圣以撒教堂，普希金旧居，滴血大教堂等，过涅瓦河大桥，就到了彼得保罗要塞。除了监狱，彼得保罗要塞还有一座教堂，里面安放了十多位沙皇的灵柩。</p>
<p><img src="11.7.43.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>彼得堡的索诺维茨石，在彼得保罗要塞东边的圣三一公园内。</p>
<p><img src="11.7.44.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>沿着涅瓦河，过彼得大帝小屋、阿芙乐尔号和芬兰站到十字监狱。十字监狱（kresty）在涅瓦河北岸，离冬宫三公里，建于1730年代，主要由两座十字型建筑构成，有900多间囚室，是圣彼得堡最主要的监狱。2017年，运行近三百年的十字监狱迁往别处，监狱于去年被拍卖，准备改造成文化园区，如今无人管理，杂草丛生。</p>
<p><img src="11.7.45.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1995年，米哈伊尔·切米亚金等艺术家在十字监狱的对岸，涅瓦河南侧，建造了一座政治压迫受害者纪念碑，主体是一对相向而坐的斯芬克斯，这对斯芬克斯的面部在监狱那一侧是骷髅的样子，另一侧则是正常的。两者中间的河堤上还有一个荆冠大理石窗和一本书。</p>
<p><img src="11.7.46.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>远看过去，大理石窗和荆冠也像一张脸。</p>
<p><img src="11.7.47.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>这组雕塑南侧的小广场上，还有一座修长的阿赫玛托娃铜像。</p>
<p><img src="11.7.48.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>阿赫玛托娃曾长久地在十字监狱门外排队，等候探望自己被迫害的儿子。她把这些煎熬的日子写进长诗《安魂曲》。</p>
<p><img src="11.7.49.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>在序中，阿赫玛托娃写道：</p>
<p><img src="11.7.50.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>在那令人担惊受怕的叶若夫年代，有十七个月我是在排队探监中度过的。一天，有人把我“认出来了”。排在我身后那个嘴唇毫无血色的女人，她虽然从未听说过我的名字，却突然从我们大家特有的麻木状态中苏醒过来，在我耳边低声问道（在那个地方人人都是悄声说话的）: “您能把这个都写出来吗？” “能。”我说。于是，在她那曾经是一张脸的部分掠过一丝似乎是微笑的表情。</p>
<p><img src="11.7.51.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>而未来的某一天，</p>
<p><img src="11.7.52.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>在这个国家，</p>
<p><img src="11.7.53.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>倘若要为我竖起一座纪念碑，</p>
<p><img src="11.7.54.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>我可以答应这样隆重的仪典，</p>
<p><img src="11.7.55.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>但必须恪守一个条件――</p>
<p><img src="11.7.56.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>不要建造在我出生的海滨：</p>
<p><img src="11.7.57.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>我和大海最后的纽带已经中断，</p>
<p><img src="11.7.58.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>也不要在皇家花园隐秘的树墩旁，</p>
<p><img src="11.7.59.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>那里绝望的影子正在寻找我，</p>
<p><img src="11.7.60.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>而要在这里，</p>
<p><img src="11.7.61.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>我站立过三百小时的地方，</p>
<p><img src="11.7.62.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>大门始终向我紧闭的地方。</p>
<p><img src="11.7.63.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>因为，我惧怕安详的死亡，</p>
<p><img src="11.7.64.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>那样会忘却黑色玛鲁斯的轰鸣，</p>
<p><img src="11.7.65.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>那样会忘却可厌的房门的抽泣，</p>
<p><img src="11.7.66.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>老妇人受伤的野兽般的悲嚎。</p>
<p><img src="11.7.67.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>让青铜塑像那僵凝的眼睑流出眼泪，</p>
<p><img src="11.7.68.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>如同消融的雪水，</p>
<p><img src="11.7.69.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>让监狱的鸽子在远处咕咕叫，</p>
<p><img src="11.7.70.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>让海船沿着涅瓦河平静地行驶。</p>
<p><img src="11.7.71.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>几天后，我在冬宫西侧，涅瓦河北岸看到一对更老的斯芬克斯像。</p>
<p><img src="11.7.72.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1839年就在这里了</p>
<p><img src="11.7.73.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>21号，喋血大教堂--冬宫--圣以撒教堂</p>
<p><img src="11.7.74.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>远看欧洲第一高楼，462米的拉赫塔中心。</p>
<p><img src="11.7.75.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>22号，季赫温公墓--夏宫</p>
<p><img src="11.7.76.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>圣彼得堡的季赫温（tikhvin）墓地安葬着陀思妥耶夫斯基、柴科夫斯基、普希金夫人、鲁宾斯坦、欧拉。这里需要买门票。</p>
<p><img src="11.7.77.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>陀思妥耶夫斯基</p>
<p><img src="11.7.78.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>柴可夫斯基</p>
<p><img src="11.7.79.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>夏宫一角</p>
<p><img src="11.7.80.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>23号，去索诺维茨基岛</p>
<p><img src="11.7.81.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>花了一天时间到达索诺维茨基岛。500元卢布钞票上的图案选用的就是索诺维茨基修道院。索诺维茨基离彼得堡900公里，火车要开15个小时，路过奥涅加湖和古拉格囚犯修建的连通白海-波罗的海的运河到达凯姆（一百年前的中转站也是在凯姆，不过那时候从彼得堡过来要开三四天），到码头后没赶上大船，坐了一小时快艇🚤。这里地处北纬65度，离北极圈就差1度半，130公里，但这个季节一点儿也不冷。</p>
<p><img src="11.7.82.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>俄罗斯火车上可以带餐刀</p>
<p><img src="11.7.83.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>路上停车时站台上兜售的乡野特产</p>
<p><img src="11.7.84.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>由于有建于17世纪初的修道院，当局把教士们赶走，利用修道院建起了最早的古拉格集中营，而之后古拉格系统的各项做法也发轫于此，故索洛维茨基群岛被称为古拉格的母体，索尔仁尼琴曾被关押于此，他即借用索诺维茨基群岛来命名分散的古拉格劳改营——古拉格群岛。</p>
<p><img src="11.7.85.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1991年，索尔维茨基群岛建筑群被联合国列为世界文化遗产名录。</p>
<p><img src="11.7.86.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>教士普遍很老，胡子长，有些腿脚不灵便，穿裙子或披风。</p>
<p><img src="11.7.87.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>索诺维茨基15世纪就有了苦修的修道院。在东正教信徒看来，这里是“世界尽头”般的圣地。能在这样的地方建立并维持修道生活，被视为信仰最纯粹、最坚毅的象征。由此，它逐渐成为东正教北方的核心圣地之一。17世纪曾作为旧礼派的精神堡垒跟尼康改革对抗了八年。也因为它的孤悬与艰苦，17世纪开始有监狱的功能。当然，最让它蜚声世界的应该还是与古拉格的关系。</p>
<p><img src="11.7.88.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>古拉格纪念园</p>
<p><img src="11.7.89.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>修道院的午饭，面包片、蔬菜、红菜汤</p>
<p><img src="11.7.90.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>小孩哥带我采蓝莓</p>
<p><img src="11.7.91.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>回彼得堡的火车是双层的软卧，四人间，列车总高度高过国内的。</p>
<p>薄雾笼罩的疏林，非常梦幻，他们好像见怪不怪（拍不出来）</p>
<p>车厢一头无人看管的零食，有监控。</p>
<p>自取的水杯，大家都用，用完还会还主动回去</p>
<p>大部分乘客下车时会把被套拆下来还回来</p>
<p>跟我在一个四人间的有一对彼得堡的姐妹，姐姐学的酒店管理，在酒店上班，妹妹编程在读。她们英语都不错，我们聊了一会，她们就认为战争的影响是方方面面的。妹妹的同学18岁就去打仗了，一只眼没了。结论是跟这边差不多，宣传机器强大，价值观有分野。她们说莫斯科和圣彼得堡不代表俄罗斯，更多的俄罗斯人民在地方上在乡间，去那些地方才能了解真实的俄罗斯。我心想，游客并没有那么关心“真实”的俄罗斯，游客要的是丰富的体验。如果比较方便能看到当然也愿意了解，但如果很费劲，起码那不在短期旅行的规划里。</p>
<p>25号，早上十点回到彼得堡，继续街溜子。</p>
<p>26号，陀思妥耶夫斯基故居--阿赫玛托娃故居--冬宫现代艺术馆</p>
<p>27号，顿河修道院--阿尔巴特街</p>
<p>一早到莫斯科，青旅待到十点半，去顿河修道院。顿河修道院建于1591年，有年头也有说头，顿河圣母像帮助打胜过大仗。索尔仁尼琴的墓在修道院主建筑背后。</p>
<p>旁边扩建的墓园里有三个合葬墓或者纪念性的墓，是大清洗期间被斯大林杀了骨灰扔这儿的人，89年以后才知道这个事儿。目前整理出来7000多人，据说有一万多。一号公墓的墓碑是当局立的，比较简单，写的埋着1943-1944年间骨灰无人认领的人。二号公墓是一些遇害者的家属或后人做的牌子，插在一块，蔚为壮观。三号公墓有一座雕像和不同国家语言的碑，还有一个介绍。二号公墓的牌子里面看到一名中国人，叫俞秀松，是早期党员，36年才跟盛世才妹妹盛世同结婚，1939年肃反扩大化中遇害。</p>
<p>晚上在阿尔巴特街看到一组挺有意思的战争宣传，展示了各种被破坏被涂鸦的纪念碑，大概意思是欧洲和乌克兰宵小妄图破坏我们的胜利果实，是可忍孰不可忍，必须给予粉碎性打击。</p>
<p>晚上11点在1812年战争博物馆门口唱民族歌曲的奶奶，为之折服</p>
<p>28号，普希金博物馆--扎里亚季耶公园</p>
<p>这边的场馆普遍有衣帽间。工作人员不少高龄，有的甚至步履蹒跚，老态龙钟。出来后沿莫斯科河走到扎里亚季耶公园，听了一会交响乐，后面有民族音乐，再之后旁边大V台上露天模特走秀，吃晚饭的空又看到街头艺人，晚上原地听摇滚交响。回去的路上又迷路了，俄罗斯小姐姐主动帮忙带路，发现平时走的那条街背面还有更多活力充沛的街区。</p>
<p>29号，给纳瓦尔尼献花，下午飞回国。</p>
<p>这天微雨，清冷，很符合情境。纳瓦尔尼安葬于距离红场东南18公里外的鲍里斯索沃公墓，可以算郊区了。这个公墓不大，门口停了一辆警车，车内有一名警察，开始我并没有注意。进去发现纳瓦尔尼的墓太明显了，就在大门边上，感觉还不属于墓区。就在我站在他墓地边的时候，警察摁了一下车喇叭。他的墓旁边是这个公墓的门房，屋角还有一个监控正对着他的墓地。我进去问管理员拜访纳瓦尔尼这事儿有危险吗？他说没事，那警察就是正常执勤。我问他哪里买花，他说门外有个售卖亭。说了几句，这时警察也进来了，跟管理员闲聊，顺便冲着我说了句什么，我听不懂，但感觉也就是闲话。我便出去买花，不巧的是花亭没人，回来问管理员，他说后面还有一家，我又出去，绕了一圈，没找到。再进来看见一对男女站在他墓前，悲戚的看着墓碑，男子还抽鼻子，好像是哭了，最后他鞠了一躬，走了。我也就跟着出来了。</p>
<p>机场碰到在莫大读了六年心理学的小伙子，他说俄罗斯物价涨了30-40%，但莫斯科工资高，普通人也能拿七八千人民币，歌照唱舞照跳。他做翻译一天能挣一百多美金，主要是服务国内来参展来试水的企业，国内给这些企业报80%。这边生活，房租支出是大头，在俄罗斯申请美签通过率比国内高。说战争有必然性，他不站队，站队是中国思维。漫长的飞机上也免不了聊天，左边是一位98年的博士，在莫斯科读了七年医学了，毕业后想回去。说现在不能说普京坏话，被举报了会有人找。战争后警察对中国人好了，以前不这样。右边大哥是太原人，疫情后去莫斯科做电商，生意还不错，一年在莫斯科住半年。</p>
<p>下次再去俄罗斯，打算走陆路，内蒙出境经蒙古进俄罗斯，前半段大体是乌兰巴托--乌兰乌德--贝尔加湖--伊尔库茨克--图瓦共和国--叶卡捷琳娜堡，后半段主题回到古拉格群岛：彼尔姆（彼尔姆36劳改营）--乌赫塔（佩乔拉劳改营和伊日马劳改营）--伯朝拉--因塔（因塔劳改营）--沃尔库塔。</p>
<p>再一条线是远东的科雷马地区，沿着尸骨之路一直到马加丹以及萨哈林岛。</p>`
