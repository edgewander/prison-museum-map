{id:143, category:"hotel", name:"巴拉巴斯酒店（Barabas Hotel Luzern）", region:"欧洲", country:"瑞士", lat:47.0522, lng:8.3055, address:"卢塞恩Löwengraben 18", ticket:"140英镑起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/11.%E5%B7%B4%E6%8B%89%E5%B7%B4%E6%96%AF%E9%85%92%E5%BA%97%EF%BC%88Barabas%20Hotel%20Luzern%EF%BC%89.png", desc:"前身为1862年启用的罗文拉本监狱。以关押艺术家兼和平主义者Hugo Siegrist（化名Barabas）而闻名，其在牢房27号绘制了壁画。保留了牢房、铁栏和Barabas壁画等元素。"},
{id:144, name:"第九堡监狱博物馆", region:"欧洲", country:"立陶宛", lat:56.996268, lng:24.132405, address:"立陶宛考纳斯泽迈丘公路75 号（zemaiciu plentas 75,Kaunas）", ticket:"成人门票为5 欧元，每月最后一个周日免费", hours:"周二至周日10:00-18:00（冬季至16:00），周一闭馆，节假日可能调整。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/113_第九堡监狱博物馆.jpeg", desc:"第九堡监狱博物馆（The Ninth Fort Prison Museum）位于立陶宛考纳斯市，这座堡垒是考纳斯防御工事的一部分，后转为立陶宛、苏联及纳粹的监狱，数万人被处决于此。作为俄罗斯帝国考纳斯要塞的一部分，第九堡始建于1882 年，1913 年完工，占地约65 公顷，核心建筑面积约2 万平方米，用于军事防御。"},
{id:145, name:"马奇凯战俘与古拉格集中营博物馆", region:"欧洲", country:"立陶宛", lat:55.356, lng:21.515, address:"立陶宛希卢泰区马奇凯村马奇凯路（Maciku gatve,Macikai, LT-99156 ?ilute District）", ticket:"", hours:"周二至周五10:00-16:00，周六10:00-14:00，周日、周一及节假日闭馆，需提前预约，Tel：844162207。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/114_马奇凯战俘与古拉格集中营博物馆.jpeg", desc:"马奇凯战俘与古拉格集中营博物馆（Macikai POW and GULAGCamps Museum）位于立陶宛希卢泰市马奇凯村。是纳粹战俘营与苏联古拉格集中营的遗址。"},
{id:146, name:"立陶宛·占领与自由斗争博物馆", region:"欧洲", country:"立陶宛", lat:54.68735, lng:25.289154, address:"立陶宛维尔纽斯受害者街2A 号（Auku g. 2A, Vilnius01113）", ticket:"成人门票为6 欧元，每月最后一个周日免费", hours:"周三至周六10:00-18:00，周日10:00-17:00，周一、二及12 月24、25、31 日闭馆。详情见", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/112_立陶宛·占领与自由斗争博物馆.jpeg", desc:"占领与自由斗争博物馆（Museum of Occupations and FreedomFights）位于立陶宛维尔纽斯市中心原克格勃总部大楼内，正对卢基什凯斯广场。是苏联克格勃在立陶宛的前总部，保留了完整的地下监狱、酷刑室和处决室。"},
{id:147, name:"Lukiškių kalėjimas 2.0", region:"欧洲", country:"立陶宛", lat:54.68, lng:25.27, address:"维尔纽斯市中心，Lukiškių 广场附近，紧邻占领与自由斗争博物馆", ticket:"", hours:"", image:"", desc:""},
{id:148, category:"hotel", name:"卡塔亚诺卡监狱主题酒店（Katajanokka Hotel）", region:"欧洲", country:"芬兰", lat:60.1675, lng:24.969, address:"赫尔辛基市卡塔宁岛Merikasarminkatu 1a", ticket:"130欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/14.%E5%8D%A1%E5%A1%94%E4%BA%9A%E8%AF%BA%E5%8D%A1%E7%9B%91%E7%8B%B1%E4%B8%BB%E9%A2%98%E9%85%92%E5%BA%97%EF%BC%88Katajanokka%20Hotel%EF%BC%892_.jpg", desc:"前身为赫尔辛基郡监狱，始于1749年，2002年关闭。原164个牢房整合为106间客房，开放式中央走廊保留了铁栏杆和多层结构。地下室保留了两间原始牢房。"},
{id:149, name:"芬兰·赫梅林纳监狱博物馆", region:"欧洲", country:"芬兰", lat:39.938071, lng:32.873272, address:"赫尔辛基市中心的卡塔宁岛Merikasarminkatu 1a房价：130 欧元起/ 晚1871 年至1993 年，该监狱关押了约2 万名囚犯", ticket:"成人门票为10 欧元", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/068_芬兰·赫梅林纳监狱博物馆.jpeg", desc:"赫梅林纳监狱博物馆（The Prison Museum, H?meenlinna）坐落在芬兰南部赫梅林纳市的林纳涅米区，紧邻建于13 世纪的赫梅城堡，赫梅湖。由赫梅省立监狱改建而成。"},
{id:150, name:"彼得黑德监狱博物馆", region:"欧洲", country:"英国", lat:57.5053, lng:-1.7982,
 address:"苏格兰阿伯丁郡彼得黑德镇South Road, Peterhead, AB42 2ZX", ticket:"具体票价未公开", hours:"每日10:00-17:00", image:"", desc:"1888年8月正式启用，是苏格兰唯一的\u201c重刑犯监狱\u201d，专为被判处\u201c硬劳动\u201d的囚犯设计，2013年12月6日正式关闭，运行了125年。监狱采用维多利亚时代的工业风格，由花岗岩建造，围墙高耸，配有瞭望塔，外观坚固而阴森，被称为\u201c苏格兰的古拉格\u201d、\u201c仇恨工厂\u201d。1987年发生严重暴动，SAS被派遣突袭解救人质，加速了监狱的现代化改造。2016年6月改建为彼得黑德监狱博物馆开放，展示其130年的历史。"},
{id:151, name:"阿伯丁托尔布斯博物馆", region:"欧洲", country:"英国", lat:57.1497, lng:-2.0943,
 address:"阿伯丁市Castle Street，Union Street和Castle Street交汇处", ticket:"关闭前免费开放", hours:"目前因建筑结构调查和维护计划暂时关闭，重开日期待定", image:"", desc:"建造始于1616年，1629年完工，是阿伯丁最古老的建筑之一，也是苏格兰保存最完好的17世纪监狱之一，最初作为阿伯丁皇家自治市和阿伯丁郡的监狱及法院使用，19世纪随着新市政厅的建成，其监狱功能逐渐衰退，1995年由阿伯丁市议会接管改造成博物馆向公众开放。建筑采用当地灰色花岗岩和红砖建造，顶部有锯齿状城垛，保留了17世纪和18世纪的原始牢房。"},
{id:152, name:"爱丁堡城堡监狱博物馆", region:"欧洲", country:"英国", lat:55.9486, lng:-3.1999,
 address:"爱丁堡老城城堡岩顶，皇家一英里尽头", ticket:"成人约19.5英镑，儿童7.5英镑，家庭票约47英镑", hours:"每日9:30-17:00开放（冬季至16:00）", image:"", desc:"爱丁堡城堡起源可追溯至铁器时代，现存建筑主要由12世纪苏格兰国王大卫一世奠基，最初是皇家要塞和宫殿，从中世纪起开始用作监狱，尤其在战争期间成为关押战俘的战略设施。18世纪的七年战争、美国独立战争、拿破仑战争期间，城堡的拱顶地窖和军营被改造成关押外国战俘的设施，1814年拿破仑战争结束后，战俘监狱关闭，19世纪中期不再用作常规监狱，1923年开始对公众开放，监狱部分被修复为展览区域。"},
{id:153, name:"杰德堡城堡监狱博物馆", region:"欧洲", country:"英国", lat:55.4794, lng:-2.5532,
 address:"苏格兰杰德堡镇Castlegate顶部", ticket:"免费入场，鼓励捐款以支持维护", hours:"通常在4月至10月开放，周一至周六10:00-16:30，周日13:00-16:00。冬季关闭，但可接受团体预约", image:"", desc:"1820年当地政府决定在原中世纪城堡遗址上建造新监狱，1823年完工，是苏格兰首批根据约翰·霍华德监狱改革理念建造的\u201c霍华德改革监狱\u201d，1868年关闭，1964年开始修复，1968年作为博物馆重新开放，是苏格兰仅存的霍华德改革监狱遗址。建筑采用当地砂岩建造，外观模仿中世纪城堡，内部是典型的乔治亚式监狱设计，注重功能性和秩序。"},
{id:154, name:"赫克瑟姆旧监狱博物馆", region:"欧洲", country:"英国", lat:54.9712, lng:-2.0863,
 address:"英格兰诺森伯兰郡赫克瑟姆镇Hexham, Northumberland", ticket:"成人约5英镑，优惠票（学生、老人）4英镑，16岁以下免费", hours:"夏季（4月至10月）开放，周二至周六10:00-16:30（最后入场16:00），冬季关闭", image:"", desc:"建于1330年至1333年间，是英格兰第一座明确为监禁目的而设计的监狱，被誉为\u201c英格兰最古老的专用监狱\u201d，从1333年启用到1820年关闭，持续运营近500年，是英格兰使用时间最长的监狱之一。1820年关闭后，被改作庄园办公室、银行、律师事务所、志愿军基地、消防瞭望塔等，1980年重新开放为博物馆，专注于展示中世纪监狱生活和边境地区的动荡历史。"},
{id:155, name:"圣约翰城堡博物馆", region:"欧洲", country:"英国", lat:54.9054, lng:-5.0266,
 address:"苏格兰邓弗里斯-加洛韦区斯特兰拉尔镇George Street", ticket:"免费入场，接受捐款支持维护", hours:"夏季（5月20日至10月31日）开放，周二至周六10:00-16:00，冬季关闭", image:"", desc:"最初由尼尼安·阿代尔于1510年左右建造，作为阿代尔家族的私人住宅，1815年斯特兰拉尔镇议会购得，1820年改造完成后正式成为斯特兰拉尔监狱，1907年关闭，20世纪80年代由邓弗里斯和加洛韦议会修复，1989年并入斯特兰拉尔博物馆，1990年作为历史遗址正式开放。城堡原有的四层结构被调整，顶层两层改成六间牢房，顶部改建成露天活动场，保留了中世纪的厚墙和狭窄楼梯。"},
{id:156, name:"伊甸营现代历史博物馆", region:"欧洲", country:"英国", lat:54.1356, lng:-0.7925,
 address:"英格兰北约克郡马尔顿市Eden Camp, Malton, North Yorkshire, YO17 6RT", ticket:"成人19英镑，在线17英镑", hours:"3月29日-11月2日主季开放，每日10:00-17:00，最后入场16:00。冬季关闭（11月-次年2月中）", image:"", desc:"博物馆坐落在一座真实的二战战俘营遗址内，1942年初由英国陆军部建成，编号为\u201c战俘营83\u201d，最初用于关押意大利战俘，1943年底改为波兰部队临时驻地，1944年中至1949年关押德国战俘。1985年由当地商人斯坦·约翰逊购得，1987年3月21日作为博物馆开放，是全球首座现代历史主题博物馆，保留了33座原始营房，以二战为核心主题，扩展至20世纪其他冲突。"},
{id:157, name:"兰开斯特城堡", region:"欧洲", country:"英国", lat:54.049938, lng:-2.805279, address:"英格兰兰开斯特市", ticket:"门票为成人8 英镑，需提前在线预订（www.lancastercastle.com）", hours:"兰开斯特城堡博物馆每日10:00-16:00 开放（最后入场15:00）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/040_兰开斯特城堡.jpeg", desc:"兰开斯特城堡（Lancaster Castle）位于英格兰兰开斯特市，这座城堡集诺曼时代防御工事、中世纪法庭和维多利亚时代监狱功能于一体，拥有近千年的司法与监禁历史。2011 年监狱关闭后，城堡部分区域转型为博物馆向公众开放，2019 年修复工程完成后全面开放，被列为英国一级保护建筑和受保护古迹。"},
{id:158, name:"约克债务人监狱博物馆", region:"欧洲", country:"英国", lat:53.9600, lng:-1.0873,
 address:"约克市约克城堡遗址内，靠近克利福德塔", ticket:"成人票价约13英镑，儿童和学生有折扣，年票可用", hours:"全年开放，通常每日10:00-17:00（冬季可能调整）", image:"", desc:"建于1701-1705年间，是英国第一座专为债务人设计的监狱，1952年被纳入约克城堡博物馆，1966年部分修复，1969年与女子监狱合并。监狱采用早期英国巴洛克风格，被列为英国一级保护建筑，著名囚犯包括公路强盗迪克·特平，1801-1896年间共有153名男子和7名女子在此被绞死。"},
{id:159, name:"约克女子监狱", region:"欧洲", country:"英国", lat:53.9577, lng:-1.0823, address:"英格兰北约克郡约克市的一座历史建筑", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/048_约克女子监狱.jpeg", desc:"约克女子监狱（Female Prison, York）是位于英格兰北约克郡约克市的一座历史建筑，最初作为女子监狱使用，现为约克城堡博物馆的一部分。约克女子监狱建于1780-1783 年，建筑为新古典主义风格。"},
{id:160, category:"hotel", name:"布赖德韦尔卡罗短租公寓", region:"欧洲", country:"英国", lat:53.4084, lng:-2.9898, address:"利物浦Cheapside", ticket:"60英镑起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/8.%E5%B8%83%E8%B5%96%E5%BE%B7%E9%9F%A6%E5%B0%94%E5%8D%A1%E7%BD%97%E7%9F%AD%E7%A7%9F%E5%85%AC%E5%AF%93%EF%BC%88Caro%20Short%20Stay%20Main%20Bridewell%EF%BC%89.jpg", desc:"前身为布赖德韦尔监狱（Main Bridewell Prison），1864年投入使用，1997年关闭，2015年该公寓开业。保留了牢房、铁门和中庭等监狱元素。"},
{id:161, name:"博马里斯监狱博物馆", region:"欧洲", country:"英国", lat:53.2644, lng:-4.0893,
 address:"威尔士安格尔西岛博马里斯镇Steeple Lane, Beaumaris, LL58 8EP", ticket:"成人约7英镑，儿童和老人有折扣，家庭票约20英镑", hours:"夏季（3月底至10月底）开放，每日10:00-17:00，秋季可能提前关闭（16:00）。冬季关闭，但接受团体预约", image:"", desc:"建于1829年，是威尔士安格尔西地区的一座地方监狱，1829年启用，最初设计容量约20名囚犯，1867年进行重大扩建，容量增至约30人，1878年关闭，囚犯被转移至卡那封监狱。关闭后被改作警察局、儿童诊所，二战期间安装了防空警报器，1974年由安格尔西郡议会改建为博物馆向公众开放。监狱是典型的维多利亚式建筑，拥有英国仅存的仍在原位的惩罚性踏车。"},
{id:162, name:"英国国家司法博物馆", region:"欧洲", country:"英国", lat:53.263265, lng:-4.095104, address:"Cheapside, Liverpool房价：60 英镑起/ 晚", ticket:"门票为成人13.25 英镑，联合“洞穴之城”票价有折扣", hours:"周一至周日10:00-17:00（11 月4 日-2 月14 日16:00关闭）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/045_英国国家司法博物馆.jpeg", desc:"英国国家司法博物馆（National Justice Museum）坐落于诺丁汉花边市场（Lace Market）区的二级保护建筑——原郡法院和郡监狱（Shire Hall and County Gaol）内。是英国保存最完好的维多利亚时代司法建筑之一，通过互动展览和戏剧表演，生动再现了从诺曼时代到现代的犯罪与惩罚故事。"},
{id:163, name:"林肯城堡博物馆", region:"欧洲", country:"英国", lat:53.2294, lng:-0.5377,
 address:"林肯市Castle Hill", ticket:"成人约15英镑，儿童6英镑，家庭票约36英镑", hours:"每日10:00-17:00开放（冬季至16:00）", image:"", desc:"由威廉一世于1068年下令建造，最初作为军事要塞，从18世纪起逐渐转型为司法中心，监狱功能成为核心角色。1787年在城堡东南角建造新监狱，1848年建成更大的维多利亚式监狱，1878年监狱关闭。2012-2015年\u201c林肯城堡揭秘\u201d项目修复了监狱和城墙，使其成为全面的博物馆景点，监狱部分是核心展览之一，展示19世纪监狱生活。"},
{id:164, name:"因弗雷监狱", region:"欧洲", country:"英国", lat:53.139345, lng:-4.276844, address:"苏格兰阿盖尔·比特郡因弗雷镇教堂广场", ticket:"门票为成人16 英镑", hours:"因弗雷监狱博物馆每日10:00-17:00 开放（最后入场16:00）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/046_因弗雷监狱.jpeg", desc:"因弗雷监狱（Inveraray Jail）位于苏格兰阿盖尔·比特郡因弗雷镇，是一座保存完好的19 世纪监狱和法院建筑群。如今作为博物馆对外开放。"},
{id:165, name:"鲁辛监狱博物馆", region:"欧洲", country:"英国", lat:53.1146, lng:-3.3108,
 address:"威尔士登比郡鲁辛镇Clwyd Street 46号", ticket:"成人约5英镑，儿童3英镑，家庭票约15英镑", hours:"每年3月底至9月底开放，周三至周六10:00-17:00（最后入场16:00）。秋冬关闭日常参观，但可接受团体预约和特别活动", image:"", desc:"前身是1654年建造的惩教所，1774年约翰·霍华德调查后推动重建，1775年开工建造新监狱，1779年完工，1781年正式启用，被视为当时登比郡的\u201c模范监狱\u201d。1870年代扩建，新增四层翼楼，模仿伦敦本顿维尔监狱的辐射式设计，1878年4月1日正式成为皇家监狱，1916年因一战关闭，1926年被登比郡议会购置用作办公室、档案馆和图书馆，2004年经过大规模翻修后作为博物馆重新开放，由登比郡议会文化服务部门管理。"},
{id:166, name:"牛津城堡与监狱", region:"欧洲", country:"英国", lat:53.113958, lng:-3.313783, address:"牛津市牛津城堡44-46", ticket:"门票为成人16.20英镑", hours:"牛津城堡& 监狱博物馆每日10:00-17:00 开放", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/042_牛津城堡与监狱.jpeg", desc:"牛津城堡& 监狱（Oxford Castle & Prison）融合了中世纪城堡与维多利亚时代监狱的双重身份，承载了从诺曼征服到现代的千年历史。它始建于1071 年，1996 年其监狱关闭，2004 年作为博物馆向公众开放，被列入英国一级保护建筑和受保护古迹。"},
{id:167, name:"克鲁姆林路监狱博物馆", region:"欧洲", country:"英国", lat:52.940657, lng:-3.63365, address:"北爱尔兰贝尔法斯特克鲁姆林路53-55 号（53-55 CrumlinRd, Belfast BT14 6ST）", ticket:"成人门票12 英镑，含导览，需在线预订（crumlinroadgaol.com）", hours:"每日10:00-16:30（夏季周五、周六延长至18:00），12 月24-26 日及1 月1 日闭馆。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/047_克鲁姆林路监狱博物馆.jpeg", desc:"克鲁姆林路监狱博物馆（Crumlin Road Gaol Museum），位于北爱尔兰贝尔法斯特北部。这座博物馆是北爱尔兰唯一的维多利亚时代监狱遗址，运营时间为1846 年至1996 年。"},
{id:168, name:"德比监狱博物馆", region:"欧洲", country:"英国", lat:52.9225, lng:-1.4746,
 address:"德比市Friar Gate 50-51号地下", ticket:"每周六11:00-15:00开放，门票约3英镑，16岁以下1英镑。私密导览（10人以上）每人10英镑", hours:"每周六11:00-15:00，其他时间需电话预订（01335 360 882）", image:"", desc:"历史上德比市内有五座监狱，公众通常将其与1756年至1846年间位于弗赖尔门的监狱联系在一起，这座监狱1756年建成，1846年关闭，部分遗迹保存至今。1997年由超自然研究者兼历史学家理查德·费利克斯购置了弗赖尔门50-51号地下室遗址，修复为博物馆，尽可能恢复其原始状态，专注于展示监狱历史和超自然传说。"},
{id:169, name:"莱斯特市政厅", region:"欧洲", country:"英国", lat:52.6349, lng:-1.1294, address:"104 Grove Road, The Grove, Portland, Dorset", ticket:"免费开放", hours:"（周二至周六11:00-16:00），冬季关闭（12月22 日- 次年2 月3 日）。格罗夫监狱博物馆（Grove Prison Museum）位于英格兰多塞特郡波特兰岛的格罗夫村，是一座小型博物馆，展示波特兰监狱（HMPrison Portland）的历史。博物馆在原监狱副监狱长的住宅内，紧邻现役监狱HM Prison Portland 的大门。免费开放。1848 年，波特兰监狱作为一座成人重刑犯监狱开放，首批64 名囚犯于1848 年11 月21 日抵达，起初他们开采花岗岩，建设波特兰港的防波堤。1921 年改为少年犯教养院，2011 年起兼收成年和青年罪犯。格罗夫监狱博物馆于2014 年3 月开放，由三位退休狱警发起并运营，展陈波特兰监狱的历史。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/049_莱斯特市政厅.jpeg", desc:"600 年历史的莱斯特市政厅（Leicester Guildhall）东翼内有三间牢房，为1836 年改建。免费对外参观，保留原牢房以及铁门。"},
{id:170, name:"诺里奇城堡博物馆", region:"欧洲", country:"英国", lat:52.6309, lng:1.2974,
 address:"诺里奇市中心Castle Hill", ticket:"成人约10英镑，儿童5英镑，家庭票约25英镑", hours:"周一至周六10:00-16:30，周日11:00-16:30开放（冬季可能调整）", image:"", desc:"由威廉一世于1066年后下令建造，最初作为军事要塞和皇家宫殿，从中世纪后期起逐渐转型为监狱和司法中心。1792年在城堡东侧建造新监狱，1824年建成更大的维多利亚式监狱，1887年监狱关闭，1894年诺里奇城堡博物馆正式开放。监狱部分作为博物馆的重要展区，保留了维多利亚时代的建筑特色，展示18-19世纪监狱生活。"},
{id:171, name:"温德姆布赖德韦尔遗产博物馆", region:"欧洲", country:"英国", lat:52.5719, lng:1.1164,
 address:"英格兰诺福克郡温德姆市", ticket:"成人票价约3-5英镑，儿童和学生有折扣，部分活动日免费", hours:"每年3月初至10月底开放，周一至周六10:00-16:00，周日13:00-16:00", image:"", desc:"现存建筑建于1785年，是英国监狱改革运动的重要产物，受约翰·霍华德的\u201c模范监狱\u201d理念影响，是英国乃至美国许多新监狱的原型。1619年最初的布赖德韦尔建立，1779年约翰·霍华德访问后推动重建，1785年新监狱启用，1825年关闭，1832年重新开放为诺福克女子惩教所，1878年彻底停止作为监狱使用。1996年改造为遗产博物馆开放，由温德姆遗产协会运营。"},
{id:172, name:"白金汉旧监狱博物馆", region:"欧洲", country:"英国", lat:52.0000, lng:-0.9877,
 address:"英格兰白金汉郡白金汉镇Market Hill", ticket:"成人约4英镑，儿童2英镑，5岁以下免费，家庭票9.5英镑", hours:"每周一至周六10:00-16:00开放，最后入场时间为15:30。周日关闭，节假日可能调整", image:"", desc:"始建于1748年，1747年议会通过法案授权建造，由当地贵族科巴姆子爵斥资约7000英镑建造，1748年启用后成为白金汉镇的地方监狱，同时兼具普通监狱和惩教所的功能，1878年《1877年监狱法》将英国监狱国有化后逐渐关闭，1890年新警察局建成后正式停用。此后被用作军械库、警察局、消防站、公共厕所、古董店和咖啡馆，1993年由白金汉遗产信托会改建成博物馆开放。"},
{id:173, category:"hotel", name:"牛津马尔梅森监狱酒店（Malmaison Oxford）", region:"欧洲", country:"英国", lat:51.7519, lng:-1.2628, address:"牛津市牛津城堡44-46", ticket:"188英镑起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/4.%20%E7%89%9B%E6%B4%A5%E9%A9%AC%E5%B0%94%E6%A2%85%E6%A3%AE%E7%9B%91%E7%8B%B1%EF%BC%88Malmaison%20Oxford%EF%BC%89.webp", desc:"前身为牛津城堡和监狱（Oxford Castle & Prison），始建于1071年，1996年监狱关闭。保留了牢房门、铁栅窗和部分石墙，地下室C Wing保留原始牢房布局供参观。"},
{id:174, category:"hotel", name:"Clink 78旅馆", region:"欧洲", country:"英国", lat:51.5283, lng:-0.1142, address:"伦敦国王十字区78 King's Cross Road", ticket:"12英镑起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/6.Clink%2078%E6%97%85%E9%A6%86.jpg", desc:"前身为克勒肯韦尔地方法院，1847年建成。朋克乐队The Clash成员曾在此受审。部分客房改自原拘留所牢房，保留了厚重的铁门、铁栏窗和砖墙。"},
{id:175, category:"hotel", name:"法院大楼酒店（Courthouse Hotel London）", region:"欧洲", country:"英国", lat:51.5148, lng:-0.1382, address:"伦敦大马尔伯勒街19-21号", ticket:"169英镑起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/5.%E6%B3%95%E9%99%A2%E5%A4%A7%E6%A5%BC%E9%85%92%E5%BA%97%EF%BC%88Courthouse%20Hotel%20London%EF%BC%89.jpg", desc:"前身为大马尔伯勒街地方法院附带的临时拘留所，1820年启用，1998年关闭。酒吧内设有三间原女性拘留室，改造为私人包厢，保留铁门和简陋内部结构。"},
{id:176, name:"伦敦塔", region:"欧洲", country:"英国", lat:51.508217, lng:-0.076188, address:"泰晤士河畔的城市心脏地带塔浜区伦敦塔码头（Tower Hill, London EC3N 4AB）", ticket:"成人门票为￡34.80，含王冠展览", hours:"夏季（3 月1 日-10 月31 日）：周二至周六9:00-17:30，周日、周一10:00-17:30。冬季（11 月1 日-2 月28 日）：周二至周六9:00-16:30，周日、周一10:00-16:30。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/039_伦敦塔.jpeg", desc:"伦敦塔（Tower of London），正式名称为“国王陛下的皇家宫殿与伦敦塔堡垒”（His Majesty's Royal Palace and Fortress of theTower of London），位于泰晤士河畔的城市心脏地带塔浜区伦敦塔码头（Tower Hill, London EC3N 4AB）。从这座塔楼的窗户向外望去，可以看到繁忙的伦敦市区。"},
{id:177, name:"伦敦克林克监狱博物馆", region:"欧洲", country:"英国", lat:51.5075, lng:-0.0917, address:"英国伦敦南华克区克林克街1 号（1 Clink Street, London SE1 9DG）", ticket:"成人门票为￡8.8，含免费入监照", hours:"夏季（7-9 月）：每日10:00-21:00；冬季（10-6 月）：周一至周五10:00-18:00，周末10:00-19:30。12 月25 日闭馆。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/038_伦敦克林克监狱博物馆.jpeg", desc:"伦敦克林克监狱博物馆（The Clink Prison Museum）位于英国伦敦南华克区克林克街1 号（1 Clink Street, London SE1 9DG），靠近泰晤士河南岸的班克赛德。这座博物馆建于英格兰最古老监狱——克林克监狱（The Clink）原址之上，以展示中世纪监狱历史和互动式展览而广受欢迎。"},
{id:178, name:"米尔班克监狱", region:"欧洲", country:"英国", lat:51.495, lng:-0.128, address:"伦敦晤士河畔威斯敏斯特区米尔班克路", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/041_米尔班克监狱.jpeg", desc:"米尔班克监狱，全称米尔班克国家感化院（Millbank NationalPenitentiary），原址位于伦敦晤士河畔威斯敏斯特区米尔班克路，它不仅是英国第一座感化院，也是世界监狱走向现代化的第一个里程碑式实验。从1816 年运营至1890 年，1892 年起逐步拆除，原址目前为泰特英国美术馆等。"},
{id:179, name:"西门塔博物馆", region:"欧洲", country:"英国", lat:51.2802, lng:1.0789,
 address:"坎特伯雷市高街西端，毗邻西门花园", ticket:"成人票价约4英镑，儿童和学生有折扣", hours:"通常每周一至周六11:00-16:00开放，具体时间可能因季节或维护调整", image:"", desc:"始建于1379年左右，是坎特伯雷七座中世纪城门中唯一幸存至今的遗迹，1453年起被授权设立监狱，从15世纪到19世纪一直是城市监狱，1868年正式关闭，1906年正式改为博物馆。建筑采用当地拉格石砌成，高约18米，由两座圆形鼓塔组成，中间是拱形通道，18个射击孔是英国最早在城门中加入火器防御的设计之一。"},
{id:180, name:"谢普顿马利特监狱博物馆", region:"欧洲", country:"英国", lat:51.1898, lng:-2.5474,
 address:"英格兰萨默塞特郡谢普顿马利特镇Frithfield Lane", ticket:"导览游票价约15-20英镑", hours:"每日10:00-17:00（视季节调整）", image:"", desc:"始建于1625年，是英国历史最悠久的仍在运营的监狱之一（2013年关闭时），1624年萨默塞特郡决定建造，1625年完工，最初作为感化院，1843年成为萨默塞特郡的县监狱，1930年关闭，1939年二战爆发后作为英国军事监狱重启，1942-1945年由美国接管作为纪律训练中心，1966年恢复为民事监狱，2001年转为C级终身监禁监狱，2013年3月28日正式关闭，结束近400年的监狱历史，随后开放自助游、导览游和鬼魂探险。"},
{id:181, name:"达特穆尔监狱博物馆", region:"欧洲", country:"英国", lat:50.549841, lng:-3.999332, address:"英格兰德文郡普林斯镇达特穆尔国家公园", ticket:"门票为成人5 英镑", hours:"达特穆尔监狱博物馆3 月中至10 月底每日9:30-16:30 开放，冬季仅周五至周日开放。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/044_达特穆尔监狱博物馆.jpeg", desc:"达特穆尔监狱博物馆（Dartmoor Prison Museum）位于英格兰德文郡普林斯镇，是一座展示达特穆尔监狱200 多年历史的博物馆，坐落在达特穆尔国家公园的高沼地带，与仍在运营的达特穆尔监狱仅一墙之隔。达特穆尔监狱的历史始于1805 年，当时英国正与拿破仑交战，大量战俘被关押在普利茅斯的“监狱船”（Hulks）中，条件恶劣，死亡率高企。"},
{id:182, name:"英国波德明监狱", region:"欧洲", country:"英国", lat:50.474729, lng:-4.728527, address:"英格兰康沃尔郡波德明镇Berrycoombe 路", ticket:"门票为成人20 英镑，需在线预订（www.bodminjail.org）", hours:"波德明监狱博物馆每日9:30-20:30 开放", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/043_英国波德明监狱.jpeg", desc:"波德明监狱（Bodmin Jail）位于英格兰康沃尔郡波德明镇，是一座承载着乔治时代和维多利亚时代犯罪与惩罚历史的监狱遗址。这座监狱始建于1779 年，关闭于1927 年。"},
{id:183, category:"hotel", name:"波德明监狱酒店（Bodmin Jail Hotel）", region:"欧洲", country:"英国", lat:50.4669, lng:-4.7192, address:"康沃尔郡波德明镇Berrycoombe路", ticket:"200英镑起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/7.%E8%8B%B1%E5%9B%BD%E6%B3%A2%E5%BE%B7%E6%98%8E%E7%9B%91%E7%8B%B1%EF%BC%88Bodmin%20Jail%20Hotel%EF%BC%89.jpg", desc:"前身为波德明监狱，1779年启用，1927年关闭。2021年重新开放，分为博物馆和酒店两部分。70间豪华客房由牢房合并改造，保留铁窗和厚重石墙。"},
{id:184, category:"hotel", name:"阿里比青年旅舍（Alibi Hostel）", region:"欧洲", country:"荷兰", lat:53.2035, lng:5.7983, address:"吕伐登Blokhuisplein 40", ticket:"25欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/19.%E9%98%BF%E9%87%8C%E6%AF%94%E9%9D%92%E5%B9%B4%E6%97%85%E8%88%8D%EF%BC%88Alibi%20Hostel%EF%BC%89.jpg", desc:"前身为1580年启用（1870年重建）的Blokhuispoort监狱，2007年关闭。保留了牢房、画廊和红砖外墙等元素，并设有Blokhuispoort博物馆展示历史。"},
{id:185, category:"hotel", name:"法伦酒店（The Fallon Hotel）", region:"欧洲", country:"荷兰", lat:52.6306, lng:4.746, address:"阿尔克马尔市Prins Bernhardlaan 16", ticket:"80欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/16.%E6%B3%95%E4%BC%A6%E9%85%92%E5%BA%97%EF%BC%88The%20Fallon%20Hotel%EF%BC%89.png", desc:"前身为1884年启用的舒特斯韦看守所，2013年关闭。保留了牢房、铁门、走廊等，中央大厅和瞭望塔也保持原始结构。"},
{id:186, category:"hotel", name:"劳埃德酒店（Lloyd Hotel）", region:"欧洲", country:"荷兰", lat:52.3747, lng:4.9355, address:"阿姆斯特丹东部码头区Oostelijke Handelskade 34", ticket:"90欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/15.%E5%8A%B3%E5%9F%83%E5%BE%B7%E9%85%92%E5%BA%97%EF%BC%88Lloyd%20Hotel%20%EF%BC%89.jpg", desc:"前身为劳埃德移民拘留中心（1921年建成），1930年代用作少年监狱。保留了建筑外墙和部分内部结构，弱化监狱氛围，更多融入艺术设计。酒店内有文化展览区。"},
{id:187, category:"hotel", name:"看守所酒店（Huis van Bewaring Hotel）", region:"欧洲", country:"荷兰", lat:52.3567, lng:6.6633, address:"阿尔梅洛市Marktstraat 7", ticket:"70欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/18.%E7%9C%8B%E5%AE%88%E6%89%80%E9%85%92%E5%BA%97%EF%BC%88Huis%20van%20Bewaring%20Hotel%20%EF%BC%89.jpg", desc:"前身为1888年启用的阿尔梅洛看守所，1995年关闭。2006年酒店开业。保留了牢房、画廊和红砖外墙等元素。"},
{id:188, name:"荷兰·海牙监狱博物馆", region:"欧洲", country:"荷兰", lat:52.081729, lng:4.327321, address:"海牙市布滕霍夫街33 号（Buitenhof 33, 2513 AH DenHaag）", ticket:"成人门票为15 欧元，博物馆卡免费通行，含联合入口至威廉五世画廊", hours:"周二至周五10:00-17:00，周六、周日及学校假期周一11:00-17:00（16:30 停止入场）。12 月25 日闭馆。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/061_荷兰·海牙监狱博物馆.jpeg", desc:"海牙监狱博物馆（Museum de Gevangenpoort），正式名称为“监狱之门国家博物馆”（Rijksmuseum de Gevangenpoort），位于海牙市布滕霍夫街33 号，毗邻荷兰议会大厦和霍夫维弗湖。是荷兰现存最古老的监狱建筑之一。"},
{id:189, name:"哈勒姆圆顶监狱", region:"欧洲", country:"荷兰", lat:51.98511, lng:5.878352, address:"哈勒姆Koepelplein 1", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/062_哈勒姆圆顶监狱.jpeg", desc:"哈勒姆圆顶监狱（Koepel Gevangenis Haarlem）位于北荷兰省的哈勒姆市，是荷兰三座采用边沁圆形监狱理念设计的监狱之一，如今化身为充满活力的公共空间。哈勒姆圆顶监狱始建于1899 年，建筑师为威廉·梅茨拉尔（WillemMetzelaar），他延续了父亲约翰·弗雷德里克·梅茨拉尔（JohanFrederik Metzelaar）在布雷达和阿纳姆的圆形监狱风格，建造了荷兰的第三座圆形监狱，建筑主体是一个直径约55米的圆形结构，高37.6米，顶部覆盖钢架圆顶，中央耸立一座瞭望塔，狱警可从塔内俯瞰四周的四层环形牢房，共约400 间单人牢房（…"},
{id:190, name:"布里尔历史博物馆", region:"欧洲", country:"荷兰", lat:51.9068, lng:4.1627, address:"荷兰布里尔市场街1 号", ticket:"成人门票为7.5 欧元", hours:"周二至周六10:00-17:00，周日12:00-17:00，周一及法定节假日闭馆。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/063_布里尔历史博物馆.jpeg", desc:"布里尔历史博物馆（Historisch Museum Den Briel）位于荷兰布里尔市中心，紧邻古老的市政厅广场。博物馆所在建筑前身为荷兰南部的主要监狱之一。"},
{id:191, name:"芬赫伊曾国家监狱博物馆", region:"欧洲", country:"荷兰", lat:51.442529, lng:7.004743, address:"荷兰德伦特省芬赫伊曾村镇老运河路1 号（Oude Gracht 1, 9341 AA Veenhuizen）", ticket:"成人门票为11 欧元，停车免费", hours:"为周二至周日10:00-17:00（学校假期期间每天开放）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/064_芬赫伊曾国家监狱博物馆.jpeg", desc:"芬赫伊曾国家监狱博物馆（Nationaal Gevangenis museum）位于荷兰德伦特省芬赫伊曾镇（Veenhuizen Drenthe），坐落于一个曾是贫民收容所和监狱的建筑群内。芬赫伊曾监狱博物馆的历史可追溯到1818 年，当时荷兰“慈善协会”在此建立慈善定居点，目的是通过有规划的开荒种地来帮助贫民、孤儿和流浪者。"},
{id:192, category:"hotel", name:"赫塔利耶监狱酒店（Hotel Het Arresthuis）", region:"欧洲", country:"荷兰", lat:51.192, lng:5.989, address:"鲁尔蒙德市Pollartstraat 7", ticket:"90欧元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/17.%E8%B5%AB%E5%A1%94%E5%88%A9%E8%80%B6%E7%9B%91%E7%8B%B1%E9%85%92%E5%BA%97%EF%BC%88Hotel%20Het%20Arresthuis%EF%BC%89.jpg", desc:"前身为鲁尔蒙德监狱（1863年建成），2007年关闭。42间客房由原牢房改造，保留了牢房门、铁窗和走廊结构。"},
{id:193, name:"葡萄牙·佩尼谢堡垒监狱博物馆", region:"欧洲", country:"葡萄牙", lat:38.697122, lng:-9.208026, address:"葡萄牙西海岸佩尼谢市佩尼谢堡垒（Forte dePeniche, 2520-630 Peniche）", ticket:"成人门票为6 欧元", hours:"每日9:00-18:00（17:30 停止入场），冬季（11 月-2 月）至17:00，周一闭馆。建议查阅", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/090_葡萄牙·佩尼谢堡垒监狱博物馆.jpeg", desc:"佩尼谢堡垒监狱博物馆（Museu Nacional Resistência eLiberdade）位于葡萄牙西海岸佩尼谢市佩尼谢堡垒（Forte dePeniche, 2520-630 Peniche），距离里斯本约100 公里，是葡萄牙16世纪军事堡垒的遗址，在安东尼奥·萨拉查独裁政权下作为“新国家”政治监狱。佩尼谢堡垒始建于1557 年，由葡萄牙国王若昂三世下令兴建，作为抵御海盗与敌军入侵的军事要塞。"},
{id:194, name:"西班牙·莫雷利亚监狱", region:"欧洲", country:"西班牙", lat:40.6189, lng:-0.1012, address:"Pla?a de Jaume I, s/n, Castelló d’Empúries）", ticket:"门票价格约1.5 欧元，周二下午免费", hours:"为每日10:00-14:00 及16:00-18:00（冬季可能调整）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E8%A5%BF%E7%8F%AD%E7%89%99%E8%8E%AB%E9%9B%B7%E5%88%A9%E4%BA%9A%E7%9B%91%E7%8B%B1.jpg", desc:"西班牙莫雷利亚监狱（Prisión de Morella）位于卡斯特利翁省莫雷利亚市，是一座保存完好的中世纪监狱，作为博物馆向公众开放。莫雷利亚连接埃布罗河谷与地中海沿岸，是当时瓦伦西亚王国军事与贸易的要冲。"},
{id:195, name:"阿尔巴尼亚·见证与记忆遗址博物馆", region:"欧洲", country:"阿尔巴尼亚", lat:45.796547, lng:24.150656, address:"阿尔巴尼亚斯库台斯坎德培大道（Bulevardi Sk?nderbeu,Shkod?r 4001）", ticket:"门票：成人200 列克，含英语或阿尔巴尼亚语导览", hours:"周二至周日9:00-17:00，周一闭馆（建议电话确认：+355 22249231）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/095_阿尔巴尼亚·见证与记忆遗址博物馆.jpeg", desc:"见证与记忆遗址博物馆（Site of Witness and Memory Museum）位于阿尔巴尼亚北部，风景秀丽的斯库台（Shkod?r），靠近市中心的圣斯蒂芬大教堂。它是共产主义时期（1946-1991）斯库台内政部地方分部的所在地，曾是政治犯的审讯和拘留中心。"},
{id:196, name:"加纳·开普海岸城堡", region:"非洲", country:"加纳", lat:-4.797537, lng:11.85033, address:"加纳开普海岸市维多利亚路（Victoria Rd, Cape Coast,Ghana）", ticket:"成人门票40 塞地（约6 美元），含导览（英语为主）", hours:"与", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/136_%E5%8A%A0%E7%BA%B3%C2%B7%E5%BC%80%E6%99%AE%E6%B5%B7%E5%B2%B8%E5%9F%8E%E5%A0%A1.jpeg", desc:"开普海岸城堡（Cape Coast Castle）在加纳开普市的大西洋沿岸，是一座白色墙壁的堡垒，俯瞰着波涛汹涌的海岸线。该堡垒最初由瑞典人于1653 年建造，名为卡洛斯堡，后几经易手。"},
{id:197, name:"南非·罗本岛与曼德拉", region:"非洲", country:"南非", lat:-33.906754, lng:18.422448, address:"南非西开普省桌湾的罗本岛", ticket:"门票：成人票价约600 兰特（约35 美元），官网（www.robben-island.org.za）或V&A 码头购票", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/133_%E5%8D%97%E9%9D%9E%C2%B7%E7%BD%97%E6%9C%AC%E5%B2%9B%E4%B8%8E%E6%9B%BC%E5%BE%B7%E6%8B%89.jpeg", desc:"罗本岛监狱博物馆（Robben Island Museum）位于南非西开普省桌湾的罗本岛，距离开普敦布劳伯格斯特兰德海岸约10 公里，前身为罗本岛监狱。罗本岛的名字来源于荷兰语“Robben”，意为“海豹”，因为该岛周边水域曾有许多海豹。"},
{id:198, name:"塞内加尔·戈雷岛奴隶之家", region:"非洲", country:"塞内加尔", lat:14.693425, lng:-17.447938, address:"塞内加尔戈雷岛的东南角", ticket:"门票约500 西非法郎（约1 美元），提供英语和法语导览", hours:"每日开放（8:00-18:00，冬季至17:00）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/135_%E5%A1%9E%E5%86%85%E5%8A%A0%E5%B0%94%C2%B7%E6%88%88%E9%9B%B7%E5%B2%9B%E5%A5%B4%E9%9A%B6%E4%B9%8B%E5%AE%B6.jpeg", desc:"戈雷岛奴隶之家（House of Slaves, ?le de Gorée）位在塞内加尔戈雷岛的东南角，是一座粉红色外墙的双层小楼。始建于1776 年，占地约200 平方米，是西非奴隶贸易大西洋航线上的重要中转站。"},
{id:199, name:"自由公园", region:"非洲", country:"尼日利亚", lat:6.5244, lng:3.3792, address:"拉各斯岛市布罗德街", ticket:"", hours:"", image:"", desc:""},
{id:200, name:"尼日利亚·巴达格里奴隶监狱", region:"非洲", country:"尼日利亚", lat:5.376079, lng:-4.082451, address:"Rua do Museu da Escravatura, Luanda, Angola", ticket:"门票约500 奈拉（约1.2 美元）", hours:"为每日8:00-18:00", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/137_%E5%B0%BC%E6%97%A5%E5%88%A9%E4%BA%9A%C2%B7%E5%B7%B4%E8%BE%BE%E6%A0%BC%E9%87%8C%E5%A5%B4%E9%9A%B6%E7%9B%91%E7%8B%B1.jpeg", desc:"巴达格里是尼日利亚一座历史悠久的港口小镇，位于拉各斯州以西约45 公里，靠近贝宁共和国边境，是16 至19 世纪大西洋奴隶贸易的重要港口之一。奴隶贸易遗迹散布于小镇各处，包括巴达格里遗产博物馆、塞里基·法雷米·威廉姆斯·阿巴斯奴隶博物馆（SerikiFaremi Williams Abass Slave Museum）以及“不归门”（Point ofNo Return）。"},
{id:201, name:"摩洛哥·卡斯巴当代艺术博物馆", region:"非洲", country:"摩洛哥", lat:36.784471, lng:3.057846, address:"丹吉尔老城麦地那最高处的卡斯巴堡垒区", ticket:"", hours:"每周一至周日10:00-18:00 开放", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/134_%E6%91%A9%E6%B4%9B%E5%93%A5%C2%B7%E5%8D%A1%E6%96%AF%E5%B7%B4%E5%BD%93%E4%BB%A3%E8%89%BA%E6%9C%AF%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"摩洛哥丹吉尔的卡斯巴当代艺术博物馆（Museum of ContemporaryArt in the Kasbah）是一座由17 世纪的监狱改建而成的文化空间。这座博物馆位于丹吉尔老城麦地那最高处的卡斯巴堡垒区，2021 年12 月23 日开放。"},
{id:202, name:"多切斯特监狱（Dorchester Jail）民宿", region:"北美", country:"加拿大", lat:45.9, lng:-64.3, address:"", ticket:"", hours:"", image:"", desc:""},
{id:203, name:"皮耶杜库朗监狱", region:"北美", country:"加拿大", lat:45.498697, lng:-73.579385, address:"蒙特利尔市903 Avenue De Lorimier（靠近圣劳伦斯河和雅克- 卡蒂埃大桥）", ticket:"门票为成人12 加元", hours:"爱国者监狱展览中心夏季（6 月24 日至9 月2 日）周二至周日10:00-17:00 开放，冬季10:00 - 16:30。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/140_%E7%9A%AE%E8%80%B6%E6%9D%9C%E5%BA%93%E6%9C%97%E7%9B%91%E7%8B%B1.jpeg", desc:"皮耶杜库朗监狱（Pied-du-Courant Prison，亦称“爱国者监狱”，Prison des Patriotes）位于蒙特利尔，始建于1831 年，1836 年启用，以关押和处决1837-1838 年下加拿大叛乱的爱国者而闻名。1912 年关闭，2017 年部分区域作为博物馆开放，是联合国教科文组织魁北克老城世界遗产的一部分。"},
{id:204, category:"hotel", name:"渥太华监狱酒店（HI Ottawa Jail Hostel）", region:"北美", country:"加拿大", lat:45.4252, lng:-75.6888, address:"渥太华市尼古拉斯路75号", ticket:"床位30加元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/3.%E6%B8%A5%E5%A4%AA%E5%8D%8E%E7%9B%91%E7%8B%B1%E9%85%92%E5%BA%97%EF%BC%88HI%20Ottawa%20Jail%20Hostel%EF%BC%89.jpg", desc:"前身为卡尔顿县监狱（Carleton County Gaol），1862年建成，1972年关闭。保留了牢房、绞刑室和铁门，部分房间仍使用原始木板床，附设小型监狱博物馆。"},
{id:205, name:"加拿大·金斯顿监狱博物馆", region:"北美", country:"加拿大", lat:44.21935, lng:-76.513473, address:"安大略省金斯顿国王街西560 号（560 King Street West,Kingston）", ticket:"票价为42.13 加元", hours:"4 月5 日-9 月22 日，每日8:00-16:30（冬季闭馆，建议", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/138_%E5%8A%A0%E6%8B%BF%E5%A4%A7%C2%B7%E9%87%91%E6%96%AF%E9%A1%BF%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"金斯顿监狱（Kingston Penitentiary）坐落在安大略省金斯顿市西郊，紧邻安大略湖。从1835 年6 月1 日的第一批囚犯入狱，到2013年9 月30 日关闭，经历了178 年的漫长历史。"},
{id:206, name:"休伦监狱博物馆", region:"北美", country:"加拿大", lat:43.7433, lng:-81.7073, address:"多伦多市河谷区 Gerrard 东街550号，1864年启用，1977年关闭，2013 年经过修复转型为Bridgepoint 健康中心的行政楼", ticket:"门票为成人10 加元，夏季（6 月1 日至9 月1 日）每日10:00-16:00 开放，冬季（9 月至次年5 月）周一至周五开放，需预约", hours:"为周二-- 周日10:00-17:00", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/141_%E4%BC%91%E4%BC%A6%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"休伦监狱（Huron Historic Gaol Museum）位于加拿大安大略省戈德里奇市维多利亚北街181 号，建于1841 年，采用八角形“全景监狱”设计。是加拿大联邦成立前（1867 年）休伦县的首座监狱，1972 年关闭。"},
{id:207, name:"布兰普顿监狱", region:"北美", country:"加拿大", lat:43.685, lng:-79.76, address:"安大略省布兰普顿市Wellington 和Main 街交叉口", ticket:"免费入场", hours:"布兰普顿监狱博物馆每日10:00-17:00 开放（周一及12 月24-26日闭馆），", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%B8%83%E5%85%B0%E6%99%AE%E9%A1%BF%E7%9B%91%E7%8B%B1.jpg", desc:"布兰普顿监狱（Brampton Jail），现为皮尔艺术画廊、博物馆与档案馆（(Peel Art Gallery, Museum and Archives, 简称PAMA) 的一部分，位于加拿大安大略省布兰普顿市。布兰普顿监狱始建于1867 年，是加拿大早期地方监狱的典型代表，原为皮尔县监狱（Peel CountyJail）。"},
{id:208, name:"古巴·青年岛模范监狱", region:"北美", country:"古巴", lat:23.14156, lng:-82.356688, address:"古巴青年岛新赫罗纳郊区的查孔村（Chacón Nueva Gerona Isla de la Juventud）", ticket:"免费开放", hours:"每日8:30-16:30，全年无休，建议提前确认。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/160_%E5%8F%A4%E5%B7%B4%C2%B7%E9%9D%92%E5%B9%B4%E5%B2%9B%E6%A8%A1%E8%8C%83%E7%9B%91%E7%8B%B1.jpeg", desc:"模范监狱（Presidio Modelo），位于古巴青年岛新赫罗纳郊区的查孔村（Chacón Nueva Gerona Isla de la Juventud），是古巴历史上最著名的监狱之一，同时是边沁全景监狱的典范。1926 年，古巴总统赫拉尔多·马查多下令在松树岛兴建监狱，命名为模范监狱。"},
{id:209, name:"墨西哥·黑宫监狱", region:"北美", country:"墨西哥", lat:13.846204, lng:100.493038, address:"墨西哥首都墨西哥城东北部爱德华多·莫利纳街113号（Calle Eduardo Molina 113）", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/159_%E5%A2%A8%E8%A5%BF%E5%93%A5%C2%B7%E9%BB%91%E5%AE%AB%E7%9B%91%E7%8B%B1.jpeg", desc:"黑宫监狱（Palacio Negro），也叫莱库姆贝里监狱（Palacio deLecumberri），位于墨西哥首都墨西哥城东北部爱德华多·莫利纳街113号（Calle Eduardo Molina 113）。1900年至1976年间作为监狱使用，现为墨西哥国家档案馆。"},
{id:210, name:"尼加拉瓜·传统与传说博物馆", region:"北美", country:"尼加拉瓜", lat:12.4378, lng:-86.8793, address:"尼加拉瓜第二大城市莱昂市中心", ticket:"门票价格为成人50 科多巴（约1.5 美元）", hours:"每天8:00-17:00 开放。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%B0%BC%E5%8A%A0%E6%8B%89%E7%93%9C%20%E4%BC%A0%E7%BB%9F%E4%B8%8E%E4%BC%A0%E8%AF%B4%E5%8D%9A%E7%89%A9%E9%A6%86.jpg", desc:"传统与传说博物馆（Museo de Tradiciones y Leyendas）位于尼加拉瓜第二大城市莱昂市中心，是一座展示尼加拉瓜民间传说和文化传统的独特博物馆，前身为臭名昭著的“La 21”监狱。“La 21”监狱建于1921 年，占地约0.5 公顷，砖石结构，有多间牢房和审讯室，顶部有瞭望塔。"},
{id:211, name:"法拉格特州立公园布里格博物馆", region:"北美", country:"美国", lat:47.9419, lng:-116.7089,
 address:"爱达荷州阿索尔市东5英里，地址13550 E. Hwy 54", ticket:"爱达荷居民7美元/车，非居民14美元/车，年票可选", hours:"公园日用区每日7:00-22:00，冬季访客中心9:00-16:00。布里格博物馆夏季开放（5月底至9月初）", image:"", desc:"法拉格特州立公园的前身是二战时期的法拉格特海军训练站，1942年开建，是当时世界第二大海军训练基地，1945年初曾短暂关押约900名德国战俘。1946年基地退役，1966年成立法拉格特州立公园。布里格博物馆位于原海军训练站的禁闭室（监狱）遗址内，展示二战时期的监狱历史和战俘相关文物。"},
{id:212, name:"黄石艺术博物馆", region:"北美", country:"美国", lat:45.7833, lng:-108.5007,
 address:"蒙大拿州比林斯市北27街401号（401 North 27th Street），可视库位于北26街505号", ticket:"得益于Art Bridges基金会的\u201c全民访问\u201d计划，入场现免费（原价成人15美元，学生6美元）", hours:"周二至周日10:00-17:00，周四延长至20:00，每月首个周五10:00-20:00，周一闭馆", image:"", desc:"成立于1964年10月，最初名为\u201c黄石艺术中心\u201d，馆址选在1884年建造的前黄石县监狱内，是蒙大拿州\u201c旗舰\u201d艺术博物馆，美国博物馆协会认证机构。1998年翻新后更名，2010年开放\u201c可视库\u201d，是全美少数向公众开放的艺术储藏设施。"},
{id:213, name:"五橡树博物馆（原华盛顿县博物馆）", region:"北美", country:"美国", lat:45.5152, lng:-122.6784,
 address:"俄勒冈州比弗顿以北，PCC洛克溪校区，地址17677 NW Springville Rd, Portland, OR 97229", ticket:"得益于Art Bridges基金会的\u201c全民访问\u201d计划，目前免费（原价成人10美元）", hours:"周三至周六10:00-17:00（周四延长至20:00），每月首个周五10:00-20:00，周一、周二闭馆（2024年12月29日起因财政危机暂时关闭）", image:"", desc:"前身为华盛顿县博物馆，2020年1月更名为五橡树博物馆，其核心历史组成部分是1853年建造的华盛顿县监狱遗址，这是华盛顿县最早的监狱建筑之一。1853年的监狱遗址在20世纪初被废弃后，1975年被纳入博物馆园区，1983年博物馆在监狱遗址附近建成新馆舍开放。"},
{id:214, name:"1897克拉克县监狱博物馆", region:"北美", country:"美国", lat:44.5605, lng:-90.5996,
 address:"威斯康星州尼尔斯维尔市休伊特街442号（442 Hewitt Street）", ticket:"成人3美元，5-18岁学生2美元，5岁以下免费", hours:"每年6月至8月的第2和第4个周日13:00-16:00（最晚15:30开始导览），其他时间需预约（715-743-2150）", image:"", desc:"建于1897年，是克拉克县第三座监狱，1974年关闭后由克拉克县历史协会接管改造成博物馆，2008年独立注册为非营利组织，2011年被列入国家历史名胜名录。监狱为三层砖砌建筑，前部为维多利亚式住宅，后部为监狱区，共24间牢房，展示克拉克县从19世纪末到20世纪的历史。"},
{id:215, name:"1811林肯县博物馆及旧监狱", region:"北美", country:"美国", lat:44.0012, lng:-69.6656,
 address:"缅因州威斯卡斯特市联邦街133号（Federal Street, Maine State Route 218）", ticket:"具体价格未公开，通常为捐款制或低价票", hours:"夏季（6月初至9月底）周六、周日12:00-16:00，冬季需电话预约（207-882-6817）", image:"", desc:"建于1811年，是缅因州现存最古老的监狱建筑之一，1820-1824年间作为缅因州第一座州立监狱使用，1953年彻底关闭，1954年由林肯县历史协会接管，次年开放为博物馆。监狱由花岗岩建成，墙厚41英寸，共12间牢房，保留了19世纪水手囚犯的涂鸦。"},
{id:216, name:"老爱达荷州教养所", region:"北美", country:"美国", lat:43.6097, lng:-116.2064, address:"爱达荷州博伊西市东教养所路2445 号（2445 OldPenitentiary Road Boise）", ticket:"成人门票为8 美元", hours:"冬季（劳动节后至阵亡将士纪念日前）：每日12:00-17:00（16:00停止入场）。夏季（阵亡将士纪念日至劳动节）：每日10:00-17:00（16:00 停止入场）。感恩节、圣诞节、元旦闭馆。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/154_%E8%80%81%E7%88%B1%E8%BE%BE%E8%8D%B7%E5%B7%9E%E6%95%99%E5%85%BB%E6%89%80.jpeg", desc:"老爱达荷州教养所（Old Idaho Penitentiary），简称“老监狱”（OldPen），位于美国爱达荷州博伊西市中心东南，为爱达荷州第一座监狱。从1872 年到1973 年关闭，运营了101 年。"},
{id:217, name:"赫基默县1834年监狱博物馆", region:"北美", country:"美国", lat:43.0262, lng:-74.9852,
 address:"纽约州赫基默市北主街320号（320 N. Main Street, Herkimer, NY 13350）", ticket:"免费，接受捐款", hours:"不定期开放，需通过\u201c赫基默县历史遗迹之友\u201d脸书页面或电话315-866-6413预约", image:"", desc:"建于1834-1835年间，是赫基默县第二座监狱，1972年被列入国家历史名胜名录，1910年代逐渐废弃，1972年由赫基默县历史协会接管开放为博物馆。监狱采用联邦风格，是美国财政部长弗朗西斯·埃利亚斯·斯宾纳监督建造的，曾关押著名罪犯切斯特·吉列特（小说《美国悲剧》原型）、罗克萨拉娜·德鲁斯（纽约州最后一位被绞死的女性）。"},
{id:218, name:"迪比克县老监狱博物馆", region:"北美", country:"美国", lat:42.5006, lng:-90.6646,
 address:"爱荷华州迪比克市东8街36号（36 East 8th Street, Dubuque, IA 52001）", ticket:"（博物馆时期）成人5美元，学生和老人3美元，12岁以下免费", hours:"（博物馆时期）每年阵亡将士纪念日至劳动节，周三至周日11:00-16:00", image:"", desc:"建于1857-1858年间，是迪比克县第三座监狱，1972年被列入国家历史名胜名录，1987年被指定为国家历史地标，是美国仅存的三座埃及复兴风格建筑之一。1971年关闭后，1975年由迪比克艺术协会租赁改造成博物馆，2003年租约到期后由迪比克县历史协会接管创建\u201c老监狱博物馆\u201d，2016年改建为县办公楼，牢房区作为历史遗迹保留。"},
{id:219, category:"hotel", name:"自由酒店（The Liberty Hotel）", region:"北美", country:"美国", lat:42.3617, lng:-71.0705, address:"波士顿查尔斯路215号", ticket:"250美元/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/1.%20%E8%87%AA%E7%94%B1%E9%85%92%E5%BA%97%EF%BC%88The%20Liberty%20Hotel%EF%BC%89.jpg", desc:"前身为1851年建成的查尔斯街监狱（Charles Street Jail），1990年关闭，非裔美国人民权运动家马尔科姆·X曾在此关押。酒店保留了监狱的中央圆形大厅、瞭望塔和部分牢房墙，餐厅以铁栅装饰。"},
{id:220, name:"爱荷华州松鼠笼监狱", region:"北美", country:"美国", lat:42.112511, lng:-91.29138, address:"爱荷华州康瑟尔布拉夫斯珍珠街226号（226 Pearl Street, Council Bluffs）", ticket:"门票为成人10 美元", hours:"为：冬季（11 月-3 月）：周六11:00-16:00，周日13:00-16:00。夏季（4 月-10 月）：周四至周六11:00-16:00，周日13:00-16:00", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/146_%E7%88%B1%E8%8D%B7%E5%8D%8E%E5%B7%9E%E6%9D%BE%E9%BC%A0%E7%AC%BC%E7%9B%91%E7%8B%B1.jpeg", desc:"美国爱荷华州康瑟尔布拉夫斯（Council Bluffs, Iowa）的松鼠笼监狱（全名为Pottawattamie County Squirrel Cage Jail）是另一座保存下来的旋转监狱，牢房有三层。从1885 年运营至1969 年，1972 年被列入美国国家历史名胜名录，2023 年被指定为国家历史地标。"},
{id:221, name:"老纽盖特监狱", region:"北美", country:"美国", lat:41.9501, lng:-72.782, address:"康涅狄格州东格兰比（East Granby, Connecticut）", ticket:"成人门票为10 美元", hours:"5 月至10 月的周五至周一10:00-16:30。", image:"", desc:"康涅狄格州东格兰比（East Granby, Connecticut）有一座老纽盖特监狱（Old New-Gate Prison），号称美国最早的监狱之一（与胡桃街监狱同年启用，都是1773 年），说它是监狱，实在有点勉强，实际上只是利用了一个废弃的铜矿矿洞，条件极为简陋，说不上有什么像样的设施。但它实实在在持续运营了54 年之久，不仅关过小偷强盗，独立战争期间还关过英国战俘。"},
{id:222, name:"布拉德福德县博物馆", region:"北美", country:"美国", lat:41.7670, lng:-76.4469,
 address:"宾夕法尼亚州托万达市松街109号（109 Pine St, Towanda, PA 18848）", ticket:"成人5美元，学生和老人3美元，12岁以下儿童免费", hours:"每年5月底（阵亡将士纪念日）至9月初（劳动节），周三至周五10:00-16:00，每月首个周六10:00-14:00。冬季仅接受团体预约（570-265-2240）", image:"", desc:"博物馆的建筑最初是布拉德福德县监狱，建于1871年，取代了1850年代的一座较小监狱，1970年被列入国家历史名胜名录。监狱运营至1950年代中期关闭，1958年由布拉德福德县历史协会接管改造成博物馆和研究图书馆，1960年正式开放。博物馆利用原牢房作为展厅，保留了建筑的历史氛围，展示布拉德福德县的历史、文化和工业发展。"},
{id:223, name:"怀俄明边疆监狱", region:"北美", country:"美国", lat:41.7603, lng:-107.2121, address:"怀俄明州罗林斯 Walnut 西街500 号", ticket:"门票：成人12 美元，博物馆展厅免费", hours:"夏季（5 月底至9 月初）：每日8:00-17:00，每小时导览。冬季（11 月中至5 月中）：周一至周四10:30 和13:30 两次导览", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/153_%E6%80%80%E4%BF%84%E6%98%8E%E8%BE%B9%E7%96%86%E7%9B%91%E7%8B%B1.jpeg", desc:"怀俄明边疆监狱（Wyoming Frontier Prison）位于怀俄明州罗林斯（Rawlins）。是怀俄明第一座州立监狱，从1901 年至1981 年运营了80 年。"},
{id:224, name:"布里斯托尔县监狱博物馆", region:"北美", country:"美国", lat:41.6612, lng:-71.2762,
 address:"罗德岛州布里斯托尔市法院街48号（48 Court Street, Bristol, RI 02809）", ticket:"成人约5-10美元，学生和老人折扣，具体价格需确认", hours:"通常周一至周五10:00-16:00开放，周六和节假日可能调整，冬季可能关闭（401-253-7223）", image:"", desc:"始建于1828年，用以取代1792年建造的老旧监狱，是布里斯托尔县在19世纪的主要拘留设施，1957年6月关闭。1957年7月由布里斯托尔历史协会租用作为新址，1972年正式购得，1973年修复牢房并作为公共展览开放，同年被列入国家历史名胜名录。监狱采用当地砂岩和回收材料建成，设计上既是囚犯的拘留所，也是狱卒家庭的住所。"},
{id:225, name:"旧朱丽叶监狱", region:"北美", country:"美国", lat:41.5787, lng:-88.0946, address:"伊利诺伊州朱丽叶市科林斯路1125 号", ticket:"成人门票10 美元", hours:"4 月至10 月，每周三至周日，10:00-16:00（具体时间可能因天气或活动调整）。冬季关闭，特殊活动除外。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/157_%E6%97%A7%E6%9C%B1%E4%B8%BD%E5%8F%B6%E7%9B%91%E7%8B%B1.jpeg", desc:"朱丽叶监狱（Joliet Correctional Center）位于伊利诺伊州朱丽叶市，1858 年建成，2002 年关闭，为66 号公路必打卡点，哥特式外观与荒废氛围吸引摄影师和历史爱好者。1980 年好莱坞电影《布鲁斯兄弟》曾在此取景，美剧《越狱》第一季“福克斯河州立监狱”以朱丽叶监狱为原型，如今作为遗址向公众开放。"},
{id:226, category:"hotel", name:"新港监狱酒店（Jailhouse Inn）", region:"北美", country:"美国", lat:41.4901, lng:-71.3128, address:"13 Marlborough Street, Newport", ticket:"159美元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/2.%E6%96%B0%E6%B8%AF%E7%9B%91%E7%8B%B1%E9%85%92%E5%BA%97%EF%BC%88Jailhouse%20Inn%EF%BC%89.jpg", desc:"前身为纽波特县监狱，初建于1772年，20世纪末关闭。2005年改建为旅馆并对外开放。部分房间仍保留原始的铁栏和钢制大门。"},
{id:227, name:"波特县博物馆", region:"北美", country:"美国", lat:41.4731, lng:-87.0617,
 address:"印第安纳州瓦尔帕莱索市印第安纳大道20号（20 Indiana Avenue, Valparaiso, IN 46383）", ticket:"免费入场", hours:"周二至周日11:00-16:00，节假日可能调整", image:"", desc:"成立于1916年，是波特县最古老的机构，1974年搬入1871年建造的老波特县监狱与治安官住所，1975年作为\u201c老监狱博物馆\u201d开放，1976年被列入国家历史名胜名录。2020年因疫情关闭后，2022年迁至印第安纳大道20号的新建筑开放，老监狱建筑不再作为博物馆使用。"},
{id:228, name:"约翰逊岛相关博物馆", region:"北美", country:"美国", lat:41.4489, lng:-82.7093,
 address:"俄亥俄州桑达斯基市桑达斯基湾内约翰逊岛", ticket:"博物馆免费或建议捐款，进入岛屿需支付2美元大堤通行费", hours:"俄亥俄退伍军人之家博物馆工作日9:00-16:00（需电话确认）；邦联公墓全年开放；桑达斯基海事博物馆周二至周日10:00-16:00", image:"", desc:"约翰逊岛在内战期间（1861-1865）被选为联邦战俘营，1862年4月正式开放，占地16.5英亩，三年运营期间共关押超过1.5万名南方邦联战俘，是内战期间死亡率最低的战俘营之一（约2%）。1865年9月关闭，现岛上唯一对公众开放的区域是邦联公墓，相关历史展览分布在俄亥俄退伍军人之家博物馆、桑达斯基海事博物馆。"},
{id:229, name:"科西阿斯科县监狱博物馆", region:"北美", country:"美国", lat:41.2381, lng:-85.8547,
 address:"印第安纳州华沙市北印第安纳街121号（121 North Indiana Street, Warsaw, IN 46580）", ticket:"免费，接受捐款。特别活动（如闹鬼之旅）收费10美元/人", hours:"周二至周六10:00-16:00（夏季可能延长），周日和周一关闭（574-269-1078）", image:"", desc:"建于1870年，1978年被列入国家历史名胜名录，1982年关闭后转型为博物馆，是印第安纳州最坚固的县监狱之一。监狱采用哥特式城堡风格，由当地石灰石砌成，带锯齿状城垛和角楼，形似小型城堡。博物馆展示县历史和监狱往事，保留了原始牢房和囚犯墙上刻字。"},
{id:230, name:"卡本县老监狱博物馆", region:"北美", country:"美国", lat:40.8648, lng:-75.8824,
 address:"宾夕法尼亚州吉姆索普市西百老汇128号（128 W. Broadway）", ticket:"成人12美元，6-17岁儿童8美元，5岁以下免费，导览包含在内", hours:"每年阵亡将士纪念日（5月底）至劳动节（9月初），周一至周六10:00-16:00，周日12:00-16:00。冬季仅接受团体预约（570-325-5259）", image:"", desc:"建于1869-1870年间，是卡本县第二座监狱，1974年被列入国家历史名胜名录，1995年1月关闭后，由托马斯·麦克布赖德夫妇改造成博物馆开放。监狱采用当地砂岩建造，外观酷似中世纪堡垒，因1877年6月21日六名\u201c莫利·马奎尔\u201d成员在此被绞死而闻名，17号牢房的亚历山大·坎贝尔手印是博物馆的标志性亮点。"},
{id:231, name:"曼斯菲尔德感化院：肖申克的救赎", region:"北美", country:"美国", lat:40.786896, lng:-82.500929, address:"俄亥俄州曼斯菲尔德感化院路100 号（100 ReformatoryRoad Mansfield, Ohio）", ticket:"成人门票为25 美元，“肖申克巴士之旅”99 美元", hours:"4 月-9 月：周四至周日11:00-16:00；10 月-11 月（鬼魂季）：周五至周日11:00-16:00；冬季关闭。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/148_%E6%9B%BC%E6%96%AF%E8%8F%B2%E5%B0%94%E5%BE%B7%E6%84%9F%E5%8C%96%E9%99%A2%EF%BC%9A%E8%82%96%E7%94%B3%E5%85%8B%E7%9A%84%E6%95%91%E8%B5%8E.jpeg", desc:"曼斯菲尔德感化院（Ohio State Reformatory，简称OSR）位于俄亥俄州曼斯菲尔德市感化院路100 号。其前身为一座运营近一个世纪的监狱，曾关押了超过15 万名囚犯。"},
{id:232, name:"卡萨奇监狱博物馆", region:"北美", country:"美国", lat:40.4145, lng:-91.1318,
 address:"伊利诺伊州卡萨奇市布坎南街310号（310 Buchanan St, Carthage, IL 62321）", ticket:"免费", hours:"每日9:00-17:00（夏季可能延长至19:00），感恩节、圣诞节和新年关闭", image:"", desc:"建于1839年，是汉考克县第一座监狱，1973年被列入国家历史名胜名录，1866年停止作为监狱使用，1903年被LDS教会购回，1989年全面修复后作为博物馆开放。监狱因1844年约瑟夫·史密斯和海勒姆·史密斯兄弟在此被暴徒杀害而闻名，是后期圣徒运动的重要历史遗址。"},
{id:233, name:"东州监狱：改革先驱", region:"北美", country:"美国", lat:39.968341, lng:-75.172663, address:"宾夕法尼亚州费城市费尔蒙特区东22 街2027 号（2027Fairmount Avenue）", ticket:"门票：成人21 美元，含“东州之声”音频导览", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/142_%E4%B8%9C%E5%B7%9E%E7%9B%91%E7%8B%B1%EF%BC%9A%E6%94%B9%E9%9D%A9%E5%85%88%E9%A9%B1.jpeg", desc:"东州监狱（Eastern State Penitentiary）位于美国宾夕法尼亚州费城市费尔蒙特区（Fairmount）。东州监狱可以说是美国乃至世界上第一所现代意义上的监狱，从惩教理念到建筑都具有引领性和示范性，形成了后世所称的“宾夕法尼亚体系”，在美国乃至世界刑事司法史上具有开创意义。"},
{id:234, name:"西弗吉尼亚州立监狱博物馆", region:"北美", country:"美国", lat:39.9195, lng:-80.7440,
 address:"西弗吉尼亚州芒兹维尔市", ticket:"历史导览票价14-20美元，鬼魂探险价格30-100美元", hours:"通常为4月至11月的周二至周日，上午10点至下午5点，冬季关闭", image:"", desc:"1866年开始运营，1995年关闭，运行了近130年，是西弗吉尼亚州唯一的州立监狱，采用哥特式城堡风格，拥有高耸的石墙和瞭望塔，被称为\u201c芒兹维尔城堡\u201d。监狱共关押了超过10万名囚犯，1866年至1965年间共94名囚犯在此被处决，1986年发生严重暴动，加速了监狱的关闭。1998年作为旅游景点和博物馆开放，展示监狱历史和囚犯生活。"},
{id:235, name:"1859杰克逊县监狱博物馆", region:"北美", country:"美国", lat:39.0911, lng:-94.4155,
 address:"密苏里州独立城北主街217号（217 N. Main Street, Independence, MO 64050）", ticket:"成人10美元，儿童（6-17岁）6美元，5岁以下免费，历史协会会员免费", hours:"每年阵亡将士纪念日（5月底）至劳动节（9月初），周三至周六10:00-16:00，周日13:00-16:00。冬季仅接受团体预约（816-252-7454）", image:"", desc:"建于1859年，是杰克逊县第二座监狱，1970年被列入国家历史名胜名录，1933年关闭后，1970年代初由杰克逊县历史协会修复改造成博物馆。监狱采用联邦风格，前部为元帅住所，后部设有12间石灰石牢房，曾关押著名囚犯威廉·克拉克·匡特里尔、弗兰克·詹姆斯，内战期间作为美国教务长元帅办公室使用。"},
{id:236, name:"夏延县监狱博物馆", region:"北美", country:"美国", lat:38.8167, lng:-102.3502,
 address:"科罗拉多州夏延维尔斯市西二街北85号（85 W. 2nd St. North）", ticket:"免费入场，接受捐款", hours:"每年阵亡将士纪念日（5月底）至劳动节（9月初），周六至周日13:00-16:00。非开放日需预约（719-767-5865）", image:"", desc:"建于1894年，由著名丹佛建筑师罗伯特·S·罗施劳布设计，是夏延县为应对19世纪末东部平原地区治安需求而建造的，1961年关闭后，1963年由东部科罗拉多历史协会改造成博物馆开放，1988年被列入国家历史名胜名录。监狱采用罗马式复兴风格，呈不规则平面，正面有八角形两层塔楼，设计坚固且具有艺术价值。"},
{id:237, name:"露西·伯恩斯博物馆", region:"北美", country:"美国", lat:38.7, lng:-77.23, address:"弗吉尼亚州洛顿教养院路9518 号", ticket:"", hours:"周三至周六11:00-18:00，周日12:00-17:00。博物馆成人5 美元。艺术中心免费参观，活动另计。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/158_%E9%9C%B2%E8%A5%BF%C2%B7%E4%BC%AF%E6%81%A9%E6%96%AF%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"露西·伯恩斯博物馆（Lucy Burns Museum）位于弗吉尼亚州洛顿村济贫院艺术中心（Occoquan Workhouse Arts Center）内，前身为洛顿惩教中心。始建于1910 年，因1917 年的妇女参政运动声名鹊起。"},
{id:238, name:"密苏里州立监狱博物馆", region:"北美", country:"美国", lat:38.5761, lng:-92.1735,
 address:"密苏里州杰斐逊市密苏里河畔", ticket:"具体票价未公开", hours:"具体开放时间未公开", image:"", desc:"1836年开始运营，2004年关闭，运行了168年，是密苏里州历史最悠久的监狱，采用放射状布局和高大的石灰岩围墙，被称为\u201cThe Walls\u201d。监狱早期实行\u201c租赁计划\u201d，囚犯被雇佣进行无偿劳动，建造了杰斐逊市的许多建筑。1954年发生严重暴动，1937年至1989年间共有40名囚犯在此被处决。著名囚犯包括詹姆斯·厄尔·雷（刺杀马丁·路德·金）、查尔斯·弗洛伊德（\u201c娃娃脸\u201d纳尔逊）、艾玛·戈德曼等。2004年关闭后，由杰斐逊市会议与旅游局管理，开放参观。"},
{id:239, name:"蒙哥马利县旋转监狱", region:"北美", country:"美国", lat:38.572044, lng:-92.163583, address:"印第安纳州克劳福兹维尔蒙哥马利县华盛顿北街225 号（N Washington St, Crawfordsville）", ticket:"免费入场", hours:"蒙哥马利县旋转监狱博物馆位于印第安纳州克劳福兹维尔蒙哥马利县华盛顿北街225 号（N Washington St, Crawfordsville），每年5月至10 月开放，周三至周六10:00-17:00，周日13:00-17:00，冬季闭馆。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/145_%E8%92%99%E5%93%A5%E9%A9%AC%E5%88%A9%E5%8E%BF%E6%97%8B%E8%BD%AC%E7%9B%91%E7%8B%B1.png", desc:"旋转监狱（Rotary Jail）是19 世纪末美国中西部地区一种使用时间不长但设计独特的监狱，该牢房可以整体旋转。现存的旋转监狱已成为遗址，其中最著名且唯一仍可旋转的遗址是印第安纳州克劳福兹维尔的蒙哥马利县旋转监狱博物馆（Montgomery County Rotary Jail）。"},
{id:240, name:"圣昆廷州立监狱博物馆", region:"北美", country:"美国", lat:37.9405, lng:-122.489, address:"圣昆廷州立监狱内的主街156 号（156 Main Street）", ticket:"", hours:"博物馆参观免费，每周二、周四开放，需提前电话确认（+1-415-454-1460）。节假日可能调整，建议查阅", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/147_%E5%9C%A3%E6%98%86%E5%BB%B7%E5%B7%9E%E7%AB%8B%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"圣昆廷州立监狱博物馆（San Quentin State Prison Museum）位于美国加利福尼亚州马林县圣昆廷镇。这座博物馆坐落于仍在运营的加州最古老且最臭名昭著的监狱——圣昆廷州立监狱（2023 年更名为圣昆廷康复中心San Quentin Rehabilitation Center）内部。"},
{id:241, name:"阿尔卡特兹监狱：恶魔岛", region:"北美", country:"美国", lat:37.826721, lng:-122.422759, address:"加州旧金山湾中央的阿尔卡特兹岛", ticket:"成人门票约45.25 美元，含渡轮与音频导览", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/143_%E9%98%BF%E5%B0%94%E5%8D%A1%E7%89%B9%E5%85%B9%E7%9B%91%E7%8B%B1%EF%BC%9A%E6%81%B6%E9%AD%94%E5%B2%9B.jpeg", desc:"阿尔卡特兹监狱（Alcatraz Federal Penitentiary 简称阿尔卡特兹），它还有个名字叫恶魔岛，应该是全世界知名度最高的监狱。提起它，能想到的词应该有全员恶人、最高警戒、插翅难逃... 满足了公众对监狱的概念化想象。"},
{id:242, name:"加勒德县监狱博物馆", region:"北美", country:"美国", lat:37.6201, lng:-84.5447,
 address:"肯塔基州兰开斯特市公共广场15号（15 Public Square, Lancaster, KY 40444）", ticket:"免费，接受捐款", hours:"夏季（5月至9月）的周三至周五10:00-16:00，或需电话预约（859-792-2591）", image:"", desc:"建于1873年，是加勒德县第三座监狱，1984年被列入国家历史名胜名录，1986年关闭后由加勒德县历史协会接管改造成博物馆。监狱为两层意大利风格砖石建筑，前部为狱卒住所，后部为牢房区，地下室设有单独监禁室，展示县司法历史和地方文物。"},
{id:243, name:"卡姆登县历史监狱博物馆", region:"北美", country:"美国", lat:36.3282, lng:-76.1752,
 address:"北卡罗来纳州卡姆登市343号公路117号（117 NC Hwy 343 North, Camden, NC 27921）", ticket:"免费入场，接受捐款", hours:"周四至周五8:00-17:00，周六10:00-14:00（2024年1月起调整的新时间）。感恩节、圣诞节和新年关闭（252-771-8333）", image:"", desc:"建于1910年，是卡姆登县第三座监狱，取代了之前因火灾损毁的设施，1940年代关闭，后一度被用作县选举委员会办公室。2000年代由当地历史学家和卡姆登县政府合作修复，2017年9月15日作为博物馆正式开放，与新建的遗产博物馆一起成为文化景点，由卡姆登县旅游发展局管理。"},
{id:244, name:"老威尔克斯县监狱博物馆", region:"北美", country:"美国", lat:36.1468, lng:-81.1545,
 address:"北卡罗来纳州威尔克斯伯勒市北桥街203号（203 North Bridge Street, Wilkesboro, NC 28697）", ticket:"成人6美元，5岁以下儿童免费，包含博物馆和监狱导览", hours:"周一至周六10:00-16:00（5月至10月），冬季需预约（336-667-3171）", image:"", desc:"建于1858-1859年间，是威尔克斯县第二座监狱，1971年被列入国家历史名胜名录，1915年关闭后，1968年由老威尔克斯公司购回修复，1970年代中期作为历史遗址开放。监狱为两层矩形砖建筑，是北卡罗来纳州保存最完好的19世纪监狱建筑之一，曾关押著名囚犯汤姆·杜拉（民谣《汤姆·杜利》原型）和逃狱艺术家奥托·伍德。"},
{id:245, name:"切罗基国家监狱博物馆", region:"北美", country:"美国", lat:35.9151, lng:-94.9699,
 address:"俄克拉荷马州塔勒夸市Keetoowah Street 124号", ticket:"成人约5美元，儿童和老人有折扣，切罗基族成员免费", hours:"通常每周二至周六10:00-16:00开放，冬季可能调整（1-877-779-6977）", image:"", desc:"建于1874年，是切罗基族在印第安领地建立的唯一一座国家监狱，也是整个印第安领地从1875年至1901年期间唯一的监狱建筑，1974年被列入国家历史名胜名录。1907年俄克拉荷马成为州后，监狱转为县监狱使用至20世纪70年代，关闭后由当地社区和切罗基族共同修复，1990年代正式作为博物馆开放，由切罗基族文化部门管理。"},
{id:246, name:"国家犯罪与惩罚博物馆（阿尔卡特拉斯东）", region:"北美", country:"美国", lat:35.7887, lng:-83.5549,
 address:"田纳西州鸽子谷公园大道2757号（Alcatraz East, 2757 Parkway, Pigeon Forge, TN）", ticket:"阿尔卡特拉斯东成人约30美元，儿童约20美元", hours:"每日9:00-21:00开放（冬季可能调整）", image:"", desc:"2008年5月正式开放，是华盛顿特区首座专注于犯罪与惩罚的私人博物馆，2015年9月30日因财务压力关闭，收藏品转移至田纳西州鸽子谷的阿尔卡特拉斯东犯罪博物馆。博物馆占地约28000平方英尺，拥有超过700件展品，涵盖从殖民时期到现代的犯罪与惩罚历史，包括CSI互动体验、监狱展品、死刑设备等。"},
{id:247, name:"旧交易所与教务长地牢博物馆", region:"北美", country:"美国", lat:32.7765, lng:-79.9311,
 address:"南卡罗来纳州查尔斯顿市东湾街122号（122 East Bay Street）", ticket:"成人15美元，7-12岁儿童8美元，6岁以下免费。可与旧奴隶市场博物馆购买联票", hours:"周一至周六9:00-17:00，周日11:00-17:00；新年、感恩节和圣诞节关闭。地牢导览每半小时一次（9:30-17:00）", image:"", desc:"建于1767-1771年间，最初作为皇家交易所和海关使用，1780年英国占领查尔斯顿后，将地下室改作军事监狱（教务长地牢），关押美国战俘、英国士兵、私人公民和被奴役者，著名囚犯包括三名《独立宣言》签署者。1788年南卡罗来纳在此召开大会批准《美国宪法》，1981年以博物馆形式开放，1973年被列为国家历史地标。"},
{id:248, name:"科罗拉多州监狱博物馆", region:"北美", country:"美国", lat:32.726823, lng:-114.61447, address:"卡尼翁城1 号街北201（201 North 1st Street）", ticket:"门票：成人12 美元，儿童（6-12 岁）8 美元，65 岁以上10 美元", hours:"为：夏季（5 月中-9 月底）：每日10:00-18:00。冬季（10月- 次年5 月初）：周五至周日10:00-17:00", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/152_%E7%A7%91%E7%BD%97%E6%8B%89%E5%A4%9A%E5%B7%9E%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"科罗拉多州立监狱博物馆（Colorado Prison Museum）位于科罗拉多州卡尼翁城，其所在建筑原为1929 年建成的女囚监舍，紧邻仍在运营中的监狱科罗拉多领地惩教所（Colorado TerritorialCorrectional Facility），博物馆于1988 年6 月18 日开放，旨在展示科罗拉多州150 多年的监狱历史。1991 年被列入美国国家历史名胜名录。"},
{id:249, name:"尤马领地监狱州立历史公园", region:"北美", country:"美国", lat:32.6927, lng:-114.6277,
 address:"亚利桑那州尤马市第四大道东侧，紧邻I-8高速公路，距市中心约1英里", ticket:"成人10美元，62岁以上老人8美元，7-13岁儿童5美元，6岁以下免费", hours:"每日9:30-17:00（冬季可能调整），12月25日关闭", image:"", desc:"1876年7月1日启用，是亚利桑那领地建立的第一座监狱，1909年9月15日关闭，后被列入国家历史名胜名录，1961年作为州立历史公园开放。监狱运营33年共关押3069名囚犯，被称为\u201c西部地狱\u201d，以酷热、拥挤的环境和严格的惩罚措施闻名。"},
{id:250, name:"安德森维尔国家历史遗址博物馆", region:"北美", country:"美国", lat:32.1999, lng:-84.1335,
 address:"佐治亚州安德森维尔市Cemetery Road 496号", ticket:"免费入场，接受捐款", hours:"每日8:00-17:00（博物馆8:30-16:30），感恩节、圣诞节和新年关闭", image:"", desc:"安德森维尔监狱（萨姆特营）由南方邦联于1864年2月建立，是内战期间南方最大的战俘营，14个月运营期间共关押约4.5万名联邦士兵，其中近1.3万人死亡，1865年4月内战结束后关闭。1970年遗址被列为国家历史遗址，现由国家公园管理局管理，包括监狱遗址、国家公墓和1998年开放的国家战俘博物馆（美国唯一纪念所有战俘的博物馆）。"},
{id:251, name:"德州之心历史博物馆", region:"北美", country:"美国", lat:31.1352, lng:-99.3342,
 address:"德克萨斯州布雷迪市西主街和高街交叉口（West Main and North High Streets）", ticket:"成人5美元，学生和老人3美元，12岁以下免费", hours:"每年5月至10月，周二、周四和周六10:00-16:00，或电话预约（325-597-1940）", image:"", desc:"建于1909-1910年间，是麦克卡洛克县第二座监狱，1974年关闭后转型为博物馆，1975年被列入国家历史名胜名录，1976年被指定为德克萨斯州历史地标。监狱为三层理查森罗马式复兴风格红砖建筑，设计有绞刑环和陷门，展示麦克卡洛克县和布雷迪的司法与社会历史。"},
{id:252, name:"路易斯安那州立监狱博物馆", region:"北美", country:"美国", lat:30.9545, lng:-91.598, address:"路易斯安那州安哥拉图尼卡路17544 号（17544 TunicaTrace, Angola, LA 70712）", ticket:"", hours:"路易斯安那州立监狱博物馆周一至周五8:00-16:30 开放。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/150_%E8%B7%AF%E6%98%93%E6%96%AF%E5%AE%89%E9%82%A3%E5%B7%9E%E7%AB%8B%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"路易斯安那州立监狱博物馆（Louisiana State PenitentiaryMuseum）位于路易斯安那州安哥拉，坐落于美国最大的最高安全级别监狱——路易斯安那州立监狱（简称安哥拉监狱）外。博物馆成立于1998年，旨在展示安哥拉监狱近200 年的历史。"},
{id:253, name:"安哥拉监狱牛仔竞技", region:"北美", country:"美国", lat:30.9545, lng:-91.598, address:"美国路易斯安那州安哥拉监狱", ticket:"门票：每人20美元，通过电话（225-655-2030）或官网（angolarodeo.com）购买，无退换", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/151_%E5%AE%89%E5%93%A5%E6%8B%89%E7%9B%91%E7%8B%B1%E7%89%9B%E4%BB%94%E7%AB%9E%E6%8A%80.png", desc:"个周末和10 月的每个周日。战车赛（Chariot Race）：参赛者站在马拉雪橇上，手持果汁壶，最先至终点且保持平衡者胜。"},
{id:254, name:"德克萨斯监狱博物馆", region:"北美", country:"美国", lat:30.735752, lng:-95.584309, address:"德州亨茨维尔75 号州际公路491 号（491 State Hwy 75 N,Huntsville, TX），靠近45 号州际公路118 出口", ticket:"成人门票为7 美元", hours:"周一至周六10:00-17:00，周日12:00-17:00，复活节、感恩节、圣诞节及元旦闭馆。建议查询", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/149_%E5%BE%B7%E5%85%8B%E8%90%A8%E6%96%AF%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"德克萨斯监狱博物馆（Texas Prison Museum）位于德州亨茨维尔市75 号州际公路491 号。这座博物馆因邦妮与克莱德（Bonnie &Clyde）和“老电椅”（Old Sparky）而闻名。"},
{id:255, name:"卡比维尔卡拉布斯博物馆", region:"北美", country:"美国", lat:30.6591, lng:-93.8952,
 address:"德克萨斯州卡比维尔市东拉维耶街（East Lavielle Street, Kirbyville, TX 75956）", ticket:"免费入场，或收取少量捐款以支持维护", hours:"通常在周五和周六开放（具体时间可能为10:00-14:00或更短），其他时间需预约（409-423-3028）", image:"", desc:"建筑最初建于1910年，作为卡比维尔的地方监狱使用，是典型的美国南方小镇\u201c卡拉布斯\u201d（小型拘留所），运营至20世纪中期废弃，1970年代由当地历史爱好者修复改造成博物馆，现由卡比维尔历史协会管理。博物馆保留了监狱的原始结构，展示卡比维尔及周边地区的司法与社会历史。"},
{id:256, name:"圣哈辛托县老监狱博物馆", region:"北美", country:"美国", lat:30.5927, lng:-95.1238,
 address:"德克萨斯州科尔德斯普林市洛伊德街与斯莱德街东南角（Southeastern corner of Loyd and Slade Streets, Coldspring, TX 77331）", ticket:"免费", hours:"每月第2、第4和第5个星期六11:00-15:00，其他时间需预约（936-653-2009）", image:"", desc:"始建于1887年，1911年扩建，是科尔德斯普林最古老的建筑之一，1980年被列入国家历史名胜名录，1982年被指定为德克萨斯州历史地标。1980年关闭后转型为博物馆，展示东德克萨斯和圣哈辛托县的历史，保留了原始牢房和罕见的绞刑装置。"},
{id:257, name:"圣奥古斯丁旧监狱博物馆", region:"北美", country:"美国", lat:29.8947, lng:-81.3133, address:"佛罗里达州圣奥古斯丁圣马可大道167 号", ticket:"成人门票17.19 美元，鬼魂夜游约34 美元", hours:"每日9:00-16:30（16:00 停止入场，圣诞节除外）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E5%9C%A3%E5%A5%A5%E5%8F%A4%E6%96%AF%E4%B8%81%E6%97%A7%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpg", desc:"圣奥古斯丁旧监狱博物馆（St. Augustine Old Jail Museum）位于美国佛罗里达州圣奥古斯丁市的上城区。始建于1891 年，由铁路大亨亨利·弗拉格勒出资兴建，采用罗马式复兴风格，外墙呈粉红色，占地约0.8 公顷，建筑面积约600 平方米，设计容量72 人（男囚60 人，女囚12 人）。"},
{id:258, name:"老圣约翰斯县监狱博物馆", region:"北美", country:"美国", lat:29.6516, lng:-81.5196,
 address:"佛罗里达州圣奥古斯丁市圣马科大道167号（167 San Marco Avenue, St. Augustine, FL 32084）", ticket:"成人13.83美元，6-12岁儿童7.44美元，5岁以下免费。鬼魂之旅单独定价（约25美元起）", hours:"每日9:00-16:30（导览每20分钟一次），感恩节、复活节和圣诞节前夕至15:00，圣诞节关闭", image:"", desc:"建于1891年，由P.J.波利监狱建筑与制造公司设计建造，1987年被列入国家历史名胜名录。1953年关闭后，1954年被改造成路边旅游景点，1993年全面修复后作为博物馆开放，由老城电车公司运营。监狱采用罗马复兴风格，设计容量72人，曾关押各类罪犯，院内设有绞刑架，共8名男性在此被绞死。"},
{id:259, name:"威尔逊县法院与监狱", region:"北美", country:"美国", lat:29.1358, lng:-98.1545,
 address:"德克萨斯州弗洛雷斯维尔市第3街1144号C街1号（1144 C St #1, Floresville, TX 78114）", ticket:"法院免费进入（办公用途），监狱参观需预约", hours:"法院周一至周五8:00-17:00，监狱仅作为历史遗址，内部不定期开放（需通过县政府预约）", image:"", desc:"法院建于1884年，监狱建于1887年，两者作为综合体运营，1974年新监狱启用后老监狱停止使用，1978年作为整体被列入国家历史名胜名录。监狱为白色砖石和灰泥立方体设计，墙厚约2英尺，曾短暂作为博物馆开放，目前仅作为历史遗址附属于法院，内部不定期开放。"},
{id:260, name:"哥伦比亚国家博物馆", region:"南美洲", country:"哥伦比亚", lat:4.615524, lng:-74.068413, address:"波哥大国际中心区第七大道28-66 号（Carrera 7 N° 28-66），交通便利", ticket:"免费入场", hours:"夏季（4 月-10 月）周二至周六9:00-17:30，冬季（11 月-次年3 月）至17:00，周日免费入场，平时成人", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/162_%E5%93%A5%E4%BC%A6%E6%AF%94%E4%BA%9A%E5%9B%BD%E5%AE%B6%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"哥伦比亚国家博物馆坐落在首都波哥大的市中心，是拉美地区历史最悠久的博物馆之一，它所在的大楼是始建于1874 年的全景监狱。全景监狱（Panóptico）为昆迪纳马卡州的中央监狱，运营期间为1874 年到1946 年。"},
{id:261, name:"戈尔戈纳岛监狱遗址", region:"南美洲", country:"哥伦比亚", lat:2.9333, lng:-78.2, address:"哥伦比亚戈尔戈纳岛（距海岸约34公里）", ticket:"", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/163_%E6%88%88%E5%B0%94%E6%88%88%E7%BA%B3%E5%B2%9B%E7%9B%91%E7%8B%B1%E9%81%97%E5%9D%80.jpeg", desc:"哥伦比亚的戈尔戈纳岛有座监狱遗址，该岛距离海岸约34 公里。1960 年到1984 年，岛上曾有一座高度戒备的监狱，关押哥伦比亚最危险的囚犯。"},
{id:262, name:"巴西·圣保罗州刑博物馆", region:"南美洲", country:"巴西", lat:-23.5113, lng:-46.6166, address:"圣保罗市北部Av. Zaki Narchi, 1207，靠近卡兰迪鲁地铁站", ticket:"", hours:"与费用：博物馆周二至周日开放，免费参观。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/165_%E5%B7%B4%E8%A5%BF%C2%B7%E5%9C%A3%E4%BF%9D%E7%BD%97%E5%B7%9E%E5%88%91%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"巴西圣保罗州刑博物馆（Museu Penitenciário Paulista）位于巴西圣保罗市中心，博物馆所在建筑的前身为圣保罗拘留中心，也叫卡兰迪鲁监狱（Carandiru Penitentiary），它曾经是南美洲最大的监狱。卡兰迪鲁监狱于1920 年落成，建筑参照法国弗雷斯讷监狱的鱼骨型布局，设计容量为1200 人，被视为一座现代化模范监狱。"},
{id:263, name:"瓦尔帕莱索文化公园", region:"南美洲", country:"智利", lat:0, lng:0, address:"Cárcel 471", ticket:"无", hours:"全天", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E7%93%A6%E5%B0%94%E5%B8%95%E8%8E%B1%E7%B4%A2%E6%96%87%E5%8C%96%E5%85%AC%E5%9B%AD.jpg", desc:"1807–1810 年：西班牙殖民时期建火药库（Powder Magazine），防御用途，现存为国家纪念建筑。1840 年代中期：改为瓦尔帕莱索公共监狱，1973–1990 年皮诺切特独裁时期沦为政治犯监狱，是人权迫害的见证地。2000 年后启动改造为文化活动场所，2012 年正式开放，有剧场、有画廊、还有不少舞蹈和音乐排练房。保留了监狱的岗楼。2019 年被智利政府定为国家记忆遗址（Sitio de Memoria）。"},
{id:264, name:"智利·记忆与人权博物馆", region:"南美洲", country:"智利", lat:-33.474794, lng:-70.661608, address:"智利首都圣地亚哥马塔卡纳大街501 号（AvenidaMatucana 501）", ticket:"免费入场", hours:"周二至周日10:00-18:00（夏季至20:00），周一及法定节假日闭馆。免费入场。详情见", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/164_%E6%99%BA%E5%88%A9%C2%B7%E8%AE%B0%E5%BF%86%E4%B8%8E%E4%BA%BA%E6%9D%83%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"智利记忆与人权博物馆（Museo de la Memoria y los DerechosHumanos）位于智利首都圣地亚哥马塔卡纳大街501 号（AvenidaMatucana 501）。这座博物馆不是监狱遗址，它通过展示1973 年至1990 年皮诺切特军事独裁时期的暴行，记录了皮诺切特政府众多秘密监狱、其对人权的压迫以及智利人民的不屈抗争。"},
{id:265, name:"阿根廷·ESMA 博物馆和纪念遗址", region:"南美洲", country:"阿根廷", lat:-34.908993, lng:-57.935457, address:"阿根廷布宜诺斯艾利斯解放者大道8151 号（Avenida delLibertador 8151）", ticket:"门票：免费", hours:"周二至周日10:00-17:00，周一及12 月24、25、31 日闭馆", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/166_%E9%98%BF%E6%A0%B9%E5%BB%B7%C2%B7ESMA_%E5%8D%9A%E7%89%A9%E9%A6%86%E5%92%8C%E7%BA%AA%E5%BF%B5%E9%81%97%E5%9D%80.jpeg", desc:"ESMA 博物馆和纪念遗址（ESMA Museum and Site of Memory），前军政府秘密拘留、酷刑和处决中心（Clandestine Centre ofDetention Torture and Extermination），位于阿根廷首都布宜诺斯艾利斯解放者大道8151 号。这座博物馆是阿根廷1976-1983 年军政府时期最大的秘密拘留、酷刑和处决中心。"},
{id:266, name:"世界尽头的监狱博物馆——乌斯怀亚监狱博物馆", region:"南美洲", country:"阿根廷", lat:-54.841573, lng:-68.308586, address:"阿根廷火地岛省乌斯怀亚市", ticket:"成人门票40 美金，包括所有展馆", hours:"上午10 点至晚上8 点。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/167_%E4%B8%96%E7%95%8C%E5%B0%BD%E5%A4%B4%E7%9A%84%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86%E2%80%94%E2%80%94%E4%B9%8C%E6%96%AF%E6%80%80%E4%BA%9A%E7%9B%91%E7%8B%B1%E5%8D%9A%E7%89%A9%E9%A6%86.jpeg", desc:"乌斯怀亚是地球上最南端的城市之一，被称为“世界尽头”。在“世界尽头”也有一座监狱博物馆——乌斯怀亚监狱博物馆（MuseoMarítimo y del Presidio de Ushuaia），该博物馆所依托的监狱建于1902--1920 年间，为五翼辐射式布局，建筑形制与色彩都颇有经典美感。"},
{id:267, category:"hotel", name:"新西兰监狱青旅（Jailhouse Accommodation）", region:"大洋洲", country:"新西兰", lat:-43.5375, lng:172.63, address:"基督城林肯路338号", ticket:"床位20纽币起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/27.%20%E6%96%B0%E8%A5%BF%E5%85%B0%E9%9D%92%E6%97%85%EF%BC%88Jailhouse%20Accommodation%EF%BC%89.jpg", desc:"前身为阿丁顿监狱（Addington Prison），1874年启用，1999年关闭。保留了60厘米厚的混凝土墙和铁栅栏门，墙上挂着囚犯涂鸦和历史照片，得到《孤独星球》和《粗略指南》推荐。"},
{id:268, name:"纳皮尔监狱", region:"大洋洲", country:"新西兰", lat:-44.673487, lng:167.923929, address:"新西兰霍克湾纳皮尔市布拉夫山库特路55 号（55 Coote Road Bluff Hill Napier Hawke's Bay）", ticket:"", hours:"建议查阅官网（napierprison.com）。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/132_%E7%BA%B3%E7%9A%AE%E5%B0%94%E7%9B%91%E7%8B%B1.jpeg", desc:"纳皮尔监狱（Napier Prison）位于新西兰霍克湾纳皮尔市布拉夫山库特路55 号（55 Coote Road Bluff Hill Napier Hawke's Bay），是新西兰现存最古老的监狱建筑。纳皮尔监狱始建于1861 年，1862 年启用。"},
{id:269, name:"特赖尔湾监狱", region:"大洋洲", country:"澳大利亚", lat:-25.0, lng:135.0, address:"新南威尔士州中北海岸的南西岩镇Arakoon 国家公园内（73 Trial Bay GaolRoad, Arakoon, NSW 2431）", ticket:"成人门票为11 澳元", hours:"为每日9:00-16:30 开放（圣诞节除外）。从悉尼自驾约5 小时（450 公里），或从Port Macquarie 乘车1 小时。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/129_%E7%89%B9%E8%B5%96%E5%B0%94%E6%B9%BE%E7%9B%91%E7%8B%B1.jpeg", desc:"澳大利亚的特赖尔湾监狱遗址（Trial Bay Gaol）位于新南威尔士州中北海岸的南西岩镇Arakoon 国家公园内（73 Trial Bay GaolRoad, Arakoon, NSW 2431），是一座兼具殖民监狱与一战拘留营双重历史的遗址。该监狱选址于莱特湾的犄角，拥有绝美海景。"},
{id:270, name:"圣赫勒拿岛国家公园", region:"大洋洲", country:"澳大利亚", lat:-27.3957, lng:153.2332, address:"昆士兰州布里斯班莫顿湾（Moreton Bay）", ticket:"门票与游览套票约80-95 澳元（成人），TEL：1300438787", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/125_%E5%9C%A3%E8%B5%AB%E5%8B%92%E6%8B%BF%E5%B2%9B%E5%9B%BD%E5%AE%B6%E5%85%AC%E5%9B%AD.jpeg", desc:"圣赫勒拿岛国家公园（St Helena Island National Park）位于昆士兰州布里斯班莫顿湾（Moreton Bay），距布里斯班河口约5 公里，占地约182公顷，是昆士兰州首个被列为历史国家公园的遗址（1979年）。1867 年至1932 年间为昆士兰最著名的监狱，被称为“太平洋的地狱之洞”（Hell Hole of the Pacific）。"},
{id:271, name:"金斯顿和亚瑟谷历史区", region:"大洋洲", country:"澳大利亚", lat:-29.0333, lng:167.9497, address:"诺福克岛南部沿海平原", ticket:"门票35 澳元（包括4 个博物馆和导览）", hours:"为每日9:00-16:00。游客可从伯恩特派恩（Burnt Pine）步行20 分钟或乘车到达。入场免费，博物馆", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/120_金斯顿和亚瑟谷历史区.jpeg", desc:"澳大利亚的金斯顿和亚瑟谷历史区（Kingston and Arthur’sVale Historic Area, KAVHA）位于诺福克岛南部沿海平原，东北方向距悉尼约1600 公里，占地约250 公顷，是一处集殖民监狱历史与多重文化遗产于一身的独特遗址。位列UNESCO“澳大利亚流放遗址”。"},
{id:272, name:"墨尔本旧监狱", region:"大洋洲", country:"澳大利亚", lat:-30.877325, lng:153.070185, address:"Adina Apartment Hotel Pentridge房价：190 澳元/ 晚", ticket:"门票为成人38 澳元", hours:"每日10:00-17:00（16:30 停止入场），全年无休（12月25 日除外）。建议查阅", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/124_%E5%A2%A8%E5%B0%94%E6%9C%AC%E6%97%A7%E7%9B%91%E7%8B%B1.jpeg", desc:"墨尔本旧监狱（Old Melbourne Gaol）位于墨尔本市中心，拉塞尔街377 号（377 Russell Street），毗邻旧城市瞭望台和法院大楼。是维多利亚州现存最古老的监狱遗址。"},
{id:273, category:"hotel", name:"弗里曼特尔监狱青年旅舍（Fremantle Prison YHA）", region:"大洋洲", country:"澳大利亚", lat:-32.0542, lng:115.7545, address:"弗里曼特尔市梯台街1号", ticket:"床位40美元起/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/25.%20%E5%BC%97%E9%87%8C%E6%9B%BC%E7%89%B9%E5%B0%94%E7%9B%91%E7%8B%B1%E9%9D%92%E5%B9%B4%E6%97%85%E8%88%8D%EF%BC%88Fremantle%20Prison%20YHA%EF%BC%89.jpg", desc:"前身为弗里曼特尔监狱，始于1850年6月，曾是澳大利亚最大的流放监狱。1991年关闭。酒店旁边为弗里曼特尔监狱博物馆。"},

{id:275, name:"老达博监狱", region:"大洋洲", country:"澳大利亚", lat:-32.2464, lng:148.6046, address:"新南威尔士州西部重镇达博市中心（90 MacquarieStreet）", ticket:"成人门票为22.50 澳元", hours:"老达博监狱每日9:00-16:00 开放（圣诞节除外），", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E8%80%81%E8%BE%BE%E5%8D%9A%E7%9B%91%E7%8B%B1.jpg", desc:"澳大利亚的老达博监狱（Old Dubbo Gaol）是一座保存完好的殖民时期监狱遗址，位于新南威尔士州西部重镇达博市中心（90 MacquarieStreet），以丰富的展品、戏剧化的导览体验和对19 世纪澳大利亚司法的生动再现，成为该地区最受欢迎的旅游景点之一。1847 年，作为新兴农业定居点的达博设立了临时拘留所。"},
{id:276, name:"卡图岛囚犯遗址", region:"大洋洲", country:"澳大利亚", lat:-33.8466, lng:151.1706, address:"悉尼港中心的独特历史遗迹", ticket:"", hours:"为每日8:00- 日落，入场免费。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/122_卡图岛囚犯遗址.jpeg", desc:"澳大利亚科卡图岛囚犯遗址（Cockatoo Island Convict Site）是一座位于悉尼港中心的独特历史遗迹。这座岛屿原名“Wa-rea-mah”（当地原住民语言），是悉尼港最大的岛屿。"},
{id:277, name:"澳大利亚司法与警察博物馆", region:"大洋洲", country:"澳大利亚", lat:-33.8623, lng:151.2127, address:"悉尼市菲利普街与阿尔伯特街交汇处（4-8 PhillipStreet），周六、周日10:00-17:00 开放（一月延长至周四）", ticket:"门票15澳元", hours:"地址为悉尼市菲利普街与阿尔伯特街交汇处（4-8 PhillipStreet），周六、周日10:00-17:00 开放（一月延长至周四）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E6%BE%B3%E5%A4%A7%E5%88%A9%E4%BA%9A%E5%8F%B8%E6%B3%95%E4%B8%8E%E8%AD%A6%E5%AF%9F%E5%8D%9A%E7%89%A9%E9%A6%86.jpg", desc:"司法与警察博物馆（Justice and Police Museum）位于悉尼中央商务区环形码头附近，是一座承载着殖民时期司法与犯罪历史的遗址。由两座19 世纪的法院和一座水上警察局改建而成。"},
{id:278, name:"比奇沃思监狱", region:"大洋洲", country:"澳大利亚", lat:-36.36, lng:146.687, address:"维多利亚东北部的比奇沃思镇", ticket:"门票约20 澳元", hours:"为每日10:00-16:00（视季节调整）", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/126_%E6%AF%94%E5%A5%87%E6%B2%83%E6%80%9D%E7%9B%91%E7%8B%B1.jpeg", desc:"比奇沃思监狱（HM Prison Beechworth）位于维多利亚东北部的比奇沃思镇。这座监狱运营了140 年，曾是澳大利亚最坚固的中等安全级别监狱之一。"},
{id:279, name:"J 号病房：从淘金监狱到疯人院的暗黑传奇", region:"大洋洲", country:"澳大利亚", lat:-37.285, lng:142.931, address:"Girdlestone Street Ararat VIC 3377", ticket:"票价约17 澳元），时长约90 分钟", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/130_J_%E5%8F%B7%E7%97%85%E6%88%BF%EF%BC%9A%E4%BB%8E%E6%B7%98%E9%87%91%E7%9B%91%E7%8B%B1%E5%88%B0%E7%96%AF%E4%BA%BA%E9%99%A2%E7%9A%84%E6%9A%97%E9%BB%91%E4%BC%A0%E5%A5%87.jpeg", desc:"J 号病房（J Ward）位于澳大利亚维多利亚州西部的小镇阿拉拉特（Ararat），最初是阿拉拉特县监狱，后转为一所收容精神病犯的精神病院。阿拉拉特县监狱因19 世纪中期的淘金热而设立。"},
{id:280, category:"hotel", name:"艾迪娜公寓酒店（Adina Apartment Hotel Pentridge）", region:"大洋洲", country:"澳大利亚", lat:-37.7369, lng:144.9683, address:"墨尔本彭特里奇", ticket:"190澳元/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/24.%E8%89%BE%E8%BF%AA%E5%A8%9C%E5%85%AC%E5%AF%93%E9%85%92%E5%BA%97%EF%BC%88Adina%20Apartment%20Hotel%20Pentridge%20Melbourne%EF%BC%89.jpg", desc:"前身为彭特里奇监狱（HM Prison Pentridge），1851年投入使用，1997年关闭，2023年5月酒店开业。保留了铁门、狭小布局和监狱标志性青石外墙。"},
{id:281, name:"海德公园兵营", region:"大洋洲", country:"澳大利亚", lat:-37.807819, lng:144.965268, address:"悉尼市皇后广场", ticket:"门票20 澳元", hours:"海德公园兵营每日10:00-17:00 开放", image:"https://raw.githubusercontent.com/edgewander/prison-museum-photos/main/121_海德公园兵营.jpeg", desc:"海德公园兵营（Hyde Park Barracks）位于悉尼市皇后广场，这座兵营由流放囚犯建造，是澳大利亚保存最完好的殖民监狱遗址之一，2010 年作为“澳大利亚流放遗址”（Australian Convict Sites）的一部分被列入UNESCO 世界遗产名录。1817 年，新南威尔士州第四任总督拉克兰·麦夸里（LachlanMacquarie）下令兴建海德公园兵营，1819 年6 月启用，设计者是因伪造罪被流放的英国建筑设计师弗朗西斯·格林韦（FrancisGreenway）。"},
{id:282, category:"hotel", name:"老甘比亚山监狱酒店", region:"大洋洲", country:"澳大利亚", lat:-37.8296, lng:140.78, address:"芒特甘比尔市25 Margaret Street", ticket:"20英镑/晚", hours:"", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/26.%E8%80%81%E7%94%98%E6%AF%94%E4%BA%9A%E5%B1%B1%E7%9B%91%E7%8B%B1%E9%85%92%E5%BA%97.jpg", desc:"前身为老芒特甘比尔监狱（Old Mount Gambier Gaol），1866年开始运营，1995年关闭。保留了狭小空间布局、厚重石墙和铁门设计。酒店内设有小型展览区。"},
{id:283, name:"罗斯女子工厂", region:"大洋洲", country:"澳大利亚", lat:-42.0285, lng:147.4947, address:"澳大利亚塔斯马尼亚州罗斯镇近郊的葡萄牙路", ticket:"免费入场", hours:"为每日上午10 点至下午3 点。免费入场。步行从罗斯镇中心上山约10 分钟即可到达。", image:"https://raw.githubusercontent.com/edgewander/prison-museum-map/main/%E7%BD%97%E6%96%AF%E5%A5%B3%E5%AD%90%E5%B7%A5%E5%8E%82.jpg", desc:"罗斯女子工厂（Ross Female Factory）位于澳大利亚塔斯马尼亚州罗斯镇近郊的葡萄牙路，是19 世纪英国位于塔斯马尼亚的四座女子劳改工厂之一。始建于1833 年，1848 年3 月正式启用，至1854 年11月关闭，六年半的运营中，罗斯女子工厂接纳了数百名女性囚犯及其婴儿。"},

    delete checkedDates[id];

    checkedSet.add(id);
    var d = new Date();
    checkedDates[id] = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  saveChecked();
  updateStats();
  renderList();
  updateMarker(id);
  // update popup buttons if open
  var btn = document.querySelector('.popup-check-btn');
  var sbtn = document.querySelector('.popup-share-btn');
  if (btn && btn.dataset.id == id) {
    if (checkedSet.has(id)) {
      btn.textContent = '✅ 已打卡！'; btn.classList.add('checked');
      if (sbtn) sbtn.style.display = 'block';
    } else {
      btn.textContent = '📍 标记为已打卡'; btn.classList.remove('checked');
      if (sbtn) sbtn.style.display = 'none';
    }
  }
}

// ============================================================
// MARKER
// ============================================================
function createMarkerIcon(museum, forceChecked) {
  const checked = forceChecked !== undefined ? forceChecked : checkedSet.has(museum.id);
  const color = checked ? '#2f9e44' : (museum.category === 'hotel' ? '#e8590c' : getColor(museum.region));
  const isHotel = museum.category === 'hotel';
  const label = checked ? '✓' : (isHotel ? 'H' : '');
  const idLabel = (!checked && !isHotel) ? museum.id : '';
  const size = checked ? 32 : (isHotel ? 28 : 28);
  const bg = isHotel ? '#e8590c' : color;
  return L.divIcon({
    className: '',
    html: `<div style="
      width:${size}px;height:${size}px;
      border-radius:${isHotel?'4px':'50% 50% 50% 0'};
      transform:rotate(${isHotel?'0deg':'-45deg'});
      background:${bg};
      border:2px solid rgba(255,255,255,0.9);
      box-shadow:0 2px 6px rgba(0,0,0,0.35);
      display:flex;align-items:center;justify-content:center;
    "><span style="transform:rotate(${isHotel?'0deg':'45deg'});color:#fff;font-size:${checked?14:(isHotel?13:9)}px;font-weight:700;">${label}${isHotel?'':idLabel}</span></div>`,
    iconSize: [size, size],
    iconAnchor: [size/2, size],
    popupAnchor: [0, -size]
  });
}

function updateMarker(id) {
  const m = markers[id];
  if (!m) return;
  const museum = MUSEUMS.find(x => x.id === id);
  m.setIcon(createMarkerIcon(museum));
}

// ============================================================
// MAP INIT
// ============================================================
function initMap() {
  map = L.map('map', {
    center: [25, 10],
    zoom: 3,
    minZoom: 2,
    maxZoom: 18,
    zoomControl: true,
  });

  // CartoDB Dark Matter 暗黑底图（深灰陆地 + 暗色海洋 + 白色标签）
  const cartoDarkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: ['a','b','c','d'],
    attribution: '\u00a9 <a href="https://carto.com/">CARTO</a> | \u00a9 <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    maxZoom: 19,
  });

  // 备用：高德地图（国内访问流畅）
  const amapLayer = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1','2','3','4'],
    attribution: '\u00a9 \u9ad8\u5fb7\u5730\u56fe | \u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 18,
  });

  cartoDarkLayer.addTo(map);

  // CartoDB 国外 CDN 国内可能慢，加载失败自动切高德
  cartoDarkLayer.on('tileerror', function() {
    if (!window._amapFallback) {
      window._amapFallback = true;
      map.removeLayer(cartoDarkLayer);
      amapLayer.addTo(map);
    }
  });

  MUSEUMS.forEach(m => {
    if (!m.lat || !m.lng) return;
    const marker = L.marker([m.lat, m.lng], { icon: createMarkerIcon(m) });
    marker.on('click', () => showPopup(m));
    marker.addTo(map);
    markers[m.id] = marker;
  });

  initFloatingPopup();
  setupMapClickClose();
}

// ============================================================
// FLOATING POPUP (independent overlay, not clipped by map)
// ============================================================
var floatingPopup = null;
var floatingInner = null;
var floatingVisible = false;

function initFloatingPopup() {
  floatingPopup = document.getElementById('floating-popup');
  floatingInner = floatingPopup.querySelector('.floating-popup-inner');
  // Close button
  var closeBtn = document.createElement('button');
  closeBtn.className = 'floating-popup-close';
  closeBtn.innerHTML = '✕';
  closeBtn.onclick = function(e) { e.stopPropagation(); hideFloatingPopup(); };
  floatingPopup.appendChild(closeBtn);
}

function showPopup(museum) {
  activeMarkerId = museum.id;
  var marker = markers[museum.id];
  if (!marker) return;

  var checked = checkedSet.has(museum.id);
  var color = getColor(museum.region);
  var websiteHtml = museum.website
    ? '<div class="popup-info-row"><span class="popup-info-icon">🌐</span><a class="popup-website" href="' + museum.website + '" target="_blank">' + museum.website + '</a></div>'
    : '';
  var ticketHtml = museum.ticket
    ? '<div class="popup-info-row"><span class="popup-info-icon">🎫</span><span class="popup-info-text">' + museum.ticket + '</span></div>' : '';
  var hoursHtml = museum.hours
    ? '<div class="popup-info-row"><span class="popup-info-icon">🕐</span><span class="popup-info-text">' + museum.hours + '</span></div>' : '';
  var addrHtml = museum.address
    ? '<div class="popup-info-row"><span class="popup-info-icon">📍</span><span class="popup-info-text">' + museum.address + '</span></div>' : '';
  var imageHtml = museum.image
    ? '<div class="popup-image-wrap"><img src="' + museum.image + '" alt="' + museum.name + '" onerror="this.parentElement.style.display=\'none\'"></div>' : '';

  var content = '<div class="popup-header" style="background:linear-gradient(135deg,#1a1a2e,' + color + ')">' +
    '<div class="popup-num"># ' + museum.id + '</div>' +
    '<div class="popup-name">' + museum.name + '</div>' +
    '<div class="popup-region">🗺 ' + museum.region + ' · ' + museum.country + '</div>' +
    '</div>' +
    imageHtml +
    '<div class="popup-body">' +
    '<div class="popup-desc">' + (museum.desc || '') + '</div>' +
    addrHtml + ticketHtml + hoursHtml + websiteHtml +
    '</div>' +
    '<button class="popup-check-btn ' + (checked ? 'checked' : '') + '" data-id="' + museum.id + '" onclick="toggleCheck(' + museum.id + ')">' +
    (checked ? '✅ 已打卡！' : '📍 标记为已打卡') +
    '</button>' +
    (checked ? '<button class="popup-share-btn" data-id="' + museum.id + '" onclick="showShareCard(' + museum.id + ');event.stopPropagation()">📤 分享打卡</button>' : '');

  floatingInner.innerHTML = content;
  positionFloatingPopup(marker);
  floatingPopup.classList.add('show');
  floatingVisible = true;

  highlightListItem(museum.id);
}

function positionFloatingPopup(marker) {
  var mapEl = document.getElementById('map');
  var mapRect = mapEl.getBoundingClientRect();
  var point = map.latLngToContainerPoint(marker.getLatLng());
  var popupW = 340;

  // Position popup horizontally: centered on marker, clamped within map
  var left = mapRect.left + point.x - popupW / 2;
  if (left < mapRect.left + 10) left = mapRect.left + 10;
  if (left + popupW > mapRect.right - 10) left = mapRect.right - popupW - 10;

  // Vertical: above or below marker depending on available space
  var markerScreenY = mapRect.top + point.y;
  var aboveSpace = markerScreenY - 20;
  var belowSpace = window.innerHeight - markerScreenY - 20;
  var popupH = floatingPopup.offsetHeight || 300;
  var arrow = floatingPopup.querySelector('.floating-popup-arrow');

  if (aboveSpace > popupH + 30 || aboveSpace > belowSpace) {
    // Show above marker
    floatingPopup.style.top = (markerScreenY - popupH - 18) + 'px';
    floatingPopup.style.left = left + 'px';
    floatingPopup.style.bottom = 'auto';
    arrow.className = 'floating-popup-arrow'; // bottom arrow (default)
    arrow.style.left = (point.x - left) + 'px';
    arrow.style.bottom = '-7px'; arrow.style.top = 'auto';
  } else {
    // Show below marker
    floatingPopup.style.top = (markerScreenY + 24) + 'px';
    floatingPopup.style.left = left + 'px';
    floatingPopup.style.bottom = 'auto';
    arrow.className = 'floating-popup-arrow arrow-top';
    arrow.style.left = (point.x - left) + 'px';
    arrow.style.top = '-7px'; arrow.style.bottom = 'auto';
  }
}

function hideFloatingPopup() {
  floatingPopup.classList.remove('show');
  floatingVisible = false;
  activeMarkerId = null;
}

// Close popup when clicking on map
function setupMapClickClose() {
  map.on('click', function(e) {
    if (floatingVisible) hideFloatingPopup();
  });
  map.on('movestart', function() {
    if (floatingVisible) hideFloatingPopup();
  });
}

// Close popup when clicking outside
document.addEventListener('click', function(e) {
  if (!floatingVisible) return;
  if (floatingPopup.contains(e.target)) return;
  // Don't close if clicking a marker (showPopup handles that)
  var markerClicked = false;
  for (var k in markers) {
    if (markers[k]._icon && markers[k]._icon.contains(e.target)) { markerClicked = true; break; }
  }
  if (!markerClicked) hideFloatingPopup();
});

<p>艾森豪威尔将军的兄弟米尔顿·S·艾森豪威尔希望只对男性进行“安置”，将他们带到美国内陆那些急需劳力的农业社区。他主张把日裔美国人从海岸线转移出去，而不是关进拘留营。但犹他州等州的州长坚称，这些撤离人员可能会破坏他们的发电厂或供水。艾森豪威尔不情愿地同意建立拘留营，他写道：“作为美国人，我们将对不可避免的不公正行为感到遗憾。”艾森豪威尔对安置的方式感到不满，于1942年6月18日从WRA辞职，取而代之的是迪伦·迈尔斯。 战时再安置管理局聘请几位摄影师来记录这一“疏散”和“转移”的行动，包括多萝西·兰格（Dorothea Lange）、安塞尔·亚当斯（Ansel Adams）、阿尔伯斯（Clem Albers）和李（Russell Lee），希望向人们展现美国政府对美籍日裔的“人道”待遇。他们也被允许进入拘留营拍摄，条件是不可以拍摄警卫、岗楼、铁丝网等军事设施。 兰格（1895-1965）最广为人知的作品是大萧条时期一张名为《移民母亲》的照片。“兰格打心底里并不赞同政府这项行动，她拍下这些照片，并在之后呼吁关闭这些拘留营。”兰格完成任务后，军事长官们看到她的作品，发现兰格的观点在她拍摄的照片中有很明显的体现，因此把她拍摄的照片封存到国家档案馆，2006年历史学家Linda Gordon和Gary Y. Okihiro发掘出这批照片，才公之于众。</p>

<p>曾被监禁的美籍日裔艺术家宫武东洋（Tōyō Miyatake）。宫武东洋起初被关在曼扎纳尔拘留营，他偷带了一个镜头并做了一个简易的箱式相机。一开始是严格禁止在拘留营拍照的，但后来制度有所放松，允许他拍照，但快门得由白人长官按。</p>

<p>官方希望拘留营是自给自足的，每个成年人都要工作，从厨房到给锅炉喂煤到担任拘留营医生以及在营地农场工作。米尼多卡建立了一个为所有被监禁的日裔美国人制作服装的工厂，曼扎纳尔、吉拉河和波斯顿的工厂生产战争使用的伪装网，吉拉河的工人为美国海军制作船模，心山有一家丝印店为军方制作宣传海报。这些工作只能得到很微博的薪酬。1942年，美国人平均月薪为157美元。“在拘留营里，医生或牙医每个月的最高工资是19美元”，平均月薪是12美元。</p>

<p>在曼扎纳尔拘留营的头几个月里，大部分被监禁者来自洛杉矶的小东京，他们分为支持和反对WRA的两派。1942年11月曼扎纳尔爆发大规模抗议活动。军警向人群投掷催泪瓦斯并开枪，打死两人，打伤数人。在图勒湖、波斯顿、哈特山和杰罗姆，一些被监禁的人组织工会罢工，抗议被微薄的工资。军警再次对他们进行了镇压。到1943年7月，所有“捣乱者”被派往最高安全警戒级别营地图勒湖，确保了其他9个营地的平静运作。</p>

<p>排队投选票</p>
<p>安塞尔·亚当斯在曼扎纳拘留营拍摄的照片更符合当局的期许，他的照片里的曼赞纳拘留营像风景照一般，背景清晰明亮，远处的群山若隐若现，拘留营上方是加利福尼亚州广阔的天空。这体现了他浪漫风景照的风格，也令其他摄影师对他的照片评价不一。1944年他的这一系列摄影作品得以出版，书名为《生而自由与平等：忠诚的日裔美国人的故事》（Born Free and Equal: The Story of Loyal Japanese Americans）。并在1945年登上了《旧金山纪事报》的畅销书排行榜。</p>
<p><img src="2.7.105.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1943年2月1日，美国政府推翻先前不许日裔美国人在军队服役的决定，批准编成一个以日裔美国人为主的战斗单位。几天后，政府要求全部被拘禁者回答一份忠诚度问卷调查，用于日裔美籍第二代的征兵登记。 问卷调查的第27题，询问合乎条件的男性公民：“你是否愿意服役于美国军队的战斗职务，不管是什么安排？”和第28题：“你能否宣誓完全对美国拥护，以及全心全意保卫美国免于来自任何外来或国内的军事攻击，且宣誓放弃以任何形式效忠或服从日本天皇，或任何其他外国政府、政权或组织？”</p>
<p>这两个问题的合格答案是“YES”，但是有近四分之一的日裔美籍第二代男性公民一致回答“NO”，或答案“有保留”，有些则留下空白未填写。他们批评这是让日本人送葬，或是搞种族歧视。不过，仍有超过百分之七十五的人表示他们自愿应募，和宣誓效忠美国。</p>
<p>1943年3月23日，第442团战斗队成立了日美独立作战部队。超过12000第二代日裔美国志愿者响应号召入伍。最终，来自拘留营的1500名日裔和来自夏威夷的2686人（夏威夷处于戒严状态，没有拘留营）于1943年4月在密西西比州谢尔比营（Camp Shelby）集合，接受为期一年的步兵训练，尔后他们被派往欧洲战场。因伤亡人数众多，至二战结束补充的人员数量是原人数的2.5倍，总计约有14000人曾在二战期间在该部队服役，共获得9486枚紫星勋章，八次美国总统部队嘉许奖（一个月内五次），且有21位成员获得二战荣誉勋章，被称为紫心部队。21名成员获得了荣誉勋章。2010年，国会批准向二战期间服役的第442团战斗队和联合部队授予国会金质奖章，2012年，所有幸存成员都获得了荣誉勋章他们为法国解放和英勇营救失去的军队做出了贡献，成为法国荣誉区的骑士。</p>

<p>1944年12月18日，美国最高法院就两起有关日裔拘留合法性的重要案件作出裁决。第一起为Fred Koremats诉美国政府，法院宣布将日裔美国人从“军事禁区”中驱逐是符合宪法的。第二起由日美公民联盟起诉，该联盟挑选了一位名叫恩多三叶的年轻女性代表12万被监禁者。在该案中，法院裁定无理由拘留忠诚的美国公民是非法的。这项裁决为释放被监禁的日裔美国人打开了大门。 1945年1月2日，罗斯福总统签署了第21号公告，允许日本移民和日裔美国人返回西海岸。然后，战时再安置管理局制定了一项计划，在一年内关闭所有10个集中营。被拘留者得到25美元（今天大约价值348美元）和火车票。然而，大多数被监禁者已经失去了家园和工作，也耗尽了所有的积蓄，很难离开，所以有许多日裔美国人一直呆在营地里，直到被迫离开。有一半人选择回到西海岸，另一半人去到其他地方。5700人申请放弃美国国籍，4700人申请被遣返回日本。 1945年8月6日，美国陆军航空兵在日本广岛投放了一枚原子弹。三天后，美军在距广岛186英里的日本长崎市投放了另一枚原子弹，造成12.9万至22.6万日本人死亡。8月15日日本政府向盟国投降。 1945年底，大多数拘留营都关闭了，戒备森严的图勒湖拘留营于1946年3月关闭。 1988年，美国国会通过了里根总统签署的法案，美国政府正式道歉，承认政府的行动是出于“种族偏见、战争中的不安情绪和政治领导层的失败。向被拘留的日裔美国人和他们的继承人支付了总计超过16亿美元的赔偿。</p>

<p>​阿尔卡特兹岛是美国加州旧金山湾内的一座小岛，距离旧金山渔人码头不到2英里。英文名Alcatraz Island，意思是鹈鹕岛，面积为0.0763平方公里，四面峭壁深水，联外交通不易，因而被美国政府选为监狱建地。阿尔卡特兹1907年成为军事监狱，由囚犯建造了大部分的建筑物。一战时菲利普·格罗瑟（Philip Grosser）因拒绝服兵役而被判有罪，他把自己的铁窗经历整理出书，取名《山姆大叔的恶魔岛》（Uncle Sam's Devil's Island），由此，之后这座鹈鹕之岛也被称为恶魔岛。1933年军队撤出了恶魔岛，1934年恶魔岛成为联邦监狱，近30年时间内，那里关押过近100名臭名昭著的重刑犯，包括芝加哥“教父”阿尔·卡彭(Al Capone)、天赋异禀对鸟类极有研究的杀人犯“鸟人”史特劳德(Robert Stroud)和冷血的“机关枪”杀手凯利(George Kelly)等。由于只用来囚禁重刑犯，岛上的336间囚室从未住满过，平均囚禁人数为260人，也从未处决过任何囚犯。</p>
<p><img src="2.10.2.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>在监狱使用的29年间，监狱官方声称没有任何一名囚犯成功越狱。一共有36名囚犯尝试了14次越狱。其中2人曾两次试图越狱，23人被缉拿，6人在越狱过程中被击毙，2人溺亡，5人被列为失踪（溺亡）。最严重的一次越狱发生在1946年5月2日，6人试图越狱挑起“阿尔卡特兹械斗”。1962年6月11日，法兰克·摩利斯、约翰·安格廉以及格拉伦斯·安格廉执行了堪称史上最复杂也是最知名的越狱计划。</p>
<p>1963年，联邦政府鉴于监狱运营成本太高而放弃了该岛。后来一度无人居住。</p>
<p>1964年3月8日，恶魔岛第一次被美洲土著活动家占领。这次抗议活动由苏族活动家贝尔瓦·科蒂尔（Belva Cottier）提议，约35人参加，持续了4个小时，《旧金山纪事报》和《旧金山考官报》等报道了抗议活动。印第安人根据美国和苏族之间的《拉拉米堡条约》（1868年）的规定声称拥有该岛；他们说，该条约承诺将所有退役、废弃或不再使用的联邦土地归还给这些土地的原主人。当时，各族印第安人都以“最早发现权”的名义声称拥有阿尔卡特拉兹岛，因为土著部落早在欧洲人来到北美几千年前就发现了这个地方。抗议者表示愿按当年政府付给印第安人的价格支付款项给联邦政府。按每亩47美分计算，整个阿尔卡特兹的价格为9.4美元，12英亩可用土地的价格为5.64美元。科蒂尔还表示，联邦政府将被允许继续使用岛上的海岸警卫队灯塔。</p>

<p>占领者在岛上住下来后立即开始组织了起来，他们成立了一个民选委员会，所有决定都是经所有成员共同决定，安排每个人各司其职，安全、卫生、日托、学校、住房、烹饪、洗衣......，建立了一个小小的乌托邦。他们还建立了自己的电台。举行感恩节盛大party。鼎盛时期，岛上有400人居住。 其间，马龙白兰度、简·方达等明星去岛上为他们站台，有明星给他们捐赠了发电机、船等设施。</p>

<p>占领者在岛上逗留了19个月，他们要求政府对岛上的设施进行改造，并为印度教育中心、生态中心和文化中心建造新的建筑。占领行动吸引了来自全国各地的其他印第安人，包括来自明尼阿波利斯的美洲印第安运动的激进分子。印第安土著要求美国政府对从他们部落拿走的土地的行为进行赔偿。</p>

<p>联邦政府最初坚持要求印第安人离开该岛，在岛周围设置了路障，后来同意了印第安人提出的正式谈判的要求。印第安方面想要拿到阿尔卡特兹的所有权，建立一所印第安大学，一个文化中心和一个博物馆。政府表示无法满足他们的要求，督促他们离开阿尔卡特兹。</p>
<p>到1970年初，印第安组织内部开始陷入混乱，一些人反对理查德·奥克斯，1970年1月，印第安学生开始返回学校，取而代之的是来自城市和保留地的印第安人，他们没有参与最初的占领。此外，一些非印第安人也开始到岛上居住，包括旧金山嬉皮士和瘾君子。对组织的致命一击发生在1970年1月5日，当时奥克斯13岁的继女伊冯从三层楼的楼梯间摔下身亡。伊冯死后，奥克斯离开了岛上，两个互相竞争的团体争夺岛上的领导权。</p>
<p>与此同时，政府关闭了岛上的电力输送，并拆除了向占领者提供淡水的水驳。水上驳船被移走三天后，岛上发生了火灾。几座建筑被烧毁。包括灯塔看守所、典狱长之家、军官俱乐部、娱乐厅和海岸警卫队宿舍。政府指责印第安人，印第安人指责政府派人秘密纵火嫁祸印第安人。</p>
<p><img src="2.10.40.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>1971年，占领者的状况日益恶化。据称，为了筹集资金购买食品，他们开始从建筑物上剥离铜线和铜管，并将其作为废金属出售。其中三名占领者被捕、受审，并因出售约600磅铜而被判有罪。1971年初，同情占领者的媒体也开始转而反对他们，并发表岛上的负面报道，还有一宗袭击案件被起诉。很快，他们几乎失去了所有支持。 1971年6月10日，全副武装的联邦法警、FBI特工和特种部队警察蜂拥而来，带走了5名妇女、4名儿童和6名手无寸铁的印第安男子。持续十九个月零九天的占领活动就此结束。</p>

<p>在占领活动期间，尼克松总统废止了《印第安人终止政策》，建立了一个新的自我认定政策。归还了蓝湖和48000英亩土地给陶斯印第安人。</p>
<p>占领阿尔卡特兹后来一直被印第安人视为印第安自我觉醒的意义重大的事件。</p>
<p>1971年阿尔卡特兹被纳入金门国家公园。</p>
<p>离开阿尔卡特兹后，奥克斯继续抗争，他帮助Pit River部落夺回了被太平洋电器公司侵占的近300万英亩土地。奥克斯还计划创建一所“移动大学”。1972年他不幸被一名白人至上主义者射杀。</p>

<p>2017年5月22日谷歌日历涂鸦（google doodles）纪念理查德·奥克斯75岁生日</p>
<p>1973年3月27日第45届奥斯卡颁奖典礼上，马龙·白兰度凭借《教父》荣获当年奥斯卡最佳男主角，但是马龙·白兰度没有现身，他请参加过占领阿尔卡特兹的印第安女士萨申·小羽毛替她上台，小羽毛拒绝了主持人递过来的奥斯卡小金人。称马龙·白兰度愤怒于电影界把印第安人塑造成了野蛮残暴的形象，除非等这些现象有所改善，他才会对奥斯卡奖表示尊重。</p>

<p>2011年一个名为“我们仍然在这里”多媒体常设展厅在阿尔卡特拉斯开放，对为期19个月的占领活动进行反思。并设立了印第安文化中心。展厅陈列了许多由旧金山州立大学和加利福尼亚州立大学的学生搜集的当年的照片、视频以及声音资料。以及展览馆的馆长对当年的占领者以及奥克斯子女的采访资料。</p>

    content: `<p>文/吴家东、朱文一</p>
<p>监狱建筑的发展与特定的刑罚制度和社会环境分不开。美国监狱建筑建立在西方监狱建筑变革创新的基础之上，在其特定的历史条件、司法制度、社会现实和罪犯改造理念之下，形成了自身的特点。</p>
<p>发展历程</p>
<p>据《监狱学》一书记载，早在奴隶社会时代，古希腊和古罗马就已经出现了早期的监禁建筑。在进入资本主义社会之后，近代监狱建筑开始出现。法国哲学家福柯在《规训与惩罚》一书中认为，正是由于资本主义生产关系的发展和人权意识的建立，才使得欧洲的行刑逐渐由身体刑逐渐转变为自由刑；因为只有当生产力发展到资本主义时代时，囚犯的自由才有了意义——剥夺他们的自由可以剥夺其劳动价值并为统治阶级所用。而据《外国建筑史》一书的介绍，1595年荷兰阿姆斯特丹矫正院（Rasphuis）的建立，是西方近代自由刑和监狱的开端。</p>
<p>阿姆斯特丹矫正院</p>
<p>在建国之前，美国的监狱建筑直接借鉴于欧洲，这些监狱大多采用欧洲中世纪城堡的建筑形式，以形成一种坚固的、牢不可破的心理暗示，如东州教养所（Eastern_State Penitentiary）、西维吉尼亚监狱（West Virginia State Penitentiary ）等。这种城堡式监狱大多采用大型的集体牢房，囚犯居住环境较为恶劣。在18世纪中后期，欧洲掀起了一场监狱改良运动，提倡教育矫正罪犯的自由刑观念。这场西方近代监狱的改良运动影响到美国，促使了现代监狱的诞生。</p>
<p>东州教养所</p>
<p>西维吉尼亚监狱</p>
<p>## 1. 大屋监狱时期</p>
<p>美国建国直至19世纪中期，监狱建筑的主要形制特点为一个大型屋宇容纳监狱的所有功能，所有囚犯监房位于同一个监区。大屋监狱的形式包括宾州制监狱、奥本制监狱及圆形监狱。</p>
<p>根据《监狱学》一书记载，1790年，宾夕法尼亚州的胡桃街监狱（Walnut_Street Prison）投入使用，标志着世界上第一所现代监狱的诞生。胡桃街监狱在原有老监所的北边加建了一个折线形建筑，构成一个完整的围合建筑体。胡桃街监狱的特点是采用了中间走廊、两侧细胞式监房的结构。这种监房布置形制在问世后很长一段时间被欧美各国借鉴和吸收，被称为“宾州制”监狱。</p>
<p>胡桃街监狱平面图</p>
<p>1817年，纽约州奥本监狱（Auburn Prison）建成使用，其监房布置方式是中间两排背靠背的这些监房一共有5层高，细胞式监房、外面两侧是走廊。而2层以上的走廊部分挑出在一个共享的上下通高的大空间里。由于监房互相隔开、背对并且与外界没有接触，这种监房布置方式是非常安全的，被称之为“奥本制”。</p>
<p>纽约奥本监狱</p>
<p>据《规训与惩罚》一书的描述，18世纪末英国功利主义哲学家杰瑞米·边沁提出了一种“圆形监狱”（Panopticon）的设计理念。这种监狱由一座中心岗楼和环形围绕岗楼的小监房构成，每个监房都有前后两个窗户。因为逆光效果，中央岗楼的监督人员可以清楚地看到监房中囚犯的行为，囚犯由于产生时刻被监视的心理而时刻迫使自己遵守纪律。这种设计理念在欧洲并没有得到推广，反而是在19世纪初被引入美国后，建设了一批以此为理念基础的监狱，如匹兹堡西部监狱（Western Penitentiary）、斯泰特维尔监狱（United States Penitentiary of Terre Haute）等。</p>
<p>圆形监狱剖面图</p>
<p>斯泰特维尔监狱内部</p>
