<p>新加坡 樟宜监狱礼拜堂</p>
<p><img src="11.8.13.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.14.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>雅加达 雅加达历史博物馆（地牢）</p>
<p><img src="11.8.15.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.16.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>万隆 班丘伊监狱遗址</p>
<p><img src="11.8.17.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.18.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>日惹 Wirogunan监狱</p>
<p><img src="11.8.19.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.20.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>玛琅 Lowokwaru监狱</p>
<p><img src="11.8.21.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.22.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>泗水 古城废弃监狱</p>
<p><img src="11.8.23.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.24.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>马尼拉 圣地亚哥古堡</p>
<p><img src="11.8.25.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.26.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>行程仓促，有一些重要的点没能去到，菲律宾更是几乎没能展开。</p>
<p><img src="11.8.27.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.28.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>国人常去这几个国家休闲度假，听得多了，我心想“小小东南亚”，就没怎么做功课。11月开始，马来西亚、印尼都进入了雨季，也不知道对出行有没有影响。但年底得冲冲任务，走吧。</p>
<p><img src="11.8.29.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.30.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>12月11号中午，第一站来到马来西亚首都吉隆坡。机场大巴进城，先去看了下车站附近的国家博物馆。之后吃午饭，到宾馆放下行李，出门去寻找半山芭监狱（Pudu Jail）的遗址。</p>
<p><img src="11.8.31.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.32.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>半山芭监狱位于吉隆坡市中心，由英殖民政府兴建，1895年启用，运行了100多年，于1996年关闭，曾改为监狱博物馆，半年后关闭。2009-2012年拆除，在原址建了豪华商场LaLaPort。网上说监狱的大门以及一小段围墙得以保留。我走到该商场，从东门穿到西门，又绕外围走了一圈，没找到监狱大门，不确定它跟商场是一个什么关系。</p>
<p><img src="11.8.33.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.34.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>商场的北门，有一家面包坊+咖啡馆，冲大路的店门有点像监狱大门，两边各有一个窄窄的侧门和两扇有铁网的窗。但附近没有介绍，我确定不了，问了店外的保安以及西门的保安，都说不知道。兜了半天，我才想起网络，在手机上搜以前监狱大门的照片，才确认了就是这里。这家店叫CHEF KECIK，在大门的基础上合围了一个小半圆，装修成一家档次还不错的面包坊。旁边有个不大的喷泉广场，叫大门广场（Gate Plaza），应该指的就是监狱大门。后来问到另一个保安，他说就是这里。转换身份以后，很难看出来它的正脸曾经是一座监狱的大门，估计大部分客人也不知道这甜美的牛角包与监狱的牵扯。</p>
<p><img src="11.8.35.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.36.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>以前，半山芭监狱还有个特色，它的外墙有270公尺长的壁画。是三名犯人邝炎章、曾戴登和林金祥1983年耗时上千小时完成的，创下当时世界最长壁画记录，监狱当局为此购买了327桶漆料。可惜没能保存下来。</p>
<p><img src="11.8.37.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.38.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>当时店里客人不少，我就先去别的地方逛了。茨厂街看了下关帝庙和马里安曼印度庙。印度庙需要脱鞋才能进去，里面好几个端着祭品忙碌的光着上身的男祭司。又看了下中央艺术坊和独立广场。</p>
<p><img src="11.8.39.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.40.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>晚上九点多，我走回CHEF KECIK，打算坐下来喝一杯苦咖啡。但店员说要打烊了，不卖了，我只好悻悻地走回住处。</p>
<p><img src="11.8.41.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.42.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>12号，离开吉隆坡，坐2个小时大巴到了马六甲。马六甲是座旅游城市，街上很多当地特色的三轮人力车，花团锦簇，点缀着各种卡通玩偶，配着流行歌，招摇过市，我感觉坐上去像坐进花圈。</p>
<p><img src="11.8.43.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.44.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>住下后，公交去马来西亚监狱博物馆(Muzium Penjara Malaysia)。</p>
<p><img src="11.8.45.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.46.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>博物馆离住处不到三公里，原址是1860年由英殖民政府建造的监狱。1990年代末，随着新监狱的启用，该监狱废弃。2011年，马来西亚监狱署与当地政府合作，将该遗址改造为博物馆。2014年11月起免费对外开放。</p>
<p><img src="11.8.47.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.48.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>这博物馆不小，有两层楼。</p>
<p><img src="11.8.49.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.50.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>有结实的牢房、绞刑室、接见室、工房、医务室、操场、岗楼等，有服刑人员作品展、自制违禁品展示、服刑人员用的缝纫机、织布机，还有几个展厅关于马来监狱制度，包括惩戒器械、警服囚服的变迁，各监狱建筑、还有一个房间专门放鞭刑视频等等。</p>
<p><img src="11.8.51.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.52.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>这种质感和色彩竟然给我一种很美的感觉</p>
<p><img src="11.8.53.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.54.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>墙上的涂鸦</p>
<p><img src="11.8.55.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.56.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>看完博物馆，外面下起小雨，我沿着外墙避雨，一边跟在里面干活的大叔聊天。他把我带到后院，那里还有些展品。收集了各监狱的门和一些刑具（站笼、断头台等）。</p>
<p><img src="11.8.57.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.58.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>去大家都去的荷兰红屋、圣保罗教堂、鸡场街。鸡场街有不少老房子，门神的位置和窗上都写不少中文，如河图洛书，三多九如，三醒九思，礼门义路，“志奋九霄追前哲，鹏程万里望后昆”等等。到马六甲才发现马来西亚除了国旗，每个州都有自己的州旗。</p>
<p><img src="11.8.59.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.60.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>天快黑的时候，坐马路牙子上下载了grab软件，打车去看了下马六甲海峡的地标点。旁边有座写着“又见马六甲”的海浪一样剧院，上演王潮歌的作品《又见马六甲》。</p>
<p><img src="11.8.61.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.62.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>13号中午，大巴去新山。一路看到摩托车群呼啸，后来听说有摩托党聚会，又碰上事故堵车，还下起了雨，近五点才到新山。又一阵大雨，公交进城，直接去监狱博物馆（kota Jail）。</p>
<p><img src="11.8.63.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.64.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>该遗址分两部分，一部分是公共空间，一部分是供参观的牢房区。公共空间包括饮品区、车间里的艺术和手工市集，晚八点还有独立电影放映，另一个车间开发为餐饮区。</p>
<p><img src="11.8.65.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.66.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>参观区大概定时开放，我去的时候拉着线，以为要第二天再来。</p>
<p><img src="11.8.67.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.68.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>“Prison Cell For Rent,+6016-721 5646”</p>
<p><img src="11.8.69.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.70.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>正在徘徊的时候，工作人员领着一群人来了，我跟着就进去了，也不知道他们是不是买了票。进去后，工作人员又把线挂上，开始用马来语导览。这群人有20来个，大部分是年轻人，还有好几个小朋友。同样是不少涂鸦、自制违禁品、囚服、鞭刑架等，最后在一个屋子里集体看鞭刑视频，一个五六岁的小女孩捂着眼睛一直不敢看。</p>
<p><img src="11.8.71.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.72.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>Kiss Me When I Cry, Bless Me When I Die.</p>
<p><img src="11.8.73.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.74.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>走出kota Jail，去看了下罗哲文题字的柔佛古庙。莫名其妙领了一份印度人圣诞派饭，转了下旁边的印度庙，穿过夜市去找公交站。发现南边一河之隔就是新加坡。新山华人比较多，打车，出租车司机是华人，到旅馆，工作人员是华人，吃饭，饭馆老板也是。住下后，买了张次日早上七点过新加坡的火车票。</p>
<p><img src="11.8.75.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.76.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>14号六点起来，想着离火车站就三公里多，打个车十来分钟就到。没想到在软件上看司机兜来兜去就是过不来，我以为这人有什么问题，过了半天他说今天自行车比赛，到处封路，过不来，只好取消订单。往出走了一段，再打，还是没戏。眼看着到了七点，只能放弃。</p>
<p><img src="11.8.77.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.78.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>走去车站，路过一片墓地，马来西亚的墓比较低调，有的露出一个军棋一样的头。有的窄窄的，地面部分像以前扣坯的架子，四块石板拼起来。</p>
<p><img src="11.8.79.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.80.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>又走过kota Jail，吃了早饭。到车站火车已经没票了，于是坐大巴。</p>
<p><img src="11.8.81.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.82.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>新加坡比较友好，上下车刷信用卡就可以，丝滑过关，还是大巴，九点到青旅。新加坡面积小，东西50公里，南北20多公里，但有600万人，华人占四分之三。以前叫过淡马锡、狮城、星洲等，没有想象中的繁华和现代。随处可见雅致多彩的花窗。</p>
<p><img src="11.8.83.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.84.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>坐公交去16公里外的樟宜监狱教堂＆博物馆。这边公交司机都偏老，车上也有老头大声外放看视频。1942年2月，新加坡沦陷，日本占领军将樟宜地区的英军军营改建为樟宜战俘营，用于关押被俘的盟军士兵和本地反抗者（英国、澳大利亚、印度和新加坡本地士兵近十万人）。博物馆门票9.81新币。</p>
<p><img src="11.8.85.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.86.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>15号，回新山，飞印尼首都雅加达。看了下印尼介绍，两亿八千万人，世界第四人口大国，。爪哇人占45%，巽他族14%。穆斯林87%，地球上穆斯林人口最多的国家，有17508个岛，世界上最大的群岛国家。雅加达有一千多万人，雅加达都市圈四千多万人，是全球人口最多的城市。晚八点落地，机场大巴进城，下车走1.6公里到旅馆，一路垃圾不少，乱，摩托多，小摊多。</p>
<p><img src="11.8.87.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.88.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>16号，看到新闻说巴厘岛洪灾，淹了别墅，死了一名女游客。打车去新宾馆，到地方下车，司机说得付现金，22000（9块多），我不知道雅加达grab不能从支付宝扣钱。幸好昨晚取了点现金，最小一张面值50000（合21块），司机找不开。那我买点东西。后边有个路边摊，做没见过的吃的。老板操作的时候，我在想，这啥玩意，我吃的惯？做完打包，我付钱，司机伸手拎了餐盒。拿到零钱后我又给了司机25000，司机拿了饭和钱上了车，走了。我看了看手里两张5000，懵了。</p>
<p><img src="11.8.89.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.90.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>放下行李后，先去附近国家博物馆。挺好的博物馆，很多东西不明就里。赶上学校组织小朋友来参观，好几种校服，欢乐可爱。</p>
<p><img src="11.8.91.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.92.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>出博物馆到独立广场，有国家纪念塔，广场北边是伊斯蒂克拉尔清真寺。进清真寺要登记，围上纱绒。该清真寺规模排世界第三，说里外加起来可容纳25万人做礼拜。清真寺对面是一座圣母升天主教座堂，教堂门口给几个精神小伙拍照。</p>
<p><img src="11.8.93.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.94.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>之后才去九公里外的雅加达历史博物馆（Museum Fatahillah），该博物馆在古城中心，建于1707–1710年，原本是巴达维亚市政厅，由荷兰东印度公司时期总督主持落成。1974年3月大楼转型为博物馆，里面有一排地牢。谷歌地图显示该博物馆三点就关门了，我不死心，想去看看。坐雅加达的地铁和BRT都要办卡，一张五六十块钱，还不能退。但公交对外国游客免费。到了地方，果然关门，不过博物馆门前的法塔西拉广场有不错的乐队演出，还有不少租彩色老式自行车的，大家以在广场转圈骑自行车为乐。周边还有不少人体雕塑。广场西北角是木偶剧场，东边是个美术馆，换了乐队后，飘起小雨，我起身回住处。</p>
<p><img src="11.8.95.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.96.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>谷歌地图显示，回程的小公交也对外国游客免费。大概是为了应对拥堵的路况，这种公交小到只有面对面两排座位，最多坐十个人。</p>
<p><img src="11.8.97.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.98.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>也是刷卡，乘客上来把卡传给前排帮刷，过一站再刷一下才把卡还回去。我以为坐刷卡机边上的是车上的工作人员，挺不好意思的问他要不要买票，他听不懂，尴尬地笑。我像一个愿意自首的小偷，时不时的看看他，表示我可以买票，他也不说话，客气地笑，翻手机，好像找在线翻译。小巴绕来绕去，经过大片的城中村（看得出来雅加达城市管理难度不小，怪不得要迁都）。到站下车，小伙也下来了。原来他不是乘务员，他用翻译说可以带我去喝个咖啡，“附近有咖啡馆”。好吧，都说要和当地人深入交流。但是他几乎不会英语。他说加个whatsapp，我没有。他说他有微信。我一看，名字叫王特里斯坦，有三个好友，现在有四个了。屏保是个中国小伙，他说是他朋友。我说很帅，他说谢谢。我忍了半天说对不起啊小哥，不知道有没有啥误会，我不是同性恋啊。小哥说没事没事。继续走向咖啡馆。路上还从兜里掏出两块糖，给了我一个。可是，过了我的宾馆又走了半天，还是没有咖啡馆。这时候我感觉到下了半天的小雨成问题了，我俩都没打伞，我的脚也表示走累了。我跟他说帅哥，实在是太远了，这咖啡我不喝了。反正咱们加了微信，慢慢聊.．．回去后我发现他把我删了。</p>
<p><img src="11.8.99.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.100.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>17号，再去雅加达历史博物馆。还是有不少学生，地牢里有不少大大小小的铁球，是用来系在犯人脚镣上的，我掂了个小的，不轻。</p>
<p><img src="11.8.101.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.102.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>出了博物馆，回酒店背行李，到独立广场东边的火车站，准备去万隆。但普通车只有晚上六点的班次。于是想着去坐高铁，但高铁站还有15公里。出站碰到摩的揽客，戴上头盔。摩托载着我穿过摩登的雅加达，幸好坐了这一段，否则我对雅加达的认识只有脏乱差那部分，这边肯定不缺咖啡馆。不一会，下起了大雨，赶紧避雨。稍小后，司机拿出雨衣继续走，然后停在没多远的一个站，说到了，其实还有十多公里。看他不容易，商量了个价结束行程。抽完向他讨的一支烟，叫了辆出租车。</p>
<p><img src="11.8.103.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.104.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>高铁三点半就到万隆，再坐一段免费的接驳火车才到市中心。下车先去看班丘伊监狱遗址（Monumen Penjara Banceuy），该监狱1877年由荷兰人建造，因反对殖民统治，“印尼国父”苏加诺于1930年在此被关押八个月。1983年，监狱拆除，保留了当年关押苏加诺的第5号牢房（Block F）和警卫塔。</p>
<p><img src="11.8.105.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.106.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>我四点多到达该遗址，在两栋楼之间的一个小院里，但四点就关门了。我跟里面的管理员讲情，他好心开了门。院内一间小小的牢房，一尊苏加诺的坐姿雕像，两边墙上有一些展板。据说附近还有个原监狱的岗楼，我没注意，没去看。</p>
<p><img src="11.8.107.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.108.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>看完去青旅，路过万隆“锣鼓巷”布拉加街，看到万隆热闹的一面，不少人在拥挤的街头给人拍照谋生。</p>
<p><img src="11.8.109.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.110.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>18号，又是一早出门，不到六点就有人在街上拍照。看到两对趁人少拍婚纱照的。六点半的火车去日惹，火车上分男女厕所，有流动咖啡售卖，乘务员戴头巾穿民族特色裙子。前半段，火车在山群穿梭，村庄和热带植被在低处。十点多，去餐厅吃饭充电，看印尼排华历史（政府一直回避这个问题）。后半程偏平原，窗外多稻田。11点后开始下雨，车厢空调足，冷。六小时后抵达日惹。</p>
<p><img src="11.8.111.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.112.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>住下后，先去水之城堡，再去弗里德堡要塞博物馆（Vredeburg Museum）。这座博物馆原本是一座荷兰殖民时期的堡垒，1942–1945年，日本占领时成为日军总部和监狱。1980年代，转型为博物馆，主要展示印尼独立斗争历史，展馆里弥漫着刺鼻的本地香水。博物馆里的监狱，如今改成了穆斯林的祈祷室。</p>
<p><img src="11.8.113.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.114.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>出了博物馆，天还亮着，看了下两公里外有个现役监狱，想着反正也不远，去看看吧。打了个摩的过去，意外看到满墙涂鸦，有官方的也有大家创作的。</p>
<p><img src="11.8.115.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.116.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>这座监狱叫Wirogunan，始建于20世纪初的荷兰殖民时代。2022年底，狱方召集一些涂鸦创作者，涂了整整三面墙，大家可以自由发挥，官方只是贴了两个提示：请不要发布淫秽内容。所以呈现出不少挺耐看的作品。完全没有五讲四美、正能量等主旋律画面。</p>
<p><img src="11.8.117.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.118.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>正面外墙上，狱方也做了一些展示。</p>
<p><img src="11.8.119.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.120.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>监狱不是终点</p>
<p><img src="11.8.121.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.122.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>“过去的监狱极其残酷，从强迫劳动到公开绞刑以及其他种种侵犯人类尊严的行为，不一而足，充斥着各种非人道待遇。</p>
<p><img src="11.8.123.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p><img src="11.8.124.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>如今监狱系统已转型为矫正系统，人权得到尊重。囚犯现在被称为矫正服刑人员，接受各种形式的适当待遇。这些待遇包括技能培训，帮助他们成为独立自主的人，以及宗教指导，以增强他们对上帝的虔诚。”</p>
<p><img src="11.8.125.jpg" alt="" style="max-width:100%;margin:12px 0;border-radius:4px;"></p>
<p>走回夜市，满大街马车三轮车人力车，有好些街头表演。</p>
<p>不少男的在街头按摩。以及日惹人喜欢路边席地而坐吃喝休闲。一位当地人告诉我日惹是印尼工资最低的城市，普通人月薪只有几百到一千出头。</p>
<p>吃完饭，在大堂晃了下，看到一个City Walk Tour的招募，第二天居然是去逛那座涂鸦监狱（周五固定项目），但我没本地电话，也没whatsapp。想着还按自己的安排，如果下午能回来就空降过去学习一下。</p>
<p>19号，骑摩托去婆罗浮屠，转完又去看了小鸡教堂和另外两个寺庙，回到城里六点了，没赶上监狱旅游团，些许遗憾。</p>
<p>20号，逛了皇宫、普兰巴南和塞乌寺。由于日惹苏丹在四十年代积极支持印尼的独立运动，新的印尼政府决定成立日惹特区，苏丹仍拥有日惹地区的行政管理权，“世袭罔替”，2012年还将此写入国家法律。印尼其他地方的苏丹或王室领袖，如梭罗苏丹和巴厘岛乌布皇宫主人，只有象征性头衔，没有任何实职。塞乌寺（CANDI SEWU），建于公元8世纪，为中爪哇第二大佛教寺庙群（第一是婆罗浮屠）。整体按照曼荼罗布局排列，由249座寺庙组成：一座主寺、八座角寺和240座围寺，代表大乘佛教宇宙论中的宇宙。</p>
<p>日惹是此行停留时间最长的城市，即便这样，有些想看的地方还是没来得及去。</p>
<p>当天坐夜车去玛琅。</p>
<p>玛琅就到了东爪哇，中爪哇省的南部有座监狱岛--努萨康邦甘岛（Nusa Kambangan）。荷兰殖民时期开始关人，岛上九座监狱，目前还有四座在运营。但该岛不允许自由行，必须至少组成15人的团，需要单独申请许可以及安保人员陪同，且当日下午六点必须离岛。时间有限，这次就不去了。</p>
<p>同样去不了的还有遥远的布鲁岛（Pulau Buru），号称热带古拉格。1969–1979年，印尼著名作家普拉姆迪亚曾在此被流放十年（他也曾被短暂关押于努萨康邦甘岛），当局禁止他使用纸笔，他最初靠向其他囚犯讲故事来创作，后来获准书写，将故事偷偷带出岛外。诞生了他最著名的作品——“布鲁岛四部曲”，不过布鲁岛四部曲并没有涉及布鲁岛的生活，关于布鲁岛的劳改生涯，他记录在回忆录《哑巴独白》（The Mute's Soliloquy）中。</p>
<p>玛琅的近郊有个监狱博物馆（Museum Pendjara Lowokwaroe），在现役监狱（Lowokwaru）内的一个锅炉房里。我在想这个锅炉房到底有多大，但虽然21号一大早就到了玛琅，并不能很快得到答案。21号是周日，监狱不上班。</p>
<p>大部分到玛琅的游客是从这里去五十公里外的布罗莫火山和塞武瀑布。我犹豫了半天，还是放弃了。没有队友，对需要跋涉的自然景观心气不足，借口是路远且费衣服费鞋。决定既然是周日，也放一天假，city walk。从青旅走九百米到彩虹村。</p>
<p>彩虹村在低处，中间有一条河。2016年，为了保护村子不被拆迁，由当地大学生发起，企业捐赠涂料，将村里房子刷成彩色。红黄蓝绿，成为一景。再去遗产村。</p>
<p>玛琅人喜养鸟，有个不小的花鸟市场。</p>
<p>逛完才十点多，只好坐街边喝咖啡。</p>
<p>回青旅的路上在天桥下看到一个涂鸦：DON'T STOP TALKING ABOUT KANJURUHAN，感觉有故事。</p>
<p>查了一下：2022年10月1日晚上，玛琅市坎朱鲁汉（Kanjuruhan）球场有一场东爪哇德比球赛，Arema FC俱乐部主场对阵宿敌 Persebaya Surabaya，结果Arema主场失利。赛后，部分球迷进入场内抗议。警方则动用了催泪瓦斯，引发大规模恐慌、踩踏、窒息以致伤亡。至少 135 人死亡（官方数据），数百人受伤，成为死亡人数最多的球场灾难之一。事后，有六名相关人员被起诉，五人判处1-2年半徒刑，一人案件另行处理。</p>
<p>于是有了如下涂鸦。</p>
<p>POLICE EVERYWHERE, JUSTICE NOWHERE</p>
<p>1312 表示 All Cops Are Bastards。</p>
<p>1312 转自字母 ACAB</p>
<p>A = 1</p>
<p>C = 3</p>
<p>A = 1</p>
<p>B = 2</p>
<p>ACAB means All Cops Are Bastards</p>
<p>我没去事发球场（离市区23公里），就在城里和市中心的Gajayana球场转了下，看到不少关于坎朱鲁汉的涂鸦，没有明显的关于前几个月印尼大抗议的涂鸦。</p>
<p>中饭后，小雨，走回青旅，洗衣服，悠闲地刷短视频。想起来可以把明天去巴厘岛的汽车票买了，出门换钱买车票，打摩的打到一个女摩托司机。发现车票成了问题，去了四家巴士公司都表示巴厘岛和外南梦没票了（路上还看到一起车祸，一男一女躺地上，流着血，不忍看）。再去火车站也买不到去外南梦的票。只能到泗水坐飞机先去龙目岛了。</p>
<p>22号，起了个大早，一路走到Lowokwaroe监狱，八点就到门口，打算看该博物馆，也是此行来到玛琅的主要目的，但被工作人员无情拒绝了，说需要领导批准，看不了。</p>
<p>只好含恨去泗水，窗外是高山，查了下，泗水玛琅周边最高的山是塞梅鲁火山，海拔3676米，布罗莫火山海拔2329米。这两天气温还不错，不很热。十点多到印尼第二大城市、东爪哇首府泗水。</p>
<p>住下后，先逛了下泗水动物园。我基本不逛动物园，不过前阵子见了一位摄影师，他拍了200多座动物园，讲了点人类和动物在动物园上尴尬的关系，我受他影响，来看看这些被囚禁在笼子和孤岛上的热带生灵们。</p>
<p>出动物园奔泗水老城的废弃监狱。这座监狱也建于荷兰殖民时期，面积不小，我先围着走了一圈。</p>
<p>回到正面，侧门的两间办公室被一个公司占用（大概是物流公司）。里面三位女孩，她们不让我进去，说要政府的许可。好说歹说站到前廊看了一眼，里面是废弃的状态，大概还有危房。</p>
<p>出来后在老城转了一下，在广场的古城旅游示意图上看到也标注了刚才的监狱，也许以后会开发出来。</p>
<p>23号，一早飞龙目岛，等大巴票遇到印尼小伙Bob，他每个月从雅加达飞三个小时到龙目岛，再坐船到东边的岛上工作，是个露天的铜和金矿，上四周休两周。没多会，下了四次阵雨。坐机场大巴进市区，龙目岛号称是“有一千座清真寺的地方”，和临夏一样，每个村都有清真寺，没有楼房，清真寺比较显眼。</p>
<p>岛的中心叫马塔兰，像国内小县城。吃完中饭，直接去码头，目标巴厘岛。旅途漫长，在船上看理想国翻译的《印尼Etc：众神遗落的珍珠》。渡轮和坐火车感觉差不多，平稳，偶尔晃动，有动力的声音。周围小小的嘈杂，大厅电视放着电影，人们有坐有卧。</p>
<p>到巴厘岛八丹拜码头，坐30多公里摩的到乌布。入住，乌布的青旅很棒，古色古香，进门就是先是鱼池，各种植物的庭院，泳池，放下行李出门逛夜市。转了一个小时，巴厘岛80%多的居民是印度教徒，建筑也有浓郁的宗教特色，居所外观也像宗教场所，有雕刻精美的印度教风格大门，门神、门外有神龛。路两侧悬吊着竹制的像花灯一样的Penjor。</p>
<p>24号，早上，人们会给神龛仪式性的摆放一点贡品，其他的整盘贡品则放在门外的地上，有叶子编的花、花瓣、大米、香等，还会烧一些东西祈福。</p>
<p>看了乌布皇宫、圣泉寺、小圣泉寺、塔曼阿云寺和Gunung Kawi Tampaksiring。后者在一个山谷里，里面凿了一些石窟，其中有两处塔窟，第一次见石窟塔。这一天不知道是什么节日，看到很多人穿素服去拜庙，还有人在路边跪地迎神。</p>
<p>下午，去巴厘岛最南的乌鲁瓦图寺，看七点的罗摩衍那火舞，提前几天在线买了票，到寺庙门口得知还需要买寺庙的门票才能看上演出，而且只能用现金，可我的现金几乎花完了，第二天一早就离开印尼，没必要为这点钱取现。争了几分钟，工作人员给了我一张票。六点半开始观众就在外面排长队等候入场，又挤又热。稀里糊涂的检票后，是随意找坐。大几百人花了20分钟落座。整场演出靠一群人喊，还有几个做动作的演员，大部分缺乏情绪，看的我昏昏欲睡。最后猴神上来跟观众互动几下。以为有戏剧看，不过是杂耍和小品。</p>
<p>25号，圣诞节，六点起，走行去机场，去往菲律宾首都马尼拉。路上买了早饭，兄弟俩小不点看摊。菲律宾有一亿一千万人，近九成是天主教和基督教徒，基督教人口过亿，规模亚洲第一世界第三。出机场等机场大巴，等客满，再卖票，半天出发。满街小三轮和媲美加长林肯的硬核摇滚巴士，车前门挂一轮胎，司机左手夹着一堆零钱。堵车，路边躺着homeless，开了不到4公里，到站了。后来知道从机场走到最近的轻轨站也就1.6公里，又坐了一段圣诞节免费轻轨。</p>
<p>年底菲律宾放长假，普遍有十多天，有的长达三周。市中心的黎刹公园满满当当全是人。还有个“天下为公”的繁体牌坊，进去是一个偏中式的花园，有一尊孔子像，是中国商会捐建的。</p>
<p>古城里有几座教堂，都在做圣诞弥撒，虽然也有合唱，也是很庄重的样子。马尼拉大教堂外有两个大电视，人们在外面火树银花的公园也能参加弥撒。</p>
<p>26号，圣迭戈古堡，荷兰人建的军事要塞。同时有囚室和地牢，菲律宾精神之父黎塞（作家、医生、艺术家，而非一呼百应的革命家）被处决之前就在这里被关押了两个多月。地牢里展示了二战日本人对菲律宾人的暴行。</p>
<p>坐了一段摇滚大篷车，司机年纪不小了，旁边还坐一个帮忙卖票的女士，司机需要眼观六路，闪转腾挪，还要不断揽客。</p>
<p>大概因为殖民监狱建筑坚固耐久，保存完好。菲律宾好几个省立博物馆利用了退役的殖民地监狱，比如宿务博物馆（宿务省监狱），索尔索贡省博物馆（索尔索贡省监狱），西维萨亚斯国家博物馆分馆（原伊洛伊洛省监狱）和老监狱博物馆（伊洛科斯苏尔省监狱）。而监狱的极简厚重和光线克制，也适合转型为博物馆。但由于临时买票价格偏高，我最后放弃了原计划准备去的宿务，临时决定去比较近的PG岛（全名puerto galera）。</p>
<p>网图</p>
<p>下午去八打雁，四点半上车，两个半小时没走一半，100公里的路，一直开到天黑，我老幻想过了某个地方它开始狂飙，最后九点多彻底停下了，到站了。我刷新了下地图，离八打雁还有47公里，但是车到站了，停在了小镇Balayan。原来坐错车了，由于不提前售票，我进站以后还问了人，上车前也问了司机。大晚上来了一个完全陌生的地方，我冲售票员一顿吐槽，他听了半天，转身到办公室取自己的东西，他要回家。他的老婆抱着婴儿在等他，孩子还在哭，我说我帮提点东西吧，给我指下酒店在哪。</p>
<p>Balayan是八打雁下面的小镇，先走到最“繁华”的地方，所谓的繁华，也就是有个教堂，一些路边摊，有些商店，我先吃了点东西垫肚子，在各大平台找住宿，这个镇子只有一家酒店（入住的时候还跟前台确认了一下），普普通通，空调有点吵，别的都还好。</p>
<p>27号，退了房，看了下镇中心的教堂，碰到一场婚礼，又去脏兮兮的海边看了下，走到另一个车站，继续坐车去八打雁。</p>
<p>八打雁的渡口外有上百homeless，生平仅见，跟网上看到的战争难民非洲难民几乎一样，大部分长时间没洗澡，呆滞的眼神，杂乱的头发，营养不良的孩子，衣衫不整的奶孩子的女人....（回程的时候一个都没看到）。</p>
<p>等船的时候我把昨天的事说给旁边菲律宾青年，他说很多菲律宾人太懒了。三点开船，风大。问在马尼拉工作的中国小伙菲律宾好不好玩，他说比在中国好，在这里只要花钱什么都能享受到，在国内有钱也不见得能享受到。</p>
<p>一小时上岛，住下后，去海边转了下，天黑了，看到不少姑娘开始上班，PG岛也不富裕，狭窄的巷子里开着Disco，看到不少韩国人，以及常见的陪着西人的菲女，明显感觉到经济殖民。又一次在超市看到散烟（整盒烟拆开了卖，之前在尼泊尔、缅甸等地见过），好奇买了一支，1块来钱。想了下，论根卖也好，能少抽点。回来到住处，隔壁上海来的女孩说pg岛很好，她没潜水，租了摩托车转。</p>
<p>28号，草草潜了个水。邻居来了一个在马尼拉留学学英语的老挝人，85年的，说老挝也是社会主义国家，老百姓不敢说什么。菲律宾比老挝好，虽然马尼拉流浪汉非常多。</p>
<p>29号，返回马尼拉，回家。</p>
<p>多年前，宿务监狱（CPDRC）跳舞跳成网红。据说现在每周六开放参观，但需提前通过宿务旅游局脸书预约。我在该旅游局的脸书留言咨询，至今没收到回复。</p>`
  }
]
    if (c.total === 0) return '';
    var barPct = c.total > 0 ? Math.round(c.checked / c.total * 100) : 0;
    var color = regionColors[r] || '#888';
    return '<div class="st-region-row">'+
      '<div class="st-region-label">'+r+'</div>'+
      '<div class="st-region-bar-wrap">'+
        '<div class="st-region-bar-fill" style="width:'+barPct+'%; background:'+color+'"></div>'+
      '</div>'+
      '<div class="st-region-count">'+c.checked+'/'+c.total+'</div>'+
    '</div>';
  }).join('');
  document.getElementById('st-regions').innerHTML = rowsHtml;

  document.getElementById('stats-overlay').classList.add('show');
}

function closeStats(e) {
  if (e && e.target !== document.getElementById('stats-overlay')) return;
  document.getElementById('stats-overlay').classList.remove('show');
}

function downloadStatsShare() {
  var card = document.getElementById('stats-card');
  var btn = document.querySelector('.btn-stats-save');
  btn.textContent = '⏳ 生成中...';
  btn.disabled = true;
  html2canvas(card, {backgroundColor:null, scale:2, useCORS:true}).then(function(canvas){
    var link = document.createElement('a');
    link.download = 'prison-stats-share.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.textContent = '💾 保存图片';
    btn.disabled = false;
  }).catch(function(){
    btn.textContent = '💾 保存图片';
    btn.disabled = false;
    alert('生成失败，请重试');
  });
}
